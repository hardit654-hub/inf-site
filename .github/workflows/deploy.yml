name: Загрузка сайта на хостинг

on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "build.py", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы сайта
        uses: actions/checkout@v4

      # Страница предварительной записи на поездку живёт в корне домена: gsvv.ru/forms/.
      # Загрузка идёт по FTP, а FTP-пользователь посажен прямо в корень сайта — значит, кладём
      # папку site/forms в папку forms рядом с inf. Загружается только то, что изменилось.
      - name: Страница записи на поездку (gsvv.ru/forms)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/forms/
          server-dir: ./forms/

      # Основной сайт размещён в /inf; FTP-пользователь для forms имеет домашнюю папку /www/gsvv.ru.
      # Поэтому явно пишем основной сайт в подкаталог inf, не в корень домена.
      - name: Загрузить временную заглушку в корень домена
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-root-only/
          server-dir: ./
          state-name: .ftp-deploy-root-only-sync-state.json
          dangerous-clean-slate: false

      # Страница со ссылками для классных руководителей (gsvv.ru/link/ssylki.html) должна
      # открываться как раньше — код ВДК живёт отдельно от этого репозитория. Возвращаем
      # сохранённую копию страницы, чтобы временная заглушка не задела её при обновлениях.
      - name: Вернуть страницу ссылок ВДК (gsvv.ru/link/ssylki.html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-vdk-restore/
          server-dir: ./link/
          state-name: .ftp-deploy-vdk-link-sync-state.json
          dangerous-clean-slate: false

      # Данные раздела могут прийти сжатыми (src/<раздел>/course.js.xz.b64): распаковываем.
      # xz проверяет контрольную сумму — если файл повреждён, загрузка останавливается и сайт не меняется.
      # Потом собираем страницы курсов (build.py) и сохраняем результат в репозиторий.
      - name: Собрать страницы курсов
        run: |
          set -e
          for f in src/*/course.js.xz.b64; do
            [ -e "$f" ] || continue
            base64 -d "$f" | xz -d > "${f%.xz.b64}"
            git rm -q "$f"
            echo "распакован ${f%.xz.b64}"
          done
          python3 build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src site
          if ! git diff --cached --quiet; then git commit -q -m "Сборка страниц курсов"; git push; fi

      - name: Загрузить изменённые файлы по FTP (папка inf на хостинге)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: ./inf/

      # Пароль базы кладём на хостинг отдельно и только если PHP там действительно выполняется.
      # Иначе файл с паролем отдавался бы как обычный текст — поэтому сначала проверка, после — ещё одна.
      - name: Проверить PHP и положить настройки базы (config.php)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SITE: https://gsvv.ru/inf
        run: |
          if [ -z "$DB_NAME" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then echo "::warning::Нет секретов DB_* — личные кабинеты не настроены"; exit 0; fi
          body=$(curl -s --max-time 25 "$SITE/api/index.php?action=health&t=$(date +%s)" || true)
          case "$body" in
            "{"*) echo "PHP на хостинге работает";;
            *) echo "::warning::PHP на хостинге не выполняется — config.php НЕ загружен. Включите PHP для сайта gsvv.ru в панели хостинга и запустите загрузку ещё раз."; exit 0;;
          esac
          umask 077
          php -r '$c=["dsn"=>"mysql:host=localhost;dbname=".getenv("DB_NAME").";charset=utf8mb4","user"=>getenv("DB_USER"),"pass"=>getenv("DB_PASSWORD"),"setup_code"=>getenv("DB_PASSWORD")];
                  file_put_contents(getenv("RUNNER_TEMP")."/config.php","<?php\n// создано автоматически при загрузке\nreturn ".var_export($c,true).";\n");'
          curl -s --show-error -T "$RUNNER_TEMP/config.php" "ftp://$FTP_SERVER/inf/api/config.php" --user "$FTP_USERNAME:$FTP_PASSWORD"
          rm -f "$RUNNER_TEMP/config.php"
          check=$(curl -s --max-time 25 "$SITE/api/config.php?t=$(date +%s)" || true)
          if printf '%s' "$check" | grep -q "php\|pass"; then
            curl -s "ftp://$FTP_SERVER/inf/" --user "$FTP_USERNAME:$FTP_PASSWORD" -Q "DELE api/config.php" >/dev/null || true
            echo "::error::config.php отдаётся как текст — удалён с хостинга"; exit 1
          fi
          echo "Проверка: $(curl -s --max-time 25 "$SITE/api/index.php?action=health")"
