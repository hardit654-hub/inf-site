<style>
/* Layout: Stepik-like learning shell — dark header with the step strip, dark collapsible table of contents on the left, white lesson page with a grey footer band */
:root{
  --bar:#222326; --bar-2:#2d2e32; --bar-ink:#e8e8ea; --bar-muted:#9a9ca3; --bar-line:#3a3b40;
  --green:#66cc66; --green-d:#4fae4f; --green-ink:#2e8b2e; --green-soft:#e8f6e8;
  --bg:#ffffff; --page:#f4f5f6; --ink:#222222; --muted:#6b6f76; --line:#e1e3e6; --line-strong:#22222255;
  --code-bg:#f6f8fa; --accent:#2f7dd1;
  --bad:#d64541; --bad-soft:#fdeceb; --warn:#c27c0e; --warn-soft:#fdf3e1;
  --kw:#7c3aed; --str:#0f7b5f; --com:#8a94a6; --num:#b45309;
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --toc-w:300px; --head-h:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181b; --page:#1e1f23; --ink:#e6e7ea; --muted:#9a9ea6; --line:#2e3036; --line-strong:#e6e7ea55;
  --code-bg:#111215; --accent:#7fb2ff; --green-ink:#7ad67a; --green-soft:#1c3320;
  --bad:#ff7d78; --bad-soft:#3a1d1c; --warn:#f0b354; --warn-soft:#352812;
  --kw:#c4a5ff; --str:#6fdcb6; --com:#6f7b8f; --num:#f5b26b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181b; --page:#1e1f23; --ink:#e6e7ea; --muted:#9a9ea6; --line:#2e3036; --line-strong:#e6e7ea55;
  --code-bg:#111215; --accent:#7fb2ff; --green-ink:#7ad67a; --green-soft:#1c3320;
  --bad:#ff7d78; --bad-soft:#3a1d1c; --warn:#f0b354; --warn-soft:#352812;
  --kw:#c4a5ff; --str:#6fdcb6; --com:#6f7b8f; --num:#f5b26b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body)}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* header */
.head{position:fixed;inset:0 0 auto 0;height:calc(var(--head-h) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:var(--bar);color:var(--bar-ink);z-index:30;display:flex;align-items:center;gap:14px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;color:var(--bar-ink);text-decoration:none;flex:none;width:calc(var(--toc-w) - 28px);min-width:0}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--green);color:#10331a;display:flex;align-items:center;justify-content:center;font:700 15px var(--f-mono);flex:none}
.logo .lt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.logo .lt b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo .lt small{font-size:12px;color:var(--bar-muted)}
.strip{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 10px}
.strip::-webkit-scrollbar{display:none}
.sq{flex:none;width:32px;height:32px;border-radius:3px;border:0;background:#55575d;color:#d7d8db;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative;font:700 15px var(--f-body)}
.sq svg{width:16px;height:16px}
.sq.seen,.sq.ok{background:var(--green);color:#10331a}
.sq.bad{background:var(--bad);color:#fff}
.sq.rev{background:var(--warn);color:#2a1a00}
.sq.on{outline:2px solid #fff;outline-offset:1px}
.sq.on::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:var(--bg)}
.hright{display:flex;align-items:center;gap:10px;flex:none}
.pts{font:500 13px var(--f-body);color:var(--bar-muted);white-space:nowrap}
.pts b{color:var(--bar-ink)}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--bar-line);background:var(--bar-2);color:var(--bar-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;text-decoration:none}
.iconbtn svg{width:19px;height:19px}
.iconbtn:hover{border-color:var(--bar-muted)}
.acct{height:38px;border-radius:9px;border:1px solid var(--bar-line);background:var(--bar-2);color:var(--bar-ink);display:flex;align-items:center;gap:7px;padding:0 12px 0 9px;text-decoration:none;font:500 14px var(--f-body);white-space:nowrap;max-width:190px}
.acct:hover{border-color:var(--bar-muted)}
.acct svg{width:18px;height:18px;flex:none}
.acct span{overflow:hidden;text-overflow:ellipsis}
.acct i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;display:none}
.acct.in i{display:block}
.acct.err i{background:var(--bad)}
@media (max-width:640px){.acct span{display:none}.acct{padding:0;width:38px;justify-content:center;position:relative}.acct.in i{position:absolute;top:5px;right:5px}}

/* table of contents */
.toc{position:fixed;top:calc(var(--head-h) + env(safe-area-inset-top,0px));bottom:0;left:0;width:var(--toc-w);background:var(--bar-2);color:var(--bar-ink);z-index:20;display:flex;flex-direction:column;transition:transform .25s ease;border-right:1px solid var(--bar-line)}
.toc-closed .toc{transform:translateX(-100%)}
.toc-top{padding:18px 18px 14px;padding-left:max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--bar-line)}
.toc-top h2{margin:0 0 10px;font:700 16px/1.3 var(--f-body)}
.prog{font-size:13px;color:var(--bar-muted)}
.prog b{color:var(--bar-ink)}
.pbar{height:6px;border-radius:9px;background:#45474d;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:9px;width:0;transition:width .3s}
.toc-list{flex:1;overflow-y:auto;padding:8px 0 24px}
.mod{display:flex;gap:8px;align-items:baseline;padding:14px 18px 8px;font:700 15px/1.3 var(--f-body)}
.mod .n{color:var(--bar-muted)}
.les{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--bar-ink);padding:10px 22px 10px 30px;cursor:pointer;position:relative;font-size:15px;line-height:1.3}
.les::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:#4a4c52}
.les.part::before{background:linear-gradient(var(--green) var(--p,0%),#4a4c52 var(--p,0%))}
.les.done::before{background:var(--green)}
.les .n{color:var(--bar-muted);font-weight:500;min-width:30px}
.les .t{flex:1;min-width:0}
.les .c{font:500 12px var(--f-mono);color:var(--bar-muted)}
.les.done .c{color:var(--green)}
.les:hover{background:#ffffff0d}
.les.on{background:var(--green-d);color:#fff}
.les.on .n,.les.on .c{color:#eaffea}
.les.on::after{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);border:9px solid transparent;border-right-color:var(--bg)}
.les[disabled]{opacity:.45;cursor:default}
.les[disabled]:hover{background:none}

/* the big toggle arrow on the TOC edge */
.tocbtn{position:fixed;z-index:25;top:50%;left:var(--toc-w);transform:translate(-50%,-50%);width:44px;height:64px;border-radius:12px;border:2px solid var(--green);background:var(--bar);color:var(--green);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 4px 14px #0004;transition:left .25s ease,background .15s}
.tocbtn svg{width:26px;height:26px;transition:transform .25s}
.tocbtn:hover{background:var(--green);color:#10331a}
.toc-closed .tocbtn{left:22px}
.toc-closed .tocbtn svg{transform:rotate(180deg)}

/* main */
.main{padding-top:calc(var(--head-h) + env(safe-area-inset-top,0px));margin-left:var(--toc-w);transition:margin-left .25s ease;min-height:100%;display:flex;flex-direction:column}
.toc-closed .main{margin-left:0}
.lbar{border-bottom:1px solid var(--line);padding:14px 32px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;font-size:15px;
  padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.lbar b{font-weight:500}
.lbar span{color:var(--muted)}
.content{flex:1;padding:28px 32px 40px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.toc-closed .content{padding-left:max(84px,env(safe-area-inset-left,0px))}
.step{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.step h2{font:700 26px/1.25 var(--f-body);margin:6px 0;text-align:center;text-wrap:balance}
.step h2.left{text-align:left}
.step h3{font:700 19px/1.3 var(--f-body);margin:10px 0 0}
.step p{margin:0}
.html{display:flex;flex-direction:column;gap:12px;min-width:0}
ul.dash{margin:0;padding-left:22px;list-style:none;display:flex;flex-direction:column;gap:2px}
ul.dash li::before{content:"– ";margin-left:-14px}
code{font:14px var(--f-mono);background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.cond{border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:10px}
.codebox{position:relative;min-width:0}
.codebox pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:14px 16px;overflow-x:auto;font:14px/1.55 var(--f-mono);tab-size:4}
.codebox pre code{background:none;border:0;padding:0}
.copy{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:5px;font-size:12px;padding:3px 8px;cursor:pointer}
.k{color:var(--kw);font-weight:600}.s{color:var(--str)}.c{color:var(--com);font-style:italic}.d{color:var(--num)}
details.box{border:1px solid var(--line);border-radius:6px;padding:0 16px;background:var(--bg)}
details.box>summary{cursor:pointer;font-weight:500;padding:12px 0;color:var(--accent)}
details.box[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.box>div{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.locked{display:flex;gap:12px;align-items:center;border:1px dashed var(--line-strong);border-radius:6px;padding:11px 16px;color:var(--muted)}
.locked svg{width:18px;height:18px;flex:none}
.locked span{display:flex;flex-direction:column;gap:1px}
.locked b{color:var(--ink);font-weight:500}
.locked small{font-size:13px}
.vwrap{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:6px;overflow:hidden;background:#000}
.vwrap iframe{width:100%;height:100%;border:0;display:block}
.video{aspect-ratio:16/9;max-width:100%;border-radius:6px;background:#2d2e32;color:#c9cbd0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.video .pl{width:72px;height:72px;border-radius:50%;background:#ffffff1a;display:flex;align-items:center;justify-content:center}
.video .pl svg{width:30px;height:30px;color:var(--green)}
.video b{color:#fff;font-weight:500}
.filebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:6px;font-size:15px}
.flbl{font-style:italic;font-weight:500}
.file{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:6px;background:var(--green-soft);color:var(--green-ink);text-decoration:none;font:600 14px var(--f-mono)}
.file:hover{text-decoration:underline}
.file svg{width:15px;height:15px;flex:none}
.file .sz{font:400 12px var(--f-body);opacity:.8}
.vlinks{font-size:14px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.html table:not(.g18){border-collapse:collapse;font-variant-numeric:tabular-nums}
.html table:not(.g18) td,.html table:not(.g18) th{border:1px solid var(--line-strong);padding:7px 14px;text-align:center;vertical-align:middle}
.html table:not(.g18) thead td,.html table:not(.g18) thead th{background:var(--code-bg);font-weight:600}
.html table:not(.g18) tbody td:first-child{background:var(--code-bg)}
.html table.note-t td{text-align:left;background:none!important;border-color:var(--line)}
.html img{max-width:100%;height:auto;border-radius:6px}
.html blockquote{margin:0;padding:6px 14px;border-left:3px solid var(--accent);background:var(--code-bg);border-radius:0 6px 6px 0}
.html blockquote p{margin:0}
.html ul,.html ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:4px}
.html pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;font:14px/1.5 var(--f-mono);white-space:pre}
.html h4{margin:6px 0 0;font-size:17px}
.tex{display:inline-block;max-width:100%;overflow-x:auto;vertical-align:middle;padding:2px 0}
.tex.raw{font:14px var(--f-mono);color:var(--muted)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(64px,auto) minmax(0,1fr);gap:12px;align-items:center}
.mk{font:600 16px var(--f-mono);text-align:center;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--code-bg)}
.mrow select{font:15px var(--f-body);padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.mrow select.ok{border-color:var(--green);background:var(--green-soft)}
.mrow select.bad{border-color:var(--bad)}
.gridwrap{overflow-x:auto;max-width:100%}
table.g18{border-collapse:collapse;border:3px solid var(--ink);font-variant-numeric:tabular-nums}
table.g18 td{width:46px;height:38px;text-align:center;border:1px solid var(--line-strong);font-size:16px}
table.g18 td.wr{border-right:3px solid var(--ink)}
table.g18 td.wb{border-bottom:3px solid var(--ink)}
.treewrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px;background-color:var(--bg)}
svg.tree{max-width:100%;height:auto;display:block}
svg.tree line{stroke:var(--ink);stroke-width:1.6}
svg.tree circle{stroke:var(--ink);stroke-width:1.6}
svg.tree .w{fill:var(--bg)} svg.tree .g{fill:#2fa54a} svg.tree .r{fill:#e5413a}
svg.tree rect{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
svg.tree text{fill:var(--ink);font:13px var(--f-mono)}

/* quiz — like Stepik's framed answer block */
.quiz{border:2px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;margin-top:6px;box-shadow:0 0 0 6px var(--page)}
.quiz.ok{border-color:var(--green);box-shadow:0 0 0 6px var(--green-soft)}
.quiz.bad{border-color:var(--bad);box-shadow:0 0 0 6px var(--bad-soft)}
.qt{font:700 17px var(--f-body)}
.verdict{display:flex;align-items:center;gap:8px;font-weight:500;padding:9px 12px;border-radius:6px}
.verdict svg{width:18px;height:18px;flex:none}
.verdict.ok{background:var(--green-soft);color:var(--green-ink)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--green-d)}
.opt.ok{border-color:var(--green);background:var(--green-soft)} .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.fields{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.frow label{font-weight:500;min-width:52px}
.frow input{font:600 16px var(--f-mono);width:130px;max-width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:5px;background:var(--bg);color:var(--ink)}
.frow input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.frow input.ok{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.frow input.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.qact{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:5px;font-weight:500;font-size:16px;padding:10px 20px;cursor:pointer;background:var(--green-d);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:#45a045}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn.ghost:hover{background:var(--page)}
.btn.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.att{font-size:14px;color:var(--muted)}
.reveal{background:var(--warn-soft);border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 6px 6px 0;font-size:15px}
.reveal b{font-family:var(--f-mono)}

.foot{background:var(--page);border-top:1px solid var(--line);padding:22px 32px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.toc-closed .foot{padding-left:max(84px,env(safe-area-inset-left,0px))}
.foot-in{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.foot .soon{color:var(--muted)}
.foot .note{width:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.foot .note .btn{font-size:13px;padding:5px 10px}

.scrim{display:none}
@media (max-width:900px){
  :root{--toc-w:290px}
  .logo{width:auto}
  .logo .lt{display:none}
  .pts{display:none}
  .main{margin-left:0}
  .content,.foot,.toc-closed .content,.toc-closed .foot{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .lbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tocbtn{width:38px;height:56px;top:auto;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%)}
  .toc-closed .tocbtn{left:24px}
  html:not(.toc-closed) .scrim{display:block;position:fixed;inset:0;background:#0007;z-index:15}
  .step h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.toc,.tocbtn,.main,.tocbtn svg{transition:none}}
</style>
</head>
<body>
<header class="head">

        "v": "<p>Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов <strong>A = {a<sub>0</sub>, a<sub>1</sub>, …, a<sub>n–1</sub>}</strong>),&nbsp;включая специальный пустой символ a0.</p><p>Время работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний <strong>Q = {q<sub>0</sub>, q<sub>1</sub>, …, q<sub>n–1</sub>}</strong>. В начальный момент времени головка находится в начальном состоянии <strong>q<sub>0</sub></strong>.<br> На каждом такте головка обозревает одну ячейку ленты, называемую&nbsp;текущей ячейкой. За один такт головка исполнителя может переместиться&nbsp;в ячейку справа или слева от текущей, не меняя находящийся в ней символ,&nbsp;или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После&nbsp;каждого такта головка переходит в новое состояние или остаётся в прежнем&nbsp;состоянии.</p><p>Программа работы исполнителя МТ задаётся в табличном виде.</p><div class=\"tw\"><table><tbody><tr><td>&nbsp;</td><td><strong>a<sub>0</sub></strong></td><td><strong>a<sub>1</sub></strong></td><td><strong>...</strong></td><td><strong>a<sub>n-1</sub></strong></td></tr><tr><td><strong>q<sub>0</sub></strong></td><td>команда</td><td>команда</td><td>...</td><td>команда</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>команда</td><td>команда</td><td>...</td><td>команда</td></tr><tr><td><strong>...</strong></td><td>...</td><td>...</td><td>...</td><td>...</td></tr><tr><td><strong>q<sub>n-1</sub></strong></td><td>команда</td><td>команда</td><td>...</td><td>команда</td></tr></tbody></table></div><p>В первой строке перечислены все возможные символы в текущей ячейке&nbsp;ленты, в первом столбце – возможные состояния головки. На пересечении&nbsp;i-й строки и j-го столбца находится команда,         "v": "<h2>Содержание урока</h2><p>В текущем уроке мы решим устно задачу из демоверсии и похожие на неё задачи.</p><h3>Это очень важный урок!!!</h3>"

       {
        "t": "html",
        "v": "<p>(Демо 2026) Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов <strong>A = {a<sub>0</sub>, a<sub>1</sub>, …, a<sub>n–1</sub>}</strong>),&nbsp;включая специальный пустой символ a0.</p><p>Время работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний <strong>Q = {q<sub>0</sub>, q<sub>1</sub>, …, q<sub>n–1</sub>}</strong>. В начальный момент времени головка находится в начальном состоянии <strong>q<sub>0</sub></strong>.<br> На каждом такте головка обозревает одну ячейку ленты, называемую&nbsp;текущей ячейкой. За один такт головка исполнителя может переместиться&nbsp;в ячейку справа или слева от текущей, не меняя находящийся в ней символ,&nbsp;или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После&nbsp;каждого такта головка переходит в новое состояние или остаётся в прежнем&nbsp;состоянии.</p><p>Программа работы исполнителя МТ задаётся в табличном виде.</p><div class=\"tw\"><table><tbody><tr><td>&nbsp;</td><td><strong>a<sub>0</sub></strong></td><td><strong>a<sub>1</sub></strong></td><td><strong>...</strong></td><td><strong>a<sub>n-1</sub></strong></td></tr><tr><td><strong>q<sub>0</sub></strong></td><td>команда</td><td>команда</td><td>...</td><td>команда</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>команда</td><td>команда</td><td>...</td><td>команда</td></tr><tr><td><strong>...</strong></td><td>...</td><td>...</td><td>...</td><td>...</td></tr><tr><td><strong>q<sub>n-1</sub></strong></td><td>команда</td><td>команда</td><td>...</td><td>команда</td></tr></tbody></table></div><p>В первой строке перечислены все возможные символы в текущей ячейке&nbsp;ленты, в первом столбце – возможные состояния головки. На пересечении&nbsp;i-й строки и j-го столбца находится команда, которую выполняет МТ, когда&nbsp;головка обозревает j-й символ, находясь в i-м состоянии. Если пара&nbsp;«символ – состояние» невозможна, то клетка для команды остаётся пустой.</p><p>Каждая команда состоит из трёх элементов, разделённых запятыми: первый&nbsp;элемент – записываемый в текущую ячейку символ алфавита (может&nbsp;совпадать с тем, который там уже записан). Второй элемент – один из&nbsp;четырёх символов «L», «R», «N», «S». Символы «L» и «R» означают сдвиг&nbsp;в левую или правую ячейки соответственно, «N» – отсутствие сдвига, «S» –&nbsp;завершение работы исполнителя МТ после выполнения текущей команды.</p><p>Сдвиг происходит после записи символа в текущую ячейку. Третий&nbsp;элемент – новое состояние головки после выполнения команды.</p><p><em>Например</em>, команда 0, L, q<sub>3</sub> выполняется следующим образом: в текущую ячейку записывается символ «0», затем головка сдвигается в соседнюю слева ячейку и переходит в состояние q<sub>3</sub>.</p><p>Приведём пример выполнения программы, заданной таблично.</p><p>На ленте записано неизвестное ненулевое количество расположенных подряд в соседних ячейках символов «Z», все остальные ячейки ленты заполнены пустым символом «λ». В начальный момент времени головка находится на неизвестном ненулевом расстоянии справа от самого правого символа «Z».</p><p>Программа</p><div class=\"tw\"><table><thead><tr><th style=\"background-color:#ffffff\">&nbsp;</th><th style=\"background-color:#ffffff\"><strong>λ</strong></th><th style=\"background-color:#ffffff\"><strong>Z</strong></th></tr></thead><tbody><tr><td><strong>q0</strong></td><td>λ, L, q<sub>0</sub></td><td>X, L, q<sub>1</sub></td></tr><tr><td><strong>q1</strong></td><td>λ, S, q<sub>1</sub></td><td>X, L, q<sub>1</sub></td></tr></tbody></table></div><p>заменяет на ленте все символы «Z» на «X» и останавливает исполнителя&nbsp;в первой ячейке слева от последовательности символов «X».</p><p>Возможное начальное состояние исполнителя:</p><div class=\"tw\"><table><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>▲ q<sub>0</sub></td><td>&nbsp;</td></tr><tr><td>...</td><td>λ</td><td>λ</td><td>Z</td><td>Z</td><td>Z</td><td>Z</td><td>λ</td><td>λ</td><td>...</td></tr></tbody></table></div><p>Конечное состояние исполнителя после завершения выполнения программы:</p><div class=\"tw\"><table><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>▲ q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>...</td><td>λ</td><td>λ</td><td>X</td><td>X</td><td>X</td><td>X</td><td>λ</td><td>λ</td><td>...</td></tr></tbody></table></div><p><strong>Выполните задание.</strong><br> На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 343 нуля.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p><p><strong>🎬 Видеоразбор задачи находится на следующем шаге.</strong></p><p>Условие задачи выглядит огромным. Но на самом деле в начале содержится просто теория по Машине Тьюринга. А само задание находится после фразы&nbsp;<code>Выполните задание</code>.</p>"

        "t": "html",
        "v": "<h2>Устное решение № 12 из Демоверсии 2026</h2><div class=\"cond\"><p>(Демо 2026) На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 343 нуля.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p></div><h3>Решение</h3><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>На основании таблицы пытаемся понять, что делает программа.</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Начало:</p><ul><li>Головка стоит <strong>справа от слова</strong> на символе <code>λ</code> в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на символе <code>λ</code> выполняется: <code>λ, L, q<sub>1</sub></code> — просто сдвиг на одну ячейку <strong>влево</strong> к последнему символу слова и переход в состояние <code>q<sub>1</sub></code>.</li></ul><p>Далее МТ будет работать только в состоянии&nbsp;<code>q<sub>1</sub></code>, так как по таблице видно, что из состояния <code>q<sub>1</sub></code>&nbsp;есть переходы только в состояние&nbsp;<code>q<sub>1</sub></code>:</p><ul><li>На <code>0</code> → <code>1, L, q1</code> — ноль меняем на единицу и идём влево.</li><li>На <code>1</code> → <code>0, S, q1</code> — единицу меняем на ноль и <strong>останавливаемся</strong>.</li><li>На <code>λ</code> → <code>λ, S, q1</code> — если слово закончилось, то&nbsp;останавливаемся.</li></ul><p><strong>Вывод</strong><br> МТ идёт с конца слова влево, пока видит нули — делает их единицами; как только встретила <strong>первую</strong>&nbsp;единицу — превращает её в ноль и <strong>завершает работу</strong>.</p><h3><strong>Шаг 2. Ответ на вопрос задачи</strong></h3><div class=\"cond\">Условие задачи<br> На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.<br><br> После выполнения программы на ленте осталось ровно 343 нуля. Определите максимально возможное число нулей в исходной последовательности.</div><p>Так как нужно найти максимально возможное число нулей, то попробуем взять максимально возможное число нулей&nbsp;–&nbsp;1000, если 1000 нулей не подойдёт, то попробуем взять 999 и так далее.</p><p><strong>Пусть в исходной строке было 1000 нулей.</strong><br> В таком случае исходная строка состояла только из нулей.&nbsp;<code>λ00000...00000λ</code>.</p><p>При такой исходной строке головка движется справа налево и просто заменяет все нули на единицы. МТ завершает свою работу в первой пустой клетке слева от слова.</p><p>Получается из стартовой позиции&nbsp;<code>λ00000...00000λ</code> получается позиция&nbsp;<code>λ11111...11111λ</code>.&nbsp;<br> В ней ноль нулей, а по условию задачи требуется, чтобы в финальной позиции оказалось ровно 343 нуля.<br> Вывод: 1000 нулей не могло быть в исходной строке.</p><p><strong>Пусть в исходной строке было 999 нулей.</strong><br> В таком случае исходная строка состояла из 999 нулей и одной единицы. Единица может стоять на любой из 1000 позиций. Поэтому всего есть 1000 вариантов, куда можно поставить эту единицу.&nbsp;</p><p>Все 1000 вариантов выбора позиции единицы в «лоб» перебрать не получится из-за их большого количества. Поэтому нужно подумать, куда нужно поставить единицу, чтобы после выполнения программы осталось ровно 343 нуля.</p><div class=\"cond\">Вспомним, что&nbsp;МТ идёт с конца слова влево, пока видит нули — делает их единицами; как только встретила <strong>первую</strong>&nbsp;единицу — превращает её в ноль и <strong>завершает работу</strong>.</div><p>Если поставить единицу на первую позицию<br><code>λ<span style=\"color:#ff4363\">10000...00000λ</code> -&gt;&nbsp;<code>λ<span style=\"color:#ff4363\">01111...11111λ</code></p><p>Если поставить единицу на последнюю позицию<br><code>λ00000...0000<span style=\"color:#ff4363\">1λ</code> -&gt;&nbsp;<code>λ00000...0000<span style=\"color:#ff4363\">0λ</code></p><p>Если поставить единицу где-то в середине<br><code>λ00000...0<span style=\"color:#ff4363\">1000λ</code> -&gt;&nbsp;<code>λ00000...0<span style=\"color:#ff4363\">0111λ</code></p><p><strong>Вывод</strong></p><ul><li>Все нули, стоящие справа от единицы, заменяются на единицы.</li><li>Сама единица (выделена красным цветом) заменяется на ноль.</li></ul><p>Чтобы после выполнения программы осталось ровно 343 нуля, нужно поставить в стартовой строке единицу в триста сорок третью ячейку.</p><p>Лента до выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{342 \\text{ нуля}} \\;\\; 1 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{657 \\text{ нулей}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Лента после выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\ ну ячейку <strong>влево</strong> к последнему символу слова и переход в состояние <code>q<sub>1</sub></code>.</li></ul><p>Далее МТ будет работать только в состоянии&nbsp;<code>q<sub>1</sub></code>, так как по таблице видно, что из состояния <code>q<sub>1</sub></code>&nbsp;есть переходы только в состояние&nbsp;<code>q<sub>1</sub></code>:</p><ul><li>На <code>0</code> → <code>1, L, q1</code> — ноль меняем на единицу и идём влево.</li><li>На <code>1</code> → <code>0, S, q1</code> — единицу меняем на ноль и <strong>останавливаемся</strong>.</li><li>На <code>λ</code> → <code>λ, S, q1</code> — если слово закончилось, то&nbsp;останавливаемся.</li></ul><p>Вывод<br> МТ идёт с конца слова влево, пока видит нули — делает их единицами; как только встретила <strong>первую</strong>&nbsp;единицу — превращает её в ноль и <strong>завершает работу</strong>.</p><h3><strong>Шаг 2. Ответ на вопрос задачи</strong></h3><div class=\"cond\">Условие задачи<br> На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.<br><br> После выполнения программы на ленте осталось ровно 343 нуля. Определите максимально возможное число нулей в исходной последовательности.</div><p>Так как нужно найти максимально возможное число нулей, то попробуем взять максимально возможное число нулей&nbsp;–&nbsp;1000, если 1000 нулей не подойдёт, то попробуем взять 999 и так далее.</p><p><strong>Пусть в исходной строке было 1000 нулей.</strong><br> В таком случае исходная строка состояла только из нулей.&nbsp;<code>λ00000...00000λ</code>.</p><p>При такой исходной строке головка движется справа налево и просто заменяет все нули на единицы. МТ завершает свою работу в первой пустой клетке слева от слова.</p><p>Получается из стартовой позиции&nbsp;<code>λ00000...00000λ</code> получаетс const st=(li,si)=>S.st[sid(li,si)]||(S.st[sid(li,si)]={});
const passed=(li,si)=>{const s=lessons[li].steps[si],x=S.st[sid(li,si)]||{};return isTask(s)?!!x.ok:!!x.seen};

/* python highlighting */
function hl(src){
  const KW=/\b(def|return|if|else|elif|for|in|and|or|not|while|import|from|print|range|max|min|any|all|continue|break|True|False|None|lambda|sum|len)\b/g;
  return src.split("\n").map(line=>{
    let code=line,com="";
    const i=line.indexOf("#");
    if(i>=0&&!/['"]/.test(line.slice(0,i).replace(/'[^']*'|"[^"]*"/g,""))){code=line.slice(0,i);com=line.slice(i)}
    let out="",last=0;const re=/('[^']*'|"[^"]*")/g;let m;
    const tok=t=>esc(t).replace(KW,'<span class="k">$1</span>').replace(/\b(\d+)\b/g,'<span class="d">$1</span>');
    while((m=re.exec(code))){out+=tok(code.slice(last,m.index))+'<span class="s">'+esc(m[0])+'</span>';last=m.index+m[0].length}
    out+=tok(code.slice(last));
    return out+(com?'<span class="c">'+esc(com)+'</span>':"");
  }).join("\n");
}
/* game tree */
function tree(spec,labels){
  const LW=46,LH=72,R=16,PAD=26;let leaf=0;const nodes=[],edges=[];let depth=0;
  (function walk(n,d){
    depth=Math.max(depth,d);
    const me={d,kind:Array.isArray(n)?"w":n};nodes.push(me);
    if(Array.isArray(n)){const kids=n.map(k=>walk(k,d+1));me.x=kids.reduce((a,k)=>a+k.x,0)/kids.length;kids.forEach(k=>edges.push([me,k]))}
    else{me.x=PAD+R+leaf*LW;leaf++}
    return me;
  })(spec,0);
  const W=PAD*2+R*2+(leaf-1)*LW+80, H=PAD*2+R*2+depth*LH, y=d=>PAD+R+d*LH;
  let s=`<svg class="tree" viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Дерево игры">`;
  edges.forEach(([a,b])=>s+=`<line x1="${a.x}" y1="${y(a.d)}" x2="${b.x}" y2="${y(b.d)}"/>`);
  nodes.forEach(n=>s+=`<circle class="${n.kind}" cx="${n.x}" cy="${y(n.d)}" r="${R}"/>`);
  const lx=PAD+R*2+(leaf-1)*LW+16;
  (labels||[]).forEach((t,i)=>{s+=`<rect x="${lx}" y="${y(i+1)-12}" width="54" height="24"/><text x="${lx+27}" y="${y(i+1)+4}" text-anchor="middle">${esc(t)}</text>`});
  return s+"</svg>";
}
/* hints and solutions inside task steps open step by step */
function need(title){const m=/Подсказка\s*(\d+)/.exec(title);if(m)return +m[1];if(/Подсказк/.test(title))return 1;if(/Решени|Видеоразбор/.test(title))return 3;return 0}
function lockText(n,title){const w=n===1?"1-й":n===2?"2-й":"3-й";return /Решени|Видеоразбор/.test(title)?`Откроется после ${w} неверной попытки или когда задача будет решена`:`Откроется после ${w} неверной попытки`}
function blocks(list,x){
  return list.map(b=>{
    if(b.t==="details"&&x){const n=need(b.title);if(n&&!x.ok&&!x.rev&&(x.att||0)<n)return `<div class="locked">${ICON.lock}<span><b>${esc(b.title)}</b><small>${lockText(n,b.title)}</small></span></div>`}
    if(b.t==="html") return `<div class="html">${b.v}</div>`;
    if(b.t==="code") return `<div class="codebox"><pre><code>${hl(b.v)}</code></pre><button class="copy" type="button">Копировать</button></div>`;
    if(b.t==="tree") return `<div class="treewrap">${tree(b.v,b.labels)}</div>`;
    if(b.t==="file") return `<div class="filebar"><span class="flbl">Задание выполняется с использованием прилагаемого файла.</span>${b.files.map(f=>`<a class="file" href="${esc(f.href)}" download>${ICON.dl}${esc(f.name)}<span class="sz">${esc(f.size||"")}</span></a>`).join("")}</div>`;
    if(b.t==="embed") return `<div class="vwrap"><iframe src="${esc(b.src)}" title="${esc(b.title||"Видео")}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`+(b.alt?`<p class="vlinks">Не открывается? ${b.alt.map(a=>`<a href="${esc(a.href)}" target="_blank" rel="noopener">${esc(a.name)}</a>`).join(" · ")}</p>`:"");
    if(b.t==="grid") return `<div class="gridwrap"><table class="g18">${b.v.map((row,i)=>`<tr>${row.map((v,j)=>`<td class="${(b.r||[])[i]&&b.r[i][j]?"wr ":""}${(b.d||[])[i]&&b.d[i][j]?"wb":""}">${v}</td>`).join("")}</tr>`).join("")}</table></div>`;
    if(b.t==="details") return `<details class="box"><summary>${esc(b.title)}</summary><div>${blocks(b.v)}</div></details>`;
    return "";
  }).join("");
}

let cur={li:0,si:0};
function lessonStat(li){
  const L=lessons[li];if(!L.steps)return null;
  let done=0,tasks=0,ok=0;
  L.steps.forEach((s,i)=>{if(passed(li,i))done++;if(isTask(s)){tasks++;if(passed(li,i))ok++}});
  return {done,total:L.steps.length,ok,tasks};
}
function renderToc(){
  $("ctitle").textContent=C.title+". "+SEC.title;
  let allDone=0,all=0;
  let h=`<div class="mod"><span class="n">${SEC.num}</span><span>✅ ${esc(SEC.title)}</span></div>`;
  lessons.forEach((L,li)=>{
    if(!L.steps){h+=`<button class="les" disabled><span class="n">${L.num}</span><span class="t">${esc(L.title)}</span><span class="c">скоро</span></button>`;return}
    const p=lessonStat(li);allDone+=p.done;all+=p.total;
    const cls=p.done===p.total?" done":p.done?" part":"";
    h+=`<button class="les${li===cur.li?" on":""}${cls}" style="--p:${Math.round(p.done/p.total*100)}%" data-li="${li}"><span class="n">${L.num}</span><span class="t">${esc(L.title)}</span><span class="c">${p.done}/${p.total}</span></button>`;
  });
  $("toclist").innerHTML=h;
  $("toclist").querySelectorAll(".les[data-li]").forEach(b=>b.onclick=()=>{go(+b.dataset.li,null);if(matchMedia("(max-width:900px)").matches)setToc(false)});
  $("pnum").textContent=allDone+"/"+all;
  $("pfill").style.width=(all?allDone/all*100:0)+"%";
}
function sqHTML(li,i){
  const s=lessons[li].steps[i],x=S.st[sid(li,i)]||{};
  let c="sq",icon=s.type==="video"?ICON.video:isTask(s)?ICON.task:ICON.text;
  if(isTask(s)){if(x.ok){c+=x.rev?" rev":" ok";icon=ICON.check}else if(x.att){c+=" bad";icon=ICON.cross}}
  else if(x.seen)c+=" seen";
  if(i===cur.si)c+=" on";
  return `<button class="${c}" data-si="${i}" aria-label="Шаг ${i+1}" title="Шаг ${i+1}">${icon}</button>`;
}
function render(){
  const L=lessons[cur.li], s=L.steps[cur.si], x=st(cur.li,cur.si);
  if(!isTask(s)&&!x.seen){x.seen=true;save()}
  document.title=L.num+" "+L.title+" · шаг "+(cur.si+1);
  $("strip").innerHTML=L.steps.map((_,i)=>sqHTML(cur.li,i)).join("");
  const on=$("strip").querySelector(".sq.on");if(on)on.scrollIntoView({inline:"center",block:"nearest"});
  const p=lessonStat(cur.li);
  $("lbar").innerHTML=`<b>${L.num} ${esc(L.title)}</b><span>${p.done} из ${p.total} шагов пройдено</span><span>${p.ok} из ${p.tasks} баллов получено</span>`;
  $("pts").innerHTML=`Шаг <b>${cur.si+1}</b> из ${L.steps.length}`;
  let h="";
  if(s.title&&s.type!=="video") h+=`<h2 class="left">${esc(s.title)}</h2>`;
  if(s.type==="video"){
    if(s.embed) h+=`<div class="vwrap"><iframe src="${esc(s.embed)}" title="${esc(s.title||"Видео")}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock" allowfullscreen loading="lazy"></iframe></div>`;
    else if(s.src) h+=`<video class="vwrap" controls preload="metadata" playsinline src="${esc(s.src)}"></video>`;
    else h+=`<div class="video"><span class="pl">${ICON.video}</span><b>${esc(s.title||"Видео")}</b><span>Видео к этому шагу появится позже</span></div>`;
  }
  if(s.blocks) h+=blocks(s.blocks,isTask(s)?x:null);
  if(s.type==="choice") h+=choiceHTML(s,x);
  if(s.type==="fill") h+=fillHTML(s,x);
  if(s.type==="match") h+=matchHTML(s,x);
  $("step").innerHTML=h;
  const prev=prevPos(), next=nextPos();
  $("foot").innerHTML=`${prev?`<button class="btn ghost" id="prev">${ICON.prev}Назад</button>`:"<span></span>"}${next?`<button class="btn" id="next">${next.li!==cur.li?"Следующий урок":"Следующий шаг"}${ICON.next}</button>`:`<span class="soon">Это последний шаг раздела</span>`}
    <div class="note"><span>${ME?"Ответы сохраняются в личном кабинете — их видно с любого устройства.":'Ответы сохраняются на этом устройстве. <a href="../kabinet/">Войдите</a>, чтобы они были на любом.'}</span><button class="btn ghost" id="rst">Сбросить прогресс</button><span id="rstc" hidden>Точно стереть все ответы? <button class="btn ghost" id="rsty" style="color:var(--bad)">Да, стереть</button> <button class="btn ghost" id="rstn">Нет</button></span></div>`;
  wire(s,x);
  renderToc();
  renderTex();
}
let katexP=null;
function renderTex(){
  const els=[...document.querySelectorAll("#step .tex:not([data-done])")];if(!els.length)return;
  if(!katexP)katexP=new Promise((res,rej)=>{
    const l=document.createElement("link");l.rel="stylesheet";l.href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";document.head.appendChild(l);
    const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";sc.onload=()=>res(window.katex);sc.onerror=rej;document.head.appendChild(sc);
  });
  katexP.then(k=>{els.forEach(e=>{if(e.dataset.done)return;try{k.render(e.textContent,e,{throwOnError:false,output:"html"});e.dataset.done="1"}catch(err){e.classList.add("raw")}})}).catch(()=>els.forEach(e=>e.classList.add("raw")));
}
function nextPos(){
  if(cur.si<lessons[cur.li].steps.length-1) return {li:cur.li,si:cur.si+1};
  for(let li=cur.li+1;li<lessons.length;li++) if(lessons[li].steps) return {li,si:0};
  return null;
}
function prevPos(){
  if(cur.si>0) return {li:cur.li,si:cur.si-1};
  for(let li=cur.li-1;li>=0;li--) if(lessons[li].steps) return {li,si:lessons[li].steps.length-1};
  return null;
}
function verdict(x,okText,badText){
  if(x.ok) return `<div class="verdict ok">${ICON.check}${okText}</div>`;
  if(x.att&&x.last===false) return `<div class="verdict bad">${ICON.cross}${badText}</div>`;
  return "";
}
function choiceHTML(s,x){
  const sel=x.v!=null?x.v:-1;
  let h=`<div class="quiz${x.ok?" ok":x.att&&x.last===false?" bad":""}" id="quiz"><span class="qt">Выберите один вариант из списка</span>`+verdict(x,"Верно!","Неверно. Попробуйте ещё раз.");
  s.options.forEach((o,i)=>{
    const mark=x.last!=null&&i===sel?(x.ok?" ok":(x.last===false?" bad":"")):"";
    h+=`<label class="opt${mark}"><input type="radio" name="opt" value="${i}" ${i===sel?"checked":""} ${x.ok?"disabled":""}><span>${esc(o)}</span></label>`;
  });
  return h+actions(s,x)+`</div>`;
}
function fillHTML(s,x){
  const v=x.v||[];
  let h=`<div class="quiz${x.ok?" ok":x.att&&x.last===false?" bad":""}" id="quiz"><span class="qt">Заполните пропуски</span>`+verdict(x,"Верно!","Есть ошибки — неверные поля подсвечены красным.")+`<div class="fields">`;
  s.fields.forEach((f,fi)=>{
    h+=`<div class="frow"><label for="f${fi}_0">${esc(f.label)}</label>`;
    for(let k=0;k<f.n;k++){
      const val=(v[fi]||[])[k]||"";
      let cls="";if(x.last!=null&&val!=="")cls=norm(val)===norm(s.answer[fi][k])?"ok":"bad";
      if(x.ok)cls="ok";
      h+=`<input id="f${fi}_${k}" data-f="${fi}" data-k="${k}" inputmode="numeric" autocomplete="off" value="${esc(val)}" class="${cls}" ${x.ok?"readonly":""} aria-label="${esc(f.label)}${f.n>1?", значение "+(k+1):""}">`;
    }
    h+=`</div>`;
  });
  return h+`</div>`+actions(s,x)+`</div>`;
}
function matchHTML(s,x){
  const v=x.v||[];
  let h=`<div class="quiz${x.ok?" ok":x.att&&x.last===false?" bad":""}" id="quiz"><span class="qt">Сопоставьте значения из двух списков</span>`+verdict(x,"Верно!","Есть ошибки — неверные пары подсвечены красным.")+`<div class="mlist">`;
  s.items.forEach((it,i)=>{
    const sel=v[i]!=null?+v[i]:-1;
    let cls="";if(x.last!=null&&sel>=0)cls=sel===s.answer[i]?"ok":"bad";if(x.ok)cls="ok";
    h+=`<label class="mrow"><span class="mk">${it}</span><select data-i="${i}" class="${cls}" ${x.ok?"disabled":""}><option value="">— выберите —</option>${s.options.map((o,j)=>`<option value="${j}" ${j===sel?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
  });
  return h+`</div>`+actions(s,x)+`</div>`;
}
function actions(s,x){
  let h=`<div class="qact">`;
  h+=x.ok?`<button class="btn ghost" id="again">Решить снова</button>`:`<button class="btn" id="send">Отправить</button>`;
  if(x.att) h+=`<span class="att">Неверных попыток: ${x.att}</span>`;
  if(!x.ok&&x.att>=3&&!x.rev) h+=`<button class="btn warn" id="showans">Показать ответ</button>`;
  h+=`</div>`;
  if(x.rev){
    const a=s.type==="choice"?esc(s.options[s.answer]):s.type==="match"?s.items.map((it,i)=>it+" — "+esc(s.options[s.answer[i]])).join("<br>"):s.fields.map((f,i)=>esc(f.label)+": <b>"+s.answer[i].join(" ")+"</b>").join("<br>");
    h+=`<div class="reveal">Правильный ответ:<br>${a}</div>`;
  }
  return h;
}
function wire(s,x){
  $("strip").querySelectorAll(".sq").forEach(b=>b.onclick=()=>go(cur.li,+b.dataset.si));
  document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{
    const t=b.previousElementSibling.innerText;
    try{await navigator.clipboard.writeText(t);b.textContent="Скопировано"}catch(e){const r=document.createRange();r.selectNodeContents(b.previousElementSibling);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);b.textContent="Выделено"}
    setTimeout(()=>b.textContent="Копировать",1500);
  });
  const p=$("prev"),n=$("next");
  if(p)p.onclick=()=>{const q=prevPos();if(q)go(q.li,q.si)};
  if(n)n.onclick=()=>{const q=nextPos();if(q)go(q.li,q.si)};
  $("rst").onclick=()=>{$("rstc").hidden=false;$("rst").hidden=true};
  $("rstn").onclick=()=>{$("rstc").hidden=true;$("rst").hidden=false};
  $("rsty").onclick=()=>{S={pos:null,st:{}};if(ME){S.uid=ME.id;S._reset=true}save();go(0,0)};
  if(!isTask(s))return;
  if(s.type==="choice"){
    document.querySelectorAll('input[name="opt"]').forEach(r=>r.onchange=()=>{x.v=+r.value;x.last=null;save();render()});
  }else if(s.type==="match"){
    document.querySelectorAll(".mrow select").forEach(sl=>sl.onchange=()=>{x.v=x.v||[];x.v[sl.dataset.i]=sl.value===""?null:+sl.value;sl.classList.remove("ok","bad");x.last=null;save()});
  }else{
    document.querySelectorAll(".frow input").forEach(inp=>{
      inp.oninput=()=>{x.v=x.v||[];(x.v[inp.dataset.f]=x.v[inp.dataset.f]||[])[inp.dataset.k]=inp.value;inp.classList.remove("ok","bad");save()};
      inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();submit(s,x)}};
    });
  }
  const send=$("send");if(send)send.onclick=()=>submit(s,x);
  const ag=$("again");if(ag)ag.onclick=()=>{x.ok=false;x.last=null;x.v=s.type==="choice"?null:[];save();render()};
  const sa=$("showans");if(sa)sa.onclick=()=>{x.rev=true;save();render()};
}
function submit(s,x){
  let good;
  if(s.type==="choice"){
    if(x.v==null){flash("Выберите вариант ответа");return}
    good=x.v===s.answer;
  }else if(s.type==="match"){
    const v=x.v||[];
    if(s.items.some((_,i)=>v[i]==null)){flash("Выберите пару для каждой строки");return}
    good=s.items.every((_,i)=>+v[i]===s.answer[i]);
  }else{
    const v=x.v||[];
    const empty=s.fields.every((f,fi)=>[...Array(f.n)].every((_,k)=>!((v[fi]||[])[k]||"").trim()));
    if(empty){flash("Впишите ответ");return}
    good=s.fields.every((f,fi)=>[...Array(f.n)].every((_,k)=>norm((v[fi]||[])[k])===norm(s.answer[fi][k])));
  }
  x.last=good;if(good)x.ok=true;else x.att=(x.att||0)+1;
  save();render();
  const q=$("quiz");if(q)q.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function flash(t){const a=document.querySelector(".qact");if(!a)return;let m=a.querySelector(".att.tmp");if(!m){m=document.createElement("span");m.className="att tmp";a.appendChild(m)}m.textContent=t}
function go(li,si){
  if(!lessons[li]||!lessons[li].steps)return;
  if(si==null){const p=S.last&&S.last[li];si=p!=null?p:0}
  cur={li,si};S.pos=cur;S.last=S.last||{};S.last[li]=si;save();
  history.replaceState(null,"","#"+lessons[li].num+"-"+(si+1));
  render();window.scrollTo({top:0});
}
function fromHash(){
  const m=location.hash.match(/^#([\d.]+)-(\d+)$/);
  if(m){const li=lessons.findIndex(L=>L.num===m[1]);if(li>=0&&lessons[li].steps){go(li,Math.max(0,Math.min(+m[2]-1,lessons[li].steps.length-1)));return}}
  if(S.pos&&lessons[S.pos.li]&&lessons[S.pos.li].steps)go(S.pos.li,S.pos.si);else go(0,0);
}

/* table of contents toggle */
function setToc(open){
  root.classList.toggle("toc-closed",!open);
  try{localStorage.setItem("toc",open?"open":"closed")}catch(e){}
  const b=$("tocbtn");b.setAttribute("aria-label",open?"Скрыть оглавление":"Показать оглавление");b.setAttribute("aria-expanded",open);
}
if(matchMedia("(max-width:900px)").matches&&!root.classList.contains("toc-closed"))setToc(false);
$("tocbtn").onclick=()=>setToc(root.classList.contains("toc-closed"));
$("scrim").onclick=()=>setToc(false);
$("tocbtn").setAttribute("aria-expanded",!root.classList.contains("toc-closed"));

/* theme toggle */
(function(){
  const b=$("theme");
  const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const paint=()=>{const d=isDark();b.innerHTML=d?SUN:MOON;b.title=d?"Светлая тема":"Тёмная тема";b.setAttribute("aria-label",b.title)};
  b.onclick=()=>{const t=isDark()?"light":"dark";root.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}paint()};
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paint);
  paint();
})();
/* скачивание файлов без перехода на другую страницу (Яндекс Браузер перехватывает .xlsx) */
document.addEventListener("click",async e=>{
  const a=e.target.closest&&e.target.closest("a.file[href]");
  if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.button!==0)return;
  e.preventDefault();
  if(a.dataset.busy)return;a.dataset.busy="1";
  const href=a.getAttribute("href"),name=decodeURIComponent(href.split("/").pop());
  try{
    const r=await fetch(href,{cache:"no-store"});if(!r.ok)throw new Error(r.status);
    const blob=new Blob([await r.arrayBuffer()],{type:"application/octet-stream"});
    const url=URL.createObjectURL(blob),t=document.createElement("a");
    t.href=url;t.download=name;t.style.display="none";document.body.appendChild(t);t.click();
    setTimeout(()=>{URL.revokeObjectURL(url);t.remove()},4000);
  }catch(err){location.href=href}
  finally{delete a.dataset.busy}
});
window.addEventListener("hashchange",fromHash);
fromHash();
initSync();
})();
