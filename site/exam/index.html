<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вариант ЕГЭ</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#16181c">
<meta name="robots" content="noindex">
<meta property="og:title" content="Варианты ЕГЭ по информатике">
<meta property="og:description" content="Варианты в формате экзамена для учеников Артёма Свинченко.">
<meta property="og:image" content="https://gsvv.ru/inf/og-course.jpg">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Режим экзамена: тёмная шапка, сетка номеров 1–27, задание слева, таймер и баллы справа */
:root{
  --bar:#222326; --bar-2:#2d2e32; --bar-ink:#e8e8ea; --bar-muted:#9a9ca3; --bar-line:#3a3b40;
  --green:#66cc66; --green-ink:#2e8b2e; --green-soft:#e8f6e8;
  --bg:#f4f5f6; --card:#ffffff; --ink:#222222; --muted:#6b6f76; --line:#e1e3e6; --line-strong:#22222244;
  --accent:#2f7dd1; --accent-soft:#e7f0fb;
  --bad:#d64541; --bad-soft:#fdeceb; --warn:#c27c0e; --warn-soft:#fdf3e1; --hw:#ff9f1a;
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --head-h:58px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141518; --card:#1c1d21; --ink:#e6e7ea; --muted:#9a9ea6; --line:#2e3036; --line-strong:#e6e7ea44;
  --accent:#7fb2ff; --accent-soft:#1b2a40; --green-ink:#7ad67a; --green-soft:#1c3320;
  --bad:#ff7d78; --bad-soft:#3a1d1c; --warn:#f0b354; --warn-soft:#352812; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141518; --card:#1c1d21; --ink:#e6e7ea; --muted:#9a9ea6; --line:#2e3036; --line-strong:#e6e7ea44;
  --accent:#7fb2ff; --accent-soft:#1b2a40; --green-ink:#7ad67a; --green-soft:#1c3320;
  --bad:#ff7d78; --bad-soft:#3a1d1c; --warn:#f0b354; --warn-soft:#352812; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);min-height:100vh}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}

/* шапка */
.head{position:sticky;top:0;z-index:30;background:var(--bar);color:var(--bar-ink);padding-top:env(safe-area-inset-top,0px)}
.head .wrap{height:var(--head-h);display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;color:var(--bar-ink);text-decoration:none;min-width:0;flex:1}
.mark{width:34px;height:34px;border-radius:9px;background:var(--green);color:#10331a;display:flex;align-items:center;justify-content:center;font:700 15px var(--f-mono);flex:none}
.lt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.lt b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt small{font-size:12px;color:var(--bar-muted)}
.hright{display:flex;align-items:center;gap:8px;flex:none}
.hbtn{height:38px;border-radius:9px;border:1px solid var(--bar-line);background:var(--bar-2);color:var(--bar-ink);display:flex;align-items:center;gap:7px;padding:0 11px;text-decoration:none;font:500 14px var(--f-body);white-space:nowrap;cursor:pointer}
.hbtn:hover{border-color:var(--bar-muted)}
.hbtn svg{width:18px;height:18px;flex:none}
#theme{width:38px;padding:0;justify-content:center}
.coins{font:700 15px var(--f-mono)}
.coin{width:19px;height:19px;flex:none;display:block}
.coins.bump{animation:cbump .5s ease}
@keyframes cbump{30%{transform:scale(1.18)}}
.cfly{position:fixed;z-index:60;pointer-events:none;display:flex;align-items:center;gap:4px;font:800 18px var(--f-mono);color:#e0a100;text-shadow:0 1px 0 #0003;animation:cfly 1.1s cubic-bezier(.2,.7,.3,1) forwards}
.cfly .coin{width:22px;height:22px}
@keyframes cfly{0%{opacity:0;transform:translate(0,10px) scale(.8)}15%{opacity:1;transform:translate(0,0) scale(1.1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.6)}}
@media (max-width:560px){.lt small{display:none}.acct span{display:none}}

/* полоса с номерами заданий */
.vbar{position:sticky;top:calc(var(--head-h) + env(safe-area-inset-top,0px));z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.vbar .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.vtitle{display:flex;align-items:center;gap:10px;min-width:0;font-size:14px;color:var(--muted)}
.vtitle a{text-decoration:none;white-space:nowrap}
.vtitle b{color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:700px){.nums{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:5px 5px 6px;margin:-5px -5px -6px}.nums::-webkit-scrollbar{display:none}}
.nq{flex:none;width:38px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px var(--f-mono);display:flex;align-items:center;justify-content:center;text-decoration:none;position:relative;cursor:pointer}
.nq:hover{border-color:var(--muted)}
.nq.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.nq.ok{background:var(--green);border-color:var(--green);color:#10331a}
.nq.part{background:var(--warn);border-color:var(--warn);color:#2a1a00}
.nq.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.nq.txt{border-style:dashed;color:var(--muted)}
.nq.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.nq.hw::before{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--hw);border:2px solid var(--card)}
.nq.res{width:auto;padding:0 12px;font:600 14px var(--f-body);gap:6px}

/* основная часть */
.vmain{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;padding-block:20px 60px;align-items:start}
@media (max-width:920px){.vmain{grid-template-columns:minmax(0,1fr)}.side{order:-1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
@media (max-width:560px){.card{padding:16px}}
.thead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.thead h1{margin:0;font:700 22px/1.2 var(--f-body)}
.badge{font:600 12px var(--f-mono);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:2px 10px;white-space:nowrap}
.badge.hw{border-color:#ffd59a;background:#fff3e0;color:#b86b00}
:root[data-theme="dark"] .badge.hw{background:#3a2a10;color:#ffc46b;border-color:#5c4214}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.hw{background:#3a2a10;color:#ffc46b;border-color:#5c4214}}
.filebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.flbl{font-size:14px;color:var(--muted);flex-basis:100%}
.file{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line-strong);text-decoration:none;color:var(--ink);font:600 14px var(--f-mono)}
.file:hover{border-color:var(--green)}
.file svg{width:16px;height:16px;color:var(--green-ink)}
.file .sz{font:400 12px var(--f-body);color:var(--muted)}
.tx{overflow-wrap:break-word}
.tx p{margin:0 0 10px}
.tx img{max-width:100%;height:auto;background:#fff;border-radius:4px}
.tx table{border-collapse:collapse;margin:10px 0 14px;max-width:100%;display:block;overflow-x:auto;width:max-content}
.tx td,.tx th{border:1px solid var(--line-strong);padding:4px 10px;text-align:center;min-width:28px;height:30px}
.tx table.plain td{border:0;padding:1px 22px 1px 0;text-align:left}
.tx pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:14px/1.5 var(--f-mono)}
.tex{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle;scrollbar-width:none}
.tex::-webkit-scrollbar{display:none}
.tex.raw{font:14px var(--f-mono);color:var(--muted)}
.vnote{padding:10px 14px;border-radius:10px;background:var(--warn-soft);border:1px solid var(--warn);margin-bottom:14px}

/* поле ответа */
.answ{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.answ h3{margin:0 0 10px;font:600 15px var(--f-body);color:var(--muted)}
.atab{display:grid;gap:6px;width:max-content;max-width:100%}
.arow{display:flex;align-items:center;gap:6px}
.arow label{width:34px;flex:none;font:500 14px var(--f-mono);color:var(--muted);text-align:right}
.arow.one label{display:none}
.arow input{width:150px;height:42px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink);font:600 16px var(--f-mono);padding:0 10px;min-width:0}
.atab.wide .arow input{width:min(320px,70vw)}
.arow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.arow input:disabled{opacity:1;background:var(--bg);color:var(--ink)}
.arow input.c-ok{border-color:var(--green);background:var(--green-soft)}
.arow input.c-bad{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:480px){.arow input{width:calc((100vw - 130px)/2)}.arow.one input{width:calc((100vw - 90px)/2)}.atab.wide .arow input{width:calc(100vw - 80px)}}
.saved{font-size:13px;color:var(--muted);margin-top:8px;min-height:20px}
.tnav{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font:600 15px var(--f-body);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--green);border-color:var(--green);color:#10331a}
.btn.pri:hover{filter:brightness(.95)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.link{border:0;background:none;color:var(--accent);padding:0 6px;height:auto}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.sp{flex:1}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-weight:500}
.verdict.ok{background:var(--green-soft);color:var(--green-ink)}
.verdict.part{background:var(--warn-soft);color:var(--warn)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.info{background:var(--bg);color:var(--muted)}
.key{margin-top:12px;padding:10px 14px;border-radius:10px;border:1px dashed var(--green);font-size:15px}
.key code{font:600 15px var(--f-mono)}
.prize{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 7px}
.prize .coin{width:16px;height:16px}

/* правая колонка */
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(var(--head-h) + 140px)}
@media (max-width:920px){.side{position:static}}
.timer{font:700 30px/1.1 var(--f-mono);letter-spacing:.02em}
.timer.low{color:var(--warn)}.timer.out{color:var(--bad)}
.slbl{font-size:13px;color:var(--muted);margin-bottom:4px}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--green);border-radius:99px}
.side .btn{width:100%}
.side p{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font:700 44px/1 var(--f-mono)}
.score span{color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14.5px;margin-top:10px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--f-mono);text-align:right}
@media (max-width:920px){.side .card{padding:14px 16px}.sidegrid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.side .btn{width:auto}.side p{display:none}}

/* итоги */
.rtab{width:100%;border-collapse:collapse;font-size:15px}
.rtab th{font:600 13px var(--f-body);color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.rtab td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.rtab tr[data-n]{cursor:pointer}
.rtab tr[data-n]:hover td{background:var(--bg)}
.rtab code{font:600 14px var(--f-mono);white-space:pre-wrap;word-break:break-all}
.rtab .pt{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.pt.ok{color:var(--green-ink)}.pt.part{color:var(--warn)}.pt.bad{color:var(--bad)}
.rsum{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.rbox{flex:1 1 150px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rbox b{display:block;font:700 30px/1.1 var(--f-mono)}
.rbox span{font-size:13.5px;color:var(--muted)}
.rbox.main{background:var(--green-soft);border-color:transparent}
.rbox.main b{color:var(--green-ink)}
.muted{color:var(--muted)}

/* список вариантов */
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding-block:24px 60px}
.vlist h1{grid-column:1/-1;margin:0;font:700 26px/1.2 var(--f-body)}
.vlist .lead{grid-column:1/-1;margin:-8px 0 0;color:var(--muted)}
.vc{display:flex;flex-direction:column;gap:10px}
.vc h2{margin:0;font:600 19px/1.3 var(--f-body)}
.vc .st{font-size:14px;color:var(--muted)}
.vc .btn{align-self:flex-start;margin-top:auto}
.gate{max-width:560px;margin:60px auto;text-align:center}
.gate h2{margin:0 0 10px}

/* окно подтверждения */
.modal{position:fixed;inset:0;z-index:80;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--card);color:var(--ink);border-radius:16px;max-width:440px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px #0006}
.mbox h2{margin:0 0 8px;font-size:20px}
.mbox p{margin:0 0 10px;color:var(--muted)}
.mbox .tnav{justify-content:flex-end}

.scale{margin:0 0 20px}
.scale .slbl b{color:var(--ink);font-family:var(--f-mono)}
.sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;margin-top:6px}
.sc-c{border:1px solid var(--line);border-radius:7px;padding:3px 0 4px;text-align:center;line-height:1.15}
.sc-c b{display:block;font:500 11px var(--f-mono);color:var(--muted)}
.sc-c span{font:700 14px var(--f-mono)}
.z-r{background:var(--bad-soft);border-color:transparent}.z-o{background:var(--warn-soft);border-color:transparent}.z-g{background:var(--green-soft);border-color:transparent}
.sc-c.me{background:var(--ink);border-color:var(--ink)}.sc-c.me b,.sc-c.me span{color:var(--card)}
.sc-leg{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px;color:var(--muted)}
.sc-leg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}

/* вёрстка условий как в демоверсии: таблицы, граф, схема БД, формулы, программы */
.tx .scroll{overflow-x:auto;max-width:100%;margin:6px 0 12px}
.tx .scroll table{margin:0}
.tx .fig{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin:6px 0 12px}
.tx table.t{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px;display:table;width:auto;margin:0}
.tx table.t td,.tx table.t th{border:1px solid var(--line-strong);text-align:center;padding:4px 9px;min-width:32px;height:30px}
.tx table.t th{font-weight:600;background:var(--accent-soft)}
.tx table.t td.x{background:var(--line)}
.tx table.t th.c0{background:transparent}
.tx table.t.mono td{font-family:var(--f-mono)}
.tx table.t td.l{text-align:left}
.tx pre.code{margin:6px 0 12px;font:14px/1.55 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;overflow-x:auto;max-width:100%}
.tx .nw{white-space:nowrap}
.tx .formula{text-align:center;font-size:17px;padding:4px 0;overflow-x:auto}
.tx ul.dash{list-style:none;padding-left:18px;margin:0 0 10px}
.tx ul.dash li::before{content:"– ";margin-left:-14px}
.tx ol{margin:0 0 10px;padding-left:24px}
.tx li{margin:2px 0}
.tx svg.graph{width:300px;max-width:100%;height:auto}
.tx svg.graph .e{stroke:var(--ink);stroke-width:1.7;fill:none}
.tx svg.graph .v{fill:var(--ink)}
.tx svg.graph text{fill:var(--ink);font:500 15px var(--f-body)}
.tx svg.db{width:560px;max-width:100%;height:auto;display:block;margin:6px 0 12px}
.tx svg.db rect.box{fill:var(--card);stroke:var(--line-strong);stroke-width:1.2}
.tx svg.db rect.hd{fill:var(--accent-soft)}
.tx svg.db text{fill:var(--ink);font:13px var(--f-body)}
.tx svg.db text.h{font-weight:600}
.tx svg.db text.k{font-weight:600;text-decoration:underline}
.tx svg.db path{stroke:var(--ink);stroke-width:1.3;fill:none}

.fire{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13.5px var(--f-body);cursor:pointer;white-space:nowrap}
button.fire:hover{border-color:#ff8a1f}
span.fire{cursor:default}
.fire .fl{font-size:15px;line-height:1;filter:grayscale(1);opacity:.55}
.fire.on{background:#fff1e3;border-color:#ff8a1f;color:#a24b00;font-weight:600}
.fire.on .fl,.fire.has .fl{filter:none;opacity:1}
.fire b{font:700 12.5px var(--f-mono);background:#ff8a1f;color:#fff;border-radius:999px;padding:1px 7px}
:root[data-theme="dark"] .fire.on{background:#3a2412;color:#ffb36b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fire.on{background:#3a2412;color:#ffb36b}}
.nq .fdot{position:absolute;right:-6px;bottom:-6px;font-size:12px;line-height:1;pointer-events:none}
</style>
</head>
<body>
<header class="head"><div class="wrap">
  <a class="logo" href="../" title="На главную"><span class="mark">AS</span><span class="lt"><b id="htitle">Варианты ЕГЭ</b><small>← На главную</small></span></a>
  <div class="hright">
    <a class="hbtn coins" id="coins" href="../kabinet/" hidden title="Монетки"><svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#f6c43a"/><circle cx="10" cy="10" r="9" fill="none" stroke="#c98a12" stroke-width="1.2"/><circle cx="10" cy="10" r="5.6" fill="none" stroke="#c98a12" stroke-width="1.4"/><path d="M6.2 6.4a5 5 0 0 1 4-2" stroke="#fff6cf" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg><span id="coinn">0</span></a>
    <a class="hbtn acct" id="acct" href="../kabinet/" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg><span>Войти</span></a>
    <button class="hbtn" id="theme" type="button" aria-label="Переключить тему"></button>
  </div>
</div></header>
<div id="app"><div class="gate">Загружаем вариант…</div></div>
<div class="modal" id="modal" hidden></div>

<script>
(function(){
const API="../api/index.php";
const MID=new URLSearchParams(location.search).get("m")||"";
/* ЕГЭ-2026: задания 1–25 по 1 баллу, 26 и 27 — по 2 (за частичный ответ 1). Перевод первичных баллов в тестовые */
const SCALE=[0,7,14,20,27,34,40,43,46,48,51,54,56,59,62,64,67,70,72,75,78,80,83,85,88,90,93,95,98,100];
const LIMIT=235*60*1000;  // 3 ч 55 мин
const COIN='<svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#f6c43a"/><circle cx="10" cy="10" r="9" fill="none" stroke="#c98a12" stroke-width="1.2"/><circle cx="10" cy="10" r="5.6" fill="none" stroke="#c98a12" stroke-width="1.4"/><path d="M6.2 6.4a5 5 0 0 1 4-2" stroke="#fff6cf" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>';
const DL='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 6.8 8 10.3l3.5-3.5M2.5 13.5h11"/></svg>';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=s=>String(s==null?"":s).replace(/\s+/g,"").replace(",",".").toLowerCase();
const app=$("app");
let C=null,L=[],KEY="",S={st:{},ex:{}},ME=null,COINS=null,HW=new Set(),SHOWKEY=false;
let syncT=null,syncing=false,dirty=false,cur={li:-1,n:0,res:false},tick=null;

/* ---------- тема ---------- */
(function(){
  const b=$("theme"),root=document.documentElement;
  const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const paint=()=>{const d=isDark();b.innerHTML=d?SUN:MOON;b.title=d?"Светлая тема":"Тёмная тема"};
  b.onclick=()=>{const t=isDark()?"light":"dark";root.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}paint()};
  paint();
})();

/* ---------- сервер ---------- */
async function api(action,body,keepalive){
  const opt=body?{method:"POST",headers:{"Content-Type":"application/json","X-Inf":"1"},body:JSON.stringify(body),credentials:"same-origin",keepalive:!!keepalive}:{credentials:"same-origin",cache:"no-store"};
  const r=await fetch(API+"?action="+action,opt);let j=null;try{j=await r.json()}catch(e){}
  if(!j||!j.ok){const e=new Error((j&&j.error)||("Ошибка "+r.status));e.status=r.status;throw e}
  return j;
}
const asRec=r=>Array.isArray(r)?Object.assign({},r):r;  // пустая запись с сервера могла прийти как []
function mergeRec(a,b){
  a=asRec(a);b=asRec(b);
  if(!a)return b;if(!b)return a;
  const src=(a.ok&&!b.ok)?a:b,oth=src===a?b:a,r={};
  if("v" in src)r.v=src.v;else if("v" in oth)r.v=oth.v;
  if("last" in src)r.last=src.last;else if("last" in oth)r.last=oth.last;
  const att=Math.max(a.att||0,b.att||0);if(att)r.att=att;
  ["ok","rev","seen"].forEach(k=>{if(a[k]||b[k])r[k]=true});
  return r;
}
function pickEx(a,b){
  if(!a)return b;if(!b)return a;
  if(a.fin&&!b.fin)return a;if(b.fin&&!a.fin)return b;
  if(a.fin&&b.fin)return a.fin>=b.fin?a:b;
  return (a.t0||9e15)<=(b.t0||9e15)?a:b;
}
function mergeAll(sv,lc){
  sv=sv||{};const r=Object.assign({},sv,lc,{st:{},ex:{}});
  const a=sv.st||{},b=lc.st||{};new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{r.st[k]=mergeRec(a[k],b[k])});
  const x=sv.ex||{},y=lc.ex||{};new Set([...Object.keys(x),...Object.keys(y)]).forEach(k=>{r.ex[k]=pickEx(x[k],y[k])});
  return r;
}
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function save(now){saveLocal();if(!ME)return;dirty=true;clearTimeout(syncT);syncT=setTimeout(push,now?10:1200)}
async function push(keepalive){
  if(!ME||!dirty)return;
  if(syncing){clearTimeout(syncT);syncT=setTimeout(push,800);return}
  syncing=true;dirty=false;
  const reset=!!S._reset,data=Object.assign({},S);delete data._reset;delete data.uid;
  try{const j=await api("progress_put",{key:KEY,data,reset},keepalive);delete S._reset;
    if(typeof j.coins==="number"){COINS=j.coins;paintCoins(j.gained||0)}}
  catch(e){dirty=true;if(e.status===401)ME=null}
  finally{syncing=false;saveLocal();if(dirty&&ME){clearTimeout(syncT);syncT=setTimeout(push,15000)}}
}
async function pull(){
  let g;try{g=await api("progress_get&key="+KEY)}catch(e){if(e.status===401)ME=null;return}
  if(typeof g.coins==="number")COINS=g.coins;
  if(S._reset){dirty=true;push();return}
  const m=mergeAll(g.data,S);m.uid=ME.id;
  const changed=JSON.stringify({st:m.st,ex:m.ex})!==JSON.stringify({st:(g.data&&g.data.st)||{},ex:(g.data&&g.data.ex)||{}});
  S=m;saveLocal();if(changed){dirty=true;push()}
}
document.addEventListener("visibilitychange",()=>{if(!ME)return;if(document.visibilityState==="hidden")push(true);else if(!dirty&&!syncing)pull().then(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches(".arow input")))route()})});
window.addEventListener("pagehide",()=>{if(ME&&dirty)push(true)});

/* ---------- монетки и вход ---------- */
const coinFor=x=>x&&x.ok&&!x.rev?Math.max(0,3-(x.att||0)):0;
function localCoins(){let s=0;L.forEach(l=>l.steps.forEach(st=>{s+=coinFor(rec(l,st))}));return s}
function paintCoins(gained){
  const el=$("coins");if(!C)return;
  const n=ME&&COINS!=null?COINS:localCoins();el.hidden=false;$("coinn").textContent=n;
  el.title=ME?"Монетки в кабинете: "+n:"Монетки на этом устройстве. Войдите, чтобы они копились в кабинете";
  if(gained>0){const q=document.querySelector(".verdict")||document.querySelector(".rsum")||el,a=q.getBoundingClientRect(),b=el.getBoundingClientRect();
    const f=document.createElement("div");f.className="cfly";f.innerHTML="+"+gained+COIN;const x=a.left+Math.min(a.width-80,160),y=a.top+6;
    f.style.left=x+"px";f.style.top=y+"px";f.style.setProperty("--dx",(b.left-x)+"px");f.style.setProperty("--dy",(b.top-y)+"px");
    document.body.appendChild(f);setTimeout(()=>{f.remove();el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")},1000)}
}
function paintAcct(){
  const a=$("acct");a.hidden=false;a.querySelector("span").textContent=ME?ME.name.split(" ")[0]:"Войти";
  a.href="../kabinet/"+(ME?"":"?next="+encodeURIComponent("../exam/"+location.search+location.hash));
  a.title=ME?"Личный кабинет":"Войти";
}

/* ---------- данные варианта ---------- */
const sid=(l,st)=>l.num+"/"+st.key;
const rec=(l,st)=>{const k=sid(l,st);if(Array.isArray(S.st[k]))S.st[k]=asRec(S.st[k]);return S.st[k]};
const recW=(l,st)=>{const k=sid(l,st);if(Array.isArray(S.st[k]))S.st[k]=asRec(S.st[k]);return S.st[k]||(S.st[k]={})};
const isTask=st=>st.type==="fill"&&st.answer&&st.fields;
const filled=v=>!!v&&v.some(r=>(r||[]).some(c=>nm(c)!==""));
const maxOf=l=>l.steps.reduce((a,st)=>a+(isTask(st)?st.pts:0),0);
const toTest=p=>SCALE[Math.max(0,Math.min(SCALE.length-1,Math.round(p)))];
/* баллы за ответ: всё верно — полный балл; у заданий на 2 балла — 1 балл, если верна одна строка (№ 27) или одно число (№ 26) */
function grade(st,v){
  const A=st.answer,V=v||[];
  const rowOk=A.map((r,i)=>r.every((c,j)=>nm(c)===nm((V[i]||[])[j])));
  if(rowOk.every(Boolean))return st.pts;
  if(st.pts<2)return 0;
  const real=A.map((r,i)=>i).filter(i=>A[i].some(c=>nm(c)!==""));
  if(real.length>1)return real.some(i=>rowOk[i])?1:0;
  const r=A[real[0]||0],u=V[real[0]||0]||[];
  return r.length>1&&r.some((c,j)=>nm(c)!==""&&nm(c)===nm(u[j]))?1:0;
}
function exOf(l){
  let E=S.ex[l.num];
  if(!E&&l.steps.some(st=>{const x=rec(l,st);return x&&(x.ok||x.att)}))E={legacy:1,fin:1};  // решали раньше в обычном режиме
  return E||null;
}
const fmtT=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s/60)%60,x=s%60;return h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
const ptsWord=n=>{const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?"баллов":b===1?"балл":b>=2&&b<=4?"балла":"баллов"};
const ansText=v=>filled(v)?v.filter(r=>(r||[]).some(c=>nm(c)!=="")).map(r=>r.map(c=>String(c||"").trim()||"—").join(" ")).join("\n"):"";
const keyText=st=>st.answer.filter(r=>r.some(c=>nm(c)!=="")).map(r=>r.join(" ")).join("\n");

/* ---------- запуск ---------- */
async function boot(){
  let j;
  try{
    const r=await fetch(API+"?action=material&m="+encodeURIComponent(MID),{credentials:"same-origin",cache:"no-store"});
    try{j=await r.json()}catch(e){}
    if(r.status===401){paintGuest();return}
    if(!j||!j.ok)throw new Error(j&&j.error||("Ошибка "+r.status));
  }catch(e){app.innerHTML='<div class="gate"><h2>Не удалось открыть вариант</h2><p>'+esc(e.message)+'</p><p><a class="btn" href="../kabinet/">В личный кабинет</a></p></div>';return}
  C=j.course;const sec=C.section||C.sections[0];
  KEY="course-"+C.id+"-s"+sec.num;L=sec.lessons.filter(l=>l.steps);
  L.forEach(l=>{const big=l.steps.length>=27;l.steps.forEach((st,i)=>{st.key=st.key||String(i+1);st.no=st.no||i+1;st.pts=st.pts||(big&&(st.no===26||st.no===27)?2:1)})});
  document.title=sec.title||C.title;$("htitle").textContent=C.title==="СтатГрад"?"СтатГрад · "+sec.title:sec.title||C.title;
  try{const y=JSON.parse(localStorage.getItem(KEY)||"null");if(y&&y.st)S=Object.assign({ex:{}},y)}catch(e){}
  S.ex=S.ex||{};
  try{const m=await api("me");ME=m.user;COINS=m.coins||0}catch(e){}
  if(ME&&S.uid&&S.uid!==ME.id)S={st:{},ex:{}};
  paintAcct();
  if(ME){try{const i=await api("info_get");(i.hw_tasks||[]).forEach(x=>HW.add(x))}catch(e){}await pull()}
  paintCoins(0);route();loadFires();
  tick=setInterval(paintTimer,1000);
}
function paintGuest(){
  $("acct").hidden=false;paintAcct();
  app.innerHTML='<div class="gate"><h2>Варианты — только для учеников</h2><p class="muted">Войдите в личный кабинет, и вариант откроется. Ответы, баллы и монетки сохраняются в кабинете.</p><p><a class="btn pri" href="../kabinet/?next='+encodeURIComponent("../exam/"+location.search+location.hash)+'">Войти</a></p></div>';
}

/* ---------- навигация: #1 — вариант 1, #1-5 — задание 5, #1-res — итоги ---------- */
function route(){
  if(!C)return;
  const m=location.hash.match(/^#([\w.]+?)(?:-(\d+|res))?$/);
  let li=m?L.findIndex(l=>l.num===m[1]):-1;
  if(li<0){if(L.length===1)li=0;else{renderList();return}}
  const l=L[li],E=exOf(l);
  if(!E){S.ex[l.num]={t0:Date.now()};save(true)}
  let n=m&&m[2]&&m[2]!=="res"?+m[2]:0,res=!!(m&&m[2]==="res");
  if(res&&!exOf(l).fin)res=false;
  if(!res&&!(n>=1&&n<=l.steps.length)){const k=l.steps.findIndex(st=>isTask(st)&&!filled((rec(l,st)||{}).v));n=k<0?1:k+1}
  cur={li,n,res};renderVariant();
}
window.addEventListener("hashchange",route);
const go=(l,x)=>{const h="#"+l.num+"-"+x;if(location.hash===h)route();else location.hash=h};

/* ---------- список вариантов ---------- */
function renderList(){
  cur={li:-1};
  app.innerHTML=`<div class="wrap"><div class="vlist"><h1>${esc((C.section||{}).title||C.title)}</h1><p class="lead">Выберите вариант. Время — 3 ч 55 мин, как на экзамене; ответы сохраняются сами. После завершения — баллы, перевод в тестовые и монетки за верные ответы.</p>
  ${L.map(l=>{const E=exOf(l),tasks=l.steps.filter(isTask),a=tasks.filter(st=>filled((rec(l,st)||{}).v)).length;
    let stt,btn;
    if(E&&E.fin&&!E.legacy){stt=`Завершён: <b>${E.test}</b> тестовых · ${E.prim} из ${maxOf(l)} первичных`;btn=`<a class="btn" href="#${esc(l.num)}-res">Итоги</a>`}
    else if(E&&E.legacy){const ok=tasks.filter(st=>(rec(l,st)||{}).ok).length;stt=`Решено ${ok} из ${tasks.length}`;btn=`<a class="btn" href="#${esc(l.num)}">Продолжить</a>`}
    else if(E&&E.t0){stt=`Идёт · отвечено ${a} из ${tasks.length} · осталось ${fmtT(E.t0+LIMIT-Date.now())}`;btn=`<a class="btn pri" href="#${esc(l.num)}">Продолжить</a>`}
    else{stt=`${tasks.length} заданий · ${maxOf(l)} первичных баллов`;btn=`<a class="btn pri" href="#${esc(l.num)}">Начать</a>`}
    return `<article class="card vc"><h2>${esc(l.title)}</h2><div class="st">${stt}</div>${btn}</article>`}).join("")}</div></div>`;
  window.scrollTo(0,0);
}

/* ---------- вариант ---------- */
function sqClass(l,st,E){
  const x=rec(l,st)||{};let c="nq";
  if(!isTask(st))c+=" txt";
  else if(E&&E.fin){const p=E.p?E.p[st.no]:null;c+=x.ok?" ok":(p>0?" part":" bad")}
  else if(filled(x.v))c+=" ans";
  if(HW.has(KEY+"|"+sid(l,st)))c+=" hw";
  return c;
}
function renderVariant(){
  const l=L[cur.li],E=exOf(l),fin=!!(E&&E.fin);
  const nums=l.steps.map((st,i)=>{const fn=fireN(l,st);return `<a class="${sqClass(l,st,E)}${!cur.res&&cur.n===i+1?" on":""}" href="#${esc(l.num)}-${i+1}" title="Задание ${st.no}${fn?" · 🔥 сложная ("+fn+")":""}">${st.no}${fn?'<span class="fdot">🔥</span>':""}</a>`}).join("")+
    (fin&&!E.legacy?`<a class="nq res${cur.res?" on":""}" href="#${esc(l.num)}-res">Итоги</a>`:"");
  app.innerHTML=`<div class="vbar"><div class="wrap"><div class="vtitle">${L.length>1?`<a href="#">← Все варианты</a>`:""}<b>${esc(l.title)}</b></div><nav class="nums" aria-label="Задания">${nums}</nav></div></div>
    <div class="wrap vmain"><section id="main">${cur.res?resultsHTML(l,E):taskHTML(l,E)}</section><aside class="side" id="side">${sideHTML(l,E)}</aside></div>`;
  bindVariant(l,E);renderTex();
  const on=app.querySelector(".nq.on");if(on&&on.scrollIntoView&&matchMedia("(max-width:700px)").matches)on.scrollIntoView({block:"nearest",inline:"center"});
}
function fieldsHTML(st,v,opts){
  const one=st.fields.length===1,wide=st.fields.length===1&&st.fields[0].n===1;
  const num=!st.fields.some(f=>f.txt)&&!st.answer.some(r=>r.some(c=>/[^\d]/.test(String(c))));
  return `<div class="atab${wide?" wide":""}">${st.fields.map((f,i)=>`<div class="arow${one?" one":""}"><label>${esc(one?"":f.label||((i+1)+")"))}</label>${Array.from({length:f.n||1},(_,j)=>{
    const val=((v||[])[i]||[])[j];let cls="";
    if(opts.mark){const ok=nm(val)===nm(st.answer[i][j]);cls=nm(val)===""&&nm(st.answer[i][j])===""?"":ok?"c-ok":"c-bad"}
    return `<input data-r="${i}" data-c="${j}" value="${esc(val==null?"":val)}" ${num?'inputmode="numeric"':'inputmode="text"'} autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${esc((f.label||"Ответ")+" "+(j+1))}"${opts.dis?" disabled":""}${cls?` class="${cls}"`:""}>`}).join("")}</div>`).join("")}</div>`;
}
function blocksHTML(st){
  return (st.blocks||[]).map(b=>{
    if(b.t==="file")return `<div class="filebar"><span class="flbl">Задание выполняется с использованием прилагаемых файлов.</span>${b.files.map(f=>`<a class="file" href="${esc(f.href)}" download>${DL}${esc(f.name)}<span class="sz">${esc(f.size||"")}</span></a>`).join("")}</div>`;
    if(b.t==="html")return `<div class="tx">${b.v}</div>`;
    if(b.t==="p"||b.t==="text")return `<div class="tx"><p>${esc(b.v)}</p></div>`;
    if(b.t==="code")return `<div class="tx"><pre>${esc(b.v)}</pre></div>`;
    return b.v?`<div class="tx">${b.v}</div>`:"";
  }).join("");
}
function taskHTML(l,E){
  const st=l.steps[cur.n-1],x=rec(l,st)||{},fin=!!(E&&E.fin),hw=HW.has(KEY+"|"+sid(l,st));
  let h=`<article class="card"><div class="thead"><h1>Задание ${st.no}</h1>${isTask(st)?`<span class="badge">${st.pts} ${ptsWord(st.pts)}</span>`:""}${hw?`<span class="badge hw">домашка</span>`:""}<span class="sp"></span>${fireHTML(l,st)}</div>${blocksHTML(st)}`;
  if(!isTask(st)){h+=`<div class="answ"><div class="verdict info">У этого задания нет проверки ответа — оно не входит в подсчёт баллов.</div></div>`}
  else if(!fin){
    h+=`<div class="answ"><h3>Ответ</h3>${fieldsHTML(st,x.v,{})}<div class="saved" id="saved">${filled(x.v)?"Ответ сохранён":""}</div></div>`;
  }else{
    const p=E.p?E.p[st.no]:null,a=E.a?E.a[st.no]:null;
    h+=`<div class="answ">`;
    if(!E.legacy){
      const cls=p===st.pts?"ok":p>0?"part":"bad";
      h+=`<div class="verdict ${cls}">На экзамене: ${filled(a)?`<code>${esc(ansText(a)).replace(/\n/g," · ")}</code>`:"нет ответа"} — ${p||0} из ${st.pts} ${ptsWord(st.pts)}</div>`;
    }
    if(x.ok){
      h+=`<div class="verdict ok">✓ Решено${coinFor(x)?` · ${COIN} +${coinFor(x)}`:""}</div>${fieldsHTML(st,x.v,{dis:1,mark:1})}`;
    }else{
      const prize=x.rev?0:Math.max(0,3-(x.att||0));
      h+=`<h3>${E.legacy?"Ответ":"Решите ещё раз"}</h3>${fieldsHTML(st,x.v||a,{})}
        <div class="tnav"><button class="btn dark" id="check" type="button">Проверить</button>
        <span class="prize">${COIN}${prize?"+"+prize+" за верный ответ":"монеток не будет — ответ открыт"}</span><span class="sp"></span>
        ${x.rev?"":`<button class="btn link" id="reveal" type="button">Показать ответ</button>`}</div><div class="saved" id="saved">${x.att&&!E.legacy?"":""}</div>`;
      if(x.rev)h+=`<div class="key">Правильный ответ: <code>${esc(keyText(st)).replace(/\n/g," · ")}</code></div>`;
    }
    h+=`</div>`;
  }
  if(SHOWKEY&&isTask(st))h+=`<div class="key">Ответ (видит только учитель): <code>${esc(keyText(st)).replace(/\n/g," · ")}</code></div>`;
  const prev=cur.n>1,next=cur.n<l.steps.length;
  h+=`<div class="tnav">${prev?`<a class="btn" href="#${esc(l.num)}-${cur.n-1}">← Задание ${l.steps[cur.n-2].no}</a>`:""}<span class="sp"></span>${next?`<a class="btn${fin?"":" pri"}" href="#${esc(l.num)}-${cur.n+1}">Задание ${l.steps[cur.n].no} →</a>`:(fin?(E.legacy?"":`<a class="btn pri" href="#${esc(l.num)}-res">Итоги</a>`):`<button class="btn pri" type="button" data-finish>Завершить экзамен</button>`)}</div></article>`;
  return h;
}
function sideHTML(l,E){
  const tasks=l.steps.filter(isTask),a=tasks.filter(st=>filled((rec(l,st)||{}).v)).length,fin=!!(E&&E.fin);
  const tkey=ME&&ME.role==="teacher"?`<button class="btn sm" id="showkey" type="button">${SHOWKEY?"Скрыть ответы":"Показать ответы (учитель)"}</button>`:"";
  if(!fin)return `<div class="card"><div class="sidegrid"><div><div class="slbl">Осталось времени</div><div class="timer" id="timer">${fmtT(E.t0+LIMIT-Date.now())}</div>
      <div class="slbl" style="margin-top:12px">Отвечено <b id="acount">${a}</b> из ${tasks.length}</div><div class="meter"><i id="ameter" style="width:${tasks.length?Math.round(100*a/tasks.length):0}%"></i></div></div>
      <button class="btn pri" type="button" data-finish>Завершить экзамен</button></div>
      <p>Ответы сохраняются сами — можно закрыть страницу и вернуться. После завершения увидите баллы; верные ответы принесут монетки (по 3 за задание), остальные можно будет дорешать.</p></div>${tkey?`<div>${tkey}</div>`:""}`;
  const ok=tasks.filter(st=>(rec(l,st)||{}).ok).length;
  let coins=0;tasks.forEach(st=>coins+=coinFor(rec(l,st)));
  if(E.legacy)return `<div class="card"><div class="slbl">Решено</div><div class="score"><b>${ok}</b><span>из ${tasks.length}</span></div><div class="meter"><i style="width:${Math.round(100*ok/tasks.length)}%"></i></div>
    <div class="kv"><span>Монетки</span><b>${coins}</b></div><p>Этот вариант вы решали в обычном режиме. Можно пройти его заново как экзамен — с таймером и баллами.</p>
    <div style="margin-top:12px"><button class="btn sm" type="button" data-restart>Пройти как экзамен</button></div></div>${tkey?`<div>${tkey}</div>`:""}`;
  return `<div class="card"><div class="sidegrid"><div><div class="slbl">Тестовый балл</div><div class="score"><b>${E.test}</b><span>из 100</span></div>
    <div class="kv"><span>Первичный</span><b>${E.prim} из ${maxOf(l)}</b><span>Верно сейчас</span><b>${ok} из ${tasks.length}</b><span>Время</span><b>${fmtT(Math.min(E.fin-E.t0,99*3600e3))}</b><span>Монетки</span><b>${coins}</b></div></div>
    ${cur.res?"":`<a class="btn" href="#${esc(l.num)}-res">Итоги</a>`}</div>
    <p>Нерешённые задания можно дорешать: за верный ответ — монетки (минус одна за каждую ошибку). Баллы за экзамен не меняются.</p>
    <div style="margin-top:12px"><button class="btn sm danger" type="button" data-restart>Пройти заново</button></div></div>${tkey?`<div>${tkey}</div>`:""}`;
}
/* шкала перевода первичных баллов в тестовые с отметкой результата */
function scaleHTML(prim){
  const zone=p=>p<=5?" z-r":p<=7?" z-o":p>=21?" z-g":"";
  return `<div class="scale"><div class="slbl">Перевод в 100-балльную шкалу (ЕГЭ-2026)${prim?` · ваш результат: <b>${prim} → ${toTest(prim)}</b>`:""}</div>
    <div class="sc">${SCALE.slice(1).map((t,i)=>{const p=i+1;return `<div class="sc-c${zone(p)}${p===prim?" me":""}" title="${p} ${ptsWord(p)} → ${t}"><b>${p}</b><span>${t}</span></div>`}).join("")}</div>
    <div class="sc-leg"><span><i class="sw z-r"></i>1–5 — ниже порога 40 баллов</span><span><i class="sw z-o"></i>6–7 — порог пройден, но для вуза мало (минимум 44)</span><span><i class="sw"></i>8–20 — хватает для поступления</span><span><i class="sw z-g"></i>21–29 — 80 баллов и выше</span></div></div>`;
}
function resultsHTML(l,E){
  const tasks=l.steps.filter(isTask),full=tasks.filter(st=>(E.p||{})[st.no]===st.pts).length;
  const rows=l.steps.map((st,i)=>{
    if(!isTask(st))return `<tr data-n="${i+1}"><td><b>${st.no}</b></td><td class="muted" colspan="3">без проверки</td></tr>`;
    const p=(E.p||{})[st.no]||0,a=(E.a||{})[st.no],x=rec(l,st)||{},show=p===st.pts||x.ok||x.rev||SHOWKEY;
    const cls=p===st.pts?"ok":p>0?"part":"bad";
    return `<tr data-n="${i+1}"><td><b>${st.no}</b></td><td>${filled(a)?`<code>${esc(ansText(a))}</code>`:'<span class="muted">—</span>'}</td>
      <td>${show?`<code>${esc(keyText(st))}</code>`:`<a href="#${esc(l.num)}-${i+1}">${x.att>1?"ещё попытка":"дорешать"}</a>`}${x.ok&&p!==st.pts?' <span class="pt ok">✓ дорешано</span>':""}</td>
      <td class="pt ${cls}">${p} / ${st.pts}</td></tr>`}).join("");
  return `<article class="card"><div class="thead"><h1>Итоги</h1><span class="badge">${new Date(E.fin).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}</span></div>
    <div class="rsum"><div class="rbox main"><b>${E.test}</b><span>тестовых баллов из 100</span></div><div class="rbox"><b>${E.prim}<small style="font-size:16px"> / ${maxOf(l)}</small></b><span>первичных баллов</span></div><div class="rbox"><b>${full}<small style="font-size:16px"> / ${tasks.length}</small></b><span>заданий верно</span></div></div>${scaleHTML(E.prim)}
    <div style="overflow-x:auto"><table class="rtab"><thead><tr><th>№</th><th>Ваш ответ</th><th>Правильный ответ</th><th>Баллы</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted" style="font-size:14px;margin:14px 0 0">Правильные ответы к нерешённым заданиям скрыты, чтобы их можно было дорешать за монетки. В задании ответ можно открыть, но тогда монеток за него не будет.</p></article>`;
}
function readV(box){
  const v=[];box.querySelectorAll("input[data-r]").forEach(i=>{const r=+i.dataset.r,c=+i.dataset.c;(v[r]=v[r]||[])[c]=i.value.trim()});
  for(let r=0;r<v.length;r++)v[r]=Array.from(v[r]||[],c=>c||"");
  return v;
}
/* ---------- огоньки: ученики отмечают сложные задачи, видят все ---------- */
let FIRE={},MYF=new Set();
const fireN=(l,st)=>FIRE[sid(l,st)]||0;
const fireMine=(l,st)=>MYF.has(sid(l,st));
const pplWord=n=>{const a=n%100,b=n%10;return a>10&&a<20?"учеников":b===1?"ученик":b>=2&&b<=4?"ученика":"учеников"};
function fireHTML(l,st){
  const n=fireN(l,st),m=fireMine(l,st),cnt=n?`<b>${n}</b>`:"";
  if(ME&&ME.role==="student")return `<button class="fire${m?" on":""}${n?" has":""}" id="firebtn" type="button" aria-pressed="${m}" title="${m?"Нажмите ещё раз, чтобы снять огонёк":"Отметьте, если задача сложная — учитель увидит"}"><span class="fl">🔥</span><span>${m?"Отмечено: сложная":"Сложная задача"}</span>${cnt}</button>`;
  return `<span class="fire${n?" has":""}" title="${n?"Отметили "+n+" "+pplWord(n):"Пока никто не отметил"}"><span class="fl">🔥</span><span>Сложная</span>${cnt}</span>`;
}
async function loadFires(){
  try{const j=await api("fires&keys="+KEY);FIRE=(j.counts||{})[KEY]||{};MYF=new Set((j.mine||{})[KEY]||[]);if(cur.li>=0)paintFireUI()}catch(e){}
}
function paintFireUI(){
  const l=L[cur.li];if(!l)return;
  app.querySelectorAll(".nums .nq[href]").forEach((a,i)=>{const st=l.steps[i];if(!st)return;const fn=fireN(l,st),d=a.querySelector(".fdot");
    if(fn&&!d)a.insertAdjacentHTML("beforeend",'<span class="fdot">🔥</span>');if(!fn&&d)d.remove();a.title="Задание "+st.no+(fn?" · 🔥 сложная ("+fn+")":"")});
  const f=app.querySelector(".thead .fire");if(f&&!cur.res){const d=document.createElement("div");d.innerHTML=fireHTML(l,l.steps[cur.n-1]);f.replaceWith(d.firstChild)}
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("#firebtn");if(!b||b.dataset.busy||cur.li<0)return;
  const l=L[cur.li],st=l.steps[cur.n-1],id=sid(l,st),on=!MYF.has(id);
  b.dataset.busy="1";on?MYF.add(id):MYF.delete(id);FIRE[id]=Math.max(0,(FIRE[id]||0)+(on?1:-1));paintFireUI();
  try{const j=await api("fire_set",{key:KEY,sid:id,on});FIRE[id]=j.n}catch(err){on?MYF.delete(id):MYF.add(id);FIRE[id]=Math.max(0,(FIRE[id]||0)+(on?-1:1))}
  paintFireUI();
});
function bindVariant(l,E){
  const fin=!!(E&&E.fin),main=$("main");
  app.querySelectorAll("[data-finish]").forEach(b=>b.onclick=()=>askFinish(l));
  app.querySelectorAll("[data-restart]").forEach(b=>b.onclick=()=>askRestart(l));
  const sk=$("showkey");if(sk)sk.onclick=()=>{SHOWKEY=!SHOWKEY;renderVariant()};
  app.querySelectorAll(".rtab tr[data-n]").forEach(tr=>tr.onclick=e=>{if(e.target.closest("a"))return;go(l,tr.dataset.n)});
  if(cur.res)return;
  const st=l.steps[cur.n-1];if(!isTask(st))return;
  const inputs=[...main.querySelectorAll(".atab input:not(:disabled)")];
  inputs.forEach((inp,k)=>inp.addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();
    if(k<inputs.length-1){inputs[k+1].focus();return}
    if(fin){const c=$("check");if(c)c.click()}else if(cur.n<l.steps.length)go(l,cur.n+1)}));
  if(!fin){
    let t=null;
    main.querySelector(".atab").addEventListener("input",()=>{
      const x=recW(l,st),v=readV(main);if(filled(v))x.v=v;else delete x.v;
      $("saved").textContent="Сохраняем…";clearTimeout(t);t=setTimeout(()=>{$("saved").textContent=filled(x.v)?"Ответ сохранён":""},500);
      save();paintProgress(l,E);
      const sq=app.querySelector(".nq.on");if(sq)sq.classList.toggle("ans",filled(x.v));
    });
    if(inputs[0]&&matchMedia("(hover:hover)").matches)inputs[0].focus({preventScroll:true});
    return;
  }
  const ch=$("check");
  if(ch)ch.onclick=()=>{
    const x=recW(l,st),v=readV(main);if(!filled(v)){$("saved").textContent="Введите ответ";return}
    x.v=v;
    if(grade(st,v)===st.pts){x.ok=true;save(true);renderVariant();if(!ME)paintCoins(coinFor(x));return}
    x.att=(x.att||0)+1;save();
    renderVariant();
    const s=$("saved");if(s)s.innerHTML='<span style="color:var(--bad)">Неверно. Попробуйте ещё раз.</span>';
  };
  const rv=$("reveal");
  if(rv)rv.onclick=()=>modal(`<h2>Показать правильный ответ?</h2><p>Монеток за это задание тогда не будет.</p>`,"Показать",()=>{recW(l,st).rev=true;save(true);renderVariant()});
}
function paintProgress(l,E){
  const tasks=l.steps.filter(isTask),a=tasks.filter(st=>filled((rec(l,st)||{}).v)).length;
  const c=$("acount"),m=$("ameter");if(c)c.textContent=a;if(m)m.style.width=(tasks.length?Math.round(100*a/tasks.length):0)+"%";
}
function paintTimer(){
  const el=$("timer");if(!el||cur.li<0)return;const E=exOf(L[cur.li]);if(!E||E.fin)return;
  const left=E.t0+LIMIT-Date.now();
  el.textContent=left>0?fmtT(left):"Время вышло";el.classList.toggle("low",left>0&&left<15*60e3);el.classList.toggle("out",left<=0);
}

/* ---------- завершение и повтор ---------- */
function modal(html,okText,onOk,danger){
  const m=$("modal");m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">${html}<div class="tnav"><button class="btn" type="button" data-x>Отмена</button><button class="btn ${danger?"danger":"pri"}" type="button" data-ok>${esc(okText)}</button></div></div>`;
  m.hidden=false;const close=()=>{m.hidden=true;m.innerHTML=""};
  m.querySelector("[data-x]").onclick=close;m.onclick=e=>{if(e.target===m)close()};
  m.querySelector("[data-ok]").onclick=()=>{close();onOk()};m.querySelector("[data-ok]").focus();
}
function askFinish(l){
  const tasks=l.steps.filter(isTask),a=tasks.filter(st=>filled((rec(l,st)||{}).v)).length;
  modal(`<h2>Завершить экзамен?</h2><p>Отвечено ${a} из ${tasks.length}.${a<tasks.length?" Задания без ответа получат 0 баллов.":""}</p><p>После завершения ответы на экзамене уже не изменить — нерешённое можно будет дорешать за монетки.</p>`,"Завершить",()=>finish(l));
}
function finish(l){
  const E=S.ex[l.num]=Object.assign({},S.ex[l.num]||{t0:Date.now()});
  E.a={};E.p={};let prim=0;
  l.steps.forEach(st=>{if(!isTask(st))return;const x=recW(l,st),p=grade(st,x.v);
    E.a[st.no]=filled(x.v)?x.v:null;E.p[st.no]=p;prim+=p;
    if(p===st.pts)x.ok=true;else if(!x.ok)x.att=Math.max(1,x.att||0)});
  E.fin=Date.now();E.prim=prim;E.test=toTest(prim);
  save(true);go(l,"res");window.scrollTo(0,0);
  if(!ME){let g=0;l.steps.forEach(st=>{if(isTask(st))g+=coinFor(rec(l,st))});paintCoins(g)}
}
function askRestart(l){
  modal(`<h2>Пройти вариант заново?</h2><p>Ответы и результат этого варианта удалятся, таймер начнётся сначала. Монетки, уже полученные за этот вариант, останутся, но повторно за те же задания их не дают.</p>`,"Начать заново",()=>{
    l.steps.forEach(st=>{delete S.st[sid(l,st)]});S.ex[l.num]={t0:Date.now()};S._reset=true;save(true);go(l,1);window.scrollTo(0,0);
  },true);
}

/* ---------- формулы ---------- */
let katexP=null;
function renderTex(){
  const els=[...app.querySelectorAll(".tex:not([data-done])")];if(!els.length)return;
  if(!katexP)katexP=new Promise((res,rej)=>{
    const l=document.createElement("link");l.rel="stylesheet";l.href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";document.head.appendChild(l);
    const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";sc.onload=()=>res(window.katex);sc.onerror=rej;document.head.appendChild(sc);
  });
  katexP.then(k=>{els.forEach(e=>{if(e.dataset.done)return;try{k.render(e.textContent,e,{throwOnError:false,output:"html"});e.dataset.done="1"}catch(err){e.classList.add("raw")}})}).catch(()=>els.forEach(e=>e.classList.add("raw")));
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("modal").hidden){$("modal").hidden=true;$("modal").innerHTML=""}});
boot();
})();
</script>
