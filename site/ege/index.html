file", "files": [{"name": "18-36.3-03.xlsx", "href": "../ege-18/files/18-36.3-03.xlsx", "size": "7 КБ"}]}, {"t": "html", "v": "<p>(ЕГЭ 2025) Квадрат разлинован на N × N клеток (1 &lt; N &lt; 30). Исполнитель Робот может перемещаться по клеткам, выполняя за одно перемещение одну из двух команд: вправо или вниз. По команде вправо Робот перемещается в соседнюю правую клетку, по команде вниз – в соседнюю нижнюю. Квадрат ограничен внешними стенами. Между соседними клетками квадрата также могут быть внутренние стены. Сквозь стену Робот пройти не может.</p><p>Перед каждым запуском Робота в каждой клетке квадрата лежит монета достоинством от 1 до 100. Посетив клетку, Робот забирает монету с собой; это также относится к начальной и конечной клеткам маршрута Робота.</p><p>В «угловых» клетках поля – тех, которые справа и снизу ограничены стенами, Робот не может продолжать движение, поэтому накопленная сумма считается итоговой. Таких конечных клеток на поле может быть несколько, включая правую нижнюю клетку поля. При разных запусках итоговые накопленные суммы могут различаться.</p><p>Определите максимальную и минимальную денежные суммы среди всех возможных итоговых сумм, которые может собрать Робот, пройдя из левой верхней клетки в конечную клетку маршрута. В ответе укажите два числа – сначала максимальную сумму, затем минимальную.</p><p>Исходные данные представляют собой электронную таблицу размером N × N, каждая ячейка которой соответствует клетке квадрата. Внутренние и внешние стены обозначены утолщёнными линиями.</p>"}], "fields": [{"label": "Ответ", "n": 2}], "answer": [["2645", "1248"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "18-36.3-04.xlsx", "href": "../ege-18/files/18-36.3-04.xlsx", "size": "6 КБ"}]}, {"t": "html", "v": "<p>(Е. Джобс) Квадрат разлинован на N×N клеток (1 &lt; N &lt; 17). Исполнитель Робот может перемещаться по клеткам, выполняя за одно перемещение одну из двух команд: вправо или вниз. По команде вправо Робот перемещается в соседнюю правую клетку, по команде вниз – в соседнюю нижнюю. В каждой клетке квадрата записано число от 10 до 99. Посетив клетку, Робот прибавляет к счету значение, записанное в этой клетке. Роботу запрещается посещать клетки с нулевым значением.</p><p>Гарантируется, что допустимый путь Робота из начальной ячейки в конечную существует.</p><p>Исходные данные записаны в файле в виде электронной таблице размером N×N, каждая ячейка которой соответствует клетке квадрата.</p><p>Определите максимальный и минимальный счёт, который может собрать Робот, пройдя из левой верхней клетки в правую нижнюю.</p><p>В ответе укажите два числа – сначала минимальный счёт, затем максимальный.</p>"}], "fields": [{"label": "Ответ", "n": 2}], "answer": [["1143", "2047"]]}]}]}, {"num": 40, "title": "№ 19–21 · Решение в Python", "key": "course-ege-inf-s40", "lessons": [{"num": "40.1", "title": "Как решать № 19-21???", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<p>Задание № 19-21 на тему теория игр из ЕГЭ можно решать разными способами:</p>\n<h3>✅ Рекурсия</h3>\n<p>Этот способ подходит для решения № 19-21 из ЕГЭ. Он простой и универсальный. Его мы рекомендуем использовать в качестве основного способа. Он реально очень хорош в рамках ЕГЭ.</p>\n<h3>✅ Динамика</h3>\n<p>Альтернативный способ решения № 19-21. Рекурсия имеет недостаток – долгое время работы. Поэтому есть очень маленькая вероятность, что на ЕГЭ встретится задача, которую рекурсией не решить. Недостатки есть и у динамики – она очень быстрая, но не универсальная. Например, реализовать в ней \"повторение ходов\" проблематично.</p>\n<h3>Вывод:</h3>\n<p>Рекурсия решит задачу из ЕГЭ с вероятностью 99%. Но есть шанс, что задача не решится рекурсией. И шанс, что не решится динамикой. Поэтому в идеале нужно владеть обоими способами решения.</p>"}]}, {"type": "text", "title": "Как решать № 19-21???", "blocks": [{"t": "html", "v": "<p>Важно понимать, что теория игр это не только задачи про Петю и Ваню!</p>\n<p>Теория игр — раздел прикладной математики, точнее исследования операций.</p>\n<p>Чаще всего методы теории игр находят применение в международных отношениях, экономике, чуть реже в других общественных науках — социологии, политологии, психологии, этике, юриспруденции и других.</p>\n<p>Начиная с 1970-х годов, её взяли на вооружение биологи для исследования поведения животных и теории эволюции.</p>\n<p>Очень важное значение она имеет для искусственного интеллекта и кибернетики, особенно с проявлением интереса к интеллектуальным агентам.</p>\n<p>Если вам интересна данная тема, то обязательно изучите способ решения № 19-21 динамикой!</p>"}]}]}, {"num": "40.2", "title": "Одна куча", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h3>Содержание урока</h3><p>В этом уроке мы научимся решать задания № 19-21 на одну кучу.</p><p>К каждой задаче из этого модуля во вкладке <b>Решение</b> есть наше решение задачи.</p>"}]}, {"type": "video", "title": "Разбор: демоверсия 2024, одна куча"}, {"type": "choice", "blocks": [{"t": "html", "v": "<h3>Мы играем за Ваню. При умной игре Вани...</h3>"}, {"t": "tree", "labels": ["Петя", "Ваня"], "v": [["g", "r"], ["g", "r"]]}, {"t": "html", "v": "<p>Зелёный кружок – победил нужный нам игрок, красный – победил противник.</p>"}], "options": ["Ваня гарантированно сможет победить своим первым ходом", "Ваня не сможет гарантированно победить своим первым ходом"], "answer": 0}, {"type": "choice", "blocks": [{"t": "html", "v": "<h3>Мы играем за Петю. При умной игре Пети...</h3>"}, {"t": "tree", "labels": ["Петя", "Ваня", "Петя"], "v": [["r", ["r", "r"]], ["r", ["r", "g"]]]}, {"t": "html", "v": "<p>Зелёный кружок – победил нужный нам игрок, красный – победил противник.</p>"}], "options": ["Петя гарантированно сможет победить своим первым или вторым ходом", "Петя не сможет гарантированно победить своим первым или вторым ходом"], "answer": 1}, {"type": "choice", "blocks": [{"t": "html", "v": "<h3>Мы играем за Ваню. При умной игре Вани...</h3>"}, {"t": "tree", "labels": ["Петя", "Ваня", "Петя", "Ваня", "Петя", "Ваня"], "v": [[[["g", [["g", "r"], ["r", "r"]]], ["r", "g"]]], [["r", "r"], [[[["r", "g"], ["g", "g"]], "r"]]]]}, {"t": "html", "v": "<p>Зелёный кружок – победил нужный нам игрок, красный – победил противник.</p>"}], "options": ["Ваня гарантированно сможет победить не более чем за три своих хода", "Ваня не сможет гарантированно победить не более чем за три своих хода"], "answer": 0}, {"type": "video", "title": "Решение демоверсии 2024 по шаблону"}, {"type": "text", "blocks": [{"t": "html", "v": "<h2 class=\"center\">Шаблон решения № 19-21 на одну кучу</h2>"}, {"t": "code", "v": "def f(x, c, win):\n    if ???:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    moves = [???]  # Записываем все возможные ходы\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\nfor s in range(???):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [1]) == 0 and f(s, 0, [2]) == 1:\n        print('№ 19:', s)\n    if f(s, 0, [1]) == 0 and f(s, 0, [3]) == 1:\n        print('№ 20:', s)\n    if f(s, 0, [2, 4]) == 1 and f(s, 0, [2]) == 0:\n        print('№ 21:', s)"}, {"t": "html", "v": "<h2 class=\"center\">Пример использования шаблона</h2><div class=\"cond\">\n<p>(Демо 2024) Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя. За один ход игрок может добавить в кучу <b>один камень</b> или увеличить количество камней в куче <b>в два раза</b>. Для того чтобы делать ходы, у каждого игрока есть неограниченное количество камней.</p>\n<p>Игра завершается в тот момент, когда количество камней в куче становится не менее 129. Победителем считается игрок, сделавший последний ход, т.е. первым получивший кучу из 129 или больше камней.</p>\n<p>В начальный момент в куче было S камней, 1 ≤ S ≤ 128.</p><p>Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p></div>\n<h3>№ 19</h3><p>Укажите <b>минимальное</b> значение S, при котором Петя не может выиграть за один ход, но при любом ходе Пети Ваня может выиграть своим первым ходом.</p>\n<p><b>Решение.</b></p><p>Петя не может выиграть за один ход <code>f(s, 0, [1]) == 0</code>.<br>Ваня может выиграть своим первым ходом <code>f(s, 0, [2]) == 1</code>.</p>"}, {"t": "code", "v": "def f(x, c, win):\n    if x >= 129:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    moves = [f(x + 1, c + 1, win), f(x * 2, c + 1, win)]  # Записываем все возможные ходы\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\nfor s in range(1, 128 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [1]) == 0 and f(s, 0, [2]) == 1:\n        print('№ 19:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4"}, {"t": "html", "v": "<p>Вывод программы.</p>"}, {"t": "code", "v": "№ 19: 64"}, {"t": "html", "v": "<p><b>Ответ: 64.</b></p>"}, {"t": "html", "v": "<h3>№ 20</h3><p>Для игры, описанной в задании 19, найдите два <b>наименьших</b> значения S, при которых у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:</p><ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul><p>Найденные значения запишите в ответе в порядке возрастания.</p>\n<p><b>Решение.</b></p><p>Петя не может выиграть за один ход <code>f(s, 0, [1]) == 0</code>.<br>Петя может выиграть своим вторым ходом <code>f(s, 0, [3]) == 1</code>.</p>"}, {"t": "code", "v": "def f(x, c, win):\n    if x >= 129:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    moves = [f(x + 1, c + 1, win), f(x * 2, c + 1, win)]  # Записываем все возможные ходы\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\nfor s in range(1, 128 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [1]) == 0 and f(s, 0, [3]) == 1:\n        print('№ 20:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4"}, {"t": "html", "v": "<p>Вывод программы.</p>"}, {"t": "code", "v": "№ 20: 32\n№ 20: 63"}, {"t": "html", "v": "<p><b>Ответ: 32 63.</b></p>"}, {"t": "html", "v": "<h3>№ 21</h3><p>Для игры, описанной в задании 19, найдите <b>минимальное</b> значение S, при котором одновременно выполняются два условия:</p><ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul><p>Если найдено несколько значений S, в ответе запишите минимальное из них.</p>\n<p><b>Решение.</b></p><p>У Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети <code>f(s, 0, [2, 4]) == 1</code>.<br>У Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом <code>f(s, 0, [2]) == 0</code>.</p>"}, {"t": "code", "v": "def f(x, c, win):\n    if x >= 129:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    moves = [f(x + 1, c + 1, win), f(x * 2, c + 1, win)]  # Записываем все возможные ходы\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\nfor s in range(1, 128 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [2, 4]) == 1 and f(s, 0, [2]) == 0:\n        print('№ 21:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4"}, {"t": "html", "v": "<p>Вывод программы.</p>"}, {"t": "code", "v": "№ 21: 62"}, {"t": "html", "v": "<p><b>Ответ: 62.</b></p>"}]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Два игрока, Петя и Ваня, играют в следующую игру e:\n        return all(moves)  # Ходит противник\n\nfor s in range(1, 148 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [1]) == 0 and f(s, 0, [2]) == 1:\n        print('№ 19:', s)\n    if f(s, 0, [1]) == 0 and f(s, 0, [3]) == 1:\n        print('№ 20:', s)\n    if f(s, 0, [2, 4]) == 1 and f(s, 0, [2]) == 0:\n        print('№ 21:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4\n"}, {"t": "html", "v": "<p>Вывод программы.</p>"}, {"t": "code", "v": "№ 20: 37\n№ 21: 72\n№ 20: 73\n№ 19: 74"}]}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["74"], ["37", "73"], ["72"]]}, {"type": "video", "title": "Разбор задач на одну кучу"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя.</p><p>За один ход игрок может добавить в кучу <b>один камень</b> или увеличить количество камней в куче <b>в три раза</b>. Для того чтобы делать ходы, у каждого игрока есть неограниченное количество камней.</p><p>Игра завершается в тот момент, когда количество камней в куче становится не менее 58. Победителем считается игрок, сделавший последний ход, т.е. первым получивший кучу из 58 или больше камней.</p><p>В начальный момент в куче было S камней, 1 ≤ S ≤ 57.</p><p>Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p><p>&nbsp;</p><p><b>№ 19</b><br>Укажите такое значение S, при котором Петя не может выиграть за один ход, но при любом ходе Пети Ваня может выиграть своим первым ходом.</p><p><b>№ 20</b><br>Для игры, описанной в предыдущем задании, найдите значение S, при которых у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul></p><p><b>№ 21</b><br>Для игры, описанной в задании 19, найдите <b>минимальное</b> значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p>"}, {"t": "details", "title": "Решение", "v": [{"t": "code", "v": "def f(x, c, win):\n    if x >= 58:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    moves = [f(x + 1, c + 1, win), f(x * 3, c + 1, win)]  # Записываем все возможные ходы\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\nfor s in range(1, 57 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [1]) == 0 and f(s, 0, [2]) == 1:\n        print('№ 19:', s)\n    if f(s, 0, [1]) == 0 and f(s, 0, [3]) == 1:\n        print('№ 20:', s)\n    if f(s, 0, [2, 4]) == 1 and f(s, 0, [2]) == 0:\n        print('№ 21:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4\n"}, {"t": "html", "v": "<p>Вывод программы.</p>"}, {"t": "code", "v": "№ 21: 17\n№ 20: 18\n№ 19: 19"}]}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 1}, {"label": "№ 21", "n": 1}], "answer": [["19"], ["18"], ["17"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя.</p><p>За один ход игрок может добавить в кучу <b>один</b> или <b>четыре</b> камня либо увеличить количество камней в куче <b>в три раза</b>. Для того чтобы делать ходы, у каждого игрока есть неограниченное количество камней.</p><p>Игра завершается в тот момент, когда количество камней в куче становится не менее 40. Победителем считается игрок, сделавший последний ход, т.е. первым получивший кучу, состоящую из 40 или больше камней.</p><p>В начальный момент в куче было S  s in range(1, 69 + 1):  # Перебираем стартовое количество камней в куче\n    if f(7, s, 0, [1]) == 0 and f(7, s, 0, [3]) == 1:\n        print('№ 20:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4"}, {"t": "html", "v": "<p>Вывод программы.</p>"}, {"t": "code", "v": "№ 20: 31\n№ 20: 34"}, {"t": "html", "v": "<p><b>Ответ: 31 34.</b></p><h3>№ 21</h3><p>Укажите минимальное значение S, при котором у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети, и при этом у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</p><p><b>Решение.</b></p><p>В начальный момент в первой куче было 7 камней, во второй куче – S камней.</p><p>У Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети <code>f(7, s, 0, [2, 4]) == 1</code>.<br>У Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом <code>f(7, s, 0, [2]) == 0</code>.</p>"}, {"t": "code", "v": "def f(x1, x2, c, win):\n    if x1 + x2 >= 77:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    # Записываем все возможные ходы\n    moves = [f(x1 + 1, x2, c + 1, win), f(x1, x2 + 1, c + 1, win),\n             f(x1 * 2, x2, c + 1, win), f(x1, x2 * 2, c + 1, win)]\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\nfor s in range(1, 69 + 1):  # Перебираем стартовое количество камней в куче\n    if f(7, s, 0, [2, 4]) == 1 and f(7, s, 0, [2]) == 0:\n        print('№ 21:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4"}, {"t": "html", "v": "<p>Вывод программы.</p>"}, {"t": "code", "v": "№ 21: 30\n№ 21: 33"}, {"t": "html", "v": "<p>По условию задачи в ответ нужно взять минимальное значение.</p><p><b>Ответ: 30.</b></p>"}]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежат две кучи камней. Игроки ходят по очереди, пер м вторым ходом независимо от того, как будет ходить Ваня.</li></ul></p><p><b>№ 21</b><br>Найдите <b>произведение</b> всех значений S, при которых одновременно выполняются два условия:<ul class=\"dash\"><li>у Пети есть выигрышная стратегия, позволяющая ему выиграть первым, вторым или третьим ходом при любой игре Вани;</li><li>у Пети нет стратегии, которая позволит ему гарантированно выиграть первым или вторым ходом.</li></ul></p>"}, {"t": "details", "title": "Подсказка 1", "v": [{"t": "html", "v": "<p>Записать это условие</p><ul class=\"dash\"><li>у Пети есть выигрышная стратегия, позволяющая ему выиграть первым, вторым или третьим ходом при любой игре Вани;</li><li>у Пети нет стратегии, которая позволит ему гарантированно выиграть первым или вторым ходом.</li></ul><p>Нужно так:</p>"}, {"t": "code", "v": "if f(23, s, 0, [1, 3, 5]) == 1 and f(23, s, 0, [1, 3]) == 0:"}]}, {"t": "details", "title": "Подсказка 2", "v": [{"t": "html", "v": "<p>Посчитать сумму и произведение можно так:</p>"}, {"t": "code", "v": "sum_20 = 0\npr_21 = 1\nfor s in range(1, 156 + 1):  # Перебираем стартовое количество камней в куче\n    if f(23, s, 0, [1]) == 0 and f(23, s, 0, [3]) == 1:  # № 20\n        sum_20 += s\n    if f(23, s, 0, [1, 3, 5]) == 1 and f(23, s, 0, [1, 3]) == 0:  # № 21\n        pr_21 = pr_21 * s\nprint(sum_20)\nprint(pr_21)"}]}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 1}, {"label": "№ 21", "n": 1}], "answer": [["18"], ["208"], ["2726880"]]}]}, {"num": "40.4", "title": "Убирание камней", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h3>Содержание урока</h3><p>В этом уроке решаем задания № 19-21, в которых камни не добавляют в кучи, а убирают.</p>"}]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>(Демо 2025) Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя. За один ход игрок может: убрать из кучи два камня или убрать из кучи пять камней или уменьшить количество камней в куче в три раза (количество камней, полученное при делении, округляется до меньшего).<br>Например, из кучи в 20 камней за один ход можно получить кучу из 18, 15 или 6 камней.</p><p>Игра завершается, когда количество камней в куче становится не более 19.<br>Победителем считается игрок, сделавший последний ход, то есть первым получивший кучу, в которой будет 19 или меньше камней.</p><p>В начальный момент в куче было S камней, S ≥ 20.</p><p>Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p><p>&nbsp;</p><p><b>№ 19</b><br>Укажите <b>минимальное</b> значение S, при котором Петя не может выиграть за один ход, но при любом ходе Пети Ваня может выиграть своим первым ходом.</p><p><b>№ 20</b><br>Для игры, описанной в задании 19, найдите два <b>наименьших</b> значения S, при которых у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p><p><b>№ 21</b><br>Для игры, описанной в задании 19, найдите <b>минимальное</b> значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p>"}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["60"], ["62", "63"], ["64"]]}, {"type": "video", "title": "Разбор демоверсии 2025"}, {"type": "text", "blocks": [{"t": "html", "v": "<h2 class=\"center\">Шаблон решения № 19-21 на убирание камней</h2><div class=\"cond\"><p>(Демо 2025) Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя. За один ход игрок может: убрать из кучи два камня или убрать из кучи пять камней или уменьшить количество камней в куче в три раза (количество камней, полученное при делении, округляется до меньшего).<br>Например, из кучи в 20 камней за один ход можно получить кучу из 18, 15 или 6 камней.</p><p>Игра завершается, когда количество камней в куче становится не более 19.<br>Победителем считается игрок, сделавший последний ход, то есть первым получивший кучу, в которой будет 19 или меньше камней.</p><p>В начальный момент в куче было S камней, S ≥ 20.</p><p>Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p></div><h3>Решение</h3><p><b>1. Записываем ходы</b></p><p>За один ход игрок может: убрать из кучи два камня или убрать из кучи пять камней или уменьшить количество камней в куче в три раза (количество камней, полученное при делении, округляется до меньшего).<br>Например, из кучи в 20 камней за один ход можно получить кучу из 18, 15 или 6 камней.</p>"}, {"t": "code", "v": "moves = [f(x - 2, c + 1, win), f(x - 5, c + 1, win), f(x // 3, c + 1, win)]"}, {"t": "html", "v": "<p>Фраза <i>уменьшить количество камней в куче в три раза (количество камней, полученное при делении, округляется до меньшего)</i> означает деление нацело на 3. Поэтому мы использовали оператор целочисленного деления <code>//</code>.</p><p><b>2. Условие окончания игры</b></p><p>Игра завершается, когда количество камней в куче становится не более 19.</p>"}, {"t": "code", "v": "if x <= 19:  # Указываем условие окончания игры\n    return c in win"}, {"t": "html", "v": "<p><b>3. Перебор стартового количества камней в куче</b></p><p>В начальный момент в куче было S камней, S ≥ 20.</p>"}, {"t": "code", "v": "for s in range(20, 1000 + 1):"}, {"t": "html", "v": "<p>Начинаем перебор с 20 и идём до большого числа. Числа 1000 должно хватить. На всякий случай можно сделать перебор до 10000.</p><h3>№ 19</h3><p>Укажите <b>минимальное</b> значение S, при котором Петя не может выиграть за один ход, но при любом ходе Пети Ваня может выиграть своим первым ходом.</p><p><b>Решение.</b></p><p>Петя не может выиграть за один ход <code>f(s, 0, [1]) == 0</code>.<br>Ваня может выиграть своим первым ходом <code>f(s, 0, [2]) == 1</code>.</p>"}, {"t": "code", "v": "def f(x, c, win):\n    if x <= 19:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    moves = [f(x - 2, c + 1, win), f(x - 5, c + 1, win), f(x // 3, c + 1, win)]  # Записываем все возможные ходы\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\nfor s in range(20, 1000 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [1]) == 0 and f(s, 0, [2]) == 1:\n        print('№ 19:', s)"}, {"t": "html", "v": "<p>Вывод программы.</p>"}, {"t": "code", "v": "№ 19: 60\n№ 19: 61"}, {"t": "html", "v": "<p>По условию задачи, в ответ нужно взять минимальное значение.</p><p><b>Ответ: 60.</b></p><h3>№ 20</h3><p>Для игры, описанной в задании 19, найдите два <b>наименьших</b> значения S, при которых у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p><p><b>Решение.</b></p><p>Петя не может выиграть за один ход <code>f(s, 0, [1]) == 0</code>.<br>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня <code>f(s, 0, [3]) == 1</code>.</p>"}, {"t": "code", "v": "def f(x, c, win):\n    if x <= 19:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    moves = [f(x - 2, c + 1, win), f(x - 5, c + 1, win), f(x // 3, c + 1, win)]  # Записываем все возможные ходы\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\nfor s in range(20, 1000 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [1]) == 0 and f(s, 0, [3]) == 1:\n        print('№ 20:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4"}, {"t": "html", "v": "<p>Вывод программы.</p>"}, {"t": "code", "v": "№ 20: 62\n№ 20: 63\n№ 20: 65\n№ 20: 66\n№ 20: 180\n№ 20: 181\n№ 20: 182\n№ 20: 183\n№ 20: 184\n№ 20: 185"}, {"t": "html", "v": "<p>По условию задачи, в ответ нужно взять два наименьших значения.</p><p><b>Ответ: 62 63.</b></p><h3>№ 21</h3><p>Для игры, описанной в задании 19, найдите <b>минимальное</b> значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p><p><b>Решение.</b></p><p>У Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети <code>f(s, 0, [2, 4]) == 1</code>.<br>У Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом <code>f(s, 0, [2]) == 0</code>.</p>"}, {"t": "code", "v": "def f(x, c, win):\n    if x <= 19:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    moves = [f(x - 2, c + 1, win), f(x - 5, c + 1, win), f(x // 3, c + 1, win)]  # Записываем все возможные ходы\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\nfor s in range(20, 1000 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [2, 4]) == 1 and f(s, 0, [2]) == 0:\n        print('№ 21:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4"}, {"t": "html", "v": "<p>Вывод программы.</p>"}, {"t": "code", "v": "№ 21: 64\n№ 21: 67\n№ 21: 68\n№ 21: 186\n№ 21: 187"}, {"t": "html", "v": "<p>По условию задачи, в ответ нужно взять минимальное значение.</p><p><b>Ответ: 64.</b></p>"}]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя. За один ход игрок может: убрать из кучи один камень или убрать из кучи десять камней или уменьшить количество камней в куче в пять раз (количество камней, полученное при делении, округляется до меньшего).</p><p>Игра завершается, когда количество камней в куче становится не более 26.<br>Победителем считается игрок, сделавший последний ход, то есть первым получивший кучу, в которой будет 26 или меньше камней.</p><p>В начальный момент в куче было S камней, S ≥ 27.</p><p>Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p><p>&nbsp;</p><p><b>№ 19</b><br>Укажите <b>минимальное</b> значение S, при котором Петя не может выиграть за один ход, но при любом ходе Пети Ваня может выиграть своим первым ходом.</p><p><b>№ 20</b><br>Для игры, описанной в задании 19, найдите два <b>наименьших</b> значения S, при которых у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p><p><b>№ 21</b><br>Для игры, описанной в задании 19, найдите <b>минимальное</b> значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p>"}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["135"], ["136", "145"], ["137"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя. За один ход игрок может: убрать из кучи три камня или убрать из кучи шесть камней или уменьшить количество камней в куче в три раза (количество камней, полученное при делении, округляется до меньшего).</p><p>Игра завершается, когда количество камней в куче становится не более 17.<br>Победителем считается игрок, сделавший последний ход, то есть первым получивший кучу, в которой будет 17 или меньше камней.</p><p>В начальный момент в куче было S камней, S ≥ 18.</p><p>Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p><p>&nbsp;</p><p><b>№ 19</b><br>Укажите <b>максимальное</b> значение S, при котором Петя не может выиграть за один ход, но при любом ходе Пети Ваня может выиграть своим первым ходом.</p><p><b>№ 20</b><br>Для игры, описанной в задании 19, найдите два <b>наименьших</b> значения S, при которых у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p><p><b>№ 21</b><br>Для игры, описанной в задании 19, найдите <b>максимальное</b> значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p>"}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["56"], ["57", "58"], ["173"]]}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Как округлять?</h2><p>1. «Уменьшить количество камней в куче в три раза (количество камней, полученное при делении, округляется <b>до меньшего</b>)»</p><p>То есть мы должны разделить нацело на 3 — <code>x // 3</code>. Для этого просто используем целочисленное деление <code>//</code>.</p><p>2. «Уменьшить количество камней в куче в три раза (количество камней, полученное при делении, округляется <b>до большего</b>)»</p><p>То есть мы должны разделить на 3 с округлением вверх.</p><p>Проще всего использовать функцию <code>ceil()</code>.</p>"}, {"t": "code", "v": "from math import ceil\nceil(x / 3) # Используем одну палочку!!! Нам не нужно делить нацело."}, {"t": "html", "v": "<p>Второй способ. Чтобы реализовать округление вверх без использования функции <code>ceil()</code>, можно разделить нацело на 3 и добавить единицу, если остаток при делении на 3 не равен нулю <code>x//3 + (x % 3 != 0)</code>.</p>"}]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя. За один ход игрок может: убрать из кучи один камень или уменьшить количество камней в куче в два раза (количество камней, полученное при делении, округляется до большего).<br>Например, из кучи в 25 камней за один ход можно получить кучу из 24 или 13 камней.</p><p>Игра завершается, когда количество камней в куче становится не более 23.<br>Победителем считается игрок, сделавший последний ход, то есть первым получивший кучу, в которой будет 23 или меньше камней.</p><p>В начальный момент в куче было S камней, S ≥ 24.</p><p>Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p><p>&nbsp;</p><p><b>№ 19</b><br>Укажите <b>минимальное</b> значение S, при котором Петя не может выиграть за один ход, но при любом ходе Пети Ваня может выиграть своим первым ходом.</p><p><b>№ 20</b><br>Для игры, описанной в задании 19, найдите два <b>наименьших</b> значения S, при которых у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p><p><b>№ 21</b><br>Для игры, описанной в задании 19, найдите <b>минимальное</b> значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p>"}, {"t": "details", "title": "Решение", "v": [{"t": "code", "v": "from math import ceil\n\ndef f(x, c, win):\n    if x <= 23:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    moves = [f((x - 1), c + 1, win), f(ceil(x / 2), c + 1, win)]  # Записываем все возможные ходы\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\nfor s in range(24, 10000 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [1]) == 0 and f(s, 0, [2]) == 1:\n        print('№ 19:', s)\n    if f(s, 0, [1]) == 0 and f(s, 0, [3]) == 1:\n        print('№ 20:', s)\n    if f(s, 0, [2, 4]) == 1 and f(s, 0, [2]) == 0:\n        print('№ 21:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4"}]}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["47"], ["48", "93"], ["49"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя. За один ход игрок может: убрать из кучи два камня или убрать из кучи пять камней или уменьшить количество камней в куче в три раза (количество камней, полученное при делении, округляется до большего).<br>Например, из кучи в 23 камней за один ход можно получить кучу из 21, 18 или 8 камней.</p><p>Игра завершается, когда количество камней в куче становится не бо ем просто записать ходы в список moves. Вот так нельзя <code>moves = [f(x - 2, c + 1, win), f(x - 3, c + 1, win), f(x // 2, c + 1, win)]</code>.</p><p>Мы должны учесть, что нельзя убрать больше камней, чем их имеется в куче. Например, если в куче 2 камня, то запрещено сделать ход -3.</p><p>Чтобы это учесть, мы будем добавлять в список moves только те ходы, которые можно сделать.</p>"}, {"t": "code", "v": "moves = []  # Изначально список ходов пустой\nif x - 2 >= 0:  # Если можем сделать ход -2\n    moves.append(f(x - 2, c + 1, win))  # То добавляем его в список moves\nif x - 3 >= 0:  # Если можем сделать ход -3\n    moves.append(f(x - 3, c + 1, win))  # То добавляем его в список moves\nif x // 2 >= 0:  # Если можем сделать ход //2\n    moves.append(f(x // 2, c + 1, win))  # То добавляем его в список moves"}, {"t": "html", "v": "<h3>Весь код</h3>"}, {"t": "code", "v": "def f(x, c, win):\n    if x == 0:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n\n    moves = []  # Изначально список ходов пустой\n    if x - 2 >= 0:  # Если можем сделать ход -2\n        moves.append(f(x - 2, c + 1, win))  # То добавляем его в список moves\n    if x - 3 >= 0:  # Если можем сделать ход -3\n        moves.append(f(x - 3, c + 1, win))  # То добавляем его в список moves\n    if x // 2 >= 0:  # Если можем сделать ход //2\n        moves.append(f(x // 2, c + 1, win))  # То добавляем его в список moves\n\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\nfor s in range(1, 30 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [1]) == 0 and f(s, 0, [2]) == 1:\n        print('№ 19:', s)\n    if f(s, 0, [1]) == 0 and f(s, 0, [3]) == 1:\n        print('№ 20:', s)\n    if f(s, 0, [2, 4]) == 1 and f(s, 0, [2]) == 0:\n        print('№ 21:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4"}]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>(А. Минак) Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя.</p><p>За один ход игрок может убрать из кучи четыре или пять камней либо уменьшить количество камней в куче в два раза. В случае, если уменьшается в два раза нечётное количество камней, то сначала убирают один камень, а затем уменьшают в два раза. Например, имея кучу из 11 камней, за один ход можно получить кучу из 7, 6 или 5 камней. Нельзя убрать больше камней, чем их имеется в куче.</p><p>Игра завершается в тот момент, когда в куче не останется камней. При этом победителем считается игрок, сделавший последний ход.</p><p>В начальный момент в куче было S камней, 1 ≤ S ≤ 40. Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p><p>&nbsp;</p><p><b>№ 19</b><br>Укажите <b>количество</b> всех возможных значений S, при которых Петя не может выиграть своим первым ходом, но при любом ходе Пети, Ваня выигрывает своим первым ходом.</p><p><b>№ 20</b><br>Найдите два <b>наибольших</b> значения S, когда Петя имеет выигрышную стратегию, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p><p><b>№ 21</b><br>Найдите <b>наибольшее</b> значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p>"}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["3"], ["18", "19"], ["12"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>(А. Кабанов) Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит две кучи камней. Игроки ходят по очереди, первый ход делает Петя.</p><p>За один ход игрок может убрать из кучи один камень или уменьшить количество камней в любой куче в два раза (если количество камней нечётно, то остаётся на один камень меньше, чем убирается). Нельзя убирать камни из кучи, если в ней ноль камней. Ход делить на 2 к такой куче тоже запрещено применить.</p><p>Игра завершается в тот момент, когда общее количество камней в двух кучах становится не более 20, побеждает игрок, сделавший последний ход. В начальный момент в первой куче было K ≥ 1 камней, а во второй – S ≥ 1 камней, S+K ≥ 21.</p><p>&nbsp;</p><p><b>№ 19</b><br>Известно, что из начальной позиции (M; M) Ваня выигрывает первым ходом при любой игре Пети. При каком значении M это возможно?</p><p><b>№ 20</b><br>При K=15, найдите <b>минимальное</b> и <b>максимальное</b> значение S, при котором у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p><p><b>№ 21</b><br>При каком минимальном значении N для начальной пары (N; N) одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h3>№ 19</h3>"}, {"t": "code", "v": "def f(x1, x2, c, win):\n    if x1 + x2 <= 20:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    # Записываем все возможные ходы\n    moves = []\n    if x1 > 0:\n        moves.append(f(x1 - 1, x2, c + 1, win))\n        moves.append(f(x1 // 2, x2, c + 1, win))\n    if x2 > 0:\n        moves.append(f(x1, x2 - 1, c + 1, win))\n        moves.append(f(x1, x2 // 2, c + 1, win))\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\n# Так как по условию S+K ≥ 21, то начинаем перебор с 11\nfor M in range(11, 1000 + 1):  # Перебираем стартовое количество камней в куче\n    if f(M, M, 0, [2]) == 1:\n        print('№ 19:', M)"}, {"t": "html", "v": "<h3>№ 20</h3>"}, {"t": "code", "v": "def f(x1, x2, c, win):\n    if x1 + x2 <= 20:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    # Записываем все возможные ходы\n    moves = []\n    if x1 > 0:\n        moves.append(f(x1 - 1, x2, c + 1, win))\n        moves.append(f(x1 // 2, x2, c + 1, win))\n    if x2 > 0:\n        moves.append(f(x1, x2 - 1, c + 1, win))\n        moves.append(f(x1, x2 // 2, c + 1, win))\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\n# Так как по условию S+K ≥ 21, то начинаем перебор с 6\nfor s in range(6, 1000 + 1):  # Перебираем стартовое количество камней в куче\n    if f(15, s, 0, [1]) == 0 and f(15, s, 0, [3]) == 1:\n        print('№ 20:', s)"}, {"t": "html", "v": "<h3>№ 21</h3>"}, {"t": "code", "v": "def f(x1, x2, c, win):\n    if x1 + x2 <= 20:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    # Записываем все возможные ходы\n    moves = []\n    if x1 > 0:\n        moves.append(f(x1 - 1, x2, c + 1, win))\n        moves.append(f(x1 // 2, x2, c + 1, win))\n    if x2 > 0:\n        moves.append(f(x1, x2 - 1, c + 1, win))\n        moves.append(f(x1, x2 // 2, c + 1, win))\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\n# Так как по условию S+K ≥ 21, то начинаем перебор с 11\nfor N in range(11, 1000 + 1):  # Перебираем стартовое количество камней в куче\n    if f(N, N, 0 ии 19, найдите наименьшее значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul><p>Решение задачи находится на следующем шаге!</p></p>"}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["38"], ["108", "323"], ["111"]]}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Решение № 19-21</h2><h3>№ 19</h3><div class=\"cond\"><p>(Резерв 2026) Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежат две кучи камней. Игроки ходят по очереди, первый ход делает Петя. За один ход игрок может:</p><ul class=\"dash\"><li>убрать из одной из куч (по своему выбору) 3 камня;</li><li>уменьшить количество камней в одной из куч (по своему выбору) в 3 раза (количество камней, полученное при делении, округляется до меньшего).</li></ul><p>Например, пусть в одной куче 20 камней, а в другой 30 камней; такую позицию в игре обозначим (20, 30). Тогда за один ход можно получить любую из четырёх позиций: (17, 30), (20, 27), (6, 30), (20, 10).</p><p>Игра завершается в тот момент, когда суммарное количество камней в двух кучах становится не более 53. Победителем считается игрок, сделавший последний ход, то есть первым получивший такую игровую позицию, при которой в двух кучах суммарно 53 камня или меньше. В начальный момент в первой куче было 19 камней, во второй куче — S камней; S ≥ 35.</p><p>Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p><p><b>№ 19</b><br>Известно, что Ваня выиграл своим первым ходом после неудачного хода Пети. Укажите минимальное значение S, при котором такая ситуация возможна.</p></div><h3>Решение</h3>"}, {"t": "code", "v": "# Код для № 19\ndef f(x1, x2, c, win):\n    if x1 + x2 <= 53:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    # Записываем все возможные ходы -3, //3 в обе кучи.\n    moves = [f(x1 - 3, x2, c + 1, win), f(x1, x2 - 3, c + 1, win),\n             f(x1 // 3, x2, c + 1, win), f(x1, x2 // 3, c + 1, win)]\n    if c % 2 != max(win) % 2:\n        return any(moves)\n    else:\n        return any(moves)  # Меняем all() на any. Так как сказано в условии про неудачный ход.\n\n# Перебираем стартовое количество камней во второй куче\n# В первой куче по условию 19 камней\nfor s in range(35, 1000):\n    # Ваня выиграл своим первым ходом f(19, s, 0, [2]) == 1.\n    if f(19, s, 0, [2]) == 1:\n        print('№ 19:', s)"}, {"t": "code", "v": "№ 19: 38\n№ 19: 39\n№ 19: 40\n.........\n№ 19: 311\n№ 19: 312\n№ 19: 313\n№ 19: 314"}, {"t": "html", "v": "<p>Минимальное значение – 38.<br><b>Ответ: 38.</b></p><h3>Важно!</h3><p>Нужно проверить только, что Ваня может выиграть своим первым ходом. Проверять, что Петя не может выиграть своим первым ходом ни в коем случае нельзя. Получите неправильный ответ.</p><p><i>Известно, что Ваня выиграл своим первым ходом после неудачного хода Пети. Укажите минимальное значение S, при котором такая ситуация возможна.</i></p><p>Проверяем только то, что сказано в условии. Сказано Ваня выигрывает первым ходом, поэтому пишем <code>if f(19, s, 0, [2]) == 1:</code>. Про Петю не сказано, что он может или не может победить – поэтому ничего про него не пишем.</p><p>Только <code>all()</code> на <code>any()</code> меняем из-за неудачного хода.</p><h3>Важно!</h3><p>Из-за того, что в задаче две кучи, и убирание камней, то нужно проверять, что после хода число камней получается не отрицательным. И что после хода число камней меняется.</p><p>В условии не сказано, что делать в таких ситуациях.</p><ul class=\"dash\"><li>К куче, в которой ноль камней, мы не можем применить никакой ход? Наверное, не можем.</li><li>Если в куче 2 камня, то сделать ход, который убирает три камня, мы можем? Наверное, не можем.</li><li>Можно ли делать ход // 3 из кучи, в которой 1 или 2 камня. Наверное, можно.</li><li>Можно ли делать ход // 3 из кучи, в которой 0 камней. Наверное, нельзя.</li></ul><p>Поэтому перед тем как добавить ход в список moves, нужно сделать проверку, что данный ход можно сделать.</p>"}, {"t": "code", "v": "def f(x1, x2, c, win):\n    if x1 + x2 <= 53:  \n        return c in win\n    if c > max(win):\n        return 0\n\n    moves = []\n    if x1 > 0:\n        moves.append(f(x1 // 3, x2, c + 1, win))\n    if x1 >= 3:\n        moves.append(f(x1 - 3, x2, c + 1, win))\n    if x2 > 0:\n        moves.append(f(x1, x2 // 3, c + 1, win))\n    if x2 >= 3:\n        moves.append(f(x1, x2 - 3, c + 1, win))\n\n    if c % 2 != max(win) % 2:\n        return any(moves)\n    else:\n        return all(moves)"}, {"t": "html", "v": "<p>В данной задаче ответ получается правильным и без данных проверок. Но в другой задаче уже может так не повезти.</p><h3>Решение № 20-21</h3><p><b>№ 20</b><br>Для игры, описанной в задании 19, найдите наименьшее и наибольшее значения S, при которых у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p><p><b>№ 21</b><br>Для игры, описанной в задании 19, найдите наименьшее значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p>"}, {"t": "code", "v": "# Код для № 20-21\ndef f(x1, x2, c, win):\n    if x1 + x2 <= 53:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    moves = []\n    if x1 > 0:\n        moves.append(f(x1 // 3, x2, c + 1, win))\n ными независимо от игры противника.</p><p>&nbsp;</p><p><b>№ 19</b><br>Известно, что Ваня выиграл своим первым ходом после неудачного первого хода Пети. Укажите минимальное значение S, когда такая ситуация возможна.</p><p><b>№ 20</b><br>Для игры, описанной в предыдущем задании, найдите два таких значения S, при которых у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p><p><b>№ 21</b><br>Для игры, описанной в задании 19, найдите <b>минимальное</b> значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p>"}, {"t": "details", "title": "Подсказка", "v": [{"t": "html", "v": "<p>В № 19 Петя делает неудачный ход. Поэтому нужно поменять <code>all()</code> на <code>any()</code>.</p>"}, {"t": "code", "v": "def f(x, c, win):\n    if x >= 31:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    # Записываем все возможные ходы\n    moves = [f(x + 1, c + 1, win), f(x + 2, c + 1, win), f(x * 2, c + 1, win)]  \n    if c % 2 != max(win) % 2:\n        return any(moves) \n    else:\n        return any(moves)  \n\nfor s in range(1, 30 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [2]) == 1:\n        print('№ 19:', s)"}]}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["8"], ["13", "14"], ["12"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>(PRO100 ЕГЭ) Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя.</p><p>За один ход игрок может добавить в кучу один камень или увеличить количество камней в куче в два раза. Для того чтобы делать ходы, у каждого игрока есть неограниченное количество камней.</p><p>Игра завершается в тот момент, когда количество камней в куче становится не менее 25. Победителем считается игрок, сделавший последний ход, т.е. первым получивший кучу из 25 или больше камней.</p><p>В начальный момент в куче было S камней, 1 ≤ S ≤ 24.</p><p>Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p><p>&nbsp;</p><p><b>№ 19</b><br>Найдите <b>минимальное</b> значение S, при котором у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul></p><p><b>№ 20</b><br><i>(№ 20 ЕГЭ)</i> Для игры, описанной в задании 19, найдите <b>минимальное</b> значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p><p><b>№ 21</b><br><i>(№ 21 ЕГЭ)</i> Для игры, описанной в задании 19, найдите два минимальных значения S, при которых одновременно выполняются три условия:<ul class=\"dash\"><li>у Пети есть выигрышная стратегия, позволяющая ему выиграть первым, вторым или третьим ходом при любой игре Вани;</li><li>у Пети нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li><li>у Пети нет стратегии, которая позволит ему гарантированно выиграть первым или вторым ходом.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p>"}, {"t": "details", "title": "Подсказка", "v": [{"t": "code", "v": "for s in range(1, 24 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [1]) == 0 and f(s, 0, [3]) == 1:\n        print('№ 19:', s)\n    if f(s, 0, [2, 4]) == 1 and f(s, 0, [2]) == 0:\n        print('№ 20:', s)\n    if f(s, 0, [1, 3, 5]) == 1 and f(s, 0, [1]) == 0 and f(s, 0, [1, 3]) == 0:\n        print('№ 21:', s)\n\n# П1 В1 П2 В2 П3\n# 1  2  3  4  5"}]}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 1}, {"label": "№ 21", "n": 2}], "answer": [["6"], ["10"], ["5", "9"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит две кучи камней. Игроки ходят по очереди, первый ход делает Петя. За один ход игрок может добавить в одну из куч 1 или 2 камня. Игра завершается в тот момент, когда в сумме в кучах будет хотя бы 17 камней. Победителем считается игрок, сделавший последний ход. В начальный момент в первой куче было 4 камня, во второй – S камней, 1 ≤ S ≤ 12.</p><p>&nbsp;</p><p><b>№ 19</b><br>Петя мог выиграть первым ходом, но сделал неудачный ход и Ваня выиграл. При каком <b>минимальном</b> значении S это возможно?</p><p><b>№ 20</b><br>Найдите <b>минимальное</b> и <b>максимальное</b> значения S, при которых Петя при оптимальной игре может выиграть своим вторым ходом при любой игре Вани.</p><p><b>№ 21</b><br>Найдите значение S, при котором Ваня при оптимальной игре может выиграть именно своим вторым ходом при любых ходах Пети.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h3>№ 19</h3><p>Петя мог выиграть первым ходом, но сделал неудачный ход и Ваня выиграл.</p><p>Так как Петя сделал неудачный ход, меняем <code>all()</code> на <code>any()</code>.</p><p>Петя мог выиграть первым ходом <code>f(4, s, 0, [1]) == 1</code>.<br>Петя сделал неудачный ход и Ваня выиграл <code>f(4, s, 0, [2]) == 1</code>.</p><p>Когда мы проверяем, что Петя может выиграть за один ход, по-хорошему, мы должны использовать <code>all()</code> на ходах противника и <code>any()</code> на ходах нашего игрока. Но так как игра заканчивается за один ход, то противник ходить не будет, поэтому можно оставить у него <code>any()</code>. Такую хитрость мы сделали, чтобы не писать два разных кода.</p>"}, {"t": "code", "v": "def f(x1, x2, c, win):\n    if x1 + x2 >= 17:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    # Записываем все возможные ходы\n    moves = [f(x1 + 1, x2, c + 1, win), f(x1, x2 + 1, c + 1, win),\n             f(x1 + 2, x2, c + 1, win), f(x1, x2 + 2, c + 1, win)]\n    if c % 2 != max(win) % 2:\n        return any(moves)  \n    else:\n        return any(moves)  \n\nfor s in range(1, 12 + 1):  # Перебираем стартовое количество камней в куче\n    if f(4, s, 0, [1]) == 1 and f(4, s, 0, [2]) == 1:\n        print('№ 19:', s)"}, {"t": "html", "v": "<h3>№ 20</h3><p>Здесь Ваня играет оптимально, поэтому у противника снова пишем <code>all()</code>.</p><p>Петя при оптимальной игре может выиграть своим вторым ходом при любой игре Вани <code>f(4, s, 0, [3]) == 1</code>.</p>"}, {"t": "code", "v": "def f(x1, x2, c, win):\n    if x1 + x2 >= 17:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    # Записываем все возможные ходы\n    moves = [f(x1 + 1, x2, c + 1, win), f(x1, x2 + 1, c + 1, win),\n             f(x1 + 2, x2, c + 1, win), f(x1, x2 + 2, c + 1, win)]\n    if c % 2 != max(win) % 2:\n        return any(moves)  \n    else:\n        return all(moves)  \n\nfor s in range(1, 12 + 1):  # Перебираем стартовое количество камней в куче\n    if f(4, s, 0, [3]) == 1:\n        print('№ 20:', s)"}, {"t": "html", "v": "<h3>№ 21</h3><p>Найдите значение S, при котором Ваня при оптимальной игре может выиграть именно своим вторым ходом при любых ходах Пети.</p>"}, {"t": "code", "v": "for s in range(1, 12 + 1):  # Перебираем стартовое количество камней в куче\n    if f(4, s, 0, [4]) == 1:\n        print('№ 21:', s)"}, {"t": "html", "v": "<p>Второй ход Вани – это четвёртый ход в игре.</p>"}]}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["11"], ["8", "9"], ["7"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>(PRO100 ЕГЭ) Два игрока, Петя и Ваня, играют в следующую игру. На координатной плоскости стоит фишка. В начале игры фишка находится в точке с координатами (S, 3), при этом 1 ≤ S ≤ 14.</p><p>Игроки ходят по очереди, первый ход делает Петя. Ход состоит в том, что игрок перемещает фишку из точки с координатами (x, y) в одну из трех точек: или в точку с координатами (x+3, y), или в точку с координатами (x, y+3), или в точку с координатами (x, y+4).</p><p>Выигрывает игрок, после хода которого расстояние по прямой от фишки до точки с координатами (0, 0) не меньше 15 единиц.</p><p>Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p><p>&nbsp;</p><p><b>№ 19</b><br>Известно, что Ваня выиграл своим первым ходом после неудачного первого хода Пети. Назовите минимальное значение S, при котором это возможно.</p><p><b>№ 20</b><br>Для игры, описанной в задании 19, найдите два <b>наименьших</b> значения S, при которых у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p><p><b>№ 21</b><br>Для игры, описанной в задании 19, найдите <b>минимальное</b> значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul>Если найдено несколько значений S, в ответе запишите минимальное из них.</p>"}, {"t": "details", "title": "Подсказка", "v": [{"t": "html", "v": "<p>Выигрывает игрок, после хода которого расстояние по прямой от фишки до точки с координатами (0, 0) не меньше 15 единиц.</p><p>Чтобы найти расстояние от начала координат до точки с координатами (x, y), нужно найти длину гипотенузы прямоугольного треугольника, у которого катеты равны x и y. То есть расстояние будет вычисляться по формуле <b>√(x² + y²)</b>.</p><h3>№ 19</h3>"}, {"t": "code", "v": "def f(x1, x2, c, win):\n    if (x1**2 + x2**2)**0.5 >= 15:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    # Записываем все возможные ходы\n    moves = [f(x1 + 3, x2, c + 1, win), f(x1, x2 + 3, c + 1, win), f(x1, x2 + 4, c + 1, win)]\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return any(moves)  # Ходит противник\n\nfor s in range(1, 14 + 1):  # Перебираем стартовое значение S\n    if f(s, 3, 0, [2]) == 1:\n        print('№ 19:', s)"}]}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["9"], ["8", "9"], ["5"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>(PRO100 ЕГЭ) Два игрока играют в следующую игру. Перед ними лежат три кучки камней, в первой из которых 2, во второй – 3, в третьей – S (1 ≤ S ≤ 21) камней.</p><p>У каждого игрока неограниченно много камней. Игроки ходят по очереди, первый ход делает Петя. Ход состоит в том, что игрок или удваивает число камней в какой-то куче или добавляет по два камня в каждую из куч.</p><p>Выигрывает игрок, после хода которого в одной из куч становится не менее 22 камней, или общее число камней во всех трех кучах становится не менее 27.</p><p>Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p><p>&nbsp;</p><p><b>№ 19</b><br>Укажите такое значение S, при котором Петя не может выиграть за один ход, но при любом ходе Пети Ваня может выиграть своим первым ходом.</p><p><b>№ 20</b><br>Для игры, описанной в предыдущем задании, найдите два <b>наименьших</b> значения S, при которых у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p><p><b>№ 21</b><br>Для игры, описанной в задании 19, найдите <b>минимальное</b> значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p>"}, {"t": "details", "title": "Подсказки", "v": [{"t": "html", "v": "<p>1. Так как игроки играют с тремя кучами, то функция f должна выглядеть так <code>def f(x1, x2, x3, c, win):</code>.</p><p>2. Ход состоит в том, что игрок или удваивает число камней в какой-то куче или добавляет по два камня в каждую из куч.</p>"}, {"t": "code", "v": "moves = [f(x1 * 2, x2, x3, c + 1, win), f(x1, x2 * 2, x3, c + 1, win), f(x1, x2, x3 * 2, c + 1, win), f(x1 + 2, x2 + 2, x3 + 2, c + 1, win)]"}, {"t": "html", "v": "<p>3. Выигрывает игрок, после хода которого в одной из куч становится не менее 22 камней, или общее число камней во всех трех кучах становится не менее 27.</p>"}, {"t": "code", "v": "# Указываем условие окончания игры\nif (x1 >= 22) or (x2 >= 22) or (x3 >= 22) or (x1+x2+x3 >= 27):  \n    return c in win"}, {"t": "html", "v": "<p><b>Полный код</b></p>"}, {"t": "code", "v": "def f(x1, x2, x3, c, win):\n    if (x1 >= 22) or (x2 >= 22) or (x3 >= 22) or (x1+x2+x3 >= 27):  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n    # Записываем все возможные ходы\n    moves = [f(x1 * 2, x2, x3, c + 1, win),\n             f(x1, x2 * 2, x3, c + 1, win),\n             f(x1, x2, x3 * 2, c + 1, win),\n             f(x1 + 2, x2 + 2, x3 + 2, c + 1, win)]\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return all(moves)  # Ходит противник\n\n\nfor s in range(1, 21 + 1):  # Перебираем стартовое количество камней в куче\n    if f(2, 3, s, 0, [1]) == 0 and f(2, 3, s, 0, [2]) == 1:\n        print('№ 19:', s)\n    if f(2, 3, s, 0, [1]) == 0 and f(2, 3, s, 0, [3]) == 1:\n        print('№ 20:', s)\n    if f(2, 3, s, 0, [2]) == 0 and f(2, 3, s, 0, [2, 4]) == 1:\n        print('№ 21:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4"}]}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["10"], ["4", "5"], ["2"]]}]}, {"num": "40.6", "title": "Условия на ходы", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h3>Содержание урока</h3><p>В этом уроке мы порешаем более сложные задания № 19-21.</p><p>Похожие задания могут встретиться на ЕГЭ. Но вероятность их встречи не большая.</p>"}]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>🔥</p><p>(С.А. Скопинцева) Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя.</p><p>За один ход игрок может увеличить количество камней в куче в три раза, добавить в кучу один камень, или 3 камня, при этом после каждого хода в куче должно быть нечетное количество камней.</p><p>Например, пусть в куче было 8 камней. Тогда за один ход можно получить кучу из 9 камней или из 11 камней (увеличить количество камней в три раза нельзя, т.к. после этого хода получится четное количество камней – 24). Для того чтобы делать ходы, у каждого игрока есть неограниченное количество камней.</p><p>Выигрывает тот игрок, после хода которого количество камней в куче становится не менее 51.</p><p>В начальный момент в куче было S камней; 1 ≤ S ≤ 50. Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p><p>&nbsp;</p><p><b>№ 19</b><br>Известно, что Ваня выиграл своим первым ходом после первого хода Пети. Назовите минимальное значение S, при котором это возможно.</p><p><b>№ 20</b><br>Найдите два <b>наибольших</b> значения S, при которых у Пети есть выигрышная стратегия, причём Петя не может выиграть первым ходом, но может выиграть своим вторым ходом независимо от того, как будет ходить Ваня. Найденные значения запишите в ответе в порядке возрастания.</p><p><b>№ 21</b><br>Сколько существует значений S, при которых одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul><p>Текстовое решение задачи смотрите на следующем шаге.</p></p>"}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["7"], ["12", "14"], ["2"]]}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Ограничение на ходы</h2><h3>Решим задачу</h3><div class=\"cond\"><p>(С.А. Скопинцева) Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя.</p><p>За один ход игрок может увеличить количество камней в куче в три раза, добавить в кучу один камень, или 3 камня, при этом после каждого хода в куче должно быть нечетное количество камней.</p><p>Например, пусть в куче было 8 камней. Тогда за один ход можно получить кучу из 9 камней или из 11 камней (увеличить количество камней в три раза нельзя, т.к. после этого хода получится четное количество камней – 24). Для того чтобы делать ходы, у каждого игрока есть неограниченное количество камней.</p><p>Выигрывает тот игрок, после хода которого количество камней в куче становится не менее 51.</p><p>В начальный момент в куче было S камней; 1 ≤ S ≤ 50. Будем говорить, что игрок имеет выигрышную стратегию, если он может выиграть при любых ходах противника.</p></div><h3>Решение</h3><p>За один ход игрок может увеличить количество камней в куче в три раза, добавить в кучу один камень, или 3 камня, при этом после каждого хода в куче должно быть нечетное количество камней.</p>"}, {"t": "code", "v": "moves = []  # Изначально список ходов пустой\nif (x*3) % 2 == 1:  # Если можем сделать ход *3\n    moves.append(f(x * 3, c + 1, win))  # То добавляем его в список moves\nif (x+1) % 2 == 1:  # Если можем сделать ход +1\n    moves.append(f(x + 1, c + 1, win))  # То добавляем его в список moves\nif (x+3) % 2 == 1:  # Если можем сделать ход +3\n    moves.append(f(x + 3, c + 1, win))  # То добавляем его в список moves"}, {"t": "html", "v": "<h3>№ 19</h3><p>Известно, что Ваня выиграл своим первым ходом после первого хода Пети. Назовите минимальное значение S, при котором это возможно.</p><p>То есть игроки просто играли и Ваня выиграл своим первым ходом. Петя мог играть не оптимально. Значит <code>all()</code> меняем на <code>any()</code>.</p>"}, {"t": "code", "v": "def f(x, c, win):\n    if x >= 51:  # Указываем условие окончания игры\n        return c in win\n    if c > max(win):\n        return 0\n\n    moves = []  # Изначально список ходов пустой\n    if (x*3) % 2 == 1:  # Если можем сделать ход *3\n        moves.append(f(x * 3, c + 1, win))  # То добавляем его в список moves\n    if (x+1) % 2 == 1:  # Если можем сделать ход +1\n        moves.append(f(x + 1, c + 1, win))  # То добавляем его в список moves\n    if (x+3) % 2 == 1:  # Если можем сделать ход +3\n        moves.append(f(x + 3, c + 1, win))  # То добавляем его в список moves\n\n    if c % 2 != max(win) % 2:\n        return any(moves)  # Ходит наш игрок\n    else:\n        return any(moves)  # Ходит противник\n\nfor s in range(1, 50 + 1):  # Перебираем стартовое количество камней в куче\n    if f(s, 0, [2]) == 1:\n        print('№ 19:', s)\n\n# П1 В1 П2 В2\n# 1  2  3  4"}, {"t": "code", "v": "№ 19: 7\n№ 19: 9\n.......\n№ 19: 46\n№ 19: 48"}, {"t": "html", "v": "<p><b>Ответ: 7.</b></p><h3>№ 20</h3><p>Найдите два <b>наибольших</b> значения S, при которых у Пети есть выигрышная стратегия, при ень. Игроки ходят по очереди, первый ход делает Петя.</p><p>За один ход игрок может добавить в меньшую кучу любое количество камней от одного до количества камней в этой куче. Изменять количество камней в большей куче не разрешается. Если кучи содержат равное количество камней, добавлять камни можно в любую из них. Пусть, например, в начале игры в первой куче 3 камня, а во второй – 5 камней, будем обозначать такую позицию (3, 5). Петя первым ходом должен добавить в первую кучу от 1 до 3 камней, он может получить позиции (4, 5), (5, 5) и (6, 5). Если Петя создаёт позицию (4, 5), то Ваня своим ходом может добавить от 1 до 4 камней в первую кучу, а если Петя создаёт позицию (6, 5), то Ваня может добавить от 1 до 5 камней во вторую кучу, так как теперь она стала меньшей. В позиции (5, 5) Ваня может добавить от 1 до 5 камней в любую кучу.</p><p>Игра завершается, когда общее количество камней в кучах становится более 49. Победителем считается игрок, сделавший последний ход, то есть первым получивший 50 или больше камней в двух кучах.</p><p>&nbsp;</p><p><b>№ 19</b><br>Известно, что Петя смог выиграть первым ходом. Какое <b>наименьшее</b> число камней могло быть суммарно в двух кучах?</p><p><b>№ 20</b><br>В игре, описанной в задании 19, в начальный момент в первой куче было 5 камней, а во второй – S камней, 1 ≤ S ≤ 40.<br>Укажите минимальное и максимальное из таких значений S, при которых Петя не может выиграть первым ходом, но у Пети есть выигрышная стратегия, позволяющая ему выиграть вторым ходом при любой игре Вани.<br>В ответе запишите сначала минимальное значение, затем максимальное.</p><p><b>№ 21</b><br>В игре, описанной в задании 19, в начальный момент в первой куче было 5 камней, а во второй – S камней, 1 ≤ S ≤ 40.<br>Найдите минимальное из таких значений S, при котором у Вани есть стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети, но у Вани нет стратегии, которая позволяла бы ему гарантированно выиграть первым ходом.</p>"}, {"t": "deta
