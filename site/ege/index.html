: "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p>Известно, что на ленте до запуска программы находилось 200 нулей и 800 единиц. Их порядок расположения на ленте не известен.</p><p>Определите количество единиц,&nbsp;находившихся на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<p><strong>Анализ МТ</strong></p><ul><li>Головка проходит всю последовательность справа налево.</li><li>Все нули меняются на единицы, все единицы меняются на нули.</li></ul><p><strong>Ответ на вопрос задачи</strong></p><div class=\"cond\"><p>Известно, что на ленте до запуска программы находилось 200 нулей и 800 единиц. Их порядок расположения на ленте не известен.</p><p>Определите количество единиц,&nbsp;находившихся на ленте после выполнения программы.</p></div><ul><li>200 нулей в исходной последовательности превратились в 200 единиц.</li><li>800 единиц в исходной последовательности превратились в 800 нулей.</li></ul><p>То есть финальная строка содержит 200 единиц и 800 нулей.</p><p><strong>Ответ: 200.</strong></p>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["200"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>&nbsp;</td></tr></tbody></table></div><p>Известно, что на ленте до запуска программы находилось 400 нулей и 600 единиц. Их порядок расположения на ленте не известен.</p><p>Определите сумму цифр,&nbsp;находившихся на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<p><strong>Анализ МТ</strong></p><ul><li>Головка проходит всю последовательность справа налево.</li><li>Все нули заменяются на единицы.</li><li>Все единицы заменяются на двойки.</li></ul><p><strong>Ответ на вопрос задачи</strong></p><div class=\"cond\"><p>Известно, что на ленте до запуска программы находилось 400 нулей и 600 единиц. Их порядок расположения на ленте не известен.</p><p>Определите сумму цифр, находившихся на ленте после выполнения программы.</p></div><ul><li>400 нулей в исходной последовательности превратились в 400 единиц.</li><li>600 единиц в исходной последовательности превратились в 600 двоек.</li></ul><p>То есть финальная строка содержит 400 единиц и 600 двоек.</p><p>Сумма цифр:</p><p><span class=\"tex\">400 \\cdot 1 + 600 \\cdot 2 = 400 + 1200 = 1600</p><p><strong>Ответ: 1600.</strong></p>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["1600"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,<strong> включающая только символы «0» и «1»</strong>. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>&nbsp;</td></tr></tbody></table></div><p>Известно, что сумма цифр, находившихся на ленте до запуска программы, равнялась 68.&nbsp;Их порядок расположения на ленте не известен.</p><p>Определите сумму цифр,&nbsp;находившихся на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<p><strong>Анализ МТ</strong></p><ul><li>Головка проходит всю последовательность справа налево.</li><li>Все нули меняются на единицы, все единицы — на двойки.</li></ul><p><strong>Ответ на вопрос задачи</strong></p><div class=\"cond\"><p>Известно, что сумма цифр, находившихся на ленте до запуска программы, равнялась 68. Их порядок расположения на ленте не известен.</p><p>Определите сумму цифр, находившихся на ленте после выполнения программы.</p></div><ul><li>Так как на ленте изначально были только нули и единицы и при этом сумма цифр равнялась 68. То это значит, что изначально на ленте было 932 нуля и 68 единиц.</li><li>После работы программы: все нули становятся единицами — <strong>932 единицы</strong>, все единицы становятся двойками — <strong>68 двоек</strong>.</li></ul><p>Сумма цифр на ленте после работы программы: <strong>932 · 1 + 68 · 2 = 932 + 136 = 1068</strong>.</p><p><strong>Ответ: 1068.</strong></p>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["1068"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов, включающая только символы «0», «1», «2», «3», «4» и «5». Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td><td><strong>3</strong></td><td><strong>4</strong></td><td><strong>5</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td><td>3, L, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>5, L, q<sub>1</sub></td><td>4, L, q<sub>1</sub></td></tr></tbody></table></div><p>Известно, что сумма цифр, находившихся на ленте до запуска программы, равнялась 800. При этом чётных и нечётных цифр было поровну. Но их порядок расположения на ленте не известен.</p><p>Определите сумму цифр,&nbsp;находившихся на ленте после выполнения программы.</p><p><strong>🎬 Видеоразбор задачи находится на следующем шаге.</strong></p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["800"]]}, {"type": "video", "title": "Видеоразбор задачи"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов, включающая только символы «0», «1», «2», «3», «4» и «5. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td><td><strong>3</strong></td><td><strong>4</strong></td><td><strong>5</strong></td><td><strong>6</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td><td>4, L, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>6, L, q<sub>1</sub></td><td>4, L, q<sub>1</sub></td><td>&nbsp;</td></tr></tbody></table></div><p>Известно, что сумма цифр, находившихся на ленте до запуска программы, равнялась 800. При этом чётных и нечётных цифр было поровну. Но их порядок расположения на ленте не известен.</p><p>Определите сумму цифр,&nbsp;находившихся на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<p>После выполнения алгоритма</p><ul><li>Каждая чётная цифра увеличилась на 2.</li><li>Каждая нечётная цифра уменьшилась на 1.</li></ul><div class=\"cond\">На ленте в соседних ячейках записана последовательность из 1000 символов.&nbsp;При этом чётных и нечётных цифр было поровну. Но их порядок расположения на ленте не известен.</div><p>Значит изначально было 500 чётных цифр и 500 нечётных.</p><p>Стартовая сумма равнялась 800. После замены 500 чётных цифр сумма увеличилась на 2*500. После замены 500 нечётных цифр, сумма уменьшилась на 1*500.<br> Получается итоговая сумма равна 800 + 2*500 - 1*500 = 1300.</p><h3>Ответ: 1300.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["1300"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов, включающая только символы «0», «1», «2», «3», «4» и «5. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td><td><strong>3</strong></td><td><strong>4</strong></td><td><strong>5</strong></td><td><strong>6</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td><td>4, L, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>6, L, q<sub>1</sub></td><td>4, L, q<sub>1</sub></td><td>&nbsp;</td></tr></tbody></table></div><p>Известно, что сумма цифр, находившихся на ленте до запуска программы, равнялась 800. При этом чётных цифр было в три раза больше, чем&nbsp;нечётных цифр. Но их порядок расположения на ленте не известен.</p><p>Определите сумму цифр,&nbsp;находившихся на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<p>После выполнения алгоритма</p><ul><li>Каждая чётная цифра увеличилась на 2.</li><li>Каждая нечётная цифра уменьшилась на 1.</li></ul><div class=\"cond\">На ленте в соседних ячейках записана последовательность из 1000 символов.&nbsp;При этом чётных цифр было в три раза больше, чем&nbsp;нечётных цифр.</div><p>Значит изначально было 750 чётных цифр и 250 нечётных.</p><p>Стартовая сумма равнялась 800. После замены 750 чётных цифр сумма увеличилась на 2*750. После замены 250 нечётных цифр, сумма уменьшилась на 1*250.<br> Получается итоговая сумма равна 800 + 2*750 - 1*250 = 2050.</p><h3>Ответ: 2050.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["2050"]]}]}, {"num": "42.4", "title": "Демоверсия 2026", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>Содержание урока</h2><p>В текущем уроке мы решим устно задачу из демоверсии и похожие на неё задачи.</p><h3>Это очень важный урок!!!</h3>"}]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>(Демо 2026) Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов <strong>A = {a<sub>0</sub>, a<sub>1</sub>, …, a<sub>n–1</sub>}</strong>),&nbsp;включая специальный пустой символ a0.</p><p>Время работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний <strong>Q = {q<sub>0</sub>, q<sub>1</sub>, …, q<sub>n–1</sub>}</strong>. В начальный момент времени головка находится в начальном состоянии <strong>q<sub>0</sub></strong>.<br> На каждом такте головка обозревает одну ячейку ленты, называемую&nbsp;текущей ячейкой. За один такт головка исполнителя может переместиться&nbsp;в ячейку справа или слева от текущей, не меняя находящийся в ней символ,&nbsp;или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После&nbsp;каждого такта головка переходит в новое состояние или остаётся в прежнем&nbsp;состоянии.</p><p>Программа работы исполнителя МТ задаётся в табличном виде.</p><div class=\"tw\"><table><tbody><tr><td>&nbsp;</td><td><strong>a<sub>0</sub></strong></td><td><strong>a<sub>1</sub></strong></td><td><strong>...</strong></td><td><strong>a<sub>n-1</sub></strong></td></tr><tr><td><strong>q<sub>0</sub></strong></td><td>команда</td><td>команда</td><td>...</td><td>команда</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>команда</td><td>команда</td><td>...</td><td>команда</td></tr><tr><td><strong>...</strong></td><td>...</td><td>...</td><td>...</td><td>...</td></tr><tr><td><strong>q<sub>n-1</sub></strong></td><td>команда</td><td>команда</td><td>...</td><td>команда</td></tr></tbody></table></div><p>В первой строке перечислены все возможные символы в текущей ячейке&nbsp;ленты, в первом столбце – возможные состояния головки. На пересечении&nbsp;i-й строки и j-го столбца находится команда, которую выполняет МТ, когда&nbsp;головка обозревает j-й символ, находясь в i-м состоянии. Если пара&nbsp;«символ – состояние» невозможна, то клетка для команды остаётся пустой.</p><p>Каждая команда состоит из трёх элементов, разделённых запятыми: первый&nbsp;элемент – записываемый в текущую ячейку символ алфавита (может&nbsp;совпадать с тем, который там уже записан). Второй элемент – один из&nbsp;четырёх символов «L», «R», «N», «S». Символы «L» и «R» означают сдвиг&nbsp;в левую или правую ячейки соответственно, «N» – отсутствие сдвига, «S» –&nbsp;завершение работы исполнителя МТ после выполнения текущей команды.</p><p>Сдвиг происходит после записи символа в текущую ячейку. Третий&nbsp;элемент – новое состояние головки после выполнения команды.</p><p><em>Например</em>, команда 0, L, q<sub>3</sub> выполняется следующим образом: в текущую ячейку записывается символ «0», затем головка сдвигается в соседнюю слева ячейку и переходит в состояние q<sub>3</sub>.</p><p>Приведём пример выполнения программы, заданной таблично.</p><p>На ленте записано неизвестное ненулевое количество расположенных подряд в соседних ячейках символов «Z», все остальные ячейки ленты заполнены пустым символом «λ». В начальный момент времени головка находится на неизвестном ненулевом расстоянии справа от самого правого символа «Z».</p><p>Программа</p><div class=\"tw\"><table><thead><tr><th style=\"background-color:#ffffff\">&nbsp;</th><th style=\"background-color:#ffffff\"><strong>λ</strong></th><th style=\"background-color:#ffffff\"><strong>Z</strong></th></tr></thead><tbody><tr><td><strong>q0</strong></td><td>λ, L, q<sub>0</sub></td><td>X, L, q<sub>1</sub></td></tr><tr><td><strong>q1</strong></td><td>λ, S, q<sub>1</sub></td><td>X, L, q<sub>1</sub></td></tr></tbody></table></div><p>заменяет на ленте все символы «Z» на «X» и останавливает исполнителя&nbsp;в первой ячейке слева от последовательности символов «X».</p><p>Возможное начальное состояние исполнителя:</p><div class=\"tw\"><table><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>▲ q<sub>0</sub></td><td>&nbsp;</td></tr><tr><td>...</td><td>λ</td><td>λ</td><td>Z</td><td>Z</td><td>Z</td><td>Z</td><td>λ</td><td>λ</td><td>...</td></tr></tbody></table></div><p>Конечное состояние исполнителя после завершения выполнения программы:</p><div class=\"tw\"><table><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>▲ q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>...</td><td>λ</td><td>λ</td><td>X</td><td>X</td><td>X</td><td>X</td><td>λ</td><td>λ</td><td>...</td></tr></tbody></table></div><p><strong>Выполните задание.</strong><br> На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 343 нуля.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p><p><strong>🎬 Видеоразбор задачи находится на следующем шаге.</strong></p><p>Условие задачи выглядит огромным. Но на самом деле в начале содержится просто теория по Машине Тьюринга. А само задание находится после фразы&nbsp;<code>Выполните задание</code>.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["999"]]}, {"type": "video", "title": "Разбор № 12 из демоверсии 2026"}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Устное решение № 12 из Демоверсии 2026</h2><div class=\"cond\"><p>(Демо 2026) На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 343 нуля.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p></div><h3>Решение</h3><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>На основании таблицы пытаемся понять, что делает программа.</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Начало:</p><ul><li>Головка стоит <strong>справа от слова</strong> на символе <code>λ</code> в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на символе <code>λ</code> выполняется: <code>λ, L, q<sub>1</sub></code> — просто сдвиг на одну ячейку <strong>влево</strong> к последнему символу слова и переход в состояние <code>q<sub>1</sub></code>.</li></ul><p>Далее МТ будет работать только в состоянии&nbsp;<code>q<sub>1</sub></code>, так как по таблице видно, что из состояния <code>q<sub>1</sub></code>&nbsp;есть переходы только в состояние&nbsp;<code>q<sub>1</sub></code>:</p><ul><li>На <code>0</code> → <code>1, L, q1</code> — ноль меняем на единицу и идём влево.</li><li>На <code>1</code> → <code>0, S, q1</code> — единицу меняем на ноль и <strong>останавливаемся</strong>.</li><li>На <code>λ</code> → <code>λ, S, q1</code> — если слово закончилось, то&nbsp;останавливаемся.</li></ul><p><strong>Вывод</strong><br> МТ идёт с конца слова влево, пока видит нули — делает их единицами; как только встретила <strong>первую</strong>&nbsp;единицу — превращает её в ноль и <strong>завершает работу</strong>.</p><h3><strong>Шаг 2. Ответ на вопрос задачи</strong></h3><div class=\"cond\">Условие задачи<br> На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.<br><br> После выполнения программы на ленте осталось ровно 343 нуля. Определите максимально возможное число нулей в исходной последовательности.</div><p>Так как нужно найти максимально возможное число нулей, то попробуем взять максимально возможное число нулей&nbsp;–&nbsp;1000, если 1000 нулей не подойдёт, то попробуем взять 999 и так далее.</p><p><strong>Пусть в исходной строке было 1000 нулей.</strong><br> В таком случае исходная строка состояла только из нулей.&nbsp;<code>λ00000...00000λ</code>.</p><p>При такой исходной строке головка движется справа налево и просто заменяет все нули на единицы. МТ завершает свою работу в первой пустой клетке слева от слова.</p><p>Получается из стартовой позиции&nbsp;<code>λ00000...00000λ</code> получается позиция&nbsp;<code>λ11111...11111λ</code>.&nbsp;<br> В ней ноль нулей, а по условию задачи требуется, чтобы в финальной позиции оказалось ровно 343 нуля.<br> Вывод: 1000 нулей не могло быть в исходной строке.</p><p><strong>Пусть в исходной строке было 999 нулей.</strong><br> В таком случае исходная строка состояла из 999 нулей и одной единицы. Единица может стоять на любой из 1000 позиций. Поэтому всего есть 1000 вариантов, куда можно поставить эту единицу.&nbsp;</p><p>Все 1000 вариантов выбора позиции единицы в «лоб» перебрать не получится из-за их большого количества. Поэтому нужно подумать, куда нужно поставить единицу, чтобы после выполнения программы осталось ровно 343 нуля.</p><div class=\"cond\">Вспомним, что&nbsp;МТ идёт с конца слова влево, пока видит нули — делает их единицами; как только встретила <strong>первую</strong>&nbsp;единицу — превращает её в ноль и <strong>завершает работу</strong>.</div><p>Если поставить единицу на первую позицию<br><code>λ<span style=\"color:#ff4363\">10000...00000λ</code> -&gt;&nbsp;<code>λ<span style=\"color:#ff4363\">01111...11111λ</code></p><p>Если поставить единицу на последнюю позицию<br><code>λ00000...0000<span style=\"color:#ff4363\">1λ</code> -&gt;&nbsp;<code>λ00000...0000<span style=\"color:#ff4363\">0λ</code></p><p>Если поставить единицу где-то в середине<br><code>λ00000...0<span style=\"color:#ff4363\">1000λ</code> -&gt;&nbsp;<code>λ00000...0<span style=\"color:#ff4363\">0111λ</code></p><p><strong>Вывод</strong></p><ul><li>Все нули, стоящие справа от единицы, заменяются на единицы.</li><li>Сама единица (выделена красным цветом) заменяется на ноль.</li></ul><p>Чтобы после выполнения программы осталось ровно 343 нуля, нужно поставить в стартовой строке единицу в триста сорок третью ячейку.</p><p>Лента до выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{342 \\text{ нуля}} \\;\\; 1 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{657 \\text{ нулей}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Лента после выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{342 \\text{ нуля}} \\;\\; 0 \\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{657 \\text{ нулей}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>В финальной позиции ровно 343 нуля (не забываем, что единственная единица в стартовой строке превратилась в ноль). Значит мы подобрали стартовую строку, удовлетворяющую условию задачи.</p><p>Максимально возможное число нулей в исходной последовательности — <code>999</code>.</p><h3>Ответ: 999.</h3>"}]}, {"type": "video", "title": "Устное решение № 12 из демоверсии 2026"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 680 нулей.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>На основании таблицы пытаемся понять, что делает программа.</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Начало:</p><ul><li>Головка стоит <strong>справа от слова</strong> на символе <code>λ</code> в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на символе <code>λ</code> выполняется: <code>λ, L, q<sub>1</sub></code> — просто сдвиг на одну ячейку <strong>влево</strong> к последнему символу слова и переход в состояние <code>q<sub>1</sub></code>.</li></ul><p>Далее МТ будет работать только в состоянии&nbsp;<code>q<sub>1</sub></code>, так как по таблице видно, что из состояния <code>q<sub>1</sub></code>&nbsp;есть переходы только в состояние&nbsp;<code>q<sub>1</sub></code>:</p><ul><li>На <code>0</code> → <code>1, L, q1</code> — ноль меняем на единицу и идём влево.</li><li>На <code>1</code> → <code>0, S, q1</code> — единицу меняем на ноль и <strong>останавливаемся</strong>.</li><li>На <code>λ</code> → <code>λ, S, q1</code> — если слово закончилось, то&nbsp;останавливаемся.</li></ul><p><strong>Вывод</strong><br> МТ идёт с конца слова влево, пока видит нули — делает их единицами; как только встретила <strong>первую</strong>&nbsp;единицу — превращает её в ноль и <strong>завершает работу</strong>.</p><h3><strong>Шаг 2. Ответ на вопрос задачи</strong></h3><div class=\"cond\">Условие задачи<br> На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.<br><br> После выполнения программы на ленте осталось ровно 680 нулей. Определите максимально возможное число нулей в исходной последовательности.</div><p>Так как нужно найти максимально возможное число нулей, то попробуем взять максимально возможное число нулей&nbsp;–&nbsp;1000, если 1000 нулей не подойдёт, то попробуем взять 999 и так далее.</p><p><strong>Пусть в исходной строке было 1000 нулей.</strong><br> В таком случае исходная строка состояла только из нулей.&nbsp;<code>λ00000...00000λ</code>.</p><p>При такой исходной строке головка движется справа налево и просто заменяет все нули на единицы. МТ завершает свою работу в первой пустой клетке слева от слова.</p><p>Получается из стартовой позиции&nbsp;<code>λ00000...00000λ</code> получается позиция&nbsp;<code>λ11111...11111λ</code>.&nbsp;<br> В ней ноль нулей, а по условию задачи требуется, чтобы в финальной позиции оказалось ровно 680 нулей.<br> Вывод: 1000 нулей не могло быть в исходной строке.</p><p><strong>Пусть в исходной строке было 999 нулей.</strong><br> В таком случае исходная строка состояла из 999 нулей и одной единицы. Единица может стоять на любой из 1000 позиций. Поэтому всего есть 1000 вариантов, куда можно поставить эту единицу.&nbsp;</p><p>Все 1000 вариантов выбора позиции единицы в «лоб» перебрать не получится из-за их большого количества. Поэтому нужно подумать, куда нужно поставить единицу, чтобы после выполнения программы осталось ровно 680 нулей.</p><div class=\"cond\">Вспомним, что&nbsp;МТ идёт с конца слова влево, пока видит нули — делает их единицами; как только встретила <strong>первую</strong>&nbsp;единицу — превращает её в ноль и <strong>завершает работу</strong>.</div><p>Если поставить единицу на первую позицию<br><code>λ<span style=\"color:#ff4363\">10000...00000λ</code> -&gt;&nbsp;<code>λ<span style=\"color:#ff4363\">01111...11111λ</code></p><p>Если поставить единицу на последнюю позицию<br><code>λ00000...0000<span style=\"color:#ff4363\">1λ</code> -&gt;&nbsp;<code>λ00000...0000<span style=\"color:#ff4363\">0λ</code></p><p>Если поставить единицу где-то в середине<br><code>λ00000...0<span style=\"color:#ff4363\">1000λ</code> -&gt;&nbsp;<code>λ00000...0<span style=\"color:#ff4363\">0111λ</code></p><p><strong>Вывод</strong></p><ul><li>Все нули, стоящие справа от единицы, заменяются на единицы.</li><li>Сама единица (выделена красным цветом) заменяется на ноль.</li></ul><p>Чтобы после выполнения программы осталось ровно 680 нулей, нужно поставить в стартовой строке единицу в шестьсот восьмидесятую ячейку.</p><p>Лента до выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{679 \\text{ нулей}} \\;\\; 1 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{320 \\text{ нулей}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Лента после выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{679 \\text{ нулей}} \\;\\; 0 \\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{320 \\text{ единиц}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>В финальной позиции ровно 680 нулей (не забываем, что единственная единица в стартовой строке превратилась в ноль). Значит мы подобрали стартовую строку, удовлетворяющую условию задачи.</p><p>Максимально возможное число нулей в исходной последовательности — <code>999</code>.</p><h3>Ответ: 999.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["999"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 320 единиц.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<blockquote><p>После выполнения программы на ленте осталось <strong>ровно 320 единиц</strong>.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p></blockquote><p>Данное условие можно преобразовать в</p><blockquote><p>После выполнения программы на ленте осталось <strong>ровно 680 нулей</strong>.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p></blockquote><p>В стартовой и конечной строках по 1000 символов. Если в конечной строке 320 единиц. То значит остальные 680 символов&nbsp;– это нули.</p><p>Получается перед нами просто задача с прошлого шага.</p><h3>Ответ: 999.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["999"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 343 нуля.&nbsp;Определите <strong>минимально </strong>возможное число нулей в исходной&nbsp;последовательности.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<p>Стоит обратить внимание, что новые нули образуются только с помощью команды&nbsp;<code>0, S, q<sub>1</sub></code>. И данная команда завершает программу.<br> Значит в ходе работы программы максимум может появиться один новый ноль.</p><p>В финальной строке содержится 343 нуля. <strong>Минимальное число нулей, которое в теории может быть в стартовой строке&nbsp;– это 342 </strong>(так как в ходе работы программы добавится максимум один ноль).</p><p>Попробуем придумать стартовое положение с 342 нулями, чтобы в итоге получилось 343 нуля. Все нули из стартовой строки нужно сохранить, поэтому ставим их в начало.</p><p>Лента до выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{342 \\text{ нуля}} \\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{658 \\text{ единиц}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Лента после выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{342 \\text{ нуля}} \\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{657 \\text{ единиц}}\\; \\; 0\\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>В ходе выполнения программы последняя единица заменяется на ноль и программа сразу же завершается. В финальной строке оказывается 343 нуля.</p><p>Значит мы привели стартовое положение с 342 нулями, которое даёт нужный результат. Меньше нулей в стартовой строке быть не могло.</p><h3>Ответ: 342.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["342"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 343 <strong>единицы</strong>.&nbsp;Определите <strong>минимально </strong>возможное число <strong>единиц </strong>в исходной&nbsp;последовательности.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>На основании таблицы пытаемся понять, что делает программа.</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Начало:</p><ul><li>Головка стоит <strong>справа от слова</strong> на символе <code>λ</code> в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на символе <code>λ</code> выполняется: <code>λ, L, q<sub>1</sub></code> — просто сдвиг на одну ячейку <strong>влево</strong> к последнему символу слова и переход в состояние <code>q<sub>1</sub></code>.</li></ul><p>Далее МТ будет работать только в состоянии&nbsp;<code>q<sub>1</sub></code>, так как по таблице видно, что из состояния <code>q<sub>1</sub></code>&nbsp;есть переходы только в состояние&nbsp;<code>q<sub>1</sub></code>:</p><ul><li>На <code>0</code> → <code>1, L, q1</code> — ноль меняем на единицу и идём влево.</li><li>На <code>1</code> → <code>0, S, q1</code> — единицу меняем на ноль и <strong>останавливаемся</strong>.</li><li>На <code>λ</code> → <code>λ, S, q1</code> — если слово закончилось, то&nbsp;останавливаемся.</li></ul><p><strong>Вывод</strong><br> МТ идёт с конца слова влево, пока видит нули — делает их единицами; как только встретила <strong>первую</strong>&nbsp;единицу — превращает её в ноль и <strong>завершает работу</strong>.</p><h3><strong>Шаг 2. Ответ на вопрос задачи</strong></h3><div class=\"cond\">Условие задачи<br> На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.<br><br> После выполнения программы на ленте осталось ровно 343 <strong>единицы</strong>.&nbsp;Определите <strong>минимально </strong>возможное число <strong>единиц </strong>в исходной&nbsp;последовательности.</div><p>Так как нужно найти минимально возможное число единиц, то попробуем взять минимально возможное число единиц –&nbsp;0, если 0 единиц не подойдёт, то попробуем взять одну, две и так далее.</p><p><strong>Пусть в исходной строке было 0 единиц.</strong><br> В таком случае исходная строка состояла только из нулей.&nbsp;<code>λ00000...00000λ</code>.</p><p>При такой исходной строке головка движется справа налево и просто заменяет все нули на единицы. МТ завершает свою работу в первой пустой клетке слева от слова.</p><p>Получается из стартовой позиции&nbsp;<code>λ00000...00000λ</code> получается позиция&nbsp;<code>λ11111...11111λ</code>.&nbsp;<br> В ней ноль нулей, а по условию задачи требуется, чтобы в финальной позиции оказалось ровно 343 нуля.<br> Вывод: 1000 нулей не могло быть в исходной строке.</p><p><strong>Пусть в исходной строке была&nbsp;одна единица.</strong><br> В таком случае исходная строка состояла из 999 нулей и одной единицы. Единица может стоять на любой из 1000 позиций. Поэтому всего есть 1000 вариантов, куда можно поставить эту единицу.&nbsp;</p><div class=\"cond\">Вспомним, что&nbsp;МТ идёт с конца слова влево, пока видит нули — делает их единицами; как только встретила <strong>первую</strong>&nbsp;единицу — превращает её в ноль и <strong>завершает работу</strong>.</div><p>Если поставить единицу на первую позицию<br><code>λ<span style=\"color:#ff4363\">10000...00000λ</code> -&gt;&nbsp;<code>λ<span style=\"color:#ff4363\">01111...11111λ</code></p><p>Если поставить единицу на последнюю позицию<br><code>λ00000...0000<span style=\"color:#ff4363\">1λ</code> -&gt;&nbsp;<code>λ00000...0000<span style=\"color:#ff4363\">0λ</code></p><p>Если поставить единицу где-то в середине<br><code>λ00000...0<span style=\"color:#ff4363\">1000λ</code> -&gt;&nbsp;<code>λ00000...0<span style=\"color:#ff4363\">0111λ</code></p><p><strong>Вывод</strong></p><ul><li>Все нули, стоящие справа от единицы, заменяются на единицы.</li><li>Сама единица (выделена красным цветом) заменяется на ноль.</li></ul><p>Чтобы после выполнения программы осталось ровно 343 единицы, нужно поставить в стартовой строке единицу в триста сорок четвёртую ячейку с конца.</p><p>Лента до выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{656\\text{ нулей}} \\;\\; 1 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{343 \\text{ нуля}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Лента после выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{656\\text{ нулей}} \\;\\; 0 \\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{343 \\text{ единицы}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>В финальной позиции ровно 343 единицы (не забываем, что единственная единица в стартовой строке превратилась в ноль). Значит мы подобрали стартовую строку, удовлетворяющую условию задачи.</p><p>Минимально возможное число единиц в исходной последовательности — <code>1</code>.</p><h3>Ответ: 1.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["1"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, S, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 343 нуля.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<p>Идея решения аналогична предыдущей задачи. В ходе работы программы удаляется максимум один ноль <code>1, S, q<sub>1</sub></code>.&nbsp;</p><p>Поэтому в теории максимум могло быть 344 нуля. Если в стартовой строке будет 345 нулей, то в итоговой минимум будет 344 нуля, а нужно по условию 343.</p><p>Попробуем привести пример стартовой строки.</p><p>Стартовое положение (344 нуля)</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{656 \\text{ единиц}} \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{343 \\text{ нуля}}\\; \\; 0\\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Финальное положение</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{656 \\text{ единиц}} \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{343 \\text{ нуля}}\\; \\; 1\\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><h3>Ответ: 344.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["344"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке <strong>слева</strong> от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, R, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, R, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 323 нуля.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>На основании таблицы пытаемся понять, что делает программа.</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, R, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, R, q<sub>1</sub></td></tr></tbody></table></div><p>Начало:</p><ul><li>Головка стоит <strong>слева от слова</strong> на символе <code>λ</code> в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на символе <code>λ</code> выполняется: <code>λ, R, q<sub>1</sub></code> — просто сдвиг на одну ячейку <strong>вправо</strong> к первому символу слова и переход в состояние <code>q<sub>1</sub></code>.</li></ul><p>Далее МТ будет работать только в состоянии <code>q<sub>1</sub></code>, так как по таблице видно, что из состояния <code>q<sub>1</sub></code> есть переходы только в состояние <code>q<sub>1</sub></code>:</p><ul><li>На <code>0</code> → <code>1, R, q1</code> — ноль меняем на единицу и идём вправо.</li><li>На <code>1</code> → <code>0, S, q1</code> — единицу меняем на ноль и <strong>останавливаемся</strong>.</li><li>На <code>λ</code> → <code>λ, S, q1</code> — если слово закончилось, то останавливаемся.</li></ul><p><strong>Вывод</strong><br> МТ идёт с начала слова вправо, пока видит нули — делает их единицами; как только встречает <strong>первую</strong> единицу — превращает её в ноль и <strong>завершает работу</strong>.</p><h3><strong>Шаг 2. Ответ на вопрос задачи</strong></h3><div class=\"cond\">Условие задачи<br> На ленте в соседних ячейках записана последовательность из 1000 символов, включающая только нули и единицы. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей ячейке <strong>слева</strong> от последовательности.<br><br> После выполнения программы на ленте осталось ровно 323 нуля. Определите максимально возможное число нулей в исходной последовательности.</div><p>Так как нужно найти максимально возможное число нулей, то попробуем взять максимально возможное число нулей — 1000, если 1000 нулей не подойдёт, то попробуем взять 999 и так далее.</p><p><strong>Пусть в исходной строке было 1000 нулей.</strong><br> В таком случае исходная строка состояла только из нулей: <code>λ00000...00000λ</code>.</p><p>При такой исходной строке головка движется слева направо и просто заменяет все нули на единицы. МТ завершает свою работу в первой пустой клетке справа от слова.</p><p>Получается из стартовой позиции <code>λ00000...00000λ</code> получается позиция <code>λ11111...11111λ</code>.<br> В ней ноль нулей, а по условию задачи требуется, чтобы в финальной позиции оказалось ровно 323 нуля.<br> Вывод: 1000 нулей не могло быть в исходной строке.</p><p><strong>Пусть в исходной строке было 999 нулей.</strong><br> В таком случае исходная строка состояла из 999 нулей и одной единицы. Единица может стоять на любой из 1000 позиций. Поэтому всего есть 1000 вариантов, куда можно поставить эту единицу.</p><p>Все 1000 вариантов выбора позиции единицы в «лоб» перебрать не получится из-за их большого количества. Поэтому нужно подумать, куда нужно поставить единицу, чтобы после выполнения программы осталось ровно 323 нуля.</p><div class=\"cond\">Вспомним, что МТ идёт с начала слова вправо, пока видит нули — делает их единицами; как только встречает <strong>первую</strong> единицу — превращает её в ноль и <strong>завершает работу</strong>.</div><p>Если поставить единицу на первую позицию<br><code>λ<span style=\"color:#ff4363\">10000...00000λ</code> → <code>λ<span style=\"color:#ff4363\">00000...00000λ</code></p><p>Если поставить единицу на последнюю позицию<br><code>λ00000...0000<span style=\"color:#ff4363\">1λ</code> → <code>λ11111...1111<span style=\"color:#ff4363\">0λ</code></p><p>Если поставить единицу где-то в середине<br><code>λ00000...0<span style=\"color:#ff4363\">1000λ</code> → <code>λ11111...1<span style=\"color:#ff4363\">0000λ</code></p><p><strong>Вывод</strong></p><ul><li>Все нули, стоящие слева от единицы, заменяются на единицы.</li><li>Сама единица (выделена красным цветом) заменяется на ноль.</li><li>Все нули, стоящие справа от единицы, не изменяются.</li></ul><p>Чтобы после выполнения программы осталось ровно 323 нуля, нужно поставить в стартовой строке единицу в 677-ю ячейку (отсчитываем слева направо).</p><p>Лента до выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{677 \\text{ нулей}} \\;\\; 1 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{322 \\text{ нуля}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Лента после выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{677 \\text{ единиц}} \\;\\; 0 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{322 \\text{ нуля}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>В финальной позиции ровно 323 нуля (единственная единица в стартовой строке превратилась в ноль). Значит мы подобрали стартовую строку, удовлетворяющую условию задачи.</p><p>Максимально возможное число нулей в исходной последовательности — <code>999</code>.</p><h3>Ответ: 999.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["999"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке слева от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, R, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, R, q<sub>1</sub></td><td>1, S, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 323 нуля.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<p>В ходе работы программы удаляется максимум один ноль <code>1, S, q<sub>1</sub></code>.&nbsp;</p><p>Поэтому в теории максимум могло быть 324 нуля. Если в стартовой строке будет 325 нулей, то в итоговой минимум будет 324 нуля, а нужно по условию 323.</p><p>Попробуем привести пример стартовой строки.</p><p>Стартовое положение (324 нуля)</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; 0\\;\\;\\underbrace{1\\;1\\;\\ldots\\;1}_{676 \\text{ единиц}} \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{323 \\text{ нуля}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Финальное положение</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\;1\\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{676 \\text{ единиц}} \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{323 \\text{ нуля}}\\; \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><h3>Ответ: 324.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["324"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 400 символов, включающая&nbsp;200 нулей и 200 единиц, расположенных подряд в произвольном порядке. Ячейки справа&nbsp;и слева от последовательности заполнены пустыми символами «λ». В начальный момент&nbsp;времени головка расположена в ближайшей ячейке слева от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, R, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, R, q<sub>1</sub></td><td>1, S, q<sub>1</sub></td></tr></tbody></table></div><p>Определите максимально возможное число нулей на ленте после завершения работы&nbsp;программы.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["399"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 400 символов, включающая&nbsp;200 нулей и 200 единиц, расположенных подряд в произвольном порядке. Ячейки справа&nbsp;и слева от последовательности заполнены пустыми символами «λ». В начальный момент&nbsp;времени головка расположена в ближайшей ячейке слева от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, R, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, R, q<sub>1</sub></td><td>1, S, q<sub>1</sub></td></tr></tbody></table></div><p>Определите минимально возможное число нулей на ленте после завершения работы&nbsp;программы.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["199"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Изначально в строке было <code>n</code> нулей. После выполнения программы на ленте осталось ровно 343 нуля.&nbsp;Определите количество различных возможных значений <code>n</code>.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<p>Данное задание проще решать в Python!!!</p><p><strong>Идея устного решения.</strong></p><ul><li>Минимум должно быть 342 нуля.<br> Так как если в стартовом положении был 341 ноль. То в ходе выполнения программы максимум добавится ещё один ноль с помощью команды&nbsp;<code>0, S, q<sub>1</sub></code>.&nbsp;</li><li>Максимум могло быть 999 нулей.<br> Так как если всего было 1000 нулей, то они бы все просто превратились в единицы.</li></ul><p>Получается первичная оценка: <code>342 &lt;= n &lt;= 999</code>.&nbsp;</p><p>Осталось привести примеры стартовых строк для каждого значения n.</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda \\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{\\text{единицы}} \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{342 \\text{ нуля}} \\;\\; \\textcolor{red}{1} \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{\\text{лишние нули}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Получился такой шаблон.&nbsp;</p><ul><li>По центру 342 нуля.</li><li>Красная единица превращается в ноль и становится ровно 343 нуля (как нужно по условию).</li><li>Лишние нули, которые расположены справа от красной единицы,&nbsp;превращаются в единицы.<br> При <code>n</code> равным 342 лишних нулей не будет. При <code>n</code> равным 343 справа от красной единицы будет стоять один лишний ноль. Который превратится в единицу после выполнения программы.</li></ul><p>Итог:&nbsp;&nbsp;<code>342 &lt;= n &lt;= 999</code>.</p><p>Значит всего <code>999 - 342 + 1 = 658</code> различных значений <code>n</code>.</p><h3>Ответ: 658.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["658"]]}]}, {"num": "42.5", "title": "Решение в Python", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>Содержание урока</h2><p>В текущем уроке мы научимся применять Python при решении № 12.</p><p>Данный урок обязателен для тех, кто планирует набрать 85+ баллов.</p>"}]}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Чем поможет Python в № 12?</h2><div class=\"cond\"><p>(Демо 2026) На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 343 нуля.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p></div><p>Важно понимать, что в демоверсии 2026 года в № 12 стартовая строка состоит из 1000 символов, каждый из которых может быть либо нулем, либо единицей.&nbsp;Это значит что всего возможно 2<sup>1000</sup> стартовых строк.</p> "}, {"t": "code", "v": "2**1000 = 10715086071862673209484250490600018105614048117055336074437503883703510511249361224931983788156958581275946729175531468251871452856923140435984577574698574803934567774824230985421074605062371141877954182153046474983581941267398767559165543946077062914571196477686542167660429831652624386837205668069376"}, {"t": "html", "v": " <p>А Python в секунду может перебрать только 10000000. То есть полный перебор стартовых строк программно сделать невозможно. Так как код будет работать гораздо больше четырёх часов.</p><p>Поэтому написать полностью автоматическое решение № 12 в Python невозможно.</p><h2>Два сценария использования Python в № 12</h2><ol><li>Решаем задание устно и в Python проверяем полученный ответ.</li><li>Решаем задание в Python перебором, используя хитрый трюк.</li></ol>"}]}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Проверка ответа в Python</h2><p>🎬 Данный материал в формате видео находится на следующем шаге.</p><div class=\"cond\"><p>(Демо 2026) На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>После выполнения программы на ленте осталось ровно 343 нуля.&nbsp;Определите максимально возможное число нулей в исходной&nbsp;последовательности.</p></div><p>Алгоритм решения задачи</p><ol><li>Решаем задачу устно.</li><li>Проверяем в Python полученный ответ.</li></ol><h2>1. Устное решение</h2><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>На основании таблицы пытаемся понять, что делает программа.</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Начало:</p><ul><li>Головка стоит <strong>справа от слова</strong> на символе <code>λ</code> в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на символе <code>λ</code> выполняется: <code>λ, L, q<sub>1</sub></code> — просто сдвиг на одну ячейку <strong>влево</strong> к последнему символу слова и переход в состояние <code>q<sub>1</sub></code>.</li></ul><p>Далее МТ будет работать только в состоянии&nbsp;<code>q<sub>1</sub></code>, так как по таблице видно, что из состояния <code>q<sub>1</sub></code>&nbsp;есть переходы только в состояние&nbsp;<code>q<sub>1</sub></code>:</p><ul><li>На <code>0</code> → <code>1, L, q1</code> — ноль меняем на единицу и идём влево.</li><li>На <code>1</code> → <code>0, S, q1</code> — единицу меняем на ноль и <strong>останавливаемся</strong>.</li><li>На <code>λ</code> → <code>λ, S, q1</code> — если слово закончилось, то&nbsp;останавливаемся.</li></ul><p>Вывод<br> МТ идёт с конца слова влево, пока видит нули — делает их единицами; как только встретила <strong>первую</strong>&nbsp;единицу — превращает её в ноль и <strong>завершает работу</strong>.</p><h3><strong>Шаг 2. Ответ на вопрос задачи</strong></h3><div class=\"cond\">Условие задачи<br> На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.<br><br> После выполнения программы на ленте осталось ровно 343 нуля. Определите максимально возможное число нулей в исходной последовательности.</div><p>Так как нужно найти максимально возможное число нулей, то попробуем взять максимально возможное число нулей&nbsp;–&nbsp;1000, если 1000 нулей не подойдёт, то попробуем взять 999 и так далее.</p><p><strong>Пусть в исходной строке было 1000 нулей.</strong><br> В таком случае исходная строка состояла только из нулей.&nbsp;<code>λ00000...00000λ</code>.</p><p>При такой исходной строке головка движется справа налево и просто заменяет все нули на единицы. МТ завершает свою работу в первой пустой клетке слева от слова.</p><p>Получается из стартовой позиции&nbsp;<code>λ00000...00000λ</code> получается позиция&nbsp;<code>λ11111...11111λ</code>.&nbsp;<br> В ней ноль нулей, а по условию задачи требуется, чтобы в финальной позиции оказалось ровно 343 нуля.<br> Вывод: 1000 нулей не могло быть в исходной строке.</p><p><strong>Пусть в исходной строке было 999 нулей.</strong><br> В таком случае исходная строка состояла из 999 нулей и одной единицы. Единица может стоять на любой из 1000 позиций. Поэтому всего есть 1000 вариантов, куда можно поставить эту единицу.&nbsp;</p><p>Все 1000 вариантов выбора позиции единицы в «лоб» перебрать не получится из-за их большого количества. Поэтому нужно подумать, куда нужно поставить единицу, чтобы после выполнения программы осталось ровно 343 нуля.</p><div class=\"cond\">Вспомним, что&nbsp;МТ идёт с конца слова влево, пока видит нули — делает их единицами; как только встретила <strong>первую</strong>&nbsp;единицу — превращает её в ноль и <strong>завершает работу</strong>.</div><p>Если поставить единицу на первую позицию<br><code>λ<span style=\"color:#ff4363\">10000...00000λ</code> -&gt;&nbsp;<code>λ<span style=\"color:#ff4363\">01111...11111λ</code></p><p>Если поставить единицу на последнюю позицию<br><code>λ00000...0000<span style=\"color:#ff4363\">1λ</code> -&gt;&nbsp;<code>λ00000...0000<span style=\"color:#ff4363\">0λ</code></p><p>Если поставить единицу где-то в середине<br><code>λ00000...0<span style=\"color:#ff4363\">1000λ</code> -&gt;&nbsp;<code>λ00000...0<span style=\"color:#ff4363\">0111λ</code></p><p><strong>Вывод</strong></p><ul><li>Все нули, стоящие справа от единицы, заменяются на единицы.</li><li>Сама единица (выделена красным цветом) заменяется на ноль.</li></ul><p>Чтобы после выполнения программы осталось ровно 343 нуля, нужно поставить в стартовой строке единицу в триста сорок третью ячейку.</p><p>Лента до выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{342 \\text{ нуля}} \\;\\; 1 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{657 \\text{ нулей}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Лента после выполнения программы</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{342 \\text{ нуля}} \\;\\; 0 \\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{657 \\text{ нулей}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>В финальной позиции ровно 343 нуля (не забываем, что единственная единица в стартовой строке превратилась в ноль). Значит мы подобрали стартовую строку, удовлетворяющую условию задачи.</p><p>Максимально возможное число нулей в исходной последовательности — <code>999</code>.</p><h3>Ответ: 999.</h3><h2>2. Проверка ответа в Python</h2><p>Напишем код, который по стартовой строке выводит финальную строку.</p><p><strong>1. Генерация стартовой позиции</strong></p><p>Будем использовать список для представления ленты. Каждый элемент списка – это ячейка ленты.</p> "}, {"t": "code", "v": "lenta = [' '] + ['0']*1000 + [' ']\nlenta[343] = '1'"}, {"t": "html", "v": " <ul><li><code>lenta = [' '] + ['0']*1000 + [' ']</code><br> Создаём список из 1000 нулей слева и справа от которых находится символ пробела.<br> Получается <code>lenta = [' ', '0', '0', ..., '0', '0', ' ']</code>.<br> Пустые ячейки для удобства обозначили пробелом.</li><li><code>lenta[343] = '1'</code><br> На 343 позиции должна стоять единица. Поэтому просто на 343 позицию списка записываем <code>'1'</code>.<br><em>Путаницы с индексами нет, так как нумерация в списках начинается с нуля. И на нулевом индексе находится символ пробела. А сама последовательность нулей и единиц уже начинается с первого индекса. Поэтому первый символ последовательности имеет индекс 1, второй&nbsp;</em>– 2, тысячный&nbsp;– 1000.</li></ul><p><strong>2. Реализация Машины Тьюринга</strong></p><p><strong>2.1&nbsp;Текущее состояние и позиция головки</strong><br> В ходе работы Машины Тьюринга меняется состояние и положение головки.&nbsp;<br> МТ всегда начинает работу в состоянии q<sub>0</sub>. А где расположена головка, нужно читать в условии задачи.</p><div class=\"cond\">(Демо 2026) На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули и единицы. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». <strong>В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</strong></div> "}, {
