<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);if(localStorage.getItem("toc")==="closed")document.documentElement.classList.add("toc-closed")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: Stepik-like learning shell — dark header with the step strip, dark collapsible table of contents on the left, white lesson page with a grey footer band */
:root{
  --bar:#222326; --bar-2:#2d2e32; --bar-ink:#e8e8ea; --bar-muted:#9a9ca3; --bar-line:#3a3b40;
  --green:#66cc66; --green-d:#4fae4f; --green-ink:#2e8b2e; --green-soft:#e8f6e8;
  --bg:#ffffff; --page:#f4f5f6; --ink:#222222; --muted:#6b6f76; --line:#e1e3e6; --line-strong:#22222255;
  --code-bg:#f6f8fa; --accent:#2f7dd1;
  --bad:#d64541; --bad-soft:#fdeceb; --warn:#c27c0e; --warn-soft:#fdf3e1;
  --kw:#7c3aed; --str:#0f7b5f; --com:#8a94a6; --num:#b45309;
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --toc-w:300px; --head-h:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181b; --page:#1e1f23; --ink:#e6e7ea; --muted:#9a9ea6; --line:#2e3036; --line-strong:#e6e7ea55;
  --code-bg:#111215; --accent:#7fb2ff; --green-ink:#7ad67a; --green-soft:#1c3320;
  --bad:#ff7d78; --bad-soft:#3a1d1c; --warn:#f0b354; --warn-soft:#352812;
  --kw:#c4a5ff; --str:#6fdcb6; --com:#6f7b8f; --num:#f5b26b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181b; --page:#1e1f23; --ink:#e6e7ea; --muted:#9a9ea6; --line:#2e3036; --line-strong:#e6e7ea55;
  --code-bg:#111215; --accent:#7fb2ff; --green-ink:#7ad67a; --green-soft:#1c3320;
  --bad:#ff7d78; --bad-soft:#3a1d1c; --warn:#f0b354; --warn-soft:#352812;
  --kw:#c4a5ff; --str:#6fdcb6; --com:#6f7b8f; --num:#f5b26b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body)}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* header */
.head{position:fixed;inset:0 0 auto 0;height:calc(var(--head-h) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:var(--bar);color:var(--bar-ink);z-index:30;display:flex;align-items:center;gap:14px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;color:var(--bar-ink);text-decoration:none;flex:none;width:calc(var(--toc-w) - 28px);min-width:0}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--green);color:#10331a;display:flex;align-items:center;justify-content:center;font:700 15px var(--f-mono);flex:none}
.logo .lt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.logo .lt b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo .lt small{font-size:12px;color:var(--bar-muted)}
.strip{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 10px}
.strip::-webkit-scrollbar{display:none}
.sq{flex:none;width:32px;height:32px;border-radius:3px;border:0;background:#55575d;color:#d7d8db;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative;font:700 15px var(--f-body)}
.sq svg{width:16px;height:16px}
.sq.seen,.sq.ok{background:var(--green);color:#10331a}
.sq.bad{background:var(--bad);color:#fff}
.sq.rev{background:var(--warn);color:#2a1a00}
.sq.on{outline:2px solid #fff;outline-offset:1px}
.hwt{display:inline-block;font:700 11px var(--f-mono);color:#2a1a00;background:#ff9f1a;border-radius:99px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.sq.hw::before{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:#ff9f1a;border:2px solid var(--bar)}
.hwnote{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#b86b00;background:#fff3e0;border:1px solid #ffd59a;border-radius:6px;padding:8px 12px}
:root[data-theme="dark"] .hwnote{background:#3a2a10;color:#ffc46b;border-color:#5c4214}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hwnote{background:#3a2a10;color:#ffc46b;border-color:#5c4214}}
.sq.on::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:var(--bg)}
.hright{display:flex;align-items:center;gap:10px;flex:none}
.pts{font:500 13px var(--f-body);color:var(--bar-muted);white-space:nowrap}
.pts b{color:var(--bar-ink)}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--bar-line);background:var(--bar-2);color:var(--bar-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;text-decoration:none}
.iconbtn svg{width:19px;height:19px}
.iconbtn:hover{border-color:var(--bar-muted)}
.acct{height:38px;border-radius:9px;border:1px solid var(--bar-line);background:var(--bar-2);color:var(--bar-ink);display:flex;align-items:center;gap:7px;padding:0 12px 0 9px;text-decoration:none;font:500 14px var(--f-body);white-space:nowrap;max-width:190px}
.acct:hover{border-color:var(--bar-muted)}
.coins{height:38px;border-radius:9px;border:1px solid var(--bar-line);background:var(--bar-2);color:var(--bar-ink);display:flex;align-items:center;gap:6px;padding:0 11px 0 9px;font:700 15px var(--f-mono);white-space:nowrap;position:relative;text-decoration:none}
.coins:hover{border-color:var(--bar-muted)}
.coin{width:19px;height:19px;flex:none;display:block}
.coins.bump{animation:cbump .5s ease}
@keyframes cbump{30%{transform:scale(1.18)}}
.cfly{position:fixed;z-index:60;pointer-events:none;display:flex;align-items:center;gap:4px;font:800 18px var(--f-mono);color:#e0a100;text-shadow:0 1px 0 #0003;animation:cfly 1.1s cubic-bezier(.2,.7,.3,1) forwards}
.cfly .coin{width:22px;height:22px}
@keyframes cfly{0%{opacity:0;transform:translate(0,10px) scale(.8)}15%{opacity:1;transform:translate(0,0) scale(1.1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.6)}}
.cprize{display:inline-flex;align-items:center;gap:5px;font:600 13.5px var(--f-body);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 7px;background:var(--bg)}
.cprize .coin{width:16px;height:16px}
.cprize.zero{opacity:.7}
.cgain{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-weight:700;color:#c98a12}
.cgain .coin{width:16px;height:16px}
@media (max-width:640px){.coins{padding:0 8px;font-size:14px}}
@media (prefers-reduced-motion:reduce){.cfly,.coins.bump{animation:none}.cfly{display:none}}
.acct svg{width:18px;height:18px;flex:none}
.acct span{overflow:hidden;text-overflow:ellipsis}
.acct i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;display:none}
.acct.in i{display:block}
.acct.err i{background:var(--bad)}
@media (max-width:640px){.acct span{display:none}.acct{padding:0;width:38px;justify-content:center;position:relative}.acct.in i{position:absolute;top:5px;right:5px}}

/* table of contents */
.toc{position:fixed;top:calc(var(--head-h) + env(safe-area-inset-top,0px));bottom:0;left:0;width:var(--toc-w);background:var(--bar-2);color:var(--bar-ink);z-index:20;display:flex;flex-direction:column;transition:transform .25s ease;border-right:1px solid var(--bar-line)}
.toc-closed .toc{transform:translateX(-100%)}
.toc-top{padding:18px 18px 14px;padding-left:max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--bar-line)}
.toc-top h2{margin:0 0 10px;font:700 16px/1.3 var(--f-body)}
.prog{font-size:13px;color:var(--bar-muted)}
.prog b{color:var(--bar-ink)}
.pbar{height:6px;border-radius:9px;background:#45474d;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:9px;width:0;transition:width .3s}
.toc-list{flex:1;overflow-y:auto;padding:8px 0 24px}
.mod{display:flex;gap:8px;align-items:baseline;padding:14px 18px 8px;font:700 15px/1.3 var(--f-body)}
.mod .n{color:var(--bar-muted)}
.mod.sec{width:100%;border:0;background:none;color:var(--bar-ink);cursor:pointer;text-align:left;align-items:center;padding:13px 18px 13px 14px;border-top:1px solid var(--bar-line)}
.mod.sec:hover{background:#ffffff0d}.mod.sec .st{flex:1;min-width:0}.mod.sec .c{font:500 12px var(--f-mono);color:var(--bar-muted)}
.mod.sec .chev{display:inline-block;width:14px;color:var(--bar-muted);transition:transform .15s;font-size:18px;line-height:1}.mod.sec.open .chev{transform:rotate(90deg)}
.mod.sec.cur .st{color:#fff}
.lbar .lsec{color:var(--muted);font-weight:600}
.les{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--bar-ink);padding:10px 22px 10px 30px;cursor:pointer;position:relative;font-size:15px;line-height:1.3}
.les::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:#4a4c52}
.les.part::before{background:linear-gradient(var(--green) var(--p,0%),#4a4c52 var(--p,0%))}
.les.done::before{background:var(--green)}
.les .n{color:var(--bar-muted);font-weight:500;min-width:30px}
.les .t{flex:1;min-width:0}
.les .c{font:500 12px var(--f-mono);color:var(--bar-muted)}
.les.done .c{color:var(--green)}
.les:hover{background:#ffffff0d}
.les.on{background:var(--green-d);color:#fff}
.les.on .n,.les.on .c{color:#eaffea}
.les.on::after{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);border:9px solid transparent;border-right-color:var(--bg)}
.les[disabled]{opacity:.45;cursor:default}
.les[disabled]:hover{background:none}

/* the big toggle arrow on the TOC edge */
.tocbtn{position:fixed;z-index:25;top:50%;left:var(--toc-w);transform:translate(-50%,-50%);width:44px;height:64px;border-radius:12px;border:2px solid var(--green);background:var(--bar);color:var(--green);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 4px 14px #0004;transition:left .25s ease,background .15s}
.tocbtn svg{width:26px;height:26px;transition:transform .25s}
.tocbtn:hover{background:var(--green);color:#10331a}
.toc-closed .tocbtn{left:22px}
.toc-closed .tocbtn svg{transform:rotate(180deg)}

/* main */
.main{padding-top:calc(var(--head-h) + env(safe-area-inset-top,0px));margin-left:var(--toc-w);transition:margin-left .25s ease;min-height:100%;display:flex;flex-direction:column}
.toc-closed .main{margin-left:0}
.lbar{border-bottom:1px solid var(--line);padding:14px 32px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;font-size:15px;
  padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.lbar b{font-weight:500}
.lbar span{color:var(--muted)}
.content{flex:1;padding:28px 32px 40px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.toc-closed .content{padding-left:max(84px,env(safe-area-inset-left,0px))}
.step{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.step h2{font:700 26px/1.25 var(--f-body);margin:6px 0;text-align:center;text-wrap:balance}
.step h2.left{text-align:left}
.step h3{font:700 19px/1.3 var(--f-body);margin:10px 0 0}
.step p{margin:0}
.html{display:flex;flex-direction:column;gap:12px;min-width:0}
ul.dash{margin:0;padding-left:22px;list-style:none;display:flex;flex-direction:column;gap:2px}
ul.dash li::before{content:"– ";margin-left:-14px}
code{font:14px var(--f-mono);background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.cond{border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:10px}
.codebox{position:relative;min-width:0}
.codebox pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:14px 16px;overflow-x:auto;font:14px/1.55 var(--f-mono);tab-size:4}
.codebox pre code{background:none;border:0;padding:0}
.copy{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:5px;font-size:12px;padding:3px 8px;cursor:pointer}
.k{color:var(--kw);font-weight:600}.s{color:var(--str)}.c{color:var(--com);font-style:italic}.d{color:var(--num)}
details.box{border:1px solid var(--line);border-radius:6px;padding:0 16px;background:var(--bg)}
details.box>summary{cursor:pointer;font-weight:500;padding:12px 0;color:var(--accent)}
details.box[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.box>div{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.locked{display:flex;gap:12px;align-items:center;border:1px dashed var(--line-strong);border-radius:6px;padding:11px 16px;color:var(--muted)}
.locked svg{width:18px;height:18px;flex:none}
.locked span{display:flex;flex-direction:column;gap:1px}
.locked b{color:var(--ink);font-weight:500}
.locked small{font-size:13px}
.vwrap{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:6px;overflow:hidden;background:#000}
.vwrap iframe{width:100%;height:100%;border:0;display:block}
.video{aspect-ratio:16/9;max-width:100%;border-radius:6px;background:#2d2e32;color:#c9cbd0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.video .pl{width:72px;height:72px;border-radius:50%;background:#ffffff1a;display:flex;align-items:center;justify-content:center}
.video .pl svg{width:30px;height:30px;color:var(--green)}
.video b{color:#fff;font-weight:500}
.filebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:6px;font-size:15px}
.flbl{font-style:italic;font-weight:500}
.file{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:6px;background:var(--green-soft);color:var(--green-ink);text-decoration:none;font:600 14px var(--f-mono)}
.file:hover{text-decoration:underline}
.file svg{width:15px;height:15px;flex:none}
.file .sz{font:400 12px var(--f-body);opacity:.8}
.vlinks{font-size:14px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.html table:not(.g18){border-collapse:collapse;font-variant-numeric:tabular-nums}
.html table:not(.g18) td,.html table:not(.g18) th{border:1px solid var(--line-strong);padding:7px 14px;text-align:center;vertical-align:middle}
.html table:not(.g18) thead td,.html table:not(.g18) thead th{background:var(--code-bg);font-weight:600}
.html table:not(.g18) tbody td:first-child{background:var(--code-bg)}
.html table.note-t td{text-align:left;background:none!important;border-color:var(--line)}
.html img{max-width:100%;height:auto;border-radius:6px}
.html blockquote{margin:0;padding:6px 14px;border-left:3px solid var(--accent);background:var(--code-bg);border-radius:0 6px 6px 0}
.html blockquote p{margin:0}
.html ul,.html ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:4px}
.html pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;font:14px/1.5 var(--f-mono);white-space:pre}
.html h4{margin:6px 0 0;font-size:17px}
.tex{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle;padding:4px 0 6px}
.tex.raw{font:14px var(--f-mono);color:var(--muted)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(64px,auto) minmax(0,1fr);gap:12px;align-items:center}
.mk{font:600 16px var(--f-mono);text-align:center;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--code-bg)}
.mrow select{font:15px var(--f-body);padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.mrow select.ok{border-color:var(--green);background:var(--green-soft)}
.mrow select.bad{border-color:var(--bad)}
.gridwrap{overflow-x:auto;max-width:100%}
table.g18{border-collapse:collapse;border:3px solid var(--ink);font-variant-numeric:tabular-nums}
table.g18 td{width:46px;height:38px;text-align:center;border:1px solid var(--line-strong);font-size:16px}
table.g18 td.wr{border-right:3px solid var(--ink)}
table.g18 td.wb{border-bottom:3px solid var(--ink)}
.treewrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px;background-color:var(--bg)}
svg.tree{max-width:100%;height:auto;display:block}
svg.tree line{stroke:var(--ink);stroke-width:1.6}
svg.tree circle{stroke:var(--ink);stroke-width:1.6}
svg.tree .w{fill:var(--bg)} svg.tree .g{fill:#2fa54a} svg.tree .r{fill:#e5413a}
svg.tree rect{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
svg.tree text{fill:var(--ink);font:13px var(--f-mono)}

/* quiz — like Stepik's framed answer block */
.quiz{border:2px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;margin-top:6px;box-shadow:0 0 0 6px var(--page)}
.quiz.ok{border-color:var(--green);box-shadow:0 0 0 6px var(--green-soft)}
.quiz.bad{border-color:var(--bad);box-shadow:0 0 0 6px var(--bad-soft)}
.qt{font:700 17px var(--f-body)}
.verdict{display:flex;align-items:center;gap:8px;font-weight:500;padding:9px 12px;border-radius:6px}
.verdict svg{width:18px;height:18px;flex:none}
.verdict.ok{background:var(--green-soft);color:var(--green-ink)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--green-d)}
.opt.ok{border-color:var(--green);background:var(--green-soft)} .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.fields{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.frow label{font-weight:500;min-width:52px}
.frow input{font:600 16px var(--f-mono);width:130px;max-width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:5px;background:var(--bg);color:var(--ink)}

<script>
window.COURSE = {"id": "ege-inf", "title": "ЕГЭ", "sections": [{"num": 6, "title": "№ 4 · Условие Фано", "key": "course-ege-inf-s6", "lessons": [{"num": "6.1", "title": "Условие Фано", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>Содержание урока</h2><p>В этом уроке мы изучим <strong>Условие Фано</strong> и порешаем задачи из ЕГЭ.</p>"}]}, {"type": "video", "title": "Теория: условие Фано"}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Условие Фано</h2><p>📝&nbsp;<strong>Условие Фано</strong>: для того, чтобы сообщение, записанное с помощью неравномерного кода, однозначно декодировалось, достаточно, чтобы&nbsp;<strong>никакое кодовое слово не являлось началом другого кодового слова</strong>.</p><p>❓ Удовлетворяет ли такое кодирование условию Фано?</p><div class=\"tw\"><table><tbody><tr><td><strong>A</strong></td><td><strong>B</strong></td><td><strong>C</strong></td><td><strong>D</strong></td><td><strong>E</strong></td></tr><tr><td>0</td><td>110</td><td>101</td><td>100</td><td>10</td></tr></tbody></table></div><p>Не удовлетворяет, так как код буквы&nbsp;<strong>E</strong>&nbsp;является&nbsp;<strong>началом&nbsp;</strong>кода буквы&nbsp;<strong>C&nbsp;</strong>и<strong>&nbsp;D</strong>.</p><p>❓ Удовлетворяет ли такое кодирование условию Фано?</p><div class=\"tw\"><table><tbody><tr><td><strong>A</strong></td><td><strong>B</strong></td><td><strong>C</strong></td><td><strong>D</strong></td><td><strong>E</strong></td></tr><tr><td>0</td><td>110</td><td>1110</td><td>1111</td><td>10</td></tr></tbody></table></div><p>Удовлетворяет, так как никакое кодовое слово не является&nbsp;<strong>началом&nbsp;</strong>другого кодового слова.</p><p><span style=\"color: #ffffff\"><sup><sub></sub></sup></p>"}]}, {"type": "choice", "blocks": [{"t": "html", "v": "<h3>Даны коды для букв:</h3><p><strong>П</strong>&nbsp;– 1111,&nbsp;<strong>Р</strong>&nbsp;– 10000,&nbsp;<strong>О</strong>&nbsp;– 100,&nbsp;<strong>С</strong>&nbsp;– 001,&nbsp;<strong>Т</strong>&nbsp;–&nbsp;01.</p><p>Удовлетворяет ли такое кодирование букв условию Фано?</p><p><span style=\"color: #ffffff\"><sup><sub></sub></sup></p>"}], "options": ["Да", "Нет"], "answer": 1}, {"type": "choice", "blocks": [{"t": "html", "v": "<h3>Даны коды для букв:</h3><p><strong>О</strong> – 1111, <strong>Е</strong> – 10000, <strong>Г</strong> – 110, <strong>Э</strong> – 000.</p><p>Удовлетворяет ли такое кодирование букв условию Фано?</p><p><span style=\"color: #ffffff\"><sup><sub></sub></sup></p>"}], "options": ["Да", "Нет"], "answer": 0}, {"type": "fill", "blocks": [{"t": "html", "v": "<p><em><strong>Попробуйте решить задачу самостоятельно, а после обязательно посмотрите её разбор на следующем шаге&nbsp;</strong></em>😉</p><p>По каналу связи передаются сообщения, содержащие только четыре буквы: А, Б, В, Г; для передачи используется двоичный код, удовлетворяющий условию Фано. Для букв А, Б, В используются такие кодовые слова:</p><p>А – 0, Б – 110, В – 101.</p><p>Укажите кратчайшее кодовое слово для буквы Г, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наибольшим числовым значением.</p><p>Примечание: Условие Фано означает, что никакое кодовое слово не является началом другого кодового слова.</p><p><span style=\"color:#ffffff\"><sup><sub></sub></sup></p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["111"]]}, {"type": "video", "title": "Видеоразбор задачи"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются сообщения, содержащие только три буквы: А, Б, В; для передачи используется двоичный код, удовлетворяющий условию Фано. Для букв А, Б используются такие кодовые слова:</p><p>А – 00, Б – 10.</p><p>Укажите кратчайшее кодовое слово для буквы В, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наибольшим числовым значением.</p><p>Примечание: Условие Фано означает, что никакое кодовое слово не является началом другого кодового слова.</p><p><span style=\"color: #ffffff\"><sup><sub></sub></sup></p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["11"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Для кодирования некоторой последовательности, состоящей из букв А, Б, В, Г, Д, Е, Ж, решили использовать неравномерный двоичный код, удовлетворяющий условию Фано. Для букв А, Б, В, Г, Д, Е использовали соответственно кодовые слова 11, 10, 010, 0011, 0010, 0000. Укажите кодовое слово минимально возможной длины для буквы Ж, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наименьшим числовым значением.</p><p>Примечание: Условие Фано означает, что никакое кодовое слово не является началом другого кодового слова.</p><p><span style=\"color: #ffffff\"><sup><sub></sub></sup></p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["011"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p><em><strong>Попробуйте решить задачу самостоятельно, а после обязательно посмотрите её разбор на следующем шаге&nbsp;</strong></em>😉</p><p>Для кодирования некоторой последовательности, состоящей из букв А, Б, В, Г, Д, Е, Ж, З, решили использовать неравномерный двоичный код, удовлетворяющий условию Фано. Для букв А, Б, В, Г, Д, Е использовали соответственно кодовые слова 11, 0010, 100, 0011, 01, 000. Укажите кратчайшее возможное кодовое слово для буквы Ж, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наименьшим числовым значением.</p><p>Примечание: Условие Фано означает, что никакое кодовое слово не является началом другого кодового слова.</p><p><span style=\"color: #ffffff\"><sup><sub></sub></sup></p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["1010"]]}, {"type": "video", "title": "Видеоразбор задачи"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Для кодирования некоторой последовательности, состоящей из букв А, Б, В, Г, Д, Е, Ж, З, решили использовать неравномерный двоичный код, удовлетворяющий условию Фано. Для букв А, Б, В, Г, Д, Е использовали соответственно кодовые слова 0101, 101, 011, 00, 0100, 11. Укажите кратчайшее возможное кодовое слово для буквы Ж, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наименьшим числовым значением.</p><p>Примечание: Условие Фано означает, что никакое кодовое слово не является началом другого кодового слова.</p><p><span style=\"color: #ffffff\"><sup><sub></sub></sup></p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["1000"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Для кодирования некоторой последовательности, состоящей из букв А, Б, В, Г, Д, Е, Ж, З, И, Й. решили использовать неравномерный двоичный код, удовлетворяющий условию Фано. Для букв А, Б, В, Г, Д, Е, Ж, З, И использовали соответственно кодовые слова 1010, 1101, 010, 00, 1000, 1110, 1001, 0111, 1011. Укажите кратчайшее возможное кодовое слово для буквы Й, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наименьшим числовым значением.</p><p>Примечание: Условие Фано означает, что никакое кодовое слово не является началом другого кодового слова.</p><p><span style=\"color: #ffffff\"><sup><sub></sub></sup></p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["0110"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p><em><strong>Попробуйте решить задачу самостоятельно, а после обязательно посмотрите её разбор на следующем шаге&nbsp;</strong></em>😉</p><p>Для кодирования некоторой последовательности, состоящей из букв А, Б, В, Г, Д, Е, Ж, З, И, Й. решили использовать неравномерный двоичный код, удовлетворяющий условию Фано. Для букв А, Б, В, Г, Д, Е, Ж, З, И использовали соответственно кодовые слова 1110, 011, 1001, 1111, 0001, 0000, 110, 0011, 0100. Укажите кратчайшее возможное кодовое слово для буквы Й, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наименьшим числовым значением.</p><p>Примечание: Условие Фано означает, что никакое кодовое слово не является началом другого кодового слова.</p><p><span style=\"color: #ffffff\"><sup><sub></sub></sup></p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["101"]]}, {"type": "video", "title": "Видеоразбор задачи"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Заглавные буквы русского алфавита закодированы неравномерным двоичным кодом, в котором никакое кодовое слово не является началом другого кодового слова. Это условие обеспечивает возможность однозначной расшифровки закодированных сообщений.&nbsp;Буквы А, Б, В, Г, Д имеют коды 00, 010, 011, 110, 111 соответственно.&nbsp;Укажите код наименьшей длины для буквы Е. Если в качестве кода может быть использовано несколько кодов одинаковой длины, выбрать тот, числовое значение которого меньше.</p><p><span style=\"color: #ffffff\"><sup><sub></sub></sup></p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["100"]]}]}, {"num": "6.2", "title": "Задачки", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>Содержание урока</h2><p>В этом уроке мы научимся решать ещё один тип № 4.</p>"}]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p><em><strong>Попробуйте решить задачу самостоятельно, а после обязательно посмотрите её разбор на следующем шаге&nbsp;</strong></em>😉</p><p>По каналу связи передаются сообщения, содержащие только четыре буквы: А, Б, В, Г; для передачи используется двоичный код, удовлетворяющий условию Фано. Для буквы А используется кодовое слово: А – 10. Укажите сумму длин кратчайших кодовых слов для букв А, Б, В и Г, при котором код будет допускать однозначное декодирование.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["8"]]}, {"type": "video", "title": "Видеоразбор задачи"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Для кодирования некоторой последовательности, состоящей из букв А, Б, В, Г, решили использовать неравномерный двоичный код, удовлетворяющий условию Фано. Для буквы А использовали кодовое слово 1, для буквы Б&nbsp;– кодовое слово 001. Какова наименьшая возможная суммарная длина всех четырёх кодовых слов?</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["9"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Для кодирования некоторой последовательности, состоящей из букв А, Б, В, Г, Д решили использовать неравномерный двоичный код, удовлетворяющий условию Фано. Для буквы А использовали кодовое слово 01, для буквы Б&nbsp;– кодовое слово 10. Какова наименьшая возможная суммарная длина всех пяти кодовых слов?</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["12"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>В сообщении встречается 7 разных букв. При его передаче использован неравномерный двоичный код, удовлетворяющий условию Фано. Известны коды трёх букв: 1, 01, 001. Коды остальных четырёх букв имеют одинаковую длину. Какова минимальная суммарная длина всех семи кодовых слов?</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["26"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>(Е. Джобс) По каналу связи передаются сообщения, содержащие только восемь букв: Х, О, Ч, У, Г, Л, Я, Т; для передачи используется двоичный код, удовлетворяющий условию Фано. Буквы Ч, У, Х, Л, Я имеют коды 10, 000, 001, 011, 110 соответственно. Укажите наименьшую суммарную длину кодовых слов для оставшихся букв.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["11"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p><em><strong>Попробуйте решить задачу самостоятельно, а после обязательно посмотрите её разбор на следующем шаге&nbsp;</strong></em>😉</p><p>Для передачи сообщений, содержащих только буквы К, Л, М, Н, О, П, Р, решили использовать неравномерный двоичный код, в котором никакое кодовое слово не является началом другого кодового слова. Это условие обеспечивает возможность однозначной расшифровки закодированных сообщений. Известны кодовые слова, использованные для некоторых букв: К – 11, Л – 000, П – 0010, Р – 1011. Какое кодовое слово надо назначить для буквы М, чтобы код удовлетворял указанному условию и при этом длина слова МОЛОКО после кодирования была наименьшей? Если таких кодов несколько, укажите код с наименьшим числовым значением.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["100"]]}, {"type": "video", "title": "Видеоразбор задачи"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Для передачи сообщений, содержащих только буквы К, Л, М, Н, О, П, Р, решили использовать неравномерный двоичный код, в котором никакое кодовое слово не является началом другого кодового слова. Это условие обеспечивает возможность однозначной расшифровки закодированных сообщений. Известны кодовые слова, использованные для некоторых букв: К – 0001, Л – 01, П – 001, Р – 1110. Какое кодовое слово надо назначить для буквы Н, чтобы код удовлетворял указанному условию и при этом длина слова ПОРОЛОН после кодирования была наименьшей? Если таких кодов несколько, укажите код с наименьшим числовым значением.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["110"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p><em><strong>Попробуйте решить задачу самостоятельно, а после обязательно посмотрите её разбор на следующем шаге&nbsp;</strong></em>😉</p><p>(А. Богданов) По каналу связи передаются сообщения, содержащие только шесть букв: А, Б, В, Д, О, Т. Для передачи используется двоичный код, удовлетворяющий условию Фано. Кодовые слова для некоторых букв известны: Б – 010, В – 011. Какое наименьшее количество двоичных знаков потребуется для кодирования слова ВОДООТВОД?</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["20"]]}, {"type": "video", "title": "Видеоразбор задачи"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются сообщения, содержащие только буквы из набора: А, З, К, Н, Ч. Для передачи используется двоичный код, удовлетворяющий условию Фано. Кодовые слова для некоторых букв известны: Н – 1111, З – 110. Для трёх оставшихся букв А, К и Ч кодовые слова неизвестны. Какое количество двоичных знаков потребуется для кодирования слова КАЗАЧКА, если известно, что оно закодировано минимально возможным количеством двоичных знаков?</p>"}, {"t": "details", "title": "Видеоразбор", "v": [{"t": "html", "v": "<p>&nbsp; &nbsp;&nbsp;<a href=\"https://youtu.be/zM_rQ0AHArc?t=1240\">https://youtu.be/zM_rQ0AHArc?t=1240</a></p><p>&nbsp; &nbsp;&nbsp;<a href=\"https://rutube.ru/video/4867e8f7b9a2fe68fca002084a7ef3cf/?r=wd&amp;t=1239\">https://rutube.ru/video/4867e8f7b9a2fe68fca002084a7ef3cf/?r=wd&amp;t=1239</a></p>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["14"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются сообщения, содержащие только шесть букв: А, И, К, Л, Н, Т, для передачи используется двоичный код, удовлетворяющий условию Фано. Буквы Л и Н имеют коды 0 и 11 соответственно. Укажите наименьшую возможную длину закодированной последовательности для слова КАЛИТКА.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["25"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются сообщения, содержащие только буквы из набора: А, З, К, Н, Т. Для передачи используется двоичный код, удовлетворяющий условию Фано. Это условие обеспечивает возможность однозначной расшифровки закодированных сообщений. Кодовые слова для некоторых букв известны: К – 1, Н – 001. Для трёх оставшихся букв А, З и Т кодовые слова неизвестны. Какое количество двоичных знаков потребуется для кодирования слова КАНТАТА, если известно, что оно закодировано&nbsp;<strong>минимально</strong>&nbsp;возможным количеством двоичных знаков?</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["18"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются сообщения, содержащие только семь букв: А, В, К, Л, О, Т, Ц. Для передачи используется двоичный код, удовлетворяющий условию Фано. Кодовые слова для некоторых букв известны: К – 00, Л – 01, О – 1000. Какое наименьшее количество двоичных знаков потребуется для кодирования слова АВТОЛАВКА?</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["25"]]}]}, {"num": "6.3", "title": "Решение в Python", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>Содержание урока</h2><p>В данном уроке рассмотрим решение в Python № 4.<br> Данный код невероятно упростит решение сложных четвёртых номеров, в которых требуется перебирать много вариантов построения дерева. Также данный способ позволит избежать ошибок в 4 номерах, в которых необходимо перебирать много вариантов построения дерева!<br> Например, такое задание из ЕГКР</p><p><img src=\"../ege-4/img/egkr-tematika.png\" alt=\"\"></p><p>В данном задании нужно перебрать целых четыре варианта построения дерева.</p><p>На реальном ЕГЭ возможно такое задание. Но в прошлые года на экзамене все № 4 были простыми и хорошо решались устно.</p><p><strong>Очень рекомендуем данный способ для подобных заданий! </strong></p><p><strong>Если же необходимо найти кодовое слово для одной или двух букв, то лучше использовать устное решение!</strong></p><p><strong><span style=\"color:#ff4363\">Это не основной способ решения, но он практически исключает ошибки в подобных заданиях, желательно его изучить! Но если вы неуверенно программируете или чувствуете, что на подготовку не хватает времени, то можно пропустить этот урок и вернуться к нему позже.</strong></p>"}]}, {"type": "video", "title": "Решение № 4 в Python"}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Шаблон решения № 4 в Python&nbsp;</h2><div class=\"cond\">По каналу связи передаются сообщения, содержащие только восемь букв: А, В, Е, Л, Н, О, С, Я. Для передачи используется двоичный код, удовлетворяющий условию Фано. Кодовые слова для некоторых букв известны:<br> В – 10, Л – 01, С – 0001, Я – 111.<br> Для четырёх оставшихся букв А, Е, Н и О кодовые слова неизвестны.<br> Какое наименьшее количество двоичных знаков требуется для кодирования слова ВСЕЛЕННАЯ?</div><p>Код для решения данной задачи&nbsp;</p> "}, {"t": "code", "v": "from itertools import *\n\nans = []\nfor a, e, n, o in product(range(20), repeat=4):\n    if (2**-2 + 2**-2 + 2**-4 + 2**-3) + (2**-a + 2**-e + 2**-n + 2**-o) <= 1:\n        cur_sum = (1*2 + 1*2 + 1*4 + 1*3) + (a + 2*e + 2*n + 0)\n        ans.append([cur_sum, a, e, n, o])\nfor x in sorted(ans)[:10]:\n    print(x)"}, {"t": "html", "v": " <p>Идея решения</p><ol><li>Перебираем всевозможные длины кодов неизвестных букв.</li><li>Проверяем, удовлетворяет ли каждый такой вариант неравенству&nbsp;Крафта—Макмиллана.</li><li>Выводим на экран наилучшие варианты.</li><li>Проверяем их путём&nbsp;построения дерева.</li></ol><h3>Разбор кода</h3><ol></ol><p><strong>1. Перебираем всевозможные длины кодов для неизвестных букв</strong></p> "}, {"t": "code", "v": "for a, e, n, o in product(range(20), repeat=4):"}, {"t": "html", "v": " <p>В данной задаче неизвестны длины кодов для букв&nbsp;А, Е, Н и О.<br> С помощью <code>product</code> генерируем всевозможные длины, меньшие 20. Указываем <code>repeat=4</code>, так как требуется дать коды четырём буквам.</p><p><strong>2. Проверяем, что длины удовлетворяют неравенству&nbsp;Крафта—Макмиллана</strong></p><p><span class=\"tex\">\\displaystyle \\sum_{i=1}^{n} 2^{-l_i} \\le 1, \\qquad n\\ \\text{— количество кодовых слов},\\qquad l_i\\ \\text{— длина $i$-го кодового слова}.</p><p>По данному неравенству, сумма двоек, каждая в степени (минус длина кодового слова), должна быть меньше или равна единице.</p><p>Известные коды: В – 10, Л – 01, С – 0001, Я – 111.<br> То есть известные длины: 2, 2, 4, 3.<br> В сумму они дают 2<sup>-2</sup> + 2<sup>-2</sup> + 2<sup>-4</sup> + 2<sup>-3</sup>.</p><p>Коды с неизвестные длинами в сумму дают&nbsp;2<sup>-a</sup> + 2<sup>-e</sup> + 2<sup>-n</sup> + 2<sup>-o</sup>.<br> Переменные a, e, n, o обозначают длины кодовых слов для букв А, Е, Н и О.&nbsp;</p><p>Получаем такое условие</p> "}, {"t": "code", "v": "if (2**-2 + 2**-2 + 2**-4 + 2**-3) + (2**-a + 2**-e + 2**-n + 2**-o) <= 1:"}, {"t": "html", "v": " <ul><li>Если данная сумма меньше или равна единице, то коды с такими длинами <strong>могут </strong>удовлетворять условию Фано.</li><li>Если данная сумма больше&nbsp;единицы, то коды с такими длинами <strong>точно не будут</strong> удовлетворять условию Фано.</li></ul><p><strong>3. Считаем количество двоичных знаков, которое требуется для кодирования слова ВСЕЛЕННАЯ.</strong></p><p>Известные коды:&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; В – 10, &nbsp; &nbsp; &nbsp;Л – 01, &nbsp; &nbsp; &nbsp;С – 0001, &nbsp;Я – 111.<br> Сколько раз они встречаются: В – 1 раз, Л – 1 раз, С – 1 раз, Я – 1 раз.<br> Количество двоичных знаков:&nbsp; &nbsp; &nbsp; 1*2 &nbsp; &nbsp; &nbsp; + &nbsp; &nbsp;1*2 &nbsp; &nbsp; &nbsp;+&nbsp; &nbsp; &nbsp;1*4&nbsp; &nbsp; &nbsp; + &nbsp; 1*3</p><p>Неизвестные коды:&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; А – ?, Е– ?, Н– ?, О – ?<br> Сколько раз они встречаются: А – 1 раз, Е – 2 раза, Н – 2 раза, О – 0 раз.<br> Количество двоичных знаков:&nbsp; &nbsp; &nbsp; a&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;+ 2*e&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; + &nbsp;2*n&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;+&nbsp; &nbsp;0<br> Напомним, что переменная <code>a</code> обозначает длину кода для буквы <code>a</code>.</p><p>Количество двоичных знаков, которое требуется для кодирования слова ВСЕЛЕННАЯ запишем в переменную <code>cur_sum</code>.</p> "}, {"t": "code", "v": "cur_sum = (1*2 + 1*2 + 1*4 + 1*3) + (a + 2*e + 2*n + 0)"}, {"t": "html", "v": " <p>Получили такой код</p> "}, {"t": "code", "v": "from itertools import *\n\nfor a, e, n, o in product(range(20), repeat=4):\n    if (2**-2 + 2**-2 + 2**-4 + 2**-3) + (2**-a + 2**-e + 2**-n + 2**-o) <= 1:\n        cur_sum = (1*2 + 1*2 + 1*4 + 1*3) + (a + 2*e + 2*n + 0)"}, {"t": "html", "v": " <p><strong>4. Выбираем наилучший вариант кодирования</strong></p><p>Для этого сохраняем в список <code>ans</code>&nbsp;количество двоичных знаков, которое требуется для кодирования слова ВСЕЛЕННАЯ, и длины кодовых слов для букв&nbsp;А, Е, Н и О.</p> "}, {"t": "code", "v": "from itertools import *\n\nans = []\nfor a, e, n, o in product(range(20), repeat=4):\n    if (2**-2 + 2**-2 + 2**-4 + 2**-3) + (2**-a + 2**-e + 2**-n + 2**-o) <= 1:\n        cur_sum = (1*2 + 1*2 + 1*4 + 1*3) + (a + 2*e + 2*n + 0)\n        ans.append([cur_sum, a, e, n, o])"}, {"t": "html", "v": " <p>После <strong>сортируем </strong>и выводим на экран коды, при которых количество двоичных знаков, которое требуется для кодирования слова ВСЕЛЕННАЯ, будет минимальным.</p> "}, {"t": "code", "v": "from itertools import *\n\nans = []\nfor a, e, n, o in product(range(20), repeat=4):\n    if (2**-2 + 2**-2 + 2**-4 + 2**-3) + (2**-a + 2**-e + 2**-n + 2**-o) <= 1:\n        cur_sum = (1*2 + 1*2 + 1*4 + 1*3) + (a + 2*e + 2*n + 0)\n        ans.append([cur_sum, a, e, n, o])\nfor x in sorted(ans)[:10]:\n    print(x)"}, {"t": "html", "v": " <p><strong>5. Проверка предложенных Python вариантов кодирования</strong></p><p>При запуске программы получаем.</p> "}, {"t": "code", "v": "[28, 5, 3, 3, 5]\n[28, 5, 3, 3, 6]\n[28, 5, 3, 3, 7]\n[28, 5, 3, 3, 8]\n[28, 5, 3, 3, 9]\n................"}, {"t": "html", "v": " <p><span style=\"color:#222222\">Напоминаем, что означают данные цифры&nbsp;<code>[cur_sum, a, e, n, o]</code>. Первое число обозначает число двоичных знаков, требуемое для кодирования всего слова. Дальше идут длины кодовых слов для букв А, Е, Н и О.</p><p>Проверим первый вариант <code>[<span style=\"color:#ff4363\">28, <span style=\"color:#64b0f4\">5, <span style=\"color:#a03881\">3, <span style=\"color:#66cc66\">3, 5]</code>.<br> Для кодирования слова ВСЕЛЕННАЯ требуется <span style=\"color:#ff4363\">28 двоичных знаков.<br> Длина кода для буквы А – <span style=\"color:#64b0f4\">5, для буквы Е – <span style=\"color:#a03881\">3, для буквы Н – <span style=\"color:#66cc66\">3,&nbsp; для буквы О – 5.</p><p>Попытаемся построить дерево с такими длинами.</p><p><img src=\"../ege-4/img/tree-vselennaya.png\" alt=\"\"></p><p>Дерево построить удалось. Значит вариант&nbsp;<code>[28, 5, 3, 3, 5]</code> подходит.</p><p><strong>Ответ: 28.</strong></p><p><span style=\"color:#ff4363\"><strong>Если бы дерево построить не удалось, то нужно было бы проверять второй вариант, который предложил Python&nbsp;[28, 5, 3, 3, 6]. Если бы второй вариант не подошёл, тогда пришлось бы проверять третий. И так до тех пор, пока не получилось бы построить дерево.<br> Но обычно первый вариант сразу является корректным.</strong></p>"}]}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Написание кода можно упростить</h2><div class=\"cond\">По каналу связи передаются сообщения, содержащие только восемь букв: А, В, Е, Л, Н, О, С, Я. Для передачи используется двоичный код, удовлетворяющий условию Фано. Кодовые слова для некоторых букв известны:<br> В – 10, Л – 01, С – 0001, Я – 111.<br> Для четырёх оставшихся букв А, Е, Н и О кодовые слова неизвестны.<br> Какое наименьшее количество двоичных знаков требуется для кодирования слова ВСЕЛЕННАЯ?</div><p><strong>Код с предыдущего шага</strong></p> "}, {"t": "code", "v": "from itertools import *\n\nans = []\nfor a, e, n, o in product(range(20), repeat=4):\n    if (2**-2 + 2**-2 + 2**-4 + 2**-3) + (2**-a + 2**-e + 2**-n + 2**-o) <= 1:\n        cur_sum = (1*2 + 1*2 + 1*4 + 1*3) + (a + 2*e + 2*n + 0)\n        ans.append([cur_sum, a, e, n, o])\nfor x in sorted(ans)[:10]:\n    print(x)"}, {"t": "html", "v": " <p><strong>Упрощённый код&nbsp;</strong></p> "}, {"t": "code", "v": "from itertools import *\n\nв = 2  # По условию код буквы В - 10. Длина кодового слова буквы В равна двум.\nл = 2\nс = 4\nя = 3\n\nans = []\nfor а, е, н, о in product(range(20), repeat=4):\n    if (2**-2 + 2**-2 + 2**-4 + 2**-3) + (2**-а + 2**-е + 2**-н + 2**-о) <= 1:\n        cur_sum = в+с+е+л+е+н+н+а+я  # !!!\n        ans.append([cur_sum, а, е, н, о])\n        \nfor ции. Если принятое кодовое слово отличается от кодовых слов букв А, Б и В более, чем в одной позиции, считается, что произошла ошибка, которую обозначают символом «*».</p><p>Декодируйте сообщение:</p> "}, {"t": "code", "v": "  00110 00000 11111 11010"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["ВВА*"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p><em><strong>Попробуйте решить задачу самостоятельно, а после обязательно посмотрите её разбор на следующем шаге&nbsp;</strong></em>😉</p><p>Заглавные буквы русского алфавита закодированы неравномерным двоичным кодом, в котором никакое кодовое слово не является началом другого кодового слова. Это условие обеспечивает возможность однозначной расшифровки закодированных сообщений. Известно, что все кодовые слова содержат не меньше двух двоичных знаков, а слову ГОЛОД соответствует код 0100001100111. Какой код соответствует слову ДОГ?</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["11100010"]]}, {"type": "video", "title": "Видеоразбор задачи"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Заглавные буквы русского алфавита закодированы неравномерным двоичным кодом, в котором никакое кодовое слово не является началом другого кодового слова. Это условие обеспечивает возможность однозначной расшифровки закодированных сообщений. Известно, что все кодовые слова содержат не меньше двух двоичных знаков, а слову ВОРОТ соответствует код 0000110001111. Какой код соответствует слову РОВ?</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["10001000"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Заглавные буквы русского алфавита закодированы неравномерным двоичным кодом, в котором никакое кодовое слово не является началом другого кодового слова. Это условие обеспечивает возможность однозначной расшифровки закодированных сообщений. Известно, что все кодовые слова содержат не меньше двух и не больше трёх двоичных знаков, а слову МАНКА соответствует код 1010111100001. Какой код соответствует слову МАК?</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["10101000"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<h2>🔥🔥</h2><p>(СтатГрад) Все заглавные буквы русского алфавита закодированы неравномерным двоичным кодом, в котором никакое кодовое слово не является началом другого кодового слова. Это условие обеспечивает возможность однозначной расшифровки закодированных сообщений. Известны кодовые слова некоторых букв: А - 000, Б - 0010, В - 10, Т - 1101. Известно также, что код слова РОБОТ содержит 17 двоичных знаков. Укажите самый короткий возможный код буквы Р. Если таких кодов несколько, укажите тот из них, который имеет <strong>наименьшее </strong>числовое значение.</p>"}, {"t": "details", "title": "Видеоразбор", "v": [{"t": "html", "v": "<p>&nbsp; &nbsp;&nbsp;<a href=\"https://youtu.be/B2EQuGN9r2w?t=1734\">https://youtu.be/B2EQuGN9r2w?t=1734</a></p><p>&nbsp; &nbsp;&nbsp;<a href=\"https://rutube.ru/video/291fa6d3f84e05443208a9fc92f8aca9/?r=wd&amp;t=1734\">https://rutube.ru/video/291fa6d3f84e05443208a9fc92f8aca9/?r=wd&amp;t=1734</a></p>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["010"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Все заглавные буквы русского алфавита закодированы неравномерным двоичным кодом, в котором никакое кодовое слово не является началом другого кодового слова. Это условие обеспечивает возможность однозначной расшифровки закодированных сообщений.</p><p>Известно, что все кодовые слова содержат не меньше двух двоичных знаков, а слову КАНАЛ соответствует код 001101011101. Какое наименьшее количество двоичных знаков может содержать сообщение, кодирующее слово ЛОТОК?</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<p><strong>1. Восстанавливаем коды.</strong> Код начинается с К, а все коды не короче двух знаков. Перебирая варианты так, чтобы обе буквы А получили одинаковый код и выполнялось условие Фано, получаем единственное разбиение: <code>00 | 11 | 010 | 11 | 101</code>, то есть К – 00, А – 11, Н – 010, Л – 101.</p><p><strong>2. Ищем свободные места.</strong> В дереве свободны узлы 011 и 100 — оба длины 3. Кодов длины 2 и короче для новых букв уже не осталось.</p><p><strong>3. Минимизируем ЛОТОК.</strong> В слове О встречается дважды, Т — один раз. Отдаём О код 011. Если Т займёт оставшийся узел 100, то для остальных букв алфавита места не останется, поэтому Т – 1000, а 1001… остаётся для других букв.</p><p>Длина: Л (3) + О (3) + Т (4) + О (3) + К (2) = 15.</p>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["15"]]}]}, {"num": "6.5", "title": "Тренировка", "steps": [{"type": "fill", "blocks": [{"t": "html", "v": "<p>Для кодирования некоторой последовательности, состоящей из букв А, Б, В, Г, Д, Е, Ж решили использовать неравномерный двоичный код, удовлетворяющий условию Фано. Для букв А, Б, В, Г использовали соответственно кодовые слова 00, 010, 011, 11. Укажите кратчайшее возможное кодовое слово для буквы Д, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наименьшим числовым значением.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["100"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются шифрованные сообщения, содержащие только 10 букв: А, Б, Е, И, К, Л, Р, С, Т, У; для передачи используется неравномерный двоичный код. Для девяти букв используются кодовые слова.</p><p>Укажите кратчайшее кодовое слово для буквы С, при котором код будет удовлетворять условию Фано. Если таких кодов несколько, укажите код с<strong>&nbsp;наименьшим</strong>&nbsp;числовым значением.</p><div class=\"tw\"><table><thead><tr><td>Буква</td><td>Кодовое слово</td><td>Буква</td><td>Кодовое слово</td></tr></thead><tbody><tr><td>А</td><td>00</td><td>Л</td><td>1001</td></tr><tr><td>Б</td><td>1000</td><td>Р</td><td>1110</td></tr><tr><td>Е</td><td>010</td><td>С</td><td>&nbsp;</td></tr><tr><td>И</td><td>011</td><td>Т</td><td>1111</td></tr><tr><td>К</td><td>1011</td><td>У</td><td>110</td></tr></tbody></table></div><p><em>Примечание</em>. Условие Фано означает, что никакое кодовое слово не является началом другого кодового слова. Это обеспечивает возможность однозначной расшифровки закодированных сообщений.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["1010"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>Для кодирования растрового рисунка, напечатанного с использованием шести красок, применили неравномерный двоичный код. Для кодирования цветов используются кодовые слова.</p><div class=\"tw\"><table><thead><tr><td>Цвет</td><td>Кодовое слово</td><td>Цвет</td><td>Кодовое слово</td></tr></thead><tbody><tr><td>Белый</td><td>10</td><td>Синий</td><td>1110</td></tr><tr><td>Зелёный</td><td>11110</td><td>Фиолетовый</td><td>11111</td></tr><tr><td>Красный</td><td>&nbsp;</td><td>Чёрный</td><td>0</td></tr></tbody></table></div><p>Укажите кратчайшее кодовое слово для кодирования красного цвета, при котором код будет удовлетворять условию Фано. Если таких кодов несколько, укажите код с<strong>&nbsp;наименьшим</strong>&nbsp;числовым значением.</p><p><em>Примечание</em>. Условие Фано означает, что никакое кодовое слово не является началом другого кодового слова. Это обеспечивает возможность однозначной расшифровки закодированных сообщений.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["110"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются шифрованные сообщения, содержащие только шесть букв: А, Б, В, Г, Д, Е. Для передачи используется неравномерный двоичный код. Для букв А, Б, В и Г используются кодовые слова 000, 010, 100, 1110 соответственно.</p><p>Укажите минимальную сумму длин кодовых слов для букв Д и Е, при котором код будет удовлетворять условию Фано.</p><p><em>Примечание</em>. Условие Фано означает, что никакое кодовое слово не является началом другого кодового слова. Это обеспечивает возможность однозначной расшифровки закодированных сообщений.</p>"}], "fields": [{"label":  оно закодировано минимально возможным количеством двоичных знаков?</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["22"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>По каналу&nbsp;связи передаются сообщения, содержащие только буквы из набора: А, К, Н, О, П, Ч, Я. Для передачи&nbsp;используется двоичный код, удовлетворяющий условию Фано. Кодовые слова для некоторых букв известны: К – 01,&nbsp;Я – 001. Для пяти оставшихся букв А, О, Н, П и Ч кодовые&nbsp;слова неизвестны.</p><p>Какое количество двоичных&nbsp;потребуется для кодирования слова КНОПОЧКА, если известно, что оно закодировано минимально возможным&nbsp;количеством двоичных знаков?</p><p><em>Примечание. Условие Фано означает, что никакое кодовое слово не является началом другого кодового слова.&nbsp;Это обеспечивает возможность однозначной расшифровки закодированных сообщений.</em></p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["22"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<h2>🔥</h2><p>(СтатГрад) Все заглавные буквы русского алфавита закодированы неравномерным двоичным кодом, в котором никакое кодовое слово не является началом другого кодового слова. Это условие обеспечивает возможность однозначной расшифровки закодированных сообщений. Известны кодовые слова некоторых букв: Б – 00, В – 0101, Д – 10, У – 111.</p><p>Какое наименьшее число двоичных знаков может содержать код слова СКАКАЛКА?</p>"}, {"t": "details", "title": "Видеоразбор", "v": [{"t": "html", "v": "<p>&nbsp; &nbsp;&nbsp;<a href=\"https://youtu.be/UbsOa3Z8Hb4?t=1603\">https://youtu.be/UbsOa3Z8Hb4?t=1603</a></p><p>&nbsp; &nbsp;&nbsp;<a href=\"https://vk.com/video-205997912_456239211\">https://vk.com/video-205997912_456239211</a></p>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["29"]]}]}, {"num": "6.6", "title": "Обратное условие Фано", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>Содержание урока</h2><p>В этом уроке мы изучим <strong>Обратное условие Фано</strong>.</p><p>Шанс, что обратное условие Фано встретится на ЕГЭ, достаточно мал, поэтому если чувствуете, что времени на подготовку не достаточно, то или пропустите оба урока по этой теме или только ознакомьтесь с Обратным условием Фано (2 и 3 шаг данного урока)</p>"}]}, {"type": "video", "title": "Теория: обратное условие Фано"}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Обратное условие Фано</h2><p>📝&nbsp;<strong>Обратное условие Фано</strong>: для того, чтобы сообщение, записанное с помощью неравномерного кода, однозначно декодировалось, достаточно, чтобы&nbsp;<strong>никакое кодовое слово не являлось концом другого кодового слова</strong>.</p><p>❓ Удовлетворяет ли такое кодирование обратному условию Фано?</p><div class=\"tw\"><table><tbody><tr><td><strong>A</strong></td><td><strong>B</strong></td><td><strong>C</strong></td><td><strong>D</strong></td><td><strong>E</strong></td></tr><tr><td>1101</td><td>110</td><td>000</td><td>1111</td><td>10</td></tr></tbody></table></div><p>Не удовлетворяет, так как код буквы&nbsp;<strong>Е</strong>&nbsp;является концом кода буквы&nbsp;<strong>B</strong>.</p><p>❓ Удовлетворяет ли такое кодирование обратному условию Фано?</p><div class=\"tw\"><table><tbody><tr><td><strong>A</strong></td><td><strong>B</strong></td><td><strong>C</strong></td><td><strong>D</strong></td><td><strong>E</strong></td></tr><tr><td>1101</td><td>110</td><td>000</td><td>1111</td><td>100</td></tr></tbody></table></div><p>Удовлетворяет, так как никакое кодовое слово не является&nbsp;<strong>концом&nbsp;</strong>другого кодового слова.</p><p>🤓 Чтобы декодировать обратное условие Фано — нужно просматривать двоичный код с&nbsp;<strong>конца</strong>.</p>"}]}, {"type": "choice", "blocks": [{"t": "html", "v": "<h3>Даны коды для букв:</h3><p><strong>П&nbsp;</strong>– 1101,&nbsp;<strong>Р</strong>&nbsp;– 10000,&nbsp;<strong>О</strong>&nbsp;– 100,&nbsp;<strong>С</strong>&nbsp;– 001,&nbsp;<strong>Т</strong>&nbsp;–&nbsp;11.</p><p>Удовлетворяет ли такое кодирование букв обратному условию Фано?</p>"}], "options": ["Да", "Нет"], "answer": 0}, {"type": "choice", "blocks": [{"t": "html", "v": "<h3>Даны коды для букв:</h3><p><strong>О</strong> – 1101, <strong>Е</strong> – 101, <strong>Г</strong> – 110, <strong>Э</strong> – 010.</p><p>Удовлетворяет ли такое кодирование букв обратному условию Фано?</p>"}], "options": ["Да", "Нет"], "answer": 1}, {"type": "fill", "blocks": [{"t": "html", "v": "<p><em><strong>Попробуйте решить задачу самостоятельно, а после обязательно посмотрите её разбор на следующем шаге&nbsp;</strong></em>😉</p><p>По каналу связи передаются сообщения, содержащие только четыре буквы: А, Б, В, Г; для передачи используется двоичный код, удовлетворяющий <strong>обратному </strong>условию Фано. Для букв А, Б, В используются такие кодовые слова:</p><p>&nbsp; &nbsp; А – 0, Б – 01, В – 011.</p><p>Укажите кратчайшее кодовое слово для буквы Г, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наибольшим числовым значением.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["111"]]}, {"type": "video", "title": "Видеоразбор задачи"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются сообщения, содержащие только пять букв: А, Б, В, Г, Д; для передачи используется двоичный код, удовлетворяющий <strong>обратному </strong>условию Фано. Для букв А, Б, В, Г используются такие кодовые слова:</p><p>&nbsp; &nbsp; А – 10, Б – 00, В – 011, Г – 101.</p><p>Укажите кратчайшее кодовое слово для буквы Д, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наименьшим числовым значением.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["001"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются сообщения, содержащие семь букв: А, Б, В, Г, Д, Е, Ж; для передачи используется двоичный код, удовлетворяющий <strong>обратному </strong>условию Фано. Для букв А, Б, В, Г, Д используются такие кодовые слова:</p><p>&nbsp; &nbsp; А – 10, Б – 000, В – 01, Г – 011, Д – 111.</p><p>Укажите кратчайшее кодовое слово для буквы Ж, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наименьшим числовым значением.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["0100"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются сообщения, содержащие восемь букв: А, Б, В, Г, Д, Е, Ж, З; для передачи используется двоичный код, удовлетворяющий <strong>обратному </strong>условию Фано. Для букв А, Б используются такие кодовые слова:</p><p>&nbsp; &nbsp; А – 10, Б – 11.</p><p>Укажите кратчайшее кодовое слово для буквы Ж, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наибольшим числовым значением.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["01"]]}, {"type": "video", "title": "Видеоразбор задачи"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются сообщения, содержащие четыре буквы: А, Б, В, Г; для передачи используется двоичный код, удовлетворяющий <strong>обратному </strong>условию Фано. Для букв А, Б, В, Г используются такие кодовые слова:</p><p>&nbsp; &nbsp; А – 10, Б – 1011, В - 00, Г- 111</p><p>Декодируйте сообщение: 10111011.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["ББ"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<h2>🔥🔥🔥</h2><p>По каналу связи передаются сообщения, содержащие только семь букв: П, Р, А, В, И, Л, О; для передачи используется двоичный код, допускающий однозначное декодирование (удовлетворяющий прямому или обратному условию Фано). Буквы П, А, Р имеют коды 1011, 01 и 0011 соответственно. Укажите наименьшую возможную длину закодированной последовательности для слова ПОВРАЛИПОПРАВО.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["42"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<h2>🔥🔥🔥</h2><p>(Е. Джобс) Для кодирования некоторой последовательности, состоящей из букв М, И, Н, У, С, О, Т, К, А решили использовать неравномерный двоичный код, удовлетворяющий прямому или обратному условию Фано. Для букв И, У, О и А использовали соответственно кодовые слова 00, 011, 10, 1110. Найдите наименьшую возможную длину кодовой последовательности для слова МУКИИТОСКАСКИМ.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["43"]]}]}, {"num": "6.7", "title": "Когда использовать обратное условие Фано?", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>Содержание урока</h2><p>В этом уроке мы узнаем, в каких задачах нужно использовать <strong>Обратное условие Фано</strong>.</p><p>Шанс, что обратное условие Фано встретится на ЕГЭ, достаточно мал.</p>"}]}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Когда использовать обратное условие Фано?</h2><p><strong>1.</strong>&nbsp;Обратное условие Фано нужно использовать только в том случае, если в условии задачи конкретно сказано про обратное условие Фано!!!</p><h4><strong>Примеры задач, в которых нужно использовать обратное условие Фано:</strong></h4><ul><li>(Е. Джобс) По каналу связи передаются сообщения, содержащие только семь букв: П, Р, А, В, И, Л, О; <code>для передачи используется двоичный код, допускающий однозначное декодирование (удовлетворяющий прямому или <strong>обратному условию Фано</strong>)</code>. Буквы П, А, Р имеют коды 1011, 01 и 0011 соответственно. Укажите наименьшую возможную длину закодированной последовательности для слова ПОВРАЛИПОПРАВО.</li></ul><ul><li><code>Заглавные буквы русского алфавита закодированы неравномерным двоичным кодом, в котором никакое кодовое слово не является <strong>концом другого кодового слова</strong>.</code> Это условие обеспечивает возможность однозначной расшифровки закодированных сообщений. Известно, что все кодовые слова содержат не меньше двух и не больше трёх двоичных знаков, а слову КАЧОК соответствует код 1110000100011. Какой код соответствует слову КОК?</li></ul><ul><li>По каналу связи передаются сообщения, содержащие только три буквы: А, Б, В; <code>для передачи используется двоичный код, удовлетворяющий <strong>обратному условию Фано</strong>.</code> Для букв А, Б используются такие кодовые слова: А – 00, Б – 10. Укажите кратчайшее кодовое слово для буквы В, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наибольшим числовым значением. <code>Примечание: Обратное условие Фано означает, что никакое кодовое слово не является <strong>концом другого кодового слова</strong>.</code></li></ul><p><strong>2.</strong>&nbsp;Если в задаче сказано используется <code>условие Фано</code>, но далее не пояснено, что это значит, то в таком случае нужно использовать только <code>прямое условие Фано</code>. В данном случае фраза&nbsp;<code>условие Фано</code> означает&nbsp;<code>прямое условие Фано</code>.</p><h4><strong>Именно такая формулировка встретилась на ЕГЭ в 2022 году:</strong></h4><ul><li>(ЕГЭ-2022) По каналу связи передаются сообщения, содержащие только буквы из набора: А, З, К, Н, Ч. <code>Для передачи используется двоичный код, удовлетворяющий <strong>условию Фано</strong></code>. Кодовые слова для некоторых букв известны: Н – 1111, З – 110. Для трёх оставшихся букв А, К и Ч кодовые слова неизвестны. Какое количество двоичных знаков потребуется для кодирования слова КАЗАЧКА, если известно, что оно закодировано минимально возможным количеством двоичных знаков?</li></ul><p><strong>3.</strong> Особыми являются случаи, когда про условие Фано ничего не сказано, а написано <code>используется неравномерный двоичный код, допускающий однозначное декодирование</code>.&nbsp;Тогда мы должны использовать при решении <code><strong>и</strong><strong>прямое, и обратное</strong><strong>условие Фано</strong></code>.</p><ul><li>(А. Куканова) Для кодирования некоторой последовательности, состоящей из букв В, И, Т, Я, З, Ь решили <code>использовать неравномерный двоичный код, допускающий однозначное декодирование</code>. Известны коды для некоторых букв: В — 110, И — 00, Т — 001, Я — 010, З — 111. Укажите кратчайшее возможное кодовое слово для буквы Ь, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наименьшим числовым значением.</li></ul><ul><li>(А. Минак) Для передачи сообщений, состоящих только из букв A, B, C, D, используют <code>неравномерный двоичный код</code>: A — 10, B — 1, C — 100. Каким должно быть кодовое слово для буквы D, чтобы длина этого кодового слова была минимальной и <code>допускалось однозначное декодирование сообщений</code>?</li></ul><h3><strong>Вывод: </strong></h3><ul><li>Внимательно читайте условие и следуйте тому, что в нём написано!</li><li>Фраза&nbsp;<code>условие Фано</code> означает&nbsp;<code>прямое условие Фано,</code>&nbsp;если в задаче не сказано конкретно про обратное условие Фано.</li></ul>"}]}, {"type": "choice", "blocks": [{"t": "html", "v": "<p>Все заглавные буквы русского алфавита закодированы неравномерным двоичным кодом, для которого выполняется условие Фано: никакое кодовое слово не совпадает с началом другого кодового слова. Известно, что слову ГНОМОН соответствует код 00010110101110. Какой код соответствует слову МОГ?</p><p><strong>Какое условие фано: только прямое, только обратное или оба сразу надо использовать в задаче?</strong></p>"}], "options": ["Только прямое условие Фано", "Только обратное условие Фано", "И прямое, и обратное условие Фано"], "answer": 0}, {"type": "choice", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются сообщения, содержащие только четыре буквы: А, Б, В, Г; для передачи используется двоичный код, удовлетворяющий условию Фано. Для букв А, Б, В используются такие кодовые слова: А – 00; Б – 110; В – 101. Укажите кратчайшее кодовое слово для буквы Г, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наибольшим числовым значением.</p><p><strong>Какое условие фано: только прямое, только обратное или оба сразу надо использовать в задаче?</strong></p>"}], "options": ["Только прямое условие Фано", "Только обратное условие Фано", "И прямое, и обратное условие Фано"], "answer": 0}, {"type": "choice", "blocks": [{"t": "html", "v": "<p>Для кодирования некоторой последовательности, состоящей из букв В, И, Т, Я, З, Ь решили использовать неравномерный двоичный код, допускающий однозначное декодирование. Известны коды для некоторых букв: В — 110, И — 000, Т — 001, Я — 010, З — 111. Укажите кратчайшее возможное кодовое слово для буквы Ь, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наименьшим числовым значением.</p><p><strong>Какое условие фано: только прямое, только обратное или оба сразу надо использовать в задаче?</strong></p>"}], "options": ["Только прямое условие Фано", "Только обратное условие Фано", "И прямое, и обратное условие Фано"], "answer": 2}, {"type": "choice", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются сообщения, содержащие только четыре буквы: А, Б, В, Г; для передачи используется двоичный код, удовлетворяющий условию Фано. Для буквы А используется кодовое слово: А – 101. Укажите сумму длин кратчайших кодовых слов для букв Б, В и Г, при котором код будет допускать однозначное декодирование.</p><p><strong>Какое условие фано: только прямое, только обратное или оба сразу надо использовать в задаче?</strong></p>"}], "options": ["И прямое, и обратное условие Фано", "Только прямое условие Фано", "Только обратное условие Фано"], "answer": 1}, {"type": "choice", "blocks": [{"t": "html", "v": "<p>По каналу связи передаются сообщения, содержащие только три буквы: А, Б, В; для передачи используется двоичный код, удовлетворяющий обратному условию Фано. Для букв А, Б используются такие кодовые слова: А – 00, Б – 10. Укажите кратчайшее кодовое слово для буквы В, при котором код будет допускать однозначное декодирование. Если таких кодов несколько, укажите код с наибольшим числовым значением.</p><p>Примечание: Обратное условие Фано означает, что никакое кодовое слово не является концом другого кодового слова.</p><p><strong>Какое условие фано: только прямое, только обратное или оба сразу надо использовать в задаче?</strong></p>"}], "options": ["И прямое, и обратное условие Фано", "Только прямое условие Фано", "Только обратное условие Фано"], "answer": 2}]}]}, {"num": 42, "title": "№ 12 · Машина Тьюринга", "key": "course-ege-inf-s42", "lessons": [{"num": "42.1", "title": "Теория", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>План изучения № 12</h2><p>В 2026 году появилось новое задание № 12 на Машину Тьюринга.</p><ol><li>На наш взгляд, это задание не простое. Имейте это в виду.</li><li>Основным способом решения является устное решение.</li><li>Если задача будет сложной, то на помощь может прийти решение в Python.</li></ol><p>Если Вам нужно 60-80 баллов. То лучше сначала изучайте другие задания из ЕГЭ. Данное задание изучайте одним из последних.</p><p><strong>План действий</strong></p><ol><li>Изучаем теорию по Машине Тьюринга.</li><li>Решаем простые задачи устно, чтобы разобраться с Машиной Тьюринга.</li><li>Решаем задачи уровня Демоверсии устно.</li><li>Изучаем решение в Python.</li><li>Практикуемся в решении задач.</li></ol><p>Если осталось мало времени до ЕГЭ и Вы не успеваете всё изучить, то можете не изучать решение в Python. А просто разберитесь, как работает Машина Тьюринга и порешайте задачи, похожие на Демоверсию.</p><h3>Содержание текущего урока</h3><p>В текущем уроке мы изучим теорию по Машине Тьюринга и порешаем простые подготовительные задачи.</p>"}]}, {"type": "video", "title": "Теория: как работает Машина Тьюринга", "blocks": [{"t": "html", "v": "<h3>Описание исполнителя МТ из демоверсии ЕГЭ</h3><p>Пока видео нет, прочитайте, как устроен исполнитель. Этот текст стоит в начале каждого задания № 12.</p>"}, {"t": "html", "v": "<p>Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов <strong>A = {a<sub>0</sub>, a<sub>1</sub>, …, a<sub>n–1</sub>}</strong>),&nbsp;включая специальный пустой символ a0.</p><p>Время работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний <strong>Q = {q<sub>0</sub>, q<sub>1</sub>, …, q<sub>n–1</sub>}</strong>. В начальный момент времени головка находится в начальном состоянии <strong>q<sub>0</sub></strong>.<br> На каждом такте головка обозревает одну ячейку ленты, называемую&nbsp;текущей ячейкой. За один такт головка исполнителя может переместиться&nbsp;в ячейку справа или слева от текущей, не меняя находящийся в ней символ,&nbsp;или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После&nbsp;каждого такта головка переходит в новое состояние или остаётся в прежнем&nbsp;состоянии.</p><p>Программа работы исполнителя МТ задаётся в табличном виде.</p><div class=\"tw\"><table><tbody><tr><td>&nbsp;</td><td><strong>a<sub>0</sub></strong></td><td><strong>a<sub>1</sub></strong></td><td><strong>...</strong></td><td><strong>a<sub>n-1</sub></strong></td></tr><tr><td><strong>q<sub>0</sub></strong></td><td>команда</td><td>команда</td><td>...</td><td>команда</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>команда</td><td>команда</td><td>...</td><td>команда</td></tr><tr><td><strong>...</strong></td><td>...</td><td>...</td><td>...</td><td>...</td></tr><tr><td><strong>q<sub>n-1</sub></strong></td><td>команда</td><td>команда</td><td>...</td><td>команда</td></tr></tbody></table></div><p>В первой строке перечислены все возможные символы в текущей ячейке&nbsp;ленты, в первом столбце – возможные состояния головки. На пересечении&nbsp;i-й строки и j-го столбца находится команда, которую выполняет МТ, когда&nbsp;головка обозревает j-й символ, находясь в i-м состоянии. Если пара&nbsp;«символ – состояние» невозможна, то клетка для команды остаётся пустой.</p><p>Каждая команда состоит из трёх элементов, разделённых запятыми: первый&nbsp;элемент – записываемый в текущую ячейку символ алфавита (может&nbsp;совпадать с тем, который там уже записан). Второй элемент – один из&nbsp;четырёх символов «L», «R», «N», «S». Символы «L» и «R» означают сдвиг&nbsp;в левую или правую ячейки соответственно, «N» – отсутствие сдвига, «S» –&nbsp;завершение работы исполнителя МТ после выполнения текущей команды.</p><p>Сдвиг происходит после записи символа в текущую ячейку. Третий&nbsp;элемент – новое состояние головки после выполнения команды.</p><p><em>Например</em>, команда 0, L, q<sub>3</sub> выполняется следующим образом: в текущую ячейку записывается символ «0», затем головка сдвигается в соседнюю слева ячейку и переходит в состояние q<sub>3</sub>.</p><p>Приведём пример выполнения программы, заданной таблично.</p><p>На ленте записано неизвестное ненулевое количество расположенных подряд в соседних ячейках символов «Z», все остальные ячейки ленты заполнены пустым символом «λ». В начальный момент времени головка находится на неизвестном ненулевом расстоянии справа от самого правого символа «Z».</p><p>Программа</p><div class=\"tw\"><table><thead><tr><th style=\"background-color:#ffffff\">&nbsp;</th><th style=\"background-color:#ffffff\"><strong>λ</strong></th><th style=\"background-color:#ffffff\"><strong>Z</strong></th></tr></thead><tbody><tr><td><strong>q0</strong></td><td>λ, L, q<sub>0</sub></td><td>X, L, q<sub>1</sub></td></tr><tr><td><strong>q1</strong></td><td>λ, S, q<sub>1</sub></td><td>X, L, q<sub>1</sub></td></tr></tbody></table></div><p>заменяет на ленте все символы «Z» на «X» и останавливает исполнителя&nbsp;в первой ячейке слева от последовательности символов «X».</p><p>Возможное начальное состояние исполнителя:</p><div class=\"tw\"><table><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>▲ q<sub>0</sub></td><td>&nbsp;</td></tr><tr><td>...</td><td>λ</td><td>λ</td><td>Z</td><td>Z</td><td>Z</td><td>Z</td><td>λ</td><td>λ</td><td>...</td></tr></tbody></table></div><p>Конечное состояние исполнителя после завершения выполнения программы:</p><div class=\"tw\"><table><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>▲ q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>...</td><td>λ</td><td>λ</td><td>X</td><td>X</td><td>X</td><td>X</td><td>λ</td><td>λ</td><td>...</td></tr></tbody></table></div>"}]}, {"type": "video", "key": "d27t", "title": "Демоверсия 2027: как работает МТ (разбор вебинара)", "blocks": [{"t": "html", "v": "<h3>Задание № 12 из демоверсии ЕГЭ 2027</h3><p>Разберём, как работает Машина Тьюринга, на тексте демоверсии 2027 года: сначала описание исполнителя и пример, где все «Z» заменяются на «X», а в следующем шаге — само задание.</p><p><strong>Что изменилось по сравнению с 2026 годом:</strong> во втором элементе команды остались только «L», «R» и «S» — команды «N» (остаться на месте) больше нет. Пример с «Z» → «X» теперь использует три состояния.</p><p>Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов <strong>A = {a<sub>0</sub>, a<sub>1</sub>, …, a<sub>n–1</sub>}</strong>), включая специальный пустой символ <strong>a<sub>0</sub></strong>.</p><p>Время работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний <strong>Q = {q<sub>0</sub>, q<sub>1</sub>, …, q<sub>n–1</sub>}</strong>. В начальный момент времени головка находится в начальном состоянии <strong>q<sub>0</sub></strong>.</p><p>На каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт головка исполнителя может изменить символ в текущей ячейке и переместиться в соседнюю ячейку слева или справа от неё. После каждого такта головка переходит в новое состояние или остаётся в прежнем состоянии.</p><p>Программа работы исполнителя МТ задаётся в табличном виде.</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>a<sub>0</sub></strong></td><td><strong>a<sub>1</sub></strong></td><td><strong>…</strong></td><td><strong>a<sub>n–1</sub></strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>команда</td><td>команда</td><td>…</td><td>команда</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>команда</td><td>команда</td><td>…</td><td>команда</td></tr><tr><td><strong>…</strong></td><td>…</td><td>…</td><td>…</td><td>…</td></tr><tr><td><strong>q<sub>n–1</sub></strong></td><td>команда</td><td>команда</td><td>…</td><td>команда</td></tr></tbody></table></div><p>В первой строке перечислены все возможные символы в текущей ячейке ленты, в первом столбце — возможные состояния головки. На пересечении <em>i</em>-й строки и <em>j</em>-го столбца находится команда, которую выполняет МТ, когда головка обозревает <em>j</em>-й символ, находясь в <em>i</em>-м состоянии. Если пара «символ — состояние» невозможна, то клетка для команды остаётся пустой.</p><p>Каждая команда состоит из трёх элементов, разделённых запятыми: первый элемент — записываемый в текущую ячейку символ алфавита (может совпадать с тем, который там уже записан). Второй элемент — один из трёх символов «L», «R», «S». Символы «L» и «R» означают сдвиг в левую или правую ячейки соответственно, «S» — завершение работы исполнителя МТ после выполнения текущей команды. Сдвиг происходит после записи символа в текущую ячейку. Третий элемент — новое состояние головки после выполнения команды.</p><p><em>Например</em>, команда 0, L, q<sub>3</sub> выполняется следующим образом: в текущую ячейку записывается символ «0», затем головка сдвигается в соседнюю слева ячейку и переходит в состояние q<sub>3</sub
