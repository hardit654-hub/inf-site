>.</p><h3>Пример: замена «Z» на «X»</h3><p>На ленте записано неизвестное ненулевое количество расположенных подряд в соседних ячейках символов «Z», все остальные ячейки ленты заполнены пустым символом «λ». В начальный момент времени головка находится на неизвестном расстоянии справа от самого правого символа «Z».</p><p>Программа</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>Z</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>0</sub></td><td>X, L, q<sub>1</sub></td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>X, L, q<sub>2</sub></td></tr><tr><td><strong>q<sub>2</sub></strong></td><td>λ, S, q<sub>2</sub></td><td>X, L, q<sub>2</sub></td></tr></tbody></table></div><p>заменяет на ленте все символы «Z» на «X» и останавливает исполнителя в первой ячейке слева от последовательности символов «X».</p><p>Возможное начальное состояние исполнителя:</p><div class=\"tw\"><table><tbody><tr><td>…</td><td>λ</td><td>λ</td><td>Z</td><td>Z</td><td>Z</td><td>Z</td><td>λ</td><td>λ</td><td>…</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>▲ q<sub>0</sub></td><td>&nbsp;</td></tr></tbody></table></div><p>Конечное состояние исполнителя после завершения выполнения программы:</p><div class=\"tw\"><table><tbody><tr><td>…</td><td>λ</td><td>λ</td><td>X</td><td>X</td><td>X</td><td>X</td><td>λ</td><td>λ</td><td>…</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>▲ q<sub>2</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div>"}, {"t": "details", "title": "Пошаговое выполнение примера", "v": [{"t": "html", "v": "<p>Как читать программу: <strong>q<sub>0</sub></strong> идёт влево по пустым ячейкам, пока не встретит первый «Z»; <strong>q<sub>1</sub></strong> отвечает за второй «Z»; <strong>q<sub>2</sub></strong> заменяет все остальные «Z» и останавливается на первом «λ» слева.</p><table><thead><tr><td><strong>Такт</strong></td><td><strong>Состояние</strong></td><td><strong>Символ под головкой</strong></td><td><strong>Команда</strong></td></tr></thead><tbody><tr><td>1</td><td>q<sub>0</sub></td><td>λ</td><td>λ, L, q<sub>0</sub></td></tr><tr><td>2</td><td>q<sub>0</sub></td><td>λ</td><td>λ, L, q<sub>0</sub></td></tr><tr><td>3</td><td>q<sub>0</sub></td><td>Z</td><td>X, L, q<sub>1</sub></td></tr><tr><td>4</td><td>q<sub>1</sub></td><td>Z</td><td>X, L, q<sub>2</sub></td></tr><tr><td>5</td><td>q<sub>2</sub></td><td>Z</td><td>X, L, q<sub>2</sub></td></tr><tr><td>6</td><td>q<sub>2</sub></td><td>Z</td><td>X, L, q<sub>2</sub></td></tr><tr><td>7</td><td>q<sub>2</sub></td><td>λ</td><td>λ, S, q<sub>2</sub></td></tr></tbody></table><p>Всего 7 тактов. Головка остановилась в состоянии q<sub>2</sub> в первой ячейке слева от «XXXX».</p>"}]}]}, {"type": "fill", "key": "d27z", "blocks": [{"t": "html", "v": "<p><strong>Демоверсия ЕГЭ 2027, задание № 12.</strong></p><p>На ленте в соседних ячейках записано двоичное представление числа 2025 без ведущих нулей. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей справа к последовательности ячейке.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>1, L, q<sub>2</sub></td><td>0, L, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr><tr><td><strong>q<sub>2</sub></strong></td><td>λ, S, q<sub>2</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div><p>Определите результат выполнения программы. В ответе запишите получившееся число в десятичной системе счисления.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<p><strong>1. Что делает каждое состояние.</strong></p><ul><li><strong>q<sub>0</sub></strong>: головка стоит на «λ» справа от числа — оставляет «λ», сдвигается влево на последнюю цифру и переходит в q<sub>1</sub>.</li><li><strong>q<sub>1</sub></strong>: цифры 0 и 1 не меняет и идёт влево по всему числу. Дойдя до «λ» слева от числа, записывает туда <strong>1</strong> и переходит в q<sub>2</sub>.</li><li><strong>q<sub>2</sub></strong>: видит «λ» и останавливается.</li></ul><p><strong>2. Итог:</strong> программа приписывает к числу слева единицу.</p><p>2025 = 11111101001<sub>2</sub> (11 разрядов). После работы программы: 111111101001<sub>2</sub> = 2<sup>11</sup> + 2025 = 2048 + 2025 = <strong>4073</strong>.</p>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["4073"]]}, {"type": "choice", "blocks": [{"t": "html", "v": "<p>В задачах ЕГЭ в начальный момент времени Машина Тьюринга...</p>"}, {"t": "details", "title": "Пояснение", "v": [{"t": "html", "v": "<p>В демоверсии во втором абзаце ТЕОРИИ к задаче № 12 есть фраза: \"В начальный момент времени головка находится в начальном состоянии q<sub>0</sub>.\" Скорее всего на реальном ЕГЭ будет написано также, но лучше прочитать условие задачи целиком.</p>"}], "after": 1}], "options": ["находится в состоянии q0.", "находится в состоянии q2.", "находится в состоянии q1."], "answer": 0}, {"type": "match", "blocks": [{"t": "html", "v": "<p>Сопоставьте сокращения из номера 12 с их значениями.&nbsp;</p>"}], "items": ["L", "R", "S", "N", "λ", "МТ", "q<sub>1</sub>"], "options": ["Движение головки в ячейку справа.", "Обозначение состояния 1", "Обозначение пустого символа", "Движение головки в ячейку слева.", "Отсутствие движения головки", "Завершение программы", "Машина Тьюринга"], "answer": [3, 0, 5, 4, 2, 6, 1]}, {"type": "choice", "blocks": [{"t": "html", "v": "<p>Какая команда обозначает запись в ячейку единицы, перемещение налево и переход в состояние q3?</p>"}], "options": ["L, 1, q3", "q3, 1, L", "L, q3, 1", "q3, L, 1", "1, L, q3", "1, q3, L"], "answer": 4}, {"type": "choice", "blocks": [{"t": "html", "v": "<p>Что обозначает команда&nbsp;<code>0, S, q1</code>?</p>"}], "options": ["Сразу завершение программы.", "Запись в ячейку нуля и завершение программы."], "answer": 1}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только нули. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ».&nbsp;В начальный момент времени головка находится на неизвестном ненулевом расстоянии справа от самого правого символа «0».</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>0</sub></td><td>1, L, q<sub>1</sub></td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество&nbsp;единиц, которые будут находится на ленте после выполнения программы.</p><p><strong>🎬 Видеоразбор задачи находится на следующем шаге.</strong></p>"}, {"t": "details", "title": "Текстовое решение", "v": [{"t": "html", "v": "<h4>Шаг 1. Анализ таблицы</h4><p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><th>&nbsp;</th><th>λ</th><th>0</th></tr></thead><tbody><tr><td><strong>q₀</strong></td><td>λ, L, q₀</td><td>1, L, q₁</td></tr><tr><td><strong>q₁</strong></td><td>λ, S, q₁</td><td>1, L, q₁</td></tr></tbody></table></div><p><strong>Начальные условия:</strong></p><ul><li>Лента содержит последовательность из 1000 символов «0», окруженную пустыми символами «λ».</li><li>Головка находится справа от последовательности на символе «λ» в состоянии q₀.</li></ul><p><strong>Поведение программы:</strong></p><ul><li>В состоянии&nbsp;<strong>q₀</strong>: <ul><li>На «λ»: выполняется&nbsp;<code>λ, L, q₀</code>&nbsp;— головка сдвигается влево, состояние остаётся q₀.</li><li>На «0»: выполняется&nbsp;<code>1, L, q₁</code>&nbsp;— символ «0» заменяется на «1», головка сдвигается влево, переход в состояние q₁.</li></ul></li><li>В состоянии&nbsp;<strong>q₁</strong>: <ul><li>На «λ»: выполняется&nbsp;<code>λ, S, q₁</code>&nbsp;— программа завершается.</li><li>На «0»: выполняется&nbsp;<code>1, L, q₁</code>&nbsp;— символ «0» заменяется на «1», головка сдвигается влево, состояние остаётся q₁.</li></ul></li></ul><p><strong>Вывод:</strong>&nbsp;Программа движется справа налево по последовательности, заменяя все встреченные символы «0» на «1». Завершение программы происходит, когда головка достигает пустого символа «λ» слева от последовательности.</p><h4>Шаг 2. Ответ на вопрос задачи</h4><blockquote><p>Определите количество единиц, которые будут находится на ленте после выполнения программы.</p></blockquote><p>Исходная последовательность состоит из 1000 символов «0». Программа заменяет каждый символ «0» на «1». После выполнения программы на ленте будет находиться 1000 единиц.</p><p>Таким образом, количество единиц после выполнения программы равно&nbsp;<strong>1000</strong>.</p><h3>Ответ: 1000.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["1000"]]}, {"type": "video", "title": "Видеоразбор задачи"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;включающая только символы «Z». Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ».&nbsp;В начальный момент времени головка находится на неизвестном ненулевом расстоянии справа от самого правого символа «Z».</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>Z</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>0</sub></td><td>X, L, q<sub>1</sub></td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>X, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество&nbsp;символов «Z»,&nbsp;которые будут находится на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h3>Шаг 1. Анализ таблицы</h3><p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><th>&nbsp;</th><th>λ</th><th>Z</th></tr></thead><tbody><tr><td><strong>q₀</strong></td><td>λ, L, q₀</td><td>X, L, q₁</td></tr><tr><td><strong>q₁</strong></td><td>λ, S, q₁</td><td>X, L, q₁</td></tr></tbody></table></div><p><strong>Начальные условия:</strong></p><ul><li>Лента содержит последовательность из 1000 символов «Z», окруженную пустыми символами «λ».</li><li>Головка находится справа от последовательности на символе «λ» в состоянии q₀.</li></ul><p><strong>Поведение программы:</strong></p><ul><li>В состоянии&nbsp;<strong>q₀</strong>: <ul><li>На «λ»: выполняется&nbsp;<code>λ, L, q₀</code>&nbsp;— головка сдвигается влево, состояние остаётся q₀.</li><li>На «Z»: выполняется&nbsp;<code>X, L, q₁</code>&nbsp;— символ «Z» заменяется на «X», головка сдвигается влево, переход в состояние q₁.</li></ul></li><li>В состоянии&nbsp;<strong>q₁</strong>: <ul><li>На «λ»: выполняется&nbsp;<code>λ, S, q₁</code>&nbsp;— программа завершается.</li><li>На «Z»: выполняется&nbsp;<code>X, L, q₁</code>&nbsp;— символ «Z» заменяется на «X», головка сдвигается влево, состояние остаётся q₁.</li></ul></li></ul><p><strong>Вывод:</strong>&nbsp;Программа движется слева направо по последовательности, заменяя все встреченные символы «Z» на «X». Завершение программы происходит, когда головка достигает пустого символа «λ» слева от последовательности.</p><h3>Шаг 2. Ответ на вопрос задачи</h3><blockquote><p>Определите количество&nbsp;символов «Z»,&nbsp;которые будут находится на ленте после выполнения программы.</p></blockquote><p>Исходная последовательность состоит из 1000 символов «Z». Программа заменяет каждый символ «Z» на «X». После выполнения программы на ленте не останется ни одного символа «Z», так как все они были заменены на «X».</p><p>Таким образом, количество символов «Z» после выполнения программы равно&nbsp;<strong>0</strong>.</p><h3>Ответ: 0.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["0"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;состоящая из 999 нулей и одной единицы. Единица расположена на сотой позиции (нумерация позиций начинается с единицы). Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{99 \\text{ нуля}} \\;\\; 1 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество&nbsp;единиц,&nbsp;которые будут находится на ленте после выполнения программы.</p><p><strong>🎬 Видеоразбор задачи находится на следующем шаге.</strong></p>"}, {"t": "details", "title": "Текстовое решение", "v": [{"t": "html", "v": "<h3>Шаг 1. Анализ таблицы</h3><p>Рассмотрим внимательно таблицу команд исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Начальные условия:</p><ul><li>На ленте записано 999 нулей и одна единица, единица находится на <strong>сотой позиции</strong> (нумерация позиций начинается с единицы).</li><li>Головка расположена <strong>сразу справа от последовательности</strong> на символе <code>λ</code> в состоянии <code>q<sub>0</sub></code>.</li></ul><p><strong>Рассмотрим работу программы пошагово:</strong></p><p>В состоянии <code>q<sub>0</sub></code> на символе <code>λ</code>: команда <code>λ, L, q<sub>1</sub></code> — просто сдвигаемся влево к последнему символу последовательности, переходим в <code>q<sub>1</sub></code>.</p><p>Дальше работаем только в <code>q<sub>1</sub></code>:</p><ul><li>На <strong>нулях</strong>: <code>1, L, q<sub>1</sub></code> — ноль меняем на единицу, двигаемся влево.</li><li>На <strong>единице</strong>: <code>1, S, q<sub>1</sub></code> — записываем единицу (ничего не меняется), <strong>останавливаемся</strong>.</li><li>На <code>λ</code>: <code>λ, S, q<sub>1</sub></code> — если дошли до пустого символа, останавливаемся.</li></ul><p><strong>Вывод: </strong>Программа движется <strong>с конца последовательности влево</strong>, меняет все нули на единицы, пока не встретит первую единицу (сотую позицию). Как только встречает единицу, записывает единицу (ничего не меняет) и завершает работу. Все нули, которые были <strong>правее единицы</strong>, становятся единицами, а сама единица остаётся на месте. Нули, которые были <strong>левее</strong> единицы, не изменяются.</p><h3>Шаг 2. Ответ на вопрос задачи</h3><div class=\"cond\">Условие задачи:<br> На ленте в соседних ячейках записана последовательность из 1000 символов, состоящая из 999 нулей и одной единицы. Единица расположена на сотой позиции (нумерация позиций начинается с единицы). Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей ячейке справа от последовательности.<br><br> Программа: <div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div> Определите количество&nbsp;единиц,&nbsp;которые будут находится на ленте после выполнения программы.</div><p>До выполнения программы на ленте:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{99 \\text{ нуля}} \\;\\; 1 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><ul><li>Слева — 99 нулей</li><li>Потом единица (100‑я позиция)</li><li>Справа — 900 нулей</li></ul><p>После выполнения программы:</p><ul><li>Все 900 нулей <strong>правее</strong> единицы заменятся на единицы (900 шт.)</li><li>Единица останется единицей (1 шт.)</li><li>99 нулей <strong>слева</strong> от единицы останутся нулями (99 шт.)</li></ul><p>Итого на ленте будет:</p><ul><li><strong>99 нулей</strong> (до единицы)</li><li><strong>901 единица</strong> (единица + все бывшие нули после неё)</li></ul><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{99} \\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{901} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><h3>Ответ: 901.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["901"]]}, {"type": "video", "title": "Видеоразбор задачи"}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;состоящая из нулей и единиц. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{99 \\text{ нуля}} \\;\\; 1 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td><strong><span style=\"color:#ff4363\">0</strong>, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество&nbsp;единиц,&nbsp;которые будут находится на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h3>Шаг 1. Анализ таблицы</h3><p>Рассмотрим таблицу команд:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td><strong><span style=\"color:#ff4363\">0</strong>, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p><strong>Начальные условия:</strong></p><ul><li>На ленте: <span class=\"tex\">\\underbrace{0\\;0\\;\\ldots\\;0}_{99}\\;1\\;\\underbrace{0\\;0\\;\\ldots\\;0}_{900}</li><li>Головка в состоянии <code>q<sub>0</sub></code> сразу справа от последовательности, на символе <code>λ</code>.</li></ul><p><strong>Пошаговое выполнение:</strong></p><ol><li>В <code>q<sub>0</sub></code> на <code>λ</code> — сдвиг влево к последнему символу последовательности, переходим в <code>q<sub>1</sub></code>.</li><li>Далее работаем в <code>q<sub>1</sub></code>: <ul><li>На <strong>нуле</strong>: <code>1, L, q<sub>1</sub></code> — меняем ноль на единицу, двигаемся влево.</li><li>На <strong>единице</strong>: <strong><span style=\"color:#ff4363\">0</strong>, S, q<sub>1</sub> — заменяем единицу на ноль и <strong>останавливаемся</strong>.</li><li>На <code>λ</code>: <code>λ, S, q<sub>1</sub></code> — завершаем работу.</li></ul></li></ol><p><strong>Программа идёт с конца слова влево:</strong></p><ul><li>Меняет все нули на единицы, пока не встретит первую единицу.</li><li>Как только встретит единицу — меняет её на ноль и останавливается.</li></ul><h3>Шаг 2. Ответ на вопрос задачи</h3><p>До выполнения программы:</p><p><span class=\"tex\">\\ldots \\lambda\\; \\lambda\\; \\underbrace{0\\,0\\,\\ldots\\,0}_{99}\\; 1\\; \\underbrace{0\\,0\\,\\ldots\\,0}_{900}\\; \\lambda\\; \\lambda \\ldots</p><ul><li>Слева: 99 нулей</li><li>Далее: единица (100-я позиция)</li><li>Справа: 900 нулей</li></ul><p>Программа движется справа налево:</p><ul><li>900 нулей после единицы заменяются на единицы (900 штук).</li><li>Когда доходит до единицы (100-я позиция), <strong>заменяет её на ноль</strong> и останавливается.</li><li>99 нулей слева от этой позиции не изменяются.</li></ul><p>Итак, после выполнения программы:</p><ul><li><strong>99 нулей</strong> (слева, не изменились)</li><li><strong>0</strong> (там, где была единица, стал&nbsp;ноль)</li><li><strong>900 единиц</strong> (бывшие нули справа от бывшей единицы)</li></ul><p><span class=\"tex\">\\ldots \\lambda\\; \\lambda\\; \\underbrace{0\\,0\\,\\ldots\\,0}_{99}\\; 0\\; \\underbrace{1\\,1\\,\\ldots\\,1}_{900}\\; \\lambda\\; \\lambda \\ldots</p><p>Ответ — <strong>900</strong> единиц будет на ленте после выполнения программы.</p><h3>Ответ: 900.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["900"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;состоящая из нулей и единиц. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 0\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество&nbsp;единиц,&nbsp;которые будут находится на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h2>Решение</h2><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p><strong>Анализ работы исполнителя:</strong></p><ul><li>В начальный момент головка находится на <code>λ</code> справа от последовательности в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на <code>λ</code> выполняется <code>λ, L, q<sub>1</sub></code> — головка просто сдвигается влево к последнему символу слова и переходит в состояние <code>q<sub>1</sub></code>.</li><li>Далее исполнитель будет работать только в состоянии <code>q<sub>1</sub></code>: <ul><li>На <code>0</code> — выполняется <code>1, L, q<sub>1</sub></code>: ноль меняется на единицу, сдвиг влево.</li><li>На <code>1</code> — выполняется <code>0, S, q<sub>1</sub></code>: единица меняется на ноль, программа завершает работу.</li><li>На <code>λ</code> — выполняется <code>λ, S, q<sub>1</sub></code>: программа завершает работу.</li></ul></li></ul><p><strong>Вывод:</strong><br> МТ движется по последовательности справа налево. Пока встречает нули — превращает их в единицы. Как только встречает первую единицу — заменяет её на ноль и завершает работу.</p><h3><strong>Шаг 2. Ответ на вопрос задачи</strong></h3><blockquote><p>Определите количество&nbsp;единиц,&nbsp;которые будут находится на ленте после выполнения программы.</p></blockquote><p>Рассмотрим работу алгоритма на данном примере:</p><p><span class=\"tex\">\\ldots \\lambda\\,\\lambda\\, 1\\,1\\, \\underbrace{0\\,0\\,\\ldots\\,0}_{95}\\, 1\\, 0\\, 1\\, \\underbrace{0\\,0\\,\\ldots\\,0}_{900}\\, \\lambda\\,\\lambda\\,\\ldots</p><p><strong>1. </strong>Головка становится на последний символ последовательности (самый правый <code>0</code> в хвосте из 900 нулей).</p><ul><li>Пока видит нули — превращает их в единицы и идёт влево.</li><li>Как только встретит <code>1</code> — меняет её&nbsp;на <code>0</code> и останавливается.</li></ul><p><strong>2.&nbsp;</strong>Машина Тьюринга обрабатывает последовательность так:</p><ul><li>Все нули в хвосте (900 штук) — превращаются в единицы.</li><li>Следующий символ слева — <code>1</code> (в 901-й позиции с конца) — он превращается в <code>0</code> и <strong>работа завершается</strong>.</li><li>Все символы левее этой позиции остаются без изменений.</li></ul><p>Стартовое положение:</p><p><span class=\"tex\">\\lambda\\,\\lambda\\, 1\\,1\\, \\underbrace{0\\,0\\,\\ldots\\,0}_{95}\\, 1\\, 0\\, 1\\, \\underbrace{0\\,0\\,\\ldots\\,0}_{900}\\, \\lambda\\,\\lambda</p><p>Финальное положение:</p><p><span class=\"tex\">\\lambda\\,\\lambda\\, 1\\,1\\, \\underbrace{0\\,0\\,\\ldots\\,0}_{95}\\, 1\\, 0\\, 0\\, \\underbrace{1\\,1\\,\\ldots\\,1}_{900}\\, \\lambda\\,\\lambda</p><p><strong>Ответ: </strong><strong>903</strong><strong style=\"color:#0070c0\"><strong>.</strong></strong></p>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["903"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;состоящая из нулей и единиц. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 0\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><span style=\"color:#ff4363\"><strong>0</strong></td><td><span style=\"color:#ff4363\"><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество&nbsp;<strong>нулей</strong>,&nbsp;которые будут находится на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h2>Решение</h2><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><span style=\"color:#ff4363\"><strong>0</strong></td><td><span style=\"color:#ff4363\"><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p><strong>Анализ работы исполнителя:</strong></p><ul><li>В начальный момент головка находится на <code>λ</code> справа от последовательности в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на <code>λ</code> выполняется <code>λ, L, q<sub>1</sub></code> — головка просто сдвигается влево к последнему символу последовательности и переходит в состояние <code>q<sub>1</sub></code>.</li><li>Далее исполнитель будет работать только в состоянии <code>q<sub>1</sub></code>: <ul><li>На <span style=\"color:#ff4363\"><code>0</code> — выполняется <span style=\"color:#ff4363\"><code>0, S, q<sub>1</sub></code>: ноль <strong>не изменяется</strong>, и программа завершается.</li><li>На <span style=\"color:#ff4363\"><code>1</code> — выполняется <span style=\"color:#ff4363\"><code>1, L, q<sub>1</sub></code>: единица <strong>не изменяется</strong>, сдвиг влево.</li><li>На <code>λ</code> — выполняется <code>λ, S, q<sub>1</sub></code>: программа завершает работу.</li></ul></li></ul><p><strong>Вывод:</strong><br> МТ идёт <strong>с конца слова влево</strong>. Пока встречает единицы — просто идёт влево, <strong>ничего не меняя</strong>. Как только встречает первый <strong>ноль</strong> (двигаясь справа налево), программа <strong>останавливается</strong> (на этом же месте, не меняя этот ноль). Все остальные символы (левее этого нуля) остаются неизменными.</p><h3><strong>Шаг 2. Ответ на вопрос задачи</strong></h3><blockquote><p>Определите количество <strong>нулей</strong>, которые будут находится на ленте после выполнения программы.</p></blockquote><p>Разберём работу алгоритма на данном примере:</p><p><span class=\"tex\">\\ldots \\lambda\\, \\lambda\\, 1\\,1\\, \\underbrace{0\\,0\\,\\ldots\\,0}_{95}\\, 1\\, 0\\, 1\\, \\underbrace{0\\,0\\,\\ldots\\,0}_{900}\\, \\lambda\\,\\lambda\\,\\ldots</p><ul><li>Головка становится на последний символ последовательности (самый правый из 900 нулей).</li><li>МТ идёт влево, пока видит <strong>единицы</strong>, но справа только нули, поэтому сразу попадает на <strong>0</strong> (на самой правой позиции последовательности).</li><li>Сразу останавливается — <strong>ни один символ не изменился</strong>!</li></ul><p>Значит, <strong>после работы программы вся лента остаётся без изменений</strong>. Нужно просто посчитать количество нулей в исходной последовательности.</p><h4>Подсчёт нулей в исходной последовательности:</h4><ul><li>В начале: 95 нулей</li><li>Далее идут: 1, 0, 1 (только <strong>один ноль</strong> из этих трёх символов)</li><li>В конце: 900 нулей</li></ul><p>Всего:</p><p><strong>95 + 1 + 900 = 996</strong></p><h3>Ответ: 996.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["996"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;состоящая из нулей и единиц. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 0\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество&nbsp;<strong>нулей</strong>,&nbsp;которые будут находится на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h2>Решение</h2><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p><strong>Анализ работы исполнителя:</strong></p><ul><li>В начальный момент головка находится на <code>λ</code> справа от последовательности в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на <code>λ</code> выполняется <code>λ, L, q<sub>1</sub></code> — головка просто сдвигается влево к последнему символу слова и переходит в состояние <code>q<sub>1</sub></code>.</li><li>Далее исполнитель работает только в состоянии <code>q<sub>1</sub></code>: <ul><li>На <code>0</code> — выполняется <code>1, L, q<sub>1</sub></code>: ноль меняется на единицу, сдвиг влево.</li><li>На <code>1</code> — выполняется <code>0, L, q<sub>1</sub></code>: единица меняется на ноль, сдвиг влево.</li><li>На <code>λ</code> — выполняется <code>λ, S, q<sub>1</sub></code>: программа завершает работу.</li></ul></li></ul><p><strong>Вывод:</strong><br> МТ идёт по всей последовательности с конца влево, и каждый символ заменяет: если был <strong>0</strong>, то становится <strong>1</strong>, если была <strong>1</strong> — становится <strong>0</strong>. Таким образом, <strong>каждый ноль становится единицей, каждая единица становится нулём</strong>. Программа полностью инвертирует все символы на ленте.</p><h3><strong>Шаг 2. Стартовое и финальное положение</strong></h3><p><strong>Стартовое положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95} \\; 1\\; 0\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900} \\; \\lambda \\;\\lambda\\;\\ldots</p><p><strong>Финальное положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 0\\;0 \\; \\underbrace{1\\;1\\;\\ldots\\;1}_{95} \\; 0\\; 1\\; 0 \\; \\underbrace{1\\;1\\;\\ldots\\;1}_{900} \\; \\lambda \\;\\lambda \\;\\ldots</p><h3><strong>Шаг 3. Подсчёт количества нулей</strong></h3><ul><li>В начале: 4 единицы и 996 нулей.</li><li>После работы: 4 нуля (все исходные единицы превратились в нули), 996 единиц (все исходные нули превратились в единицы).</li></ul><p><strong>Ответ:</strong><strong>4.</strong></p>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["4"]]}]}, {"num": "42.2", "title": "Простые задачки", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>Содержание урока</h2><p>В текущем уроке мы порешаем простые подготовительные задачи.</p>"}]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;состоящая из нулей и единиц. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 0\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество&nbsp;<strong>нулей</strong>,&nbsp;которые будут находится на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h2>Решение</h2><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p><strong>Анализ работы исполнителя:</strong></p><ul><li>В начальный момент головка находится на <code>λ</code> справа от последовательности в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на <code>λ</code> выполняется <code>λ, L, q<sub>1</sub></code> — головка просто сдвигается влево к последнему символу слова и переходит в состояние <code>q<sub>1</sub></code>.</li><li>Далее исполнитель работает только в состоянии <code>q<sub>1</sub></code>: <ul><li>На <code>0</code> — выполняется <code>0, L, q<sub>1</sub></code>: ноль остается нулём, сдвиг влево.</li><li>На <code>1</code> — выполняется <code>0, L, q<sub>1</sub></code>: единица заменяется на ноль, сдвиг влево.</li><li>На <code>λ</code> — выполняется <code>λ, S, q<sub>1</sub></code>: программа завершает работу.</li></ul></li></ul><p><strong>Вывод:</strong><br> МТ движется по последовательности справа налево. Все <strong>единицы</strong> заменяются на <strong>нули</strong>, а <strong>нули</strong> остаются без изменений.</p><h3><strong>Шаг 2. Запишем стартовое и финальное положение</strong></h3><p><strong>Стартовое положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; \\mathbf{1}\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95}\\; \\mathbf{1}\\; 0\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900}\\; \\lambda\\; \\lambda\\; \\ldots</p><p>Головка стартует на ближайшем <code>λ</code> справа от последовательности, в состоянии <code>q<sub>0</sub></code>.</p><p><strong>Описание работы программы:</strong></p><ul><li>Переходит влево к последнему символу (становится на последний <code>0</code>).</li><li>Двигаясь влево, если видит <code>0</code> — оставляет ноль, идёт влево.</li><li>Если встречает <code>1</code> — заменяет её на <code>0</code>, идёт влево.</li><li>Когда доходит до <code>λ</code> слева — программа завершает работу.</li></ul><p><strong>Финальное положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 0\\; 0\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95}\\; 0\\; 0\\; 0\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900}\\; \\lambda\\; \\lambda\\; \\ldots</p><p>Все единицы превратились в нули.</p><h3><strong>Шаг 3. Ответ на вопрос задачи</strong></h3><blockquote><p>Определите количество <strong>нулей</strong>, которые будут находиться на ленте после выполнения программы.</p></blockquote><p>Все 1000 символов стали нулями.</p><h3><strong>Ответ:</strong><strong>1000.</strong></h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["1000"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 2\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество&nbsp;<strong>нулей</strong>,&nbsp;которые будут находится на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h2>Решение</h2><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p><strong>Анализ работы исполнителя:</strong></p><ul><li>В начальный момент головка находится на <code>λ</code> справа от последовательности в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на <code>λ</code> выполняется <code>λ, L, q<sub>1</sub></code> — головка просто сдвигается влево к последнему символу слова и переходит в состояние <code>q<sub>1</sub></code>.</li><li>Далее исполнитель работает только в состоянии <code>q<sub>1</sub></code>: <ul><li>На <code>0</code> — выполняется <code>1, L, q<sub>1</sub></code>: ноль заменяется на единицу, сдвиг влево.</li><li>На <code>1</code> — выполняется <code>2, L, q<sub>1</sub></code>: единица заменяется на двойку, сдвиг влево.</li><li>На <code>2</code> — выполняется <code>0, L, q<sub>1</sub></code>: двойка заменяется на ноль, сдвиг влево.</li><li>На <code>λ</code> — выполняется <code>λ, S, q<sub>1</sub></code>: программа завершает работу.</li></ul></li></ul><p><strong>Вывод:</strong><br> МТ движется по последовательности справа налево, циклически изменяя символы: 0 → 1, 1 → 2, 2 → 0. Процесс продолжается до тех пор, пока головка не достигнет пустого символа <code>λ</code> слева от последовательности.</p><h3><strong>Шаг 2. Запишем стартовое и финальное положение</strong></h3><p><strong>Стартовое положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; \\mathbf{1}\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95}\\; \\mathbf{1}\\; \\mathbf{2}\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900}\\; \\lambda\\; \\lambda\\; \\ldots</p><p>Головка стартует на ближайшем <code>λ</code> справа от последовательности, в состоянии <code>q<sub>0</sub></code>.</p><p><strong>Описание работы программы:</strong></p><ul><li>Переходит влево к последнему символу (становится на последний <code>0</code> в хвосте из 900 нулей).</li><li>Двигаясь влево, последовательно применяет преобразования: <ul><li>0 → 1</li><li>1 → 2</li><li>2 → 0</li></ul></li><li>Когда доходит до <code>λ</code> слева — программа завершает работу.</li></ul><p>Каждый символ в последовательности претерпевает изменение. Поскольку программа проходит всю последовательность справа налево, каждому символу будет применено одно преобразование.</p><p><strong>Финальное положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; \\mathbf{2}\\; \\mathbf{2}\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{95}\\; \\mathbf{2}\\; \\mathbf{0}\\; \\mathbf{2}\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{900}\\; \\lambda\\; \\lambda\\; \\ldots</p><ul><li>Все исходные нули стали единицами.</li><li>Все исходные единицы стали двойками.</li><li>Все исходные двойки стали нулями.</li></ul><h3><strong>Шаг 3. Ответ на вопрос задачи</strong></h3><blockquote><p>Определите количество <strong>нулей</strong>, которые будут находиться на ленте после выполнения программы.</p></blockquote><p>Нули в финальной последовательности появляются только из исходных двоек. В стартовой последовательности только один символ <code>2</code>.</p><p>Следовательно, количество нулей после выполнения программы равно <strong>1</strong>.</p><h3><strong>Ответ: 1.</strong></h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["1"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 2\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите сумму цифр,&nbsp;находящихся&nbsp;на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h2>Решение</h2><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p><strong>Анализ работы исполнителя:</strong></p><ul><li>В начальный момент головка находится на <code>λ</code> справа от последовательности в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на <code>λ</code> выполняется <code>λ, L, q<sub>1</sub></code> — головка просто сдвигается влево к последнему символу слова и переходит в состояние <code>q<sub>1</sub></code>.</li><li>Далее исполнитель работает только в состоянии <code>q<sub>1</sub></code>: <ul><li>На <code>0</code> — выполняется <code>1, L, q<sub>1</sub></code>: ноль заменяется на единицу, сдвиг влево.</li><li>На <code>1</code> — выполняется <code>2, L, q<sub>1</sub></code>: единица заменяется на двойку, сдвиг влево.</li><li>На <code>2</code> — выполняется <code>0, L, q<sub>1</sub></code>: двойка заменяется на ноль, сдвиг влево.</li><li>На <code>λ</code> — выполняется <code>λ, S, q<sub>1</sub></code>: программа завершает работу.</li></ul></li></ul><p><strong>Вывод:</strong><br> МТ движется по последовательности справа налево, заменяя цифры (0 → 1, 1 → 2, 2 → 0). Работа завершается, когда головка достигает пустого символа «λ» слева от последовательности.</p><h3><strong>Шаг 2. Ответ на вопрос задачи</strong></h3><blockquote><p>Определите сумму цифр, находящихся на ленте после выполнения программы.</p></blockquote><p><strong>Стартовое положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; \\mathbf{1}\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95}\\; \\mathbf{1}\\; \\mathbf{2}\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900}\\; \\lambda\\; \\lambda\\; \\ldots</p><p><strong>Описание работы программы:</strong></p><ul><li>Программа начинает обход последовательности справа налево.</li><li>Каждая цифра преобразуется по правилу: 0 → 1, 1 → 2, 2 → 0.</li><li>Преобразование затрагивает <strong>все 1000 символов</strong> последовательности.</li></ul><p><strong>Финальное положение:</strong><br> После применения преобразования ко всем символам исходной последовательности получаем:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; \\mathbf{2}\\; \\mathbf{2}\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{95}\\; \\mathbf{2}\\; \\mathbf{0}\\; \\mathbf{2}\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{900}\\; \\lambda\\; \\lambda\\; \\ldots</p><p><strong>Подсчет суммы цифр:</strong></p><p>&nbsp;<span class=\"tex\">2 + 2 + 1*95 + 2 + 2 + 1*900 = 1003</p><h3><strong>Ответ: 1003.</strong></h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["1003"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 2\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>1, S, q<sub>1</sub></td></tr></tbody></table></div><p>Определите сумму цифр,&nbsp;находящихся&nbsp;на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h2>Решение</h2><p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>2, L, q<sub>1</sub></td><td>1, S, q<sub>1</sub></td></tr></tbody></table></div><p><strong>Анализ работы исполнителя:</strong></p><p>МТ движется по последовательности справа налево. Она заменяет символы по следующему правилу: 0 → 1, 1 → 2. При встрече символа 2 она заменяет его на 1 и немедленно завершает работу.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 2\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Финальное положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 1\\; 2 \\; \\underbrace{1\\;1\\;\\ldots\\;1}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа завершила своё выполнение при встрече двойки.</p><p>Сумма цифр:</p><p><span class=\"tex\">(1 + 1) + (1 + 1 + 2) + 1*900 = 906</p><h3>Ответ: 906.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["906"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;состоящая из нулей и единиц. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 0\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, <span style=\"color:#ff4363\">q<sub>0</sub></td><td>1, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество&nbsp;<strong>нулей</strong>,&nbsp;которые будут находится на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h2>Решение</h2><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>0</sub></td><td>1, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p><strong>Анализ работы исполнителя:</strong></p><ul><li>В начальный момент головка находится на <code>λ</code> справа от последовательности в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code>: <ul><li>На <code>λ</code> — выполняется <code>λ, L, q<sub>0</sub></code>: головка сдвигается влево, остается в состоянии <code>q<sub>0</sub></code>.</li><li>На <code>0</code> — выполняется <code>1, L, q<sub>1</sub></code>: ноль заменяется на единицу, сдвиг влево, переход в состояние <code>q<sub>1</sub></code>.</li><li>На <code>1</code> — выполняется <code>0, L, q<sub>1</sub></code>: единица заменяется на ноль, сдвиг влево, переход в состояние <code>q<sub>1</sub></code>.</li></ul></li><li>В состоянии <code>q<sub>1</sub></code>: <ul><li>На <code>λ</code> — выполняется <code>λ, S, q<sub>1</sub></code>: программа завершает работу.</li><li>На <code>0</code> — выполняется <code>0, L, q<sub>1</sub></code>: ноль остается нулём, сдвиг влево.</li><li>На <code>1</code> — выполняется <code>0, L, q<sub>1</sub></code>: единица заменяется на ноль, сдвиг влево.</li></ul></li></ul><p><strong>Вывод:</strong><br> МТ сначала движется по пустым символам <code>λ</code> влево до начала последовательности. Когда встречает первый символ (0 или 1) последовательности, выполняет инверсию (0 → 1, 1 → 0) и переходит в состояние <code>q<sub>1</sub></code>. Затем движется влево по всей последовательности, заменяя все единицы на нули, нули оставляя без изменений. Завершает работу, когда доходит до пустого символа слева.</p><h3><strong>Шаг 2. Запишем стартовое и финальное положение</strong></h3><p><strong>Стартовое положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; \\mathbf{1}\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95}\\; \\mathbf{1}\\; 0\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900}\\; \\lambda\\; \\lambda\\; \\ldots</p><p>Головка <strong>стартует</strong> на ближайшем <code>λ</code> справа от последовательности, в состоянии <code>q<sub>0</sub></code>.</p><p><strong>Описание работы программы:</strong></p><ul><li>Головка наступает на последний символ последовательности.</li><li>Последний&nbsp;<code>0</code>&nbsp;заменяет на <code>1</code> и переходит в состояние <code>q<sub>1</sub></code>.</li><li>Далее движется влево по всей последовательности: <ul><li>Все нули оставляет без изменений.</li><li>Все единицы заменяет на нули.</li></ul></li><li>Завершает работу, дойдя до пустого символа слева от последовательности.</li></ul><p><strong>Финальное положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 0\\; 0\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95}\\; 0\\; 0\\; 0\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{899}\\; 1\\; \\lambda\\; \\lambda\\; \\ldots</p><p>Все единицы исходной последовательности превратились в нули, кроме последнего символа (самого правого нуля), который стал единицей.</p><h3><strong>Шаг 3. Ответ на вопрос задачи</strong></h3><blockquote><p>Определите количество <strong>нулей</strong>, которые будут находиться на ленте после выполнения программы.</p></blockquote><p>В финальном положении содержится одна единица и 999 нулей.</p><h3><strong>Ответ: 999.</strong></h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["999"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;состоящая из нулей и единиц. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 0\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>0</sub></td><td>1, L, q<sub>0</sub></td><td>0, L, q<sub>1</sub></td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество&nbsp;<strong>нулей</strong>,&nbsp;которые будут находится на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h2>Решение</h2><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>0</sub></td><td>1, L, q<sub>0</sub></td><td>0, L, q<sub>1</sub></td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td></tr></tbody></table></div><p><strong>Анализ работы исполнителя:</strong></p><ul><li>В начальный момент головка находится на <code>λ</code> справа от последовательности в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code>: <ul><li>На <code>λ</code>: выполняется <code>λ, L, q<sub>0</sub></code> — головка сдвигается влево, состояние остаётся <code>q<sub>0</sub></code>.</li><li>На <code>0</code>: выполняется <code>1, L, q<sub>0</sub></code> — ноль заменяется на единицу, сдвиг влево, состояние остаётся <code>q<sub>0</sub></code>.</li><li>На <code>1</code>: выполняется <code>0, L, q<sub>1</sub></code> — единица заменяется на ноль, сдвиг влево, переход в состояние <code>q<sub>1</sub></code>.</li></ul></li><li>В состоянии <code>q<sub>1</sub></code>: <ul><li>На <code>λ</code>: выполняется <code>λ, S, q<sub>1</sub></code> — программа завершает работу.</li><li>На <code>0</code>: выполняется <code>0, L, q<sub>1</sub></code> — ноль остаётся без изменений, сдвиг влево.</li><li>На <code>1</code>: выполняется <code>1, L, q<sub>1</sub></code> — единица остаётся без изменений, сдвиг влево.</li></ul></li></ul><p><strong>Вывод:</strong><br> МТ движется по последовательности справа налево. В состоянии <code>q<sub>0</sub></code> она инвертирует биты (0→1, 1→0) и продолжает движение влево.</p><p>При встрече первой единицы (которая заменяется на 0) происходит переход в состояние <code>q<sub>1</sub></code>, после чего все оставшиеся символы (и нули, и единицы) остаются без изменений.</p><p>Программа завершается при достижении пустого символа <code>λ</code> слева от последовательности.</p><h3><strong>Шаг 2. Применение алгоритма к данной последовательности</strong></h3><p><strong>Стартовое положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95}\\; 1\\; 0\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900}\\; \\lambda\\; \\lambda\\; \\ldots</p><p><strong>Описание работы:</strong></p><ol><li>Головка наступает на последний символ последовательности.</li><li>Начинается обработка последовательности справа налево в состоянии <code>q<sub>0</sub></code>: <ul><li>Все 900 нулей в хвосте последовательности заменяются на единицы (команда <code>1, L, q<sub>0</sub></code>).</li><li>Следующий символ — <code>1</code> (выделен жирным). Выполняется команда <code>0, L, q<sub>1</sub></code>: эта единица заменяется на <code>0</code>, и происходит переход в состояние <code>q<sub>1</sub></code>.</li></ul></li><li>Далее обработка продолжается в состоянии <code>q<sub>1</sub></code>: <ul><li>В состоянии q1 головка едет влево не изменяя символов.</li></ul></li><li>При достижении <code>λ</code> программа завершается.</li></ol><p><strong>Финальное положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\; 1\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95}\\; 1\\; 0\\; 0\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{900}\\; \\lambda\\; \\lambda\\; \\ldots</p><blockquote><p>Определите количество&nbsp;<strong>нулей</strong>,&nbsp;которые будут находится на ленте после выполнения программы.</p></blockquote><h3><strong>Ответ: 97.</strong></h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["97"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;состоящая из нулей и единиц. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке справа&nbsp;от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 0\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>0</sub></td><td>0, L, q<sub>0</sub></td><td>1, L, q<sub>1</sub></td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество <strong>единиц</strong>,&nbsp;которые будут находится на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, L, q<sub>0</sub></td><td>0, L, q<sub>0</sub></td><td>1, L, q<sub>1</sub></td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, L, q<sub>1</sub></td><td>0, L, q<sub>1</sub></td></tr></tbody></table></div><h3>Анализ работы исполнителя:</h3><ul><li>В начальный момент головка находится на <code>λ</code> справа от последовательности в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code>: <ul><li>На <code>λ</code>: выполняется <code>λ, L, q<sub>0</sub></code> — головка сдвигается влево, состояние остается q<sub>0</sub>.</li><li>На <code>0</code>: выполняется <code>0, L, q<sub>0</sub></code> — ноль остается без изменений, сдвиг влево.</li><li>На <code>1</code>: выполняется <code>1, L, q<sub>1</sub></code> — единица остается без изменений, сдвиг влево, переход в состояние q<sub>1</sub>.</li></ul></li><li>В состоянии <code>q<sub>1</sub></code>: <ul><li>На <code>λ</code>: выполняется <code>λ, S, q<sub>1</sub></code> — программа завершает работу.</li><li>На <code>0</code>: выполняется <code>1, L, q<sub>1</sub></code> — ноль заменяется на единицу, сдвиг влево.</li><li>На <code>1</code>: выполняется <code>0, L, q<sub>1</sub></code> — единица заменяется на ноль, сдвиг влево.</li></ul></li></ul><h3>Вывод:</h3><p>МТ движется по последовательности справа налево.</p><p>В состоянии q<sub>0</sub> она просто проходит через нули без изменений, пока не встретит первую единицу.</p><p>При встрече первой единицы МТ переходит в состояние q<sub>1</sub>&nbsp;(эту единицу не изменяет) и начинает инвертировать биты (0 → 1, 1 → 0) при движении влево.</p><p>Работа завершается при достижении пустого символа λ слева от последовательности.</p><h2>Ответ на вопрос задачи</h2><h3>Стартовое положение:</h3><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; \\mathbf{1}\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95}\\; \\mathbf{1}\\; 0\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900}\\; \\lambda\\; \\lambda\\; \\ldots</p><h3>Работа программы:</h3><ol><li>Двигается влево через 900 нулей (оставляя их без изменений в состоянии q<sub>0</sub>).</li><li>Встречает первую единицу (позиция 901 с конца) — переходит в состояние q<sub>1</sub>. Эту единицу не трогает.</li><li>Далее в состоянии q<sub>1</sub> инвертирует все встречаемые символы: <ul><li>0 → 1</li><li>1 → 0</li></ul></li><li>Проходит всю последовательность&nbsp;и завершает работу.</li></ol><h3>Финальное положение:</h3><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 0\\; 0\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{95}\\; 0\\; 1\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900}\\; \\lambda\\; \\lambda\\; \\ldots</p><p>Общее количество единиц после выполнения программы: <strong>95 + 1 + 1 = 97.</strong></p><h3>Ответ: 97.</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["97"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов,&nbsp;состоящая из нулей и единиц. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке <span style=\"color:#ff4363\"><strong>слева </strong>от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{99 \\text{ нуля}} \\;\\; 1 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, R, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td><strong>0</strong>, S, q<sub>1</sub></td><td>1, R, q<sub>1</sub></td></tr></tbody></table></div><p>Определите количество&nbsp;единиц,&nbsp;которые будут находится на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h2>Решение</h2><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>Программа задана таблицей:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>1</strong></td><td><strong>0</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, R, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>0, S, q<sub>1</sub></td><td>1, R, q<sub>1</sub></td></tr></tbody></table></div><p><strong>Анализ работы исполнителя:</strong></p><ul><li>В начальный момент головка находится на <code>λ</code><strong>слева</strong> от последовательности в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на <code>λ</code> выполняется <code>λ, R, q<sub>1</sub></code> — головка сдвигается <strong>вправо</strong> к первому символу слова и переходит в состояние <code>q<sub>1</sub></code>.</li><li>Далее исполнитель работает только в состоянии <code>q<sub>1</sub></code>: <ul><li>На <code>0</code> — выполняется <code>1, R, q<sub>1</sub></code>: ноль заменяется на единицу, сдвиг вправо.</li><li>На <code>1</code> — выполняется <code>0, S, q<sub>1</sub></code>: единица заменяется на ноль, <strong>программа завершает работу</strong>.</li><li>На <code>λ</code> — выполняется <code>λ, S, q<sub>1</sub></code>: программа завершает работу.</li></ul></li></ul><p><strong>Вывод:</strong><br> МТ движется по последовательности <strong>слева направо</strong>. Пока встречает нули — превращает их в единицы. Как только встречает первую единицу — заменяет её на ноль и завершает работу.</p><h3><strong>Шаг 2. Ответ на вопрос задачи</strong></h3><p><strong>Стартовое положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{99 \\text{ нуля}} \\;\\; 1 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p><strong>Работа программы:</strong></p><ul><li>Головка стартует на <code>λ</code> слева от последовательности, переходит вправо к первому символу (первому нулю).</li><li>Двигаясь вправо, она заменяет все нули на единицы.</li><li>Как только встречает первую единицу (на 100-й позиции) — заменяет её на ноль и останавливается.</li><li>Все символы правее этой позиции остаются без изменений.</li></ul><p><strong>Финальное положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\;\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{99 \\text{ единицы}} \\;\\; 0 \\;\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\;\\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Количество единиц после выполнения программы: <strong>99</strong>.</p><h3><strong>Ответ: 99.</strong></h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["99"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записана последовательность из 1000 символов. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный&nbsp;момент времени головка расположена в ближайшей ячейке <strong><span style=\"color:#ff4363\">слева </strong>от последовательности.</p><p>Стартовое положение:</p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 1\\;1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95 \\text{ нулей}} \\; 1\\; 2\\; 1 \\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900 \\text{ нулей}} \\; \\lambda \\;\\; \\lambda \\;\\ldots</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, R, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, R, q<sub>1</sub></td><td>2, R, q<sub>1</sub></td><td>1, S, q<sub>1</sub></td></tr></tbody></table></div><p>Определите сумму цифр,&nbsp;находящихся&nbsp;на ленте после выполнения программы.</p>"}, {"t": "details", "title": "Решение", "v": [{"t": "html", "v": "<h2>Решение</h2><h3><strong>Шаг 1. Анализ таблицы</strong></h3><p>Программа работы исполнителя задана таблицей:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td><td><strong>2</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, R, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, S, q<sub>1</sub></td><td>1, R, q<sub>1</sub></td><td>2, R, q<sub>1</sub></td><td>1, S, q<sub>1</sub></td></tr></tbody></table></div><ul><li>В начальный момент головка находится <strong>на λ <span style=\"color:#ff4363\">слева от последовательности</strong> в состоянии <code>q<sub>0</sub></code>.</li><li>В состоянии <code>q<sub>0</sub></code> на λ выполняется: <code>λ, R, q<sub>1</sub></code> — просто сдвиг <strong>вправо</strong> к первому символу последовательности, переход в состояние <code>q<sub>1</sub></code>.</li></ul><p>Далее МТ работает только в состоянии <code>q<sub>1</sub></code>:</p><ul><li>На λ: <code>λ, S, q<sub>1</sub></code> — завершение работы.</li><li>На <strong>0</strong>: <code>1, R, q<sub>1</sub></code> — заменяет 0 на 1, движется вправо.</li><li>На <strong>1</strong>: <code>2, R, q<sub>1</sub></code> — заменяет 1 на 2, движется вправо.</li><li>На <strong>2</strong>: <code>1, S, q<sub>1</sub></code> — заменяет 2 на 1, <strong>завершает работу</strong>.</li></ul><p><strong>Что делает программа?</strong></p><ul><li>Головка проходит последовательность слева направо, меняя: <ul><li>Все <strong>нули</strong> — на <strong>единицы</strong>.</li><li>Все <strong>единицы</strong> — на <strong>двойки</strong>.</li></ul></li><li>Как только встречает <strong>двойку</strong> — заменяет ее на <strong>единицу</strong> и <strong>завершает работу</strong>.</li></ul><h3><strong>Шаг 2. Применяем программу к данной ленте</strong></h3><p><strong>Стартовое положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; \\mathbf{1}\\;\\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{95}\\; \\mathbf{1}\\; \\mathbf{2}\\; \\mathbf{1}\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900}\\; \\lambda \\; \\lambda \\; \\ldots</p><p><strong>Финальное положение:</strong></p><p><span class=\"tex\">\\ldots \\; \\lambda \\; \\lambda\\; 2\\;2\\; \\underbrace{1\\;1\\;\\ldots\\;1}_{95}\\; 2\\; 1\\; 1\\; \\underbrace{0\\;0\\;\\ldots\\;0}_{900}\\; \\lambda \\; \\lambda \\; \\ldots</p><h3><strong>Шаг 3. Считаем сумму цифр</strong></h3><p>Посчитаем сумму:</p><p><span class=\"tex\">2 + 2 + 95 + 2 + 1 + 1 = 103</p><h3><strong>Ответ:</strong> 103</h3>"}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["103"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>(ЕГЭ 2026) На ленте в соседних ячейках записано двоичное представление числа 2025 без ведущих нулей. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей справа к последовательности ячейке.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><th>&nbsp;</th><th>λ</th><th>0</th><th>1</th></tr></thead><tbody><tr><td>q0</td><td>λ, L, q1</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>q1</td><td>λ, R, q2</td><td>0, L, q1</td><td>1, L, q1</td></tr><tr><td>q2</td><td>&nbsp;</td><td>&nbsp;</td><td>0, L, q3</td></tr><tr><td>q3</td><td>1, S, q3</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div><p>Определите результат выполнения программы. В ответе запишите получившееся число в десятичной системе счисления.</p><p>Разбор похожей задачи:&nbsp;<a href=\"https://stepik.org/lesson/2428910/step/8\">https://stepik.org/lesson/2428910/step/8</a>&nbsp;<br> Таймкод 5:12.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["3049"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>На ленте в соседних ячейках записано двоичное представление числа 2027 без ведущих нулей. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей слева к последовательности ячейке.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><th>&nbsp;</th><th>λ</th><th>0</th><th>1</th></tr></thead><tbody><tr><td>q0</td><td>λ, R, q1</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>q1</td><td>1, R, q2</td><td>0, R, q1</td><td>1, R, q1</td></tr><tr><td>q2</td><td>1, R, q3</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>q3</td><td>λ, S, q3</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div><p>Определите результат работы программы. В ответе запишите получившееся на ленте число в десятичной системе счисления.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["8111"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>(ЕГКР) На ленте в соседних ячейках записано двоичное представление числа 2021 без ведущих нулей. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей слева от последовательности ячейке.</p><p>Программа работы исполнителя:</p><div class=\"tw\"><table><thead><tr><td>&nbsp;</td><td><strong>λ</strong></td><td><strong>0</strong></td><td><strong>1</strong></td></tr></thead><tbody><tr><td><strong>q<sub>0</sub></strong></td><td>λ, R, q<sub>1</sub></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong>q<sub>1</sub></strong></td><td>λ, L, q<sub>2</sub></td><td>0, R, q<sub>1</sub></td><td>1, R, q<sub>1</sub></td></tr><tr><td><strong>q<sub>2</sub></strong></td><td>&nbsp;</td><td>λ, L, q<sub>3</sub></td><td>λ, L, q<sub>3</sub></td></tr><tr><td><strong>q<sub>3</sub></strong></td><td>&nbsp;</td><td>λ, S, q<sub>3</sub></td><td>1, S, q<sub>3</sub></td></tr></tbody></table></div><p>Определите результат работы программы. В ответе запишите получившееся на ленте число в десятичной системе счисления.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["505"]]}]}, {"num": "42.3", "title": "Простые задачки", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>Содержание урока</h2><p>В текущем уроке мы порешаем простые подготовительные задачи, в которых неизвестна стартовая строка.</p>"}]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>(ЕГЭ 2026) На ленте в соседних ячейках записано двоичное представление числа 1514 без ведущих нулей. Ячейки справа и слева&nbsp;от последовательности заполнены пустыми символами «λ». В начальный момент времени гол
