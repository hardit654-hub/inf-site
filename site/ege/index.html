>В игре, описанной в задании 19, в начальный момент в первой куче было 19 камней, а во второй – S камней, 1 ≤ S ≤ 25. Найдите такое значение S, при котором у Вани есть стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети, но у Вани нет стратегии, которая позволяла бы ему гарантированно выиграть первым ходом.</p>"}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["31"], ["24", "33"], ["10"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p>🔥</p><p>(А. Богданов) Два игрока, Петя и Ваня, играют в следующую игру. Перед игроками лежит куча камней. Игроки ходят по очереди, первый ход делает Петя.</p><p>За один ход игрок может изменить количество камней в куче на 1, 3 или 7, но обязательно в сторону числа 50: если в куче больше 50 камней, то он забирает камни из кучи, а если меньше 50, то добавляет камни.</p><p>Игра завершается в тот момент, когда количество камней в куче становится ровно 50. Игрок, первым получивший кучу из 50 камней, считается победителем.</p><p>В начальный момент в куче было S камней, S ≥ 1, S ≠ 50.</p><p>&nbsp;</p><p><b>№ 19</b><br>Известно, что Ваня выиграл своим первым ходом после неудачного первого хода Пети. Укажите <b>минимальное</b> значение S, когда такая ситуация возможна.</p><p><b>№ 20</b><br>Найдите два <b>наименьших</b> значения S, при которых у Пети есть выигрышная стратегия, причём одновременно выполняются два условия:<ul class=\"dash\"><li>Петя не может выиграть за один ход;</li><li>Петя может выиграть своим вторым ходом независимо от того, как будет ходить Ваня.</li></ul>Найденные значения запишите в ответе в порядке возрастания.</p><p><b>№ 21</b><br>Найдите <b>максимальное</b> значение S, при котором одновременно выполняются два условия:<ul class=\"dash\"><li>у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;</li><li>у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.</li></ul></p>"}, {"t": "details", "title": "Подсказка", "v": [{"t": "code", "v": "if x < 50:\n    moves = [f(x+1, c+1, win), f(x+3, c+1, win), f(x+7, c+1, win)]\nelse:\n    moves = [f(x-1, c+1, win), f(x-3, c+1, win), f(x-7, c+1, win)]"}]}], "fields": [{"label": "№ 19", "n": 1}, {"label": "№ 20", "n": 2}, {"label": "№ 21", "n": 1}], "answer": [["36"], ["39", "45"], ["58"]]}]}]}, {"num": 35, "title": "№ 22 · Параллельные процессы", "key": "course-ege-inf-s35", "lessons": [{"num": "35.1", "title": "Без движения процессов. Теория", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>Содержание урока</h2> <p>В данном уроке мы изучим решение заданий № 22, в которых не требуется двигать процессы.</p> <ol> <li><strong>Изучим простой и наглядный способ решения, в котором создаётся схема процессов.</strong><br> Данный способ прост для понимания, но он не годится для решения всех типов задач.</li> <li><strong>Изучим способ решения без построения схемы процессов.</strong><br> Данный способ более универсальный и эффективный, относительно первого способа. </li> <li><strong>Изучим способ решения с использованием функции ВПР().</strong><br> Наиболее универсальный и эффективный способ решения задач № 22, в которых не требуется двигать процессы.</li> </ol> <p>Основным способом решения № 22 является третий способ – с использованием функции ВПР().</p> <p><strong>На экзамене, скорее всего, нужно будет использовать именно способ с функцией ВПР().</strong><br> Вероятно, первыми двумя способами будет проблематично решить задание с реального экзамена. Но есть шанс, что наоборот придумают новое задание, которое с ВПР() будет плохо решаться.</p> <p><strong>Нужно изучить все три способа!</strong><br> В случае изменения задания на реальном экзамене, Вы сможете использовать тот способ, который наиболее оптимально подходит для данной задачи.</p>"}]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.1.2.xlsx", "href": "../ege-22/files/22-35.1.2.xlsx", "size": "9 КБ"}]}, {"t": "html", "v": "<p><em><strong>Попробуйте решить задачу самостоятельно, а после обязательно посмотрите её разбор на следующем шаге </strong></em>😉</p> <p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. В этом случае процессы могут выполняться только последовательно.<br> Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс является независимым, то в таблице указано значение 0.</p> <p>Типовой пример организации данных в файле:</p> <p><img src=\"../ege-22/img/35.1.2-1.png\" alt=\"\"></p> <p>Определите минимальное время, через которое завершится выполнение всей совокупности процессов, при условии, что все независимые друг от друга процессы могут выполняться параллельно.</p> <p><strong>Примечание</strong><br> В видео на следующем шаге показан первый способ решения –<strong> </strong>в котором создаётся схема процессов.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["17"]]}, {"type": "video", "title": "Видеоразбор"}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.1.4.ods", "href": "../ege-22/files/22-35.1.4.ods", "size": "14 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности <em>N</em> вычислительных процессов, которые могут выполняться параллельно или последовательно. Будем говорить, что процесс <em>B</em> зависит от процесса <em>A</em>, если для выполнения процесса <em>B</em> необходимы результаты выполнения процесса <em>A</em>. В этом случае процессы могут выполняться только последовательно.</p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены<br> с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс является независимым, то в таблице указано значение 0.</p> <p><em>Типовой пример организации данных в файле</em>:</p> <div class=\"tw\"><table> <tbody> <tr> <td> <p>ID процесса <em>B</em></p> </td> <td> <p>Время выполнения процесса <em>B</em> (мс)</p> </td> <td> <p>ID процесса(-ов) <em>A</em></p> </td> </tr> <tr> <td> <p>1</p> </td> <td> <p>4</p> </td> <td> <p>0</p> </td> </tr> <tr> <td> <p>2</p> </td> <td> <p>3</p> </td> <td> <p>0</p> </td> </tr> <tr> <td> <p>3</p> </td> <td> <p>1</p> </td> <td> <p>1; 2</p> </td> </tr> <tr> <td> <p>4</p> </td> <td> <p>7</p> </td> <td> <p>3</p> </td> </tr> </tbody> </table></div> <p>Определите <strong>минимальное</strong> время, через которое завершится выполнение всей совокупности процессов, при условии, что все независимые друг от друга процессы могут выполняться параллельно.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["47"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.1.5.ods", "href": "../ege-22/files/22-35.1.5.ods", "size": "14 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности <em>N</em> вычислительных процессов, которые могут выполняться параллельно или последовательно. Будем говорить, что процесс <em>B</em> зависит от процесса <em>A</em>, если для выполнения процесса <em>B</em> необходимы результаты выполнения процесса <em>A</em>. В этом случае процессы могут выполняться только последовательно.</p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены<br> с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс является независимым, то в таблице указано значение 0.</p> <p><em>Типовой пример организации данных в файле</em>:</p> <div class=\"tw\"><table> <tbody> <tr> <td> <p>ID процесса <em>B</em></p> </td> <td> <p>Время выполнения процесса <em>B</em> (мс)</p> </td> <td> <p>ID процесса(-ов) <em>A</em></p> </td> </tr> <tr> <td> <p>1</p> </td> <td> <p>4</p> </td> <td> <p>0</p> </td> </tr> <tr> <td> <p>2</p> </td> <td> <p>3</p> </td> <td> <p>0</p> </td> </tr> <tr> <td> <p>3</p> </td> <td> <p>1</p> </td> <td> <p>1; 2</p> </td> </tr> <tr> <td> <p>4</p> </td> <td> <p>7</p> </td> <td> <p>3</p> </td> </tr> </tbody> </table></div> <p>Определите <strong>минимальное</strong> время, через которое завершится выполнение всей совокупности процессов, при условии, что все независимые друг от друга процессы могут выполняться параллельно.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["53"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.1.6.xls", "href": "../ege-22/files/22-35.1.6.xls", "size": "30 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Приостановка выполнения процесса не допускается. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. В этом случае процессы A и B могут выполняться только последовательно. </p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс независимый, то в таблице указано значение 0. </p> <p><em>Типовой пример организации данных в файле</em></p> <div class=\"tw\"><table> <tbody> <tr> <td><strong>ID процесса B</strong></td> <td><strong>Время выполнения процесса B (мс)</strong></td> <td><strong>ID процесса(-ов) A</strong></td> </tr> <tr> <td>1</td> <td>3</td> <td>0</td> </tr> <tr> <td>2</td> <td>4</td> <td>1</td> </tr> <tr> <td>3</td> <td>2</td> <td>2; 4</td> </tr> <tr> <td>4</td> <td>5</td> <td>0</td> </tr> <tr> <td>5</td> <td>8</td> <td>1; 4</td> </tr> </tbody> </table></div> <p>Определите максимальное количество процессов, которые начнутся не раньше 11-ой мс. Считать, что каждый процесс начинается в самое раннее допустимое время. Время отсчитывается непрерывно с первой миллисекунды.</p> <p><strong>Примечание</strong><br> В данной задаче много процессов, которые очень запутанно связанны друг с другом. Из-за этого рисовать процессы, как мы делали это ранее, будет не эффективно. Вы потратите много времени и рискуете где-то ошибиться.<br> Поэтому в видео на следующем шаге находится другой способ решения этого задания.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["9"]]}, {"type": "video", "title": "Видеоразбор"}, {"type": "video", "title": "Видеоразбор"}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.1.9.ods", "href": "../ege-22/files/22-35.1.9.ods", "size": "15 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Приостановка выполнения процесса не допускается. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. В этом случае процессы могут выполняться только последовательно.</p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс независимый, то в таблице указано значение 0.</p> <p>Типовой пример организации данных в файле</p> <p><img src=\"../ege-22/img/35.1.9-1.png\" alt=\"\"></p> <p>Определите <strong>минимальное </strong>время, через которое завершится выполнение всей совокупности процессов, при условии, что все независимые друг от друга процессы могут выполняться параллельно.</p> <p><strong>Примечание</strong><br> Из-за того, что время выполнения процессов достаточно большое – рисовать процессы будет не удобно и долго. Данную задачу лучше решить без рисования процессов, как показано в предыдущем видео. Или можно её решить с помощью ВПР(), как будет показано в следующем видео.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["218"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.1.10.xls", "href": "../ege-22/files/22-35.1.10.xls", "size": "24 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Приостановка выполнения процесса не допускается. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. В этом случае процессы A и B могут выполняться только последовательно. </p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс независимый, то в таблице указано значение 0. </p> <p><em>Типовой пример организации данных в файле</em></p> <div class=\"tw\"><table> <tbody> <tr> <td><strong>ID процесса B</strong></td> <td><strong>Время выполнения процесса B (мс)</strong></td> <td><strong>ID процесса(-ов) A</strong></td> </tr> <tr> <td>1</td> <td>3</td> <td>0</td> </tr> <tr> <td>2</td> <td>4</td> <td>1</td> </tr> <tr> <td>3</td> <td>2</td> <td>2; 4</td> </tr> <tr> <td>4</td> <td>5</td> <td>0</td> </tr> <tr> <td>5</td> <td>8</td> <td>1; 4</td> </tr> </tbody> </table></div> <p>Определите минимальное время (в мс), за которое завершатся 14 процессов. Считать, что каждый процесс начинается в самое раннее допустимое время. Минимальное время отсчитывается непрерывно с первой миллисекунды.<br> В ответе укажите только число – количество мс.</p> <p><em>Например</em>, для приведённой таблицы найдём время, за которое завершатся 3 процесса. Минимальное время, которое для этого требуется, – 7 мс. За это время завершатся процессы 1, 2 и 4.</p> <p><strong>Примечание</strong><br> На следующем шаге находится <strong>очень важное</strong> видео, в котором показан способ решения с использованием функции ВПР(). </p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["14"]]}, {"type": "video", "title": "Видеоразбор"}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Важно</h2> <p>Если при замене пустых ячеек на 0 в LibreOffice у вас в ячейках получается <code>'0</code>, то тогда при подсчёте ответа может возникнуть ошибка.</p> <p>Чтобы избавиться от <code>'</code> нужно заменить 0 на 0.</p> <p> <img src=\"../ege-22/img/35.1.12-1.png\" alt=\"\"></p> <p>В таком случае всё точно хорошо посчитается.</p>"}]}, {"type": "video", "title": "Видеоразбор"}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.1.14.ods", "href": "../ege-22/files/22-35.1.14.ods", "size": "15 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности <em>N</em> вычислительных процессов, которые могут выполняться параллельно или последовательно. Будем говорить, что процесс <em>B</em> зависит от процесса <em>A</em>, если для выполнения процесса <em>B</em> необходимы результаты выполнения процесса <em>A</em>. В этом случае процессы могут выполняться только последовательно.</p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс является независимым, то в таблице указано значение 0.</p> <p><em>Пример организации данных в файле:</em></p> <div class=\"tw\"><table> <tbody> <tr> <td> <p><strong>ID процесса B</strong></p> </td> <td> <p><strong>Время выполнения процесса B (мс)</strong></p> </td> <td> <p><strong>ID процесса(ов) A</strong></p> </td> </tr> <tr> <td> <p>1</p> </td> <td> <p>4</p> </td> <td> <p>0</p> </td> </tr> <tr> <td> <p>2</p> </td> <td> <p>3</p> </td> <td> <p>0</p> </td> </tr> <tr> <td> <p>3</p> </td> <td> <p>1</p> </td> <td> <p>1; 2</p> </td> </tr> <tr> <td> <p>4</p> </td> <td> <p>7</p> </td> <td> <p>3</p> </td> </tr> </tbody> </table></div> <p>Определите <strong>минимальное</strong> время, через которое завершится выполнение всей совокупности процессов, при условии, что все независимые друг от друга процессы могут выполняться параллельно.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["148"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.1.15.xlsx", "href": "../ege-22/files/22-35.1.15.xlsx", "size": "10 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Приостановка выполнения процесса не допускается. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. В этом случае процессы A и B могут выполняться только последовательно. </p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс независимый, то в таблице указано значение 0. </p> <p><em>Типовой пример организации данных в файле</em></p> <div class=\"tw\"><table> <tbody> <tr> <td><strong>ID процесса B</strong></td> <td><strong>Время выполнения процесса B (мс)</strong></td> <td><strong>ID процесса(-ов) A</strong></td> </tr> <tr> <td>1</td> <td>3</td> <td>0</td> </tr> <tr> <td>2</td> <td>4</td> <td>1</td> </tr> <tr> <td>3</td> <td>2</td> <td>2; 4</td> </tr> <tr> <td>4</td> <td>5</td> <td>0</td> </tr> <tr> <td>5</td> <td>8</td> <td>1; 4</td> </tr> <tr> <td>6</td> <td>3</td> <td>1</td> </tr> </tbody> </table></div> <p>Определите максимальное количество процессов, которые параллельно выполняются на 15-й мс. Считать, что каждый процесс начинается в самое раннее допустимое время. Нумерация миллисекунд начинается с 1.</p> <p><em>Например</em>, для приведённой таблицы на 6-й мс параллельно выполняются три процесса. Это процессы 2, 5 и 6.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["5"]]}, {"type": "text", "blocks": [{"t": "html", "v": "<h2>Подводим итог урока</h2> <p>В данном уроке было рассмотрено три способа решения № 22, в котором не нужно двигать процессы.</p> <h3>Способ № 1. Рисование процессов вручную.</h3> <p><img src=\"../ege-22/img/35.1.16-1.png\" alt=\"\"></p> <h3> </h3> <h3>Способ № 2. Проставление вручную времени начала и завершения процессов без рисования.</h3> <p><img src=\"../ege-22/img/35.1.16-2.png\" alt=\"\"></p>  <h3>Способ № 3. Автоматическое получение времени начала и завершения процессов с помощью функции ВПР().</h3> <p><img src=\"../ege-22/img/35.1.16-3.png\" alt=\"\"></p> <h2> </h2> <h2>Лайфхаки</h2> <p>1. Нужно обязательно сдвинуть таблицу направо на одну клетку, чтобы не мешались номера строк.</p> <p><img src=\"../ege-22/img/35.1.16-4.png\" alt=\"\"></p> <p>2. Временную ось удобно рисовать и сверху и снизу.</p> <p><img src=\"../ege-22/img/35.1.16-5.png\" alt=\"\"></p> <p>3. Удобно при решении помечать использованные процессы.</p> <p><img src=\"../ege-22/img/35.1.16-6.png\" alt=\"\"></p> <p>4. При рисовании процессов нужно смотреть на количество выделенных ячеек.</p> <p><img src=\"../ege-22/img/35.1.16-7.png\" alt=\"\"></p>"}]}]}, {"num": "35.2", "title": "Без движения процессов. Различные задачи", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>Содержание урока</h2> <p>В данном уроке собраны различные задачи. Ваша задача – решить все задания из данного урока. Всю теорию, необходимую для решения данных заданий, мы изучили в предыдущем уроке.</p> <p>Используйте наиболее оптимальный способ решения для каждого задания.<br> Например, если видите много процессов, то не рисуйте схему вручную, а решайте с помощью ВПР().</p> <p>Главное стараться дать правильный ответ с первой попытки – как на реальном экзамене!</p>"}]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.2.2.ods", "href": "../ege-22/files/22-35.2.2.ods", "size": "15 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности <em>N</em> вычислительных процессов, которые могут выполняться параллельно или последовательно. Будем говорить, что процесс <em>B</em> зависит от процесса <em>A</em>, если для выполнения процесса <em>B</em> необходимы результаты выполнения процесса <em>A</em>. В этом случае процессы могут выполняться только последовательно.</p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены<br> с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс является независимым, то в таблице указано значение 0.</p> <p><em>Типовой пример организации данных в файле</em>:</p> <div class=\"tw\"><table> <tbody> <tr> <td> <p><strong>ID процесса <em>B</em></strong></p> </td> <td> <p><strong>Время выполнения процесса <em>B</em> (мс)</strong></p> </td> <td> <p><strong>ID процесса(-ов) <em>A</em></strong></p> </td> </tr> <tr> <td> <p>1</p> </td> <td> <p>4</p> </td> <td> <p>0</p> </td> </tr> <tr> <td> <p>2</p> </td> <td> <p>3</p> </td> <td> <p>0</p> </td> </tr> <tr> <td> <p>3</p> </td> <td> <p>1</p> </td> <td> <p>1; 2</p> </td> </tr> <tr> <td> <p>4</p> </td> <td> <p>7</p> </td> <td> <p>3</p> </td> </tr> </tbody> </table></div> <p>Определите <strong>минимальное</strong> время, через которое завершится выполнение всей совокупности процессов, при условии, что все независимые друг от друга процессы могут выполняться параллельно.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["215"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.2.3.ods", "href": "../ege-22/files/22-35.2.3.ods", "size": "18 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно.</p> <p>Приостановка выполнения процесса не допускается. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. В этом случае процессы A и B могут выполняться только последовательно.</p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс независимый, то в таблице указано значение 0.</p> <p>Определите максимальное количество процессов, которые могут быть завершены за первые 17 мс. Считать, что каждый процесс начинается в самое раннее допустимое время. Нумерация миллисекунд начинается с 1.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["12"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.2.4.xls", "href": "../ege-22/files/22-35.2.4.xls", "size": "21 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Приостановка выполнения процесса не допускается. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. В этом случае процессы A и B могут выполняться только последовательно. </p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс независимый, то в таблице указано значение 0. </p> <p><em>Типовой пример организации данных в файле</em></p> <div class=\"tw\"><table> <tbody> <tr> <td><strong>ID процесса B</strong></td> <td><strong>Время выполнения процесса B (мс)</strong></td> <td><strong>ID процесса(-ов) A</strong></td> </tr> <tr> <td>1</td> <td>3</td> <td>0</td> </tr> <tr> <td>2</td> <td>4</td> <td>1</td> </tr> <tr> <td>3</td> <td>2</td> <td>2; 4</td> </tr> <tr> <td>4</td> <td>5</td> <td>0</td> </tr> <tr> <td>5</td> <td>8</td> <td>1; 4</td> </tr> </tbody> </table></div> <p>Определите количество процессов, которые выполнялись на 14-ой мс, если общее время выполнения всей совокупности процессов минимально. Считать, что каждый процесс начинается в самое раннее допустимое время. Нумерация миллисекунд начинается с единицы.</p> "}, {"t": "details", "title": "Подсказка", "v": [{"t": "html", "v": " <p>При решении с помощью функции ВПР(), чтобы найти количество процессов, которые выполнялись на 14-ой мс, можно использовать такую формулу <code>=(H7&lt;=14)*(14&lt;=I7)</code>.</p> <p>То есть (время начала меньше или равно 14) И (14 меньше или равно времени окончания).<br> Таким образом получается <code>время начала &lt;= 14 &lt;= время окончания</code>.</p> <p><img src=\"../ege-22/img/35.2.4-1.png\" alt=\"\"></p> <p><em>Таблица взята не из этой задачи.</em></p> <p><strong>Важно!</strong></p> <ul> <li>Ни в коем случае не берите в ответ нулевой процесс, который был добавлен вручную.</li> <li>Можно формулу не использовать, а просто глазами посчитать количество процессов, которые выполнялись на 14-ой мс.</li> </ul> "}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["4"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.2.5.xlsx", "href": "../ege-22/files/22-35.2.5.xlsx", "size": "10 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Приостановка выполнения процесса не допускается. Будем говорить, что процесс В зависит от процесса А, если для выполнения процесса В необходимы результаты выполнения процесса А. В этом случае процессы могут выполняться только последовательно.</p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы - время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс независимый, то в таблице указано значение 0.</p> <p>Типовой пример организации данных в файле:</p> <div class=\"tw\"><table> <tbody> <tr> <td><strong>ID процесса В</strong></td> <td><strong>Время выполнения процесса В(мс)</strong></td> <td><strong>ID процессс(-ов) А</strong></td> </tr> <tr> <td>1</td> <td>3</td> <td>0</td> </tr> <tr> <td>2</td> <td>4</td> <td>1</td> </tr> <tr> <td>3</td> <td>2</td> <td>2;4</td> </tr> <tr> <td>4</td> <td>5</td> <td>0</td> </tr> <tr> <td>5</td> <td>8</td> <td>1;4</td> </tr> <tr> <td>6</td> <td>3</td> <td>1</td> </tr> </tbody> </table></div> <p>Определите максимальное количество процессов, которое может быть выполнено за первые 30 мс. Считать, что каждый процесс начинается в самое раннее допустимое время.<br> Нумерация миллисекунд начинается с 1.</p> <p>Например, для приведённой таблицы 3 процесса будут выполнены за первые 6 мс. Это процессы 1, 4 и 6.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["5"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.2.6.xlsx", "href": "../ege-22/files/22-35.2.6.xlsx", "size": "10 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Приостановка выполнения процесса не допускается. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. В этом случае процессы A и B могут выполняться только последовательно. </p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс независимый, то в таблице указано значение 0. </p> <p><em>Типовой пример организации данных в файле</em></p> <div class=\"tw\"><table> <tbody> <tr> <td><strong>ID процесса B</strong></td> <td><strong>Время выполнения процесса B (мс)</strong></td> <td><strong>ID процесса(-ов) A</strong></td> </tr> <tr> <td>1</td> <td>3</td> <td>0</td> </tr> <tr> <td>2</td> <td>4</td> <td>1</td> </tr> <tr> <td>3</td> <td>2</td> <td>2; 4</td> </tr> <tr> <td>4</td> <td>5</td> <td>0</td> </tr> <tr> <td>5</td> <td>8</td> <td>1; 4</td> </tr> </tbody> </table></div> <p>Определите максимальное количество процессов, которые могут быть завершены за первые 16 мс. Считать, что каждый процесс начинается в самое раннее допустимое время. Нумерация миллисекунд начинается с 1.</p> <p><em>Например</em>, для приведённой таблицы найдём количество процессов, которые могут быть завершены за первые 7 мс. Это 3 процесса (за это время завершатся процессы 1, 2 и 4).</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["13"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.2.7.xls", "href": "../ege-22/files/22-35.2.7.xls", "size": "20 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Приостановка выполнения процесса не допускается. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. В этом случае процессы A и B могут выполняться только последовательно. </p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс независимый, то в таблице указано значение 0. </p> <p><em>Типовой пример организации данных в файле</em></p> <div class=\"tw\"><table> <tbody> <tr> <td><strong>ID процесса B</strong></td> <td><strong>Время выполнения процесса B (мс)</strong></td> <td><strong>ID процесса(-ов) A</strong></td> </tr> <tr> <td>1</td> <td>3</td> <td>0</td> </tr> <tr> <td>2</td> <td>4</td> <td>1</td> </tr> <tr> <td>3</td> <td>2</td> <td>2; 4</td> </tr> <tr> <td>4</td> <td>5</td> <td>0</td> </tr> <tr> <td>5</td> <td>8</td> <td>1; 4</td> </tr> </tbody> </table></div> <p>Определите максимальное количество процессов, которые могут начаться не ранее чем с 8-й мс от начала отсчёта. Считать, что каждый процесс начинается в самое раннее допустимое время. Нумерация миллисекунд начинается с 1.</p> <p><em>Например</em>, для приведённой таблицы максимальное количество процессов, которые могут начаться не ранее чем с 6-й мс, равно 2. Это процессы 3 (начинается с 8-й мс) и 5 (начинается с 6-й мс).</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["15"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.2.8.xlsx", "href": "../ege-22/files/22-35.2.8.xlsx", "size": "9 КБ"}]}, {"t": "html", "v": "<p>(СтатГрад) В компьютерной системе необходимо выполнить некоторое количество вычислительных процессов, которые могут выполняться параллельно или последовательно. Для запуска некоторых процессов необходимы данные, которые получаются как результаты выполнения одного или двух других процессов – поставщиков данных. Все независимые процессы (не имеющие поставщиков данных) запускаются в начальный момент времени.</p> <p>Если зависимый процесс получает данные от одного или нескольких других процессов (поставщиков данных), то выполнение зависимого процесса начинается <strong>сразу же</strong> после завершения последнего из процессов поставщиков.</p> <p>Количество одновременно выполняемых процессов может быть любым, длительность процесса не зависит от других параллельно выполняемых процессов.</p> <p>В таблице представлены идентификатор (ID) каждого процесса, его длительность и ID поставщиков данных для зависимых процессов.</p> <p>Определите суммарную длительность всех промежутков времени, в течение которых выполнялось ровно 3 процесса.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["9"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.2.9.xls", "href": "../ege-22/files/22-35.2.9.xls", "size": "27 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B требуется, чтобы был выполнен <strong>хотя бы один из процессов А</strong>. Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс является независимым, то в таблице указано значение 0.</p> <p>Определите минимальное время, через которое завершится выполнение всей совокупности процессов, при условии, что все независимые друг от друга процессы могут выполняться параллельно.</p> <p>Типовой пример организации данных в файле:</p> <p><img src=\"../ege-22/img/35.2.9-1.png\" alt=\"\"></p> <p>В данном случае независимые процессы 1 и 2 могут выполняться параллельно, при этом процесс 1 завершится через 4 мс, а процесс 2 – через 3 мс с момента старта. Процесс 3 может начаться только после завершения процесса 1 или 2, то есть, через 3 мс после старта. Он длится 1 мс и закончится через 3 + 1 = 4 мс после старта. Выполнение процесса 4 может начаться только после завершения процесса 3, то есть, через 4 мс. Он длится 7 мс, так что минимальное время завершения всех процессов равно 4 + 7 = 11 мс.</p> "}, {"t": "details", "title": "Видеоразбор", "v": [{"t": "html", "v": " <p> <a href=\"https://youtu.be/g-XtuRxa0zM?t=43\" target=\"_blank\" rel=\"noopener\">https://youtu.be/g-XtuRxa0zM?t=43</a></p> <p> <a href=\"https://rutube.ru/video/6def0c7a0aeee3ab2a2fa5f7f7fc641d/?r=wd&amp;t=45\" target=\"_blank\" rel=\"noopener\">https://rutube.ru/video/6def0c7a0aeee3ab2a2fa5f7f7fc641d/?r=wd&amp;t=45</a></p> <p><sup><sub>PRO100 ЕГЭ информатика ЕГЭ</sub></sup></p> "}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["14"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.2.10.xls", "href": "../ege-22/files/22-35.2.10.xls", "size": "27 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B требуется, чтобы был выполнен <strong>хотя бы 50% от количества процессов А</strong>. Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс является независимым, то в таблице указано значение 0.</p> <p>Определите минимальное время, через которое завершится выполнение всей совокупности процессов, при условии, что все независимые друг от друга процессы могут выполняться параллельно.</p> <p>Типовой пример организации данных в файле:</p> <p><img src=\"../ege-22/img/35.2.10-1.png\" alt=\"\"></p> <p>В данном случае независимые процессы 1 и 2 могут выполняться параллельно, при этом процесс 1 завершится через 4 мс, а процесс 2 – через 3 мс с момента старта. Процесс 3 может начаться только после завершения <strong>хотя бы 50% из двух процессов</strong>, то есть любого процесса 1 или 2, то есть, через 3 мс после старта. Он длится 1 мс и закончится через 3 + 1 = 4 мс после старта.<br> Выполнение процесса 4 может начаться только после завершения <strong>хотя бы 50% из трёх процессов</strong>, то есть любых двух из процессов (1, 2, 3), то есть, через 4 мс. Он длится 7 мс, так что минимальное время завершения всех процессов равно 4 + 7 = 11 мс.</p> "}, {"t": "details", "title": "Видеоразбор", "v": [{"t": "html", "v": " <p> <a href=\"https://youtu.be/g-XtuRxa0zM\" target=\"_blank\" rel=\"noopener\">https://youtu.be/g-XtuRxa0zM</a></p> <p> <a href=\"https://rutube.ru/video/6def0c7a0aeee3ab2a2fa5f7f7fc641d/?r=wd&amp;t=425\" target=\"_blank\" rel=\"noopener\">https://rutube.ru/video/6def0c7a0aeee3ab2a2fa5f7f7fc641d/?r=wd&amp;t=425</a></p> <p><sup><sub>PRO100 ЕГЭ информатика ЕГЭ</sub></sup></p> "}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["16"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.2.11.xls", "href": "../ege-22/files/22-35.2.11.xls", "size": "33 КБ"}]}, {"t": "html", "v": "<p>(А. Носкин) В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс является независимым, то в таблице указано значение 0.</p> <p>При составлении таблицы была <strong>потеряна информация</strong> после какого процесса начался процесс ID = 12. Однако известно, что вся совокупности процессов завершилась за минимальное время 25 мс. Определите ID процесса, после которого начался процесс с ID = 12. В ответе укажите только число.</p> <p>Типовой пример организации данных в файле:</p> <p><img src=\"../ege-22/img/35.2.11-1.png\" alt=\"\"></p> <p>В данном случае независимые процессы 1 и 2 могут выполняться параллельно, при этом процесс 1 завершится через 4 мс, а процесс 2 – через 3 мс с момента старта. Процесс 3 может начаться только после завершения обоих процессов 1 и 2, то есть, через 4 мс после старта. Он длится 1 мс и закончится через 4 + 1 = 5 мс после старта. Выполнение процесса 4 может начаться только после завершения процесса, ID которого <strong>потеряно</strong>. Его продолжительность равно 7 мс. Если бы минимальное время завершения всех процессов была равно 12 мс, то процесс 4 начинался бы <strong>после процесса 3</strong> (12 – 7 = 5мс).</p> "}, {"t": "details", "title": "Видеоразбор", "v": [{"t": "html", "v": " <p> <a href=\"https://youtu.be/VvhJB7ZZOIc\" target=\"_blank\" rel=\"noopener\">https://youtu.be/VvhJB7ZZOIc</a></p> <p> <a href=\"https://rutube.ru/video/0412024a1e8c72bd924e917ad7f94588/?r=wd\" target=\"_blank\" rel=\"noopener\">https://rutube.ru/video/0412024a1e8c72bd924e917ad7f94588/?r=wd</a></p> <p><sup><sub>PRO100 ЕГЭ информатика ЕГЭ</sub></sup></p> "}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["5"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.2.12.xls", "href": "../ege-22/files/22-35.2.12.xls", "size": "50 КБ"}]}, {"t": "html", "v": "<p>(А. Кабанов) В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс является независимым, то в таблице указано значение 0.</p> <p>Определите максимально возможное целочисленное неизвестное время выполнения процесса t, при котором выполнение всей совокупности процессов может завершиться не более чем за 96 мс.</p> <p>Типовой пример организации данных в файле:</p> <p><img src=\"../ege-22/img/35.2.12-1.png\" alt=\"\"></p> <p><em>Пусть выполнение данной совокупности процессов закончилось за 15 мс. В данном случае независимые процессы 1 и 2 могут выполняться параллельно, при этом процесс 1 завершится через 4 мс, а процесс 2 – через 3 мс с момента старта. Процесс 3 может начаться только после завершения обоих процессов 1 и 2, то есть, через 4 мс после старта. Он длится t мс и закончится через 4 + t мс после старта. Выполнение процесса 4 может начаться только после завершения процесса 3, то есть, через 4 + t мс. Он длится 7 мс, так что минимальное время завершения всех процессов равно 4 + t + 7 = 15 мс. Следовательно, t = 15 – 4 – 7 = 4 мс.<br> Ответ для этого примера: 4.</em></p> "}, {"t": "details", "title": "Подсказка", "v": [{"t": "html", "v": " <p>Используйте решение с помощью ВПР(). Сначала поставьте длительность t равную нулю. После подбирайте данное значение вручную. </p> "}]}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["24"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.2.13.xls", "href": "../ege-22/files/22-35.2.13.xls", "size": "24 КБ"}]}, {"t": "html", "v": "<h2>🔥🔥</h2> <p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. В этом случае процессы могут выполняться только последовательно. Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс является независимым, то в таблице указано значение 0.</p> <p>Определите минимальное время, через которое завершится выполнение всей совокупности процессов, при условии, что все независимые друг от друга процессы могут выполняться параллельно.</p> <p><strong>Примечание</strong><br> Для решения задания используйте функцию ВПР().<br> Очень маловероятно, что на ЕГЭ будет так много процессов.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["906"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-k1.5.xlsx", "href": "../ege-22/files/22-k1.5.xlsx", "size": "10 КБ"}]}, {"t": "html", "v": "<p>В файле содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно. Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. В этом случае процессы могут выполняться только последовательно. <strong>Если процесс B зависит от процесса A, то процесс B может начать выполнение не раньше, чем через 5 мс после завершения процесса A.</strong> Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнения в миллисекундах, в третьем столбце перечислены с разделителем «;» ID процессов, от которых зависит данный процесс. Если процесс является независимым, то в таблице указано значение 0.</p> <p>Определите, за какое минимальное время можно выполнить все процессы. В ответе запишите целое число – минимальное время в мс.</p> <p>Типовой пример организации данных в файле:</p> <div class=\"tw\"><table> <tbody> <tr> <td><strong>ID процесса B</strong></td> <td><strong>Время выполнения процесса B (мс)</strong></td> <td><strong>ID процесса(-ов) A</strong></td> </tr> <tr> <td>1</td> <td>4</td> <td>0</td> </tr> <tr> <td>2</td> <td>3</td> <td>0</td> </tr> <tr> <td>3</td> <td>1</td> <td>1; 2</td> </tr> <tr> <td>4</td> <td>7</td> <td>3</td> </tr> </tbody> </table></div> <p>В данном случае независимые процессы 1 и 2 могут выполняться параллельно, при этом процесс 1 завершится через 4 мс, а процесс 2 – через 3 мс с момента старта. Процесс 3 может начаться только после завершения обоих процессов 1 и 2 и 5мс ожидания, то есть, через 9 мс после старта. Он длится 1 мс и закончится через 9 + 1 = 10 мс после старта. Выполнение процесса 4 может начаться только после завершения процесса 3 и 5 мс ожидания, то есть, через 15 мс. Он длится 7 мс, так что минимальное время завершения всех процессов равно 15 + 7 = 22 мс.</p>"}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["141"]]}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-k1.15.xlsx", "href": "../ege-22/files/22-k1.15.xlsx", "size": "12 КБ"}]}, {"t": "html", "v": "В компьютерной системе необходимо выполнить некоторое количество вычислительных процессов, которые могут выполняться параллельно или последовательно. Для запуска некоторых процессов необходимы данные, которые получаются как результаты выполнения одного или двух других процессов – поставщиков данных. Все независимые процессы (не имеющие поставщиков данных) запускаются в начальный момент времени. Если процесс B (зависимый процесс) получает данные от процесса A (поставщика данных), то выполнение процесса B начинается сразу же после завершения процесса A. Количество одновременно выполняемых процессов может быть любым, длительность процесса не зависит от других параллельно выполняемых процессов. В таблице представлены идентификатор (ID) каждого процесса, его длительность и ID поставщиков данных для зависимых процессов. Определите максимальное количество процессов, которые параллельно выполняются на 141-й мс. Считать, что каждый процесс начинается в самое раннее допустимое время. Нумерация миллисекунд начинается с 1."}], "fields": [{"label": "Ответ", "n": 1}], "answer": [["10"]]}]}, {"num": "35.3", "title": "Движение процессов Ⅰ", "steps": [{"type": "text", "blocks": [{"t": "html", "v": "<h2>Задание средней сложности 🙂</h2> <p>В этом уроке мы научимся решать тип задания 22 из 2024 года. Сначала разберёмся с условием задачи, затем решим подготовительные задачи, а после этого изучим решение № 22 из демоверсии 2024 года и потренируемся на похожих заданиях.</p> <p><strong>Навигация по уроку:</strong></p> <ul> <li><a href=\"#35.3-2\">Объяснение условия задачи из демоверсии 2024 года</a></li> <li><a href=\"#35.3-4\">Решение подготовительной задачи</a></li> <li><a href=\"#35.3-9\">Разбор задачи из демоверсии</a></li> <li><a href=\"#35.3-10\">Видео по особенностям решения № 22 в Excel</a></li> </ul> <p>❗ Ко всем задачам урока есть решение, которое вы можете найти во вкладке решения!</p>"}]}, {"type": "video", "title": "Видеоразбор"}, {"type": "fill", "blocks": [{"t": "file", "files": [{"name": "22-35.3.3.xlsx", "href": "../ege-22/files/22-35.3.3.xlsx", "size": "6 КБ"}]}, {"t": "html", "v": "<p><em><strong>Попробуйте решить задачу самостоятельно, а после обязательно посмотрите её разбор на следующем шаге&nbsp;</strong></em>😉</p> <p>В&nbsp;файле&nbsp;содержится информация о совокупности N вычислительных процессов, которые могут выполняться параллельно или последовательно.</p> <p>Будем говорить, что процесс B зависит от процесса A, если для выполнения процесса B необходимы результаты выполнения процесса A. В этом случае процессы A и B могут выполняться только последовательно.</p> <p>Информация о процессах представлена в файле в виде таблицы. В первом столбце таблицы указан идентификатор процесса (ID), во втором столбце таблицы – время его выполнени <script>
/* Курс запускается сразу, если данные встроены в страницу; закрытые варианты подгружаются с сервера и запускают его сами (window.__course). */
function __course(){
const C=window.COURSE;
/* Курс может состоять из нескольких разделов (ЕГЭ: № 4, № 12, …). Прогресс каждого раздела хранится под своим ключом,
   как раньше на отдельных страницах, поэтому ответы, монетки и домашка учеников не теряются. */
const SECS=(C.sections||[C.section]).map(s=>Object.assign(s,{key:s.key||("course-"+C.id+"-s"+s.num)}));
const MULTI=SECS.length>1;
const POSKEY="pos-"+C.id+(MULTI?"-all":"-s"+SECS[0].num);
const SS={};
SECS.forEach(s=>{let x={pos:null,st:{}};try{const y=JSON.parse(localStorage.getItem(s.key)||"null");if(y&&y.st)x=y}catch(e){}SS[s.key]=x});
const DIRTY=new Set();
/* Синхронизация с личным кабинетом: если ученик вошёл, прогресс уходит на сервер (../api). Без входа всё работает как раньше — только на этом устройстве. */
const API="../api/index.php";
let ME=null,syncT=null,syncing=false,dirty=false,syncErr=false,COINS=null,HW=new Set();
const COIN_SVG='<svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#f6c43a"/><circle cx="10" cy="10" r="9" fill="none" stroke="#c98a12" stroke-width="1.2"/><circle cx="10" cy="10" r="5.6" fill="none" stroke="#c98a12" stroke-width="1.4"/><path d="M6.2 6.4a5 5 0 0 1 4-2" stroke="#fff6cf" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>';
/* Монетки: 3 за задачу минус 1 за каждую неверную попытку; если смотрели ответ — 0.
   С кабинетом считает сервер (каждая задача оплачивается один раз навсегда), без кабинета — по ответам на этом устройстве. */
const coinFor=x=>x&&x.ok&&!x.rev?Math.max(0,3-(x.att||0)):0;
const saveKey=k=>{try{localStorage.setItem(k,JSON.stringify(SS[k]))}catch(e){}};
const save=(k)=>{k=k||lessons[cur.li].ckey;saveKey(k);DIRTY.add(k);if(ME){dirty=true;clearTimeout(syncT);syncT=setTimeout(push,1200)}};
function mergeRec(a,b){
  if(!a)return b;if(!b)return a;
  const src=(a.ok&&!b.ok)?a:b,oth=src===a?b:a,r={};
  if("v" in src)r.v=src.v;else if("v" in oth)r.v=oth.v;
  if("last" in src)r.last=src.last;else if("last" in oth)r.last=oth.last;
  const att=Math.max(a.att||0,b.att||0);if(att)r.att=att;
  ["ok","rev","seen"].forEach(k=>{if(a[k]||b[k])r[k]=true});
  return r;
}
function mergeState(server,local){
  const r={pos:local.pos||(server&&server.pos)||null,last:Object.assign({},server&&server.last,local.last),st:{}};
  const a=(server&&server.st)||{},b=local.st||{};
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{r.st[k]=mergeRec(a[k],b[k])});
  return r;
}
async function api(action,body,keepalive){
  const opt=body?{method:"POST",headers:{"Content-Type":"application/json","X-Inf":"1"},body:JSON.stringify(body),credentials:"same-origin",keepalive:!!keepalive}:{credentials:"same-origin",cache:"no-store"};
  const r=await fetch(API+"?action="+action,opt);const j=await r.json();
  if(!j.ok){const e=new Error(j.error||"error");e.status=r.status;throw e}
  return j;
}
async function push(keepalive){
  if(!ME||!dirty)return;
  if(syncing){clearTimeout(syncT);syncT=setTimeout(push,800);return}
  syncing=true;dirty=false;
  const keys=[...DIRTY];DIRTY.clear();
  try{
    for(const k of keys){
      const S=SS[k],reset=!!S._reset,data=Object.assign({},S);delete data._reset;delete data.uid;
      try{const j=await api("progress_put",{key:k,data,reset},keepalive);delete S._reset;syncErr=false;if(typeof j.coins==="number"){COINS=j.coins;paintCoins(j.gained||0)}}
      catch(e){dirty=true;DIRTY.add(k);syncErr=true;if(e.status===401){ME=null;break}}
      saveKey(k);
    }
  }finally{syncing=false;paintAcct();if(dirty&&ME){clearTimeout(syncT);syncT=setTimeout(push,15000)}}
}
function paintAcct(){
  const a=$("acct");if(!a)return;a.hidden=false;
  a.classList.toggle("in",!!ME);a.classList.toggle("err",!!ME&&syncErr);
  a.querySelector("span").textContent=ME?ME.name.split(" ")[0]:"Войти";
  const href=()=>"../kabinet/"+(ME?"":"?next="+encodeURIComponent("../"+location.pathname.split("/").slice(-2,-1)[0]+"/"+location.search+location.hash));
  a.href=href();a.onclick=()=>{a.href=href()};
  a.title=ME?(syncErr?"Нет связи с сервером — ответы сохранены на этом устройстве и отправятся позже":"Личный кабинет · прогресс сохраняется"):"Войти, чтобы прогресс сохранялся на любом устройстве";
}
async function pull(first){
  let anyLocal=false,needPush=false;
  for(const sec of SECS){
    const k=sec.key;let g;

/* python highlighting */
function hl(src){
  const KW=/\b(def|return|if|else|elif|for|in|and|or|not|while|import|from|print|range|max|min|any|all|continue|break|True|False|None|lambda|sum|len)\b/g;
  return src.split("\n").map(line=>{
    let code=line,com="";
    const i=line.indexOf("#");
    if(i>=0&&!/['"]/.test(line.slice(0,i).replace(/'[^']*'|"[^"]*"/g,""))){code=line.slice(0,i);com=line.slice(i)}
    let out="",last=0;const re=/('[^']*'|"[^"]*")/g;let m;
    const tok=t=>esc(t).replace(KW,'<span class="k">$1</span>').replace(/\b(\d+)\b/g,'<span class="d">$1</span>');
    while((m=re.exec(code))){out+=tok(code.slice(last,m.index))+'<span class="s">'+esc(m[0])+'</span>';last=m.index+m[0].length}
    out+=tok(code.slice(last));
    return out+(com?'<span class="c">'+esc(com)+'</span>':"");
  }).join("\n");
}
/* game tree */
function tree(spec,labels){
  const LW=46,LH=72,R=16,PAD=26;let leaf=0;const nodes=[],edges=[];let depth=0;
  (function walk(n,d){
    depth=Math.max(depth,d);
    const me={d,kind:Array.isArray(n)?"w":n};nodes.push(me);
    if(Array.isArray(n)){const kids=n.map(k=>walk(k,d+1));me.x=kids.reduce((a,k)=>a+k.x,0)/kids.length;kids.forEach(k=>edges.push([me,k]))}
    else{me.x=PAD+R+leaf*LW;leaf++}
    return me;
  })(spec,0);
  const W=PAD*2+R*2+(leaf-1)*LW+80, H=PAD*2+R*2+depth*LH, y=d=>PAD+R+d*LH;
  let s=`<svg class="tree" viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Дерево игры">`;
  edges.forEach(([a,b])=>s+=`<line x1="${a.x}" y1="${y(a.d)}" x2="${b.x}" y2="${y(b.d)}"/>`);
  nodes.forEach(n=>s+=`<circle class="${n.kind}" cx="${n.x}" cy="${y(n.d)}" r="${R}"/>`);
  const lx=PAD+R*2+(leaf-1)*LW+16;
  (labels||[]).forEach((t,i)=>{s+=`<rect x="${lx}" y="${y(i+1)-12}" width="54" height="24"/><text x="${lx+27}" y="${y(i+1)+4}" text-anchor="middle">${esc(t)}</text>`});
  return s+"</svg>";
}

  s.items.forEach((it,i)=>{
    const sel=v[i]!=null?+v[i]:-1;
    let cls="";if(x.last!=null&&sel>=0)cls=sel===s.answer[i]?"ok":"bad";if(x.ok)cls="ok";
    h+=`<label class="mrow"><span class="mk">${it}</span><select data-i="${i}" class="${cls}" ${x.ok?"disabled":""}><option value="">— выберите —</option>${s.options.map((o,j)=>`<option value="${j}" ${j===sel?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
  });
  return h+`</div>`+actions(s,x)+`</div>`;
}
function actions(s,x){
  let h=`<div class="qact">`;
  h+=x.ok?`<button class="btn ghost" id="again">Решить снова</button>`:`<button class="btn" id="send">Отправить</button>`;
  if(x.att) h+=`<span class="att">Неверных попыток: ${x.att}</span>`;
  if(!x.ok){const c=x.rev?0:Math.max(0,3-(x.att||0));h+=`<span class="cprize${c?"":" zero"}" title="3 монетки за решение, −1 за каждую неверную попытку">${COIN_SVG}${c?"За решение: "+c:x.rev?"Ответ показан — без монеток":"Монеток уже не будет"}</span>`}
  if(!x.ok&&x.att>=3&&!x.rev) h+=`<button class="btn warn" id="showans">Показать ответ</button>`;
  h+=`</div>`;
  if(x.rev){
    const a=s.type==="choice"?esc(s.options[s.answer]):s.type==="match"?s.items.map((it,i)=>it+" — "+esc(s.options[s.answer[i]])).join("<br>"):s.fields.map((f,i)=>esc(f.label)+": <b>"+s.answer[i].join(" ")+"</b>").join("<br>");
    h+=`<div class="reveal">Правильный ответ:<br>${a}</div>`;
  }
  return h;
}
function wire(s,x){
  $("strip").querySelectorAll(".sq").forEach(b=>b.onclick=()=>go(cur.li,+b.dataset.si));
  document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{
    const t=b.previousElementSibling.innerText;
    try{await navigator.clipboard.writeText(t);b.textContent="Скопировано"}catch(e){const r=document.createRange();r.selectNodeContents(b.previousElementSibling);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);b.textContent="Выделено"}
    setTimeout(()=>b.textContent="Копировать",1500);
  });
  const p=$("prev"),n=$("next");
  if(p)p.onclick=()=>{const q=prevPos();if(q)go(q.li,q.si)};
  if(n)n.onclick=()=>{const q=nextPos();if(q)go(q.li,q.si)};
  $("rst").onclick=()=>{$("rstc").hidden=false;$("rst").hidden=true};
  $("rstn").onclick=()=>{$("rstc").hidden=true;$("rst").hidden=false};
  $("rsty").onclick=()=>{const sec=lessons[cur.li].sec,k=sec.key;SS[k]={pos:null,st:{}};if(ME){SS[k].uid=ME.id;SS[k]._reset=true}save(k);go(sec.off,0)};
  if(!isTask(s))return;
  if(s.type==="choice"){
    document.querySelectorAll('input[name="opt"]').forEach(r=>r.onchange=()=>{x.v=+r.value;x.last=null;save();render()});
  }else if(s.type==="match"){
    document.querySelectorAll(".mrow select").forEach(sl=>sl.onchange=()=>{x.v=x.v||[];x.v[sl.dataset.i]=sl.value===""?null:+sl.value;sl.classList.remove("ok","bad");x.last=null;save()});
  }else{
    document.querySelectorAll(".frow input").forEach(inp=>{
      inp.oninput=()=>{x.v=x.v||[];(x.v[inp.dataset.f]=x.v[inp.dataset.f]||[])[inp.dataset.k]=inp.value;inp.classList.remove("ok","bad");save()};
      inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();submit(s,x)}};
    });
  }
  const send=$("send");if(send)send.onclick=()=>submit(s,x);
  const ag=$("again");if(ag)ag.onclick=()=>{x.ok=false;x.last=null;x.v=s.type==="choice"?null:[];save();render()};
  const sa=$("showans");if(sa)sa.onclick=()=>{x.rev=true;save();render()};
}
function submit(s,x){
  let good;
  if(s.type==="choice"){
    if(x.v==null){flash("Выберите вариант ответа");return}
    good=x.v===s.answer;
  }else if(s.type==="match"){
    const v=x.v||[];
    if(s.items.some((_,i)=>v[i]==null)){flash("Выберите пару для каждой строки");return}
    good=s.items.every((_,i)=>+v[i]===s.answer[i]);
  }else{
    const v=x.v||[];
    const empty=s.fields.every((f,fi)=>[...Array(f.n)].every((_,k)=>!((v[fi]||[])[k]||"").trim()));
    if(empty){flash("Впишите ответ");return}
    good=s.fields.every((f,fi)=>[...Array(f.n)].every((_,k)=>norm((v[fi]||[])[k])===norm(s.answer[fi][k])));
  }
  const first=good&&!x.ok&&x.paid==null;
  x.last=good;if(good)x.ok=true;else x.att=(x.att||0)+1;
  if(first)x.paid=coinFor(x);
  save();render();
  if(first){if(ME){clearTimeout(syncT);push()}else paintCoins(x.paid)}
  const q=$("quiz");if(q)q.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function flash(t){const a=document.querySelector(".qact");if(!a)return;let m=a.querySelector(".att.tmp");if(!m){m=document.createElement("span");m.className="att tmp";a.appendChild(m)}m.textContent=t}
function go(li,si){
  if(!lessons[li]||!lessons[li].steps)return;
  const L=lessons[li],S=SL(li),j=li-L.sec.off;  // позиция и последние шаги хранятся внутри раздела, как раньше
  if(si==null){const p=S.last&&S.last[j];si=p!=null?p:0}
  if(MULTI&&L.sec!==lessons[cur.li].sec)OPEN.add(L.sec.idx);
  cur={li,si};S.pos={li:j,si};S.last=S.last||{};S.last[j]=si;save(L.ckey);
  try{localStorage.setItem(POSKEY,JSON.stringify({k:L.ckey,li:j,si}))}catch(e){}
  history.replaceState(null,"",location.pathname+location.search.replace(/[?&]s=[^&]*/,"").replace(/^&/,"?")+"#"+L.num+"-"+(si+1));
  render();window.scrollTo({top:0});
}
function fromHash(){
  const m=location.hash.match(/^#([\d.]+)-(\d+)$/);
  if(m){const li=lessons.findIndex(L=>L.num===m[1]);if(li>=0&&lessons[li].steps){go(li,Math.max(0,Math.min(+m[2]-1,lessons[li].steps.length-1)));return}}
  // ?s=42 — открыть раздел (переход со старой страницы курса) там, где ученик остановился
  const sn=new URLSearchParams(location.search).get("s"),sec=sn&&SECS.find(s=>String(s.num)===sn);
  if(sec){const q=SS[sec.key].pos;if(q&&sec.lessons[q.li]&&sec.lessons[q.li].steps){go(sec.off+q.li,q.si);return}go(sec.off,null);return}
  const p=savedPos();if(p)go(p.li,p.si);else go(0,0);
}

/* table of contents toggle */
function setToc(open){
  root.classList.toggle("toc-closed",!open);
  try{localStorage.setItem("toc",open?"open":"closed")}catch(e){}
  const b=$("tocbtn");b.setAttribute("aria-label",open?"Скрыть оглавление":"Показать оглавление");b.setAttribute("aria-expanded",open);
}
if(matchMedia("(max-width:900px)").matches&&!root.classList.contains("toc-closed"))setToc(false);
$("tocbtn").onclick=()=>setToc(root.classList.contains("toc-closed"));
$("scrim").onclick=()=>setToc(false);
$("tocbtn").setAttribute("aria-expanded",!root.classList.contains("toc-closed"));

/* theme toggle */
(function(){
  const b=$("theme");
  const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const paint=()=>{const d=isDark();b.innerHTML=d?SUN:MOON;b.title=d?"Светлая тема":"Тёмная тема";b.setAttribute("aria-label",b.title)};
  b.onclick=()=>{const t=isDark()?"light":"dark";root.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}paint()};
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paint);
  paint();
})();
/* скачивание файлов без перехода на другую страницу (Яндекс Браузер перехватывает .xlsx) */
document.addEventListener("click",async e=>{
  const a=e.target.closest&&e.target.closest("a.file[href]");
  if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.button!==0)return;
  e.preventDefault();
  if(a.dataset.busy)return;a.dataset.busy="1";
  const href=a.getAttribute("href"),name=decodeURIComponent(href.split("/").pop());
  try{
    const r=await fetch(href,{cache:"no-store"});if(!r.ok)throw new Error(r.status);
    const blob=new Blob([await r.arrayBuffer()],{type:"application/octet-stream"});
    const url=URL.createObjectURL(blob),t=document.createElement("a");
    t.href=url;t.download=name;t.style.display="none";document.body.appendChild(t);t.click();
    setTimeout(()=>{URL.revokeObjectURL(url);t.remove()},4000);
  }catch(err){location.href=href}
  finally{delete a.dataset.busy}
});
window.addEventListener("hashchange",fromHash);
fromHash();
initSync();
}
if(window.COURSE)__course();else window.__course=__course;
