й путь к файлу 125.jpg, расположенному в папке ФОТО.</p>"}], "fields": [{"label": "Ответ", "n": 1, "txt": 1}], "answer": [["D:\\ЛЕТО\\ФОТО\\125.jpg"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p><b>120.</b> Запишите маску, которая позволит выделить все файлы с расширением <b>bmp</b>, имена которых начинаются на букву <b>t</b>.</p>"}], "fields": [{"label": "Маска", "n": 1, "txt": 1}], "answer": [["t*.bmp"]]}, {"type": "text", "blocks": [{"t": "html", "v": "<p><b>121.</b> Запишите пять разных имён файлов, удовлетворяющих маске *e??e.d?*</p><div class=\"vnote\">✏️ Это задание выполняется в тетради — автоматической проверки нет.</div>"}, {"t": "details", "title": "Пример ответа", "v": [{"t": "html", "v": "<p>else.doc, frees.dat, meere.dx, eagle.dbf, theme.d1</p>"}]}]}, {"type": "choice", "blocks": [{"t": "html", "v": "<p><b>122.</b> Из перечня имён выберите (отметьте галочкой) те, которые удовлетворяют маске ?l*ck.*t?</p>"}], "options": ["click.txt", "black.ppt", "lock.sts", "clock.tt", "blink.uta", "applock.stu", "blocker.htm", "elpack.ty", "blocker.html"], "answer": [3, 7], "multi": true}, {"type": "choice", "blocks": [{"t": "html", "v": "<p><b>123.</b> Из перечня имён выберите (отметьте галочкой) те, которые НЕ удовлетворяют маске ?l*ck*.*?</p>"}], "options": ["_click.txt", "black.ppt", "lo3ck.sts", "clock.tt", "blink.uta", "applock.stu", "blocker.htm", "elpack.ty", "blocker.html"], "answer": [0, 2, 4, 5], "multi": true}, {"type": "choice", "blocks": [{"t": "html", "v": "<p><b>124.</b> Укажите, какое из указанных ниже имён файлов удовлетворяет маске ?ese*ie.?t*</p>"}], "options": ["seseie.ttx", "esenie.ttx", "eseie.xt", "sesenie.txt"], "answer": 0}]}]}, {"num": 25, "title": "§ 2.5 Пользовательский интерфейс", "lessons": [{"num": "2.5", "label": "§ 2.5", "title": "Задания 125–127", "steps": [{"type": "match", "blocks": [{"t": "html", "v": "<p><b>125.</b> Соедините управляющие элементы диалогового окна и соответствующие им названия.</p><p class=\"fig\"><img src=\"img/dialog.png\" alt=\"Диалоговое окно «Мой новый компьютер»\" width=\"560\"></p>"}], "items": ["Поле справа от надписи «Покупатель»", "«Число кнопок» (Двухкнопочная ▼)", "«Модель» (Стандартная, Оптическая, Беспроводная)", "«Корпус» (Белый, Серый, Прозрачный…)", "«Дополнительно» (коврик, тапочки, средство для чистки)", "«Длина» (10 со стрелками)", "«Скорость» (Ниже — Выше)", "Полоса со стрелками у правого края окна", "Тёмные прямоугольники внизу окна"], "options": ["Кнопка", "Переключатель", "Ползунок", "Поле ввода", "Полоса прокрутки", "Раскрывающийся список", "Список", "Счётчик", "Флажок"], "answer": [3, 5, 1, 6, 8, 7, 2, 4, 0]}, {"type": "text", "blocks": [{"t": "html", "v": "<p><b>126.</b> Представьте в виде графа основные элементы графического интерфейса компьютера.</p><div class=\"vnote\">✏️ Это задание выполняется в тетради — автоматической проверки нет.</div>"}, {"t": "details", "title": "Пример ответа", "v": [{"t": "html", "v": "<p>Графический интерфейс → рабочий стол (значки, ярлыки, панель задач, кнопка «Пуск»), окна (окна папок, окна программ, диалоговые окна), меню (главное, контекстное, строка меню), элементы управления (кнопки, поля ввода, списки, флажки, переключатели, ползунки, счётчики).</p>"}]}]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p><b>127.</b> Разгадайте кроссворд «Компьютер как универсальное устройство для работы с информацией». <i>По горизонтали.</i></p><p>2. Поименованная область внешней памяти. 6. Специальная программа, осуществляющая сжатие программ и данных. 8. Выводимый на экран список команд, которые можно задать компьютеру. 11. Специалист, разрабатывающий программное обеспечение. 12. Современные дорогостоящие компьютеры, занимающие большие залы, весящие более одной тонны, считающие быстрее всего. 14. Центральное устройство компьютера, основными характеристиками которого являются тактовая частота и разрядность.</p>"}], "fields": [{"label": "2 (4 букв)", "n": 1, "txt": 1}, {"label": "6 (9 букв)", "n": 1, "txt": 1}, {"label": "8 (4 букв)", "n": 1, "txt": 1}, {"label": "11 (11 букв)", "n": 1, "txt": 1}, {"label": "12 (15 букв)", "n": 1, "txt": 1}, {"label": "14 (9 букв)", "n": 1, "txt": 1}], "answer": [["файл"], ["архиватор"], ["меню"], ["программист"], ["суперкомпьютеры"], ["процессор"]]}, {"type": "fill", "blocks": [{"t": "html", "v": "<p><b>127.</b> Кроссворд «Компьютер как универсальное устройство для работы с информацией» (продолжение). <i>По вертикали.</i></p><p>1. Поименованная совокупность файлов и вложенных папок. 3. Интерфейс, представляющий пользователям наиболее удобные способы взаимодействия с программным обеспечением. 4. Окна, предназначенные для двустороннего взаимодействия (диалога) между компьютером и пользователем. 5. Описание на формальном языке, «понятном» компьютеру, последовательности действий, которые необходимо выполнить над данными для решения поставленной задачи. 7. Совокупность средств и правил взаимодействия человека и компьютера. 9. Вредоносная программа, способная нанести ущерб данным на компьютере или вывести его из строя. 10. Универсальное электронное программно управляемое устройство для работы с информацией. 13. Меню, содержащее список команд, относящихся к текущему объекту.</p>"}], "fields": [{"label": "1 (5 букв)", "n": 1, "txt": 1}, {"label": "3 (13 букв)", "n": 1, "txt": 1}, {"label": "4 (10 букв)", "n": 1, "txt": 1}, {"label": "5 (9 букв)", "n": 1, "txt": 1}, {"label": "7 (9 букв)", "n": 1, "txt": 1}, {"label": "9 (5 букв)", "n": 1, "txt": 1}, {"label": "10 (9 букв)", "n": 1, "txt": 1}, {"label": "13 (11 букв)", "n": 1, "txt": 1}], "answer": [["папка"], ["дружественный"], ["диалоговые"], ["программа"], ["интерфейс"], ["вирус"], ["компьютер"], ["контекстное"]]}]}]}]};

<script>
/* Курс запускается сразу, если данные встроены в страницу; закрытые варианты подгружаются с сервера и запускают его сами (window.__course). */
function __course(){
const C=window.COURSE;
/* Курс может состоять из нескольких разделов (ЕГЭ: № 4, № 12, …). Прогресс каждого раздела хранится под своим ключом,
   как раньше на отдельных страницах, поэтому ответы, монетки и домашка учеников не теряются. */
const SECS=(C.sections||[C.section]).map(s=>Object.assign(s,{key:s.key||("course-"+C.id+"-s"+s.num)}));
const MULTI=SECS.length>1;
const POSKEY="pos-"+C.id+(MULTI?"-all":"-s"+SECS[0].num);
const SS={};
SECS.forEach(s=>{let x={pos:null,st:{}};try{const y=JSON.parse(localStorage.getItem(s.key)||"null");if(y&&y.st)x=y}catch(e){}SS[s.key]=x});
const DIRTY=new Set();
/* Синхронизация с личным кабинетом: если ученик вошёл, прогресс уходит на сервер (../api). Без входа всё работает как раньше — только на этом устройстве. */
const API="../api/index.php";
let ME=null,syncT=null,syncing=false,dirty=false,syncErr=false,COINS=null,HW=new Set();
const COIN_SVG='<svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#f6c43a"/><circle cx="10" cy="10" r="9" fill="none" stroke="#c98a12" stroke-width="1.2"/><circle cx="10" cy="10" r="5.6" fill="none" stroke="#c98a12" stroke-width="1.4"/><path d="M6.2 6.4a5 5 0 0 1 4-2" stroke="#fff6cf" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>';
/* Монетки: 3 за задачу минус 1 за каждую неверную попытку; если смотрели ответ — 0.
   С кабинетом считает сервер (каждая задача оплачивается один раз навсегда), без кабинета — по ответам на этом устройстве. */
const coinFor=x=>x&&x.ok&&!x.rev?Math.max(0,3-(x.att||0)):0;
const saveKey=k=>{try{localStorage.setItem(k,JSON.stringify(SS[k]))}catch(e){}};
const save=(k)=>{k=k||lessons[cur.li].ckey;saveKey(k);DIRTY.add(k);if(ME){dirty=true;clearTimeout(syncT);syncT=setTimeout(push,1200)}};
const asRec=r=>Array.isArray(r)?Object.assign({},r):r;  // сервер мог прислать пустую запись как [] — у массива поля ok/v теряются при сохранении
function mergeRec(a,b){
  a=asRec(a);b=asRec(b);
  if(!a)return b;if(!b)return a;
  const src=(a.ok&&!b.ok)?a:b,oth=src===a?b:a,r={};
  if("v" in src)r.v=src.v;else if("v" in oth)r.v=oth.v;
  if("last" in src)r.last=src.last;else if("last" in oth)r.last=oth.last;
  const att=Math.max(a.att||0,b.att||0);if(att)r.att=att;
  ["ok","rev","seen"].forEach(k=>{if(a[k]||b[k])r[k]=true});
  return r;
}
function mergeState(server,local){
  const r={pos:local.pos||(server&&server.pos)||null,last:Object.assign({},server&&server.last,local.last),st:{}};
  const a=(server&&server.st)||{},b=local.st||{};
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{r.st[k]=mergeRec(a[k],b[k])});
  return r;
}
async function api(action,body,keepalive){
  const opt=body?{method:"POST",headers:{"Content-Type":"application/json","X-Inf":"1"},body:JSON.stringify(body),credentials:"same-origin",keepalive:!!keepalive}:{credentials:"same-origin",cache:"no-store"};
  const r=await fetch(API+"?action="+action,opt);const j=await r.json();
  if(!j.ok){const e=new Error(j.error||"error");e.status=r.status;throw e}
  return j;
}
async function push(keepalive){
  if(!ME||!dirty)return;
  if(syncing){clearTimeout(syncT);syncT=setTimeout(push,800);return}
  syncing=true;dirty=false;
  const keys=[...DIRTY];DIRTY.clear();
  try{
    for(const k of keys){
      const S=SS[k],reset=!!S._reset,data=Object.assign({},S);delete data._reset;delete data.uid;
      try{const j=await api("progress_put",{key:k,data,reset},keepalive);delete S._reset;syncErr=false;if(typeof j.coins==="number"){COINS=j.coins;paintCoins(j.gained||0)}}
      catch(e){dirty=true;DIRTY.add(k);syncErr=true;if(e.status===401){ME=null;break}}
      saveKey(k);
    }
  }finally{syncing=false;paintAcct();if(dirty&&ME){clearTimeout(syncT);syncT=setTimeout(push,15000)}}

function paintAcct(){

    const m=mergeState(g.data,S);m.uid=ME.id;if(S._reset)m._reset=true;
    const changed=JSON.stringify(m.st)!==JSON.stringify((g.data&&g.data.st)||{});

}

/* python highlighting */
function hl(src){
  const KW=/\b(def|return|if|else|elif|for|in|and|or|not|while|import|from|print|range|max|min|any|all|continue|break|True|False|None|lambda|sum|len)\b/g;
  return src.split("\n").map(line=>{
    let code=line,com="";
    const i=line.indexOf("#");
    if(i>=0&&!/['"]/.test(line.slice(0,i).replace(/'[^']*'|"[^"]*"/g,""))){code=line.slice(0,i);com=line.slice(i)}
    let out="",last=0;const re=/('[^']*'|"[^"]*")/g;let m;
    const tok=t=>esc(t).replace(KW,'<span class="k">$1</span>').replace(/\b(\d+)\b/g,'<span class="d">$1</span>');
    while((m=re.exec(code))){out+=tok(code.slice(last,m.index))+'<span class="s">'+esc(m[0])+'</span>';last=m.index+m[0].length}
    out+=tok(code.slice(last));
    return out+(com?'<span class="c">'+esc(com)+'</span>':"");
  }).join("\n");
}
/* game tree */
function tree(spec,labels){
  const LW=46,LH=72,R=16,PAD=26;let leaf=0;const nodes=[],edges=[];let depth=0;
  (function walk(n,d){
    depth=Math.max(depth,d);
    const me={d,kind:Array.isArray(n)?"w":n};nodes.push(me);
    if(Array.isArray(n)){const kids=n.map(k=>walk(k,d+1));me.x=kids.reduce((a,k)=>a+k.x,0)/kids.length;kids.forEach(k=>edges.push([me,k]))}
    else{me.x=PAD+R+leaf*LW;leaf++}
    return me;
  })(spec,0);
  const W=PAD*2+R*2+(leaf-1)*LW+80, H=PAD*2+R*2+depth*LH, y=d=>PAD+R+d*LH;
  let s=`<svg class="tree" viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Дерево игры">`;
  edges.forEach(([a,b])=>s+=`<line x1="${a.x}" y1="${y(a.d)}" x2="${b.x}" y2="${y(b.d)}"/>`);
  nodes.forEach(n=>s+=`<circle class="${n.kind}" cx="${n.x}" cy="${y(n.d)}" r="${R}"/>`);
  const lx=PAD+R*2+(leaf-1)*LW+16;
  (labels||[]).forEach((t,i)=>{s+=`<rect x="${lx}" y="${y(i+1)-12}" width="54" height="24"/><text x="${lx+27}" y="${y(i+1)+4}" text-anchor="middle">${esc(t)}</text>`});
  return s+"</svg>";
}

function lockText(n,title){const w=n===1?"1-й":n===2?"2-й":"3-й";return /решени|видеоразбор/i.test(title)?`Откроется после ${w} неверной попытки или когда задача будет решена`:`Откроется после ${w} неверной попытки`}

    else h+=`<div class="video"><span class="pl">${ICON.video}</span><b>${esc(s.title||"Видео")}</b><span>Видео к этому шагу появится позже</span></div>`;
  }
  if(s.blocks) h+=blocks(s.blocks,isTask(s)?x:null);
  if(s.type==="choice") h+=choiceHTML(s,x);
  if(s.type==="fill") h+=fillHTML(s,x);
  if(s.type==="match") h+=matchHTML(s,x);
  $("step").innerHTML=h;
  const prev=prevPos(), next=nextPos();
  $("foot").innerHTML=`${prev?`<button class="btn ghost" id="prev">${ICON.prev}Назад</button>`:"<span></span>"}${next?`<button class="btn" id="next">${next.li!==cur.li?"Следующий урок":"Следующий шаг"}${ICON.next}</button>`:`<span class="soon">Это последний шаг раздела</span>`}
    <div class="note"><span>${ME?"Ответы сохраняются в личном кабинете — их видно с любого устройства.":'Ответы сохраняются на этом устройстве. <a href="../kabinet/">Войдите</a>, чтобы они были на любом.'}</span><button class="btn ghost" id="rst">Сбросить прогресс</button><span id="rstc" hidden>Точно стереть все ответы${MULTI?" в разделе «"+esc(L.sec.title)+"»":""}? <button class="btn ghost" id="rsty" style="color:var(--bad)">Да, стереть</button> <button class="btn ghost" id="rstn">Нет</button></span></div>`;
  wire(s,x);
  renderToc();
  renderTex();
  if(!ME)paintCoins(0);
}
let katexP=null;
function renderTex(){
  const els=[...document.querySelectorAll("#step .tex:not([data-done])")];if(!els.length)return;
  if(!katexP)katexP=new Promise((res,rej)=>{
    const l=document.createElement("link");l.rel="stylesheet";l.href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";document.head.appendChild(l);
    const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";sc.onload=()=>res(window.katex);sc.onerror=rej;document.head.appendChild(sc);
  });
  katexP.then(k=>{els.forEach(e=>{if(e.dataset.done)return;try{k.render(e.textContent,e,{throwOnError:false,output:"html"});e.dataset.done="1"}catch(err){e.classList.add("raw")}})}).catch(()=>els.forEach(e=>e.classList.add("raw")));
}
function nextPos(){
  if(cur.si<lessons[cur.li].steps.length-1) return {li:cur.li,si:cur.si+1};
  for(let li=cur.li+1;li<lessons.length;li++) if(lessons[li].steps) return {li,si:0};
  return null;
}
function prevPos(){
  if(cur.si>0) return {li:cur.li,si:cur.si-1};
  for(let li=cur.li-1;li>=0;li--) if(lessons[li].steps) return {li,si:lessons[li].steps.length-1};
  return null;
}
function verdict(x,okText,badText){
  if(x.ok){
    const c=!ME&&x.paid!=null?(x.paid>0?`<span class="cgain">+${x.paid}${COIN_SVG}</span>`:` <span style="font-weight:400">— без монеток${x.rev?": ответ был показан":""}</span>`):"";
    return `<div class="verdict ok">${ICON.check}${okText}${c}</div>`;
  }
  if(x.att&&x.last===false) return `<div class="verdict bad">${ICON.cross}${badText}</div>`;
  return "";
}
function choiceHTML(s,x){
  if(s.multi){  // несколько верных вариантов: ответ — набор отмеченных
    const v=Array.isArray(x.v)?x.v:[];
    let h=`<div class="quiz${x.ok?" ok":x.att&&x.last===false?" bad":""}" id="quiz"><span class="qt">Выберите все подходящие ответы</span>`+verdict(x,"Верно!","Неверно. Попробуйте ещё раз.");
    s.options.forEach((o,i)=>{h+=`<label class="opt${x.ok&&v.includes(i)?" ok":""}"><input type="checkbox" name="optm" value="${i}" ${v.includes(i)?"checked":""} ${x.ok?"disabled":""}><span>${esc(o)}</span></label>`});
    return h+actions(s,x)+`</div>`;
  }
  const sel=x.v!=null?x.v:-1;
  let h=`<div class="quiz${x.ok?" ok":x.att&&x.last===false?" bad":""}" id="quiz"><span class="qt">Выберите один вариант из списка</span>`+verdict(x,"Верно!","Неверно. Попробуйте ещё раз.");
  s.options.forEach((o,i)=>{
    const mark=x.last!=null&&i===sel?(x.ok?" ok":(x.last===false?" bad":"")):"";
    h+=`<label class="opt${mark}"><input type="radio" name="opt" value="${i}" ${i===sel?"checked":""} ${x.ok?"disabled":""}><span>${esc(o)}</span></label>`;
  });
  return h+actions(s,x)+`</div>`;
}
function fillHTML(s,x){
  const v=x.v||[];
  let h=`<div class="quiz${x.ok?" ok":x.att&&x.last===false?" bad":""}" id="quiz"><span class="qt">Заполните пропуски</span>`+verdict(x,"Верно!","Есть ошибки — неверные поля подсвечены красным.")+`<div class="fields">`;
  s.fields.forEach((f,fi)=>{
    h+=`<div class="frow"><label for="f${fi}_0">${esc(f.label)}</label>`;
    for(let k=0;k<f.n;k++){
      const val=(v[fi]||[])[k]||"";
      let cls="";if(x.last!=null&&val!=="")cls=eqA(val,s.answer[fi][k])?"ok":"bad";
      if(x.ok)cls="ok";
      h+=`<input id="f${fi}_${k}" data-f="${fi}" data-k="${k}" inputmode="${f.txt?"text":"numeric"}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(val)}" class="${cls}" ${x.ok?"readonly":""} aria-label="${esc(f.label)}${f.n>1?", значение "+(k+1):""}">`;
    }
    h+=`</div>`;
  });
  return h+`</div>`+actions(s,x)+`</div>`;
}
function matchHTML(s,x){
  const v=x.v||[];
  let h=`<div class="quiz${x.ok?" ok":x.att&&x.last===false?" bad":""}" id="quiz"><span class="qt">Сопоставьте значения из двух списков</span>`+verdict(x,"Верно!","Есть ошибки — неверные пары подсвечены красным.")+`<div class="mlist">`;
  s.items.forEach((it,i)=>{
    const sel=v[i]!=null?+v[i]:-1;
    let cls="";if(x.last!=null&&sel>=0)cls=sel===s.answer[i]?"ok":"bad";if(x.ok)cls="ok";
    h+=`<label class="mrow"><span class="mk">${it}</span><select data-i="${i}" class="${cls}" ${x.ok?"disabled":""}><option value="">— выберите —</option>${s.options.map((o,j)=>`<option value="${j}" ${j===sel?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
  });
  return h+`</div>`+actions(s,x)+`</div>`;
}
function actions(s,x){
  let h=`<div class="qact">`;
  h+=x.ok?`<button class="btn ghost" id="again">Решить снова</button>`:`<button class="btn" id="send">Отправить</button>`;
  if(x.att) h+=`<span class="att">Неверных попыток: ${x.att}</span>`;
  if(!x.ok){const c=x.rev?0:Math.max(0,3-(x.att||0));h+=`<span class="cprize${c?"":" zero"}" title="3 монетки за решение, −1 за каждую неверную попытку">${COIN_SVG}${c?"За решение: "+c:x.rev?"Ответ показан — без монеток":"Монеток уже не будет"}</span>`}
  if(!x.ok&&x.att>=3&&!x.rev) h+=`<button class="btn warn" id="showans">Показать ответ</button>`;
  h+=`</div>`;
  if(x.rev){
    const a=s.type==="choice"?(s.multi?s.answer.map(i=>esc(s.options[i])).join("<br>"):esc(s.options[s.answer])):s.type==="match"?s.items.map((it,i)=>it+" — "+esc(s.options[s.answer[i]])).join("<br>"):s.fields.map((f,i)=>esc(f.label)+": <b>"+s.answer[i].map(a=>esc(String(a).split("||")[0])).join(" ")+"</b>").join("<br>");
    h+=`<div class="reveal">Правильный ответ:<br>${a}</div>`;
  }
  return h;
}
function wire(s,x){
  $("strip").querySelectorAll(".sq").forEach(b=>b.onclick=()=>go(cur.li,+b.dataset.si));
  document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{
    const t=b.previousElementSibling.innerText;
    try{await navigator.clipboard.writeText(t);b.textContent="Скопировано"}catch(e){const r=document.createRange();r.selectNodeContents(b.previousElementSibling);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);b.textContent="Выделено"}
    setTimeout(()=>b.textContent="Копировать",1500);
  });
  const p=$("prev"),n=$("next");
  if(p)p.onclick=()=>{const q=prevPos();if(q)go(q.li,q.si)};
  if(n)n.onclick=()=>{const q=nextPos();if(q)go(q.li,q.si)};
  $("rst").onclick=()=>{$("rstc").hidden=false;$("rst").hidden=true};
  $("rstn").onclick=()=>{$("rstc").hidden=true;$("rst").hidden=false};
  $("rsty").onclick=()=>{const sec=lessons[cur.li].sec,k=sec.key;SS[k]={pos:null,st:{}};if(ME){SS[k].uid=ME.id;SS[k]._reset=true}save(k);go(sec.off,0)};
  if(!isTask(s))return;
  if(s.type==="choice"){
    document.querySelectorAll('input[name="opt"]').forEach(r=>r.onchange=()=>{x.v=+r.value;x.last=null;save();render()});
    document.querySelectorAll('input[name="optm"]').forEach(r=>r.onchange=()=>{x.v=[...document.querySelectorAll('input[name="optm"]:checked')].map(c=>+c.value);x.last=null;save()});
  }else if(s.type==="match"){
    document.querySelectorAll(".mrow select").forEach(sl=>sl.onchange=()=>{x.v=x.v||[];x.v[sl.dataset.i]=sl.value===""?null:+sl.value;sl.classList.remove("ok","bad");x.last=null;save()});
  }else{
    document.querySelectorAll(".frow input").forEach(inp=>{
      inp.oninput=()=>{x.v=x.v||[];(x.v[inp.dataset.f]=x.v[inp.dataset.f]||[])[inp.dataset.k]=inp.value;inp.classList.remove("ok","bad");save()};
      inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();submit(s,x)}};
    });
  }
  const send=$("send");if(send)send.onclick=()=>submit(s,x);
  const ag=$("again");if(ag)ag.onclick=()=>{x.ok=false;x.last=null;x.v=s.type==="choice"?null:[];save();render()};
  const sa=$("showans");if(sa)sa.onclick=()=>{x.rev=true;save();render()};
}
function submit(s,x){
  let good;
  if(s.type==="choice"){
    if(s.multi){const v=Array.isArray(x.v)?x.v:[];if(!v.length){flash("Отметьте хотя бы один вариант");return}
      good=v.length===s.answer.length&&s.answer.every(i=>v.includes(i))}
    else{if(x.v==null){flash("Выберите вариант ответа");return}
    good=x.v===s.answer}
  }else if(s.type==="match"){
    const v=x.v||[];
    if(s.items.some((_,i)=>v[i]==null)){flash("Выберите пару для каждой строки");return}
    good=s.items.every((_,i)=>+v[i]===s.answer[i]);
  }else{
    const v=x.v||[];
    const empty=s.fields.every((f,fi)=>[...Array(f.n)].every((_,k)=>!((v[fi]||[])[k]||"").trim()));
    if(empty){flash("Впишите ответ");return}
    good=s.fields.every((f,fi)=>[...Array(f.n)].every((_,k)=>eqA((v[fi]||[])[k],s.answer[fi][k])));
  }
  const first=good&&!x.ok&&x.paid==null;
  x.last=good;if(good)x.ok=true;else x.att=(x.att||0)+1;
  if(first)x.paid=coinFor(x);
  save();render();
  if(first){if(ME){clearTimeout(syncT);push()}else paintCoins(x.paid)}
  const q=$("quiz");if(q)q.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function flash(t){const a=document.querySelector(".qact");if(!a)return;let m=a.querySelector(".att.tmp");if(!m){m=document.createElement("span");m.className="att tmp";a.appendChild(m)}m.textContent=t}
function go(li,si){
  if(!lessons[li]||!lessons[li].steps)return;
  const L=lessons[li],S=SL(li),j=li-L.sec.off;  // позиция и последние шаги хранятся внутри раздела, как раньше
  if(si==null){const p=S.last&&S.last[j];si=p!=null?p:0}
  if(MULTI&&L.sec!==lessons[cur.li].sec)OPEN.add(L.sec.idx);
  cur={li,si};S.pos={li:j,si};S.last=S.last||{};S.last[j]=si;save(L.ckey);
  try{localStorage.setItem(POSKEY,JSON.stringify({k:L.ckey,li:j,si}))}catch(e){}
  history.replaceState(null,"",location.pathname+location.search.replace(/[?&]s=[^&]*/,"").replace(/^&/,"?")+"#"+L.num+"-"+(si+1));
  render();window.scrollTo({top:0});
}
function fromHash(){
  const m=location.hash.match(/^#([\d.]+)-(\d+)$/);
  if(m){const li=lessons.findIndex(L=>L.num===m[1]);if(li>=0&&lessons[li].steps){go(li,Math.max(0,Math.min(+m[2]-1,lessons[li].steps.length-1)));return}}
  // ?s=42 — открыть раздел (переход со старой страницы курса) там, где ученик остановился
  const sn=new URLSearchParams(location.search).get("s"),sec=sn&&SECS.find(s=>String(s.num)===sn);
  if(sec){const q=SS[sec.key].pos;if(q&&sec.lessons[q.li]&&sec.lessons[q.li].steps){go(sec.off+q.li,q.si);return}FROM_S=sec;go(sec.off,null);return}
  const p=savedPos();if(p)go(p.li,p.si);else go(0,0);
}

/* table of contents toggle */
function setToc(open){
  root.classList.toggle("toc-closed",!open);
  try{localStorage.setItem("toc",open?"open":"closed")}catch(e){}
  const b=$("tocbtn");b.setAttribute("aria-label",open?"Скрыть оглавление":"Показать оглавление");b.setAttribute("aria-expanded",open);
}
if(matchMedia("(max-width:900px)").matches&&!root.classList.contains("toc-closed"))setToc(false);
$("tocbtn").onclick=()=>setToc(root.classList.contains("toc-closed"));
$("scrim").onclick=()=>setToc(false);
$("tocbtn").setAttribute("aria-expanded",!root.classList.contains("toc-closed"));

/* theme toggle */
(function(){
  const b=$("theme");
  const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const paint=()=>{const d=isDark();b.innerHTML=d?SUN:MOON;b.title=d?"Светлая тема":"Тёмная тема";b.setAttribute("aria-label",b.title)};
  b.onclick=()=>{const t=isDark()?"light":"dark";root.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}paint()};
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paint);
  paint();
})();
/* скачивание файлов без перехода на другую страницу (Яндекс Браузер перехватывает .xlsx) */
document.addEventListener("click",async e=>{
  const a=e.target.closest&&e.target.closest("a.file[href]");
  if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.button!==0)return;
  e.preventDefault();
  if(a.dataset.busy)return;a.dataset.busy="1";
  const href=a.getAttribute("href"),name=decodeURIComponent(href.split("/").pop());
  try{
    const r=await fetch(href,{cache:"no-store"});if(!r.ok)throw new Error(r.status);
    const blob=new Blob([await r.arrayBuffer()],{type:"application/octet-stream"});
    const url=URL.createObjectURL(blob),t=document.createElement("a");
    t.href=url;t.download=name;t.style.display="none";document.body.appendChild(t);t.click();
    setTimeout(()=>{URL.revokeObjectURL(url);t.remove()},4000);
  }catch(err){location.href=href}
  finally{delete a.dataset.busy}
});
window.addEventListener("hashchange",fromHash);
fromHash();
initSync().then(loadFires);
}
if(window.COURSE)__course();else window.__course=__course;
