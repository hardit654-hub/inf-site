<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Личный кабинет · Артём Свинченко</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16181c">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Кабинет: тёмная полоса как на главной, ниже карточки. Ученик видит свои курсы, учитель — учеников и их прогресс. */
:root{
  --hero:#0f1114; --hero-2:#1b1e22; --hero-ink:#eef0f3; --hero-muted:#9aa0aa;
  --green:#66cc66; --green-d:#4fae4f; --green-ink:#2e8b2e; --green-soft:#e9f6e9;
  --red:#d9534f; --red-soft:#fbeaea; --amber:#c98a12; --amber-soft:#fdf3df;
  --bg:#f5f6f4; --card:#ffffff; --ink:#1c1f24; --muted:#636a74; --line:#dfe3e0; --chip:#eef0ee;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111316; --card:#1a1d21; --ink:#e7e9ec; --muted:#9aa0aa; --line:#2a2e34; --chip:#23272c; --green-ink:#7ad67a; --green-soft:#1b3020;
  --red:#ec6b67; --red-soft:#3a1f1f; --amber:#e3a83a; --amber-soft:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --card:#1a1d21; --ink:#e7e9ec; --muted:#9aa0aa; --line:#2a2e34; --chip:#23272c; --green-ink:#7ad67a; --green-soft:#1b3020;
  --red:#ec6b67; --red-soft:#3a1f1f; --amber:#e3a83a; --amber-soft:#3a2f17; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);min-height:100vh}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar{background:var(--hero);color:var(--hero-ink);padding-top:env(safe-area-inset-top,0px);position:relative;overflow:hidden}
.bar::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.bar-in{position:relative;display:flex;align-items:center;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.mark{width:36px;height:36px;border-radius:10px;background:var(--green);color:#10331a;display:flex;align-items:center;justify-content:center;font:700 15px var(--f-mono);flex:none}
.brand span{font:600 14px var(--f-body);color:var(--hero-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.who{font:500 14px var(--f-body);color:var(--hero-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.who small{color:var(--hero-muted);font-size:12px;margin-left:6px}
.hbtn{height:38px;border-radius:10px;border:1px solid #ffffff22;background:var(--hero-2);color:var(--hero-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 12px;font:500 14px var(--f-body);flex:none;text-decoration:none}
.hbtn.sq{width:38px;padding:0}
.hbtn svg{width:18px;height:18px}
.hbtn:hover{border-color:#ffffff55}
.title{position:relative;padding-block:6px 26px}
.title h1{font:700 clamp(22px,4vw,32px)/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
.title p{margin:6px 0 0;color:var(--hero-muted);font-size:15px}

main{padding-block:24px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card+.card{margin-top:16px}
.card h2{font:600 19px/1.3 var(--f-body);margin:0 0 4px}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.narrow{max-width:440px;margin:0 auto}
label{display:block;font-size:14px;font-weight:500;margin:0 0 6px}
.field{margin-bottom:14px}
input[type=text],input[type=password],input[type=number],input[type=date],select.sel,input:not([type]){width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px var(--f-body);padding:0 12px}
input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px #66cc6633}
.btn{height:44px;border-radius:10px;border:0;background:var(--green);color:#0f2a12;font:600 15px var(--f-body);padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--green-d)}
.btn[disabled]{opacity:.6;cursor:default}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.small{height:34px;padding:0 12px;font-size:13.5px;font-weight:500}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--red)}
.btn.danger.sure{background:var(--red);color:#fff;border-color:var(--red)}
.msg{font-size:14px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--red-soft);color:var(--red)}
.msg.good{background:var(--green-soft);color:var(--green-ink)}
.hint{font-size:13.5px;color:var(--muted);margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row .field{flex:1 1 180px;margin-bottom:0}

/* курсы ученика */
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.course{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.course h3{margin:0;font:600 17px/1.3 var(--f-body)}
.meter{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:99px}
.cnum{font:600 13px var(--f-mono);color:var(--muted)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 46px;gap:10px;align-items:center;font-size:14px}
.lrow span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .meter{height:6px}
.lrow b{font:500 12.5px var(--f-mono);color:var(--muted);text-align:right}
.course .btn{align-self:flex-start;margin-top:4px}

/* вкладки учителя */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{height:38px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14.5px var(--f-body);padding:0 16px;cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cred{margin-top:16px;border:1px dashed var(--green);background:var(--green-soft);border-radius:12px;padding:14px 16px}
.cred pre{margin:0 0 10px;font:500 14.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.cred p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-weight:500;color:var(--muted);font-size:13px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.mono{font-family:var(--f-mono);font-size:13.5px}
td.acts{white-space:nowrap;text-align:right}
td.acts .btn{margin-left:6px}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.note{font-size:13px;color:var(--muted)}

/* прогресс класса */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pt td,.pt th{text-align:center}
.pt td:first-child,.pt th:first-child{text-align:left}
.pt tr.srow{cursor:pointer}
.pt tr.srow:hover td{background:var(--bg)}
.cell{display:inline-flex;flex-direction:column;align-items:center;gap:4px;min-width:52px}
.cell b{font:600 13px var(--f-mono)}
.cell .meter{width:46px;height:5px}
.cell.full b{color:var(--green-ink)}
.cell.zero b{color:var(--muted);font-weight:400}
.detail td{background:var(--bg);text-align:left!important;padding:14px 16px}
.dl{display:flex;flex-direction:column;gap:12px}
.dl h4{margin:0 0 6px;font:500 13.5px var(--f-body)}
.sqs{display:flex;flex-wrap:wrap;gap:6px}
.sq{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font:600 12px var(--f-mono);color:var(--muted);position:relative;cursor:default}
.sq.ok{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
.sq.bad{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.sq.rev::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--amber);border:2px solid var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sq{width:18px;height:18px;border-radius:5px;font-size:0}
.legend .sq.rev::after{width:7px;height:7px;top:-3px;right:-3px}

details.pw{margin-top:16px}
details.pw summary{cursor:pointer;color:var(--muted);font-size:14px}
details.pw .row{margin-top:12px}
.loading{color:var(--muted);text-align:center;padding:60px 0}
.coin{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-3px}
.wallet{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#fff6d6,#fde7a6);color:#5a3d00;border:1px solid #f0cf6a;border-radius:14px;padding:18px 22px;margin-bottom:16px}
.wallet .coin{width:46px;height:46px}
.wallet b{font:700 30px/1 var(--f-display)}
.wallet span{display:block;font-size:14px;opacity:.8;margin-top:4px}
:root[data-theme="dark"] .wallet{background:linear-gradient(135deg,#3a2f12,#2a220e);color:#f6d77a;border-color:#5c4a17}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wallet{background:linear-gradient(135deg,#3a2f12,#2a220e);color:#f6d77a;border-color:#5c4a17}}
.lb{padding:0;overflow:hidden}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;margin-bottom:16px}
.duo .card{margin:0}
.ic{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.ic h2{margin:0}
.ic .em{font-size:22px}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:flex;align-items:center;gap:12px;font-size:15.5px}
.day b{min-width:110px;font-weight:600}
.day span{font:600 15px var(--f-mono);color:var(--green-ink);background:var(--green-soft);border-radius:8px;padding:3px 10px}
.next{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14.5px}
.next b{display:block;font-size:16px;margin-top:2px}
.hw{white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.hw a{color:var(--green-ink)}
.hwmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--muted)}
.due{font-weight:600;color:var(--ink)}
.due.late{color:var(--red)}
.done{display:inline-flex;align-items:center;gap:6px;color:var(--green-ink);font-weight:600}
.fbar{margin-bottom:16px}.fbar .seg{margin-bottom:10px}.fbar .seg.sub2{margin-bottom:0;padding-top:10px;border-top:1px solid var(--line)}
.tab .cnt{opacity:.6;font-size:.88em;margin-left:2px}.tab.sm{height:32px;font-size:13.5px;padding:0 12px}
.vlist{display:flex;flex-direction:column;gap:10px}.vrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.vrow b{display:block}.vrow .muted{font-size:13.5px}.vrow .acts{display:flex;gap:6px}
.bulk{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;margin:0 0 12px;border:1px dashed var(--line);border-radius:12px;font-size:14px;color:var(--muted)}
.bulk.on{border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--ink)}
.bacts,.bgrp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bgrp input{width:130px;height:34px;padding:0 10px}
th.ck,td.ck{width:28px;padding-right:0}td.ck input,th.ck input{width:18px;height:18px;cursor:pointer}
.mv{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;white-space:nowrap}
.mv button{border:0;background:var(--card);color:var(--muted);font:500 12.5px var(--f-body);padding:5px 10px;cursor:pointer}
.mv button+button{border-left:1px solid var(--line)}.mv button[aria-pressed=true]{background:var(--ink);color:var(--bg);cursor:default}
.mv button:not([aria-pressed=true]):hover{color:var(--ink);background:var(--green-soft)}.mvg{font-size:13px;margin-top:4px}
.fhw{margin-top:14px;gap:12px;align-items:center}.fhw .note{margin:0;flex:1 1 260px}
.glist{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;max-height:320px;overflow:auto}
.gs{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;flex-wrap:wrap}.gs input{width:18px;height:18px;flex:0 0 auto}
.gs .gcur{margin-left:auto;font-size:13px;color:var(--muted)}
.gmode{display:flex;gap:18px;flex-wrap:wrap}.gmode label{display:flex;gap:7px;align-items:center;cursor:pointer;font-weight:400}
.dl{margin-top:16px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);border-left:5px solid var(--amber);background:var(--amber-soft);display:flex;flex-direction:column;gap:2px}
.dl .dll{font-size:14px;color:var(--muted)}.dl .dld{font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.dl .dlc{font-size:15px;font-weight:600;color:var(--amber);margin-top:2px}
.dl.hot{border-left-color:var(--red);background:var(--red-soft)}.dl.hot .dlc{color:var(--red)}
.dl.late{border-left-color:var(--red);background:var(--red-soft)}.dl.late .dlc{color:var(--red)}
.dl.ok{border-left-color:var(--green);background:var(--green-soft)}.dl.ok .dlc{color:var(--green-ink)}
.chip2{display:inline-block;font-size:12.5px;border-radius:99px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip2.ok{color:var(--green-ink);border-color:var(--green);background:var(--green-soft)}
.chip2.wait{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.chip2.late{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.sum{font-size:13.5px;line-height:1.5}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding:10px 12px;resize:vertical}
textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px #66cc6633}
.srow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.srow select,.srow input{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:15px var(--f-body);padding:0 10px}
.srow input[type=time]{width:120px}
.srow .dur{width:90px}
.edit{border:2px solid var(--green)}
.pick{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg)}
.pick>summary{cursor:pointer;padding:11px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.pick>summary .pc{margin-left:auto;font:600 12.5px var(--f-mono);color:var(--muted)}
.pick>summary .pc.on{color:var(--green-ink)}
.pick .lessons{padding:0 10px 10px}
.pl{border-top:1px solid var(--line)}
.pl>summary{cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 4px;font-size:15px}
.pl>summary small{color:var(--muted);margin-left:auto;white-space:nowrap}
.pl input,.pt input{width:18px;height:18px;accent-color:var(--green-d);flex:none}
.tasks{display:flex;flex-direction:column;padding:0 0 8px 32px}
.pt{display:flex;align-items:flex-start;gap:10px;padding:6px 4px;font-size:14px;line-height:1.4;border-radius:8px;cursor:pointer}
.pt:hover{background:var(--card)}
.pt b{white-space:nowrap}
.pt span{flex:1;color:var(--muted)}
.pt a{font-size:13px;color:var(--green-ink);white-space:nowrap}
.hwl{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.hwl h4{margin:10px 0 2px;font:600 14px var(--f-body);color:var(--muted)}
.hwb{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;text-decoration:none;color:var(--ink);background:var(--amber-soft);border:1px solid transparent;border-left:4px solid var(--amber)}
.hwb:hover{border-color:var(--amber)}
.hwb .hwbt{flex:1;min-width:0;font-weight:600;font-size:15.5px;line-height:1.3}.hwb .hwbt small{color:var(--muted);font-weight:500;margin-right:8px;font-family:var(--f-mono);font-size:13px}
.hwb .hwbc{font:700 13.5px var(--f-mono);color:var(--amber);white-space:nowrap}
.hwb .hwba{font-size:22px;line-height:1;color:var(--muted)}
.hwb.ok{background:var(--green-soft);border-left-color:var(--green)}.hwb.ok:hover{border-color:var(--green)}.hwb.ok .hwbc{color:var(--green-ink)}
.hwi{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--card)}
.hwi:hover{border-color:var(--green)}
.hwd summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 2px}.hwd[open] summary{margin-bottom:6px}.hwd .hwi{margin-bottom:6px}
.hwi .ic2{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.hwi.ok .ic2{background:var(--green);border-color:var(--green);color:#0f2a12}
.hwi.ok{background:var(--green-soft);border-color:transparent}
.hwi b{white-space:nowrap}
.hwi span{flex:1;min-width:0;font-size:13.5px;line-height:1.35;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hwbar{display:flex;align-items:center;gap:10px;font-size:14px;margin:2px 0 6px}
.hwbar .meter{flex:1;max-width:220px}
.hwnote{margin-bottom:10px}
.lb h2{display:flex;align-items:center;gap:8px;padding:20px 22px 4px}
.lb .sub{padding:0 22px;margin-bottom:10px}
.lbrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 22px;border-top:1px solid var(--line)}
.lbrow .pl{font:700 18px var(--f-display);text-align:center;color:var(--muted)}
.lbrow .pl.m{font-size:24px}
.lbrow .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbrow .nm small{color:var(--muted);font-weight:400;margin-left:6px}
.lbrow .cs{display:inline-flex;align-items:center;gap:6px;font:700 16px var(--f-mono)}
.lbrow .cs .coin{width:18px;height:18px}
.lbrow.me{background:var(--green-soft)}
.lbrow.gap{padding:4px 22px;color:var(--muted);font-size:13px;display:block;text-align:center;border-top:1px dashed var(--line)}
.lb .empty{border-top:1px solid var(--line)}
.ccell{display:inline-flex;align-items:center;gap:5px;font:600 14px var(--f-mono)}

<body>
<header class="bar">
  <div class="wrap bar-in">
    <a class="brand" href="../"><span class="mark">AS</span><span>Артём Свинченко · информатика</span></a>
    <div class="grow"></div>
    <span class="who" id="who" hidden></span>
    <button class="hbtn" id="logout" type="button" hidden>Выйти</button>
    <button class="hbtn sq" id="theme" type="button" aria-label="Переключить тему"></button>
  </div>
  <div class="wrap title"><h1 id="h1">Личный кабинет</h1><p id="hsub">Вход для учеников</p></div>
</header>

<main class="wrap" id="app"><div class="loading">Загрузка…</div></main>

<script>
(function(){
const API="../api/index.php";
const app=document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COIN='<svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#f6c43a"/><circle cx="10" cy="10" r="9" fill="none" stroke="#c98a12" stroke-width="1.2"/><circle cx="10" cy="10" r="5.6" fill="none" stroke="#c98a12" stroke-width="1.4"/><path d="M6.2 6.4a5 5 0 0 1 4-2" stroke="#fff6cf" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>';
const DAYS=["","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"],DS=["","Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)»"])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function nextLesson(sch){
  if(!sch||!sch.length)return null;const now=new Date();let best=null;
  for(let add=0;add<8;add++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+add);const wd=(d.getDay()+6)%7+1;
    sch.filter(x=>x.day===wd).forEach(x=>{const [h,m]=x.time.split(":").map(Number);const st=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);const end=new Date(st.getTime()+(x.dur||60)*6e4);
      if(end>now&&(!best||st<best.st))best={st,end,x,now:st<=now}})
    if(best)break}
  return best;
}
function fmtNext(b){
  if(!b)return"";if(b.now)return"Идёт прямо сейчас — до "+b.end.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  const days=Math.round((new Date(b.st.toDateString())-new Date(new Date().toDateString()))/864e5);
  const d=days===0?"сегодня":days===1?"завтра":b.st.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
  return d+", "+b.x.time;
}
function fmtDue(due){if(!due)return"";const d=new Date(due+"T23:59:59");return d.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"})}
const isLate=due=>due&&new Date(due+"T23:59:59")<new Date();
function hwChip(i){
  if(!i||(!i.homework&&!(i.hw_tasks||[]).length))return'<span class="chip2">нет</span>';
  const pg=i.hw_prog;
  if(pg&&pg.total){const all=pg.solved>=pg.total;return`<span class="chip2 ${all?"ok":isLate(i.hw_due)?"late":"wait"}">${all?"✓ ":""}${pg.solved}/${pg.total} задач${!all&&i.hw_due?" до "+new Date(i.hw_due).toLocaleDateString("ru-RU",{day:"numeric",month:"numeric"}):""}</span>`}
  if(i.hw_done)return'<span class="chip2 ok">✓ сделано</span>';
  if(isLate(i.hw_due))return'<span class="chip2 late">просрочено</span>';
  return'<span class="chip2 wait">задано'+(i.hw_due?" до "+new Date(i.hw_due).toLocaleDateString("ru-RU",{day:"numeric",month:"numeric"}):"")+'</span>';
}
const SITE=location.origin+location.pathname.replace(/kabinet\/.*$/,"kabinet/");
let ME=null,CAT=null;

async function api(action,body,params){
  const url=API+"?action="+action+(params?"&"+new URLSearchParams(params):"");
  const opt=body?{method:"POST",headers:{"Content-Type":"application/json","X-Inf":"1"},body:JSON.stringify(body),credentials:"same-origin"}:{credentials:"same-origin",cache:"no-store"};
  let r;
  try{r=await fetch(url,opt)}catch(e){throw new Error("Нет связи с сервером. Проверьте интернет.")}
  let j=null;try{j=await r.json()}catch(e){}
  if(!j)throw new Error("Сервер ответил ошибкой ("+r.status+")");
  if(!j.ok)throw new Error(j.error||"Ошибка");
  return j;
}
async function catalog(){
  if(!CAT){const r=await fetch("courses.json",{cache:"no-store"});CAT=(await r.json()).courses;
    // закрытые варианты (СтатГрад и т. п.) — только для вошедших
    if(ME){try{CAT=CAT.concat((await api("materials")).materials||[])}catch(e){}}}
  return CAT;
}
function header(){
  const who=document.getElementById("who"),lo=document.getElementById("logout");
  who.hidden=lo.hidden=!ME;
  if(ME)who.innerHTML=esc(ME.name)+'<small class="hide-sm">'+esc(ME.login)+"</small>";
  document.getElementById("h1").textContent=ME?(ME.role==="teacher"?"Кабинет учителя":"Привет, "+ME.name.split(" ")[0]+"!"):"Личный кабинет";
  document.getElementById("hsub").textContent=ME?(ME.role==="teacher"?"Ученики и их прогресс по курсам":"Твои курсы и прогресс — сохраняется на любом устройстве"):"Вход для учеников";
}
function setBusy(btn,on,text){if(on){btn.dataset.t=btn.textContent;btn.textContent=text||"Подождите…";btn.disabled=true}else{btn.textContent=btn.dataset.t||btn.textContent;btn.disabled=false}}
function msg(el,text,good){el.hidden=!text;el.textContent=text||"";el.className="msg"+(good?" good":"")}
const nextUrl=()=>{const n=new URLSearchParams(location.search).get("next")||"";return /^\.\.\/[\w\-\/]*\/?(\?m=[\w\-]+)?(#[\w.\-]*)?$/.test(n)?n:""};
function clearLocal(){try{Object.keys(localStorage).filter(k=>k.indexOf("course-")===0).forEach(k=>localStorage.removeItem(k))}catch(e){}}

/* ---------- вход ---------- */
function viewLogin(teacherExists){
  if(!teacherExists)return viewSetup();
  app.innerHTML=`<div class="card narrow"><h2>Вход</h2><p class="sub">Логин и пароль выдаёт преподаватель.</p>
   <form id="f" autocomplete="on">
    <div class="field"><label for="l">Логин</label><input id="l" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="p">Пароль</label><input id="p" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn wide" id="go">Войти</button><div id="m" hidden></div>
   </form><p class="hint">Забыли пароль? Напишите преподавателю — он выдаст новый.</p></div>`;
  const f=document.getElementById("f"),m=document.getElementById("m"),go=document.getElementById("go");
  document.getElementById("l").focus();
  f.onsubmit=async e=>{e.preventDefault();msg(m,"");setBusy(go,true,"Входим…");
    try{const j=await api("login",{login:f.l.value,password:f.p.value});ME=j.user;CAT=null;clearLocalIfOther();const n=nextUrl();if(n){location.href=n;return}route()}
    catch(err){msg(m,err.message);setBusy(go,false)}};
}
function clearLocalIfOther(){
  // На общем компьютере не смешиваем прогресс разных учеников: чужой локальный прогресс убираем.
  try{Object.keys(localStorage).filter(k=>k.indexOf("course-")===0).forEach(k=>{const x=JSON.parse(localStorage.getItem(k)||"null");if(x&&x.uid&&x.uid!==ME.id)localStorage.removeItem(k)})}catch(e){}
}
function viewSetup(){
  app.innerHTML=`<div class="card narrow"><h2>Первая настройка</h2><p class="sub">Создайте учётную запись учителя. Это можно сделать один раз; потом форма исчезнет.</p>
   <form id="f">
    <div class="field"><label for="c">Код настройки</label><input id="c" type="password" autocomplete="off" required><p class="note">Это пароль базы данных, который вы сохранили в секрете DB_PASSWORD на GitHub.</p></div>
    <div class="field"><label for="n">Имя</label><input id="n" value="Артём Свинченко" required></div>
    <div class="field"><label for="l">Логин учителя</label><input id="l" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="например, artem" required></div>
    <div class="field"><label for="p">Пароль (не короче 8 символов)</label><input id="p" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="field"><label for="p2">Пароль ещё раз</label><input id="p2" type="password" autocomplete="new-password" required></div>
    <button class="btn wide" id="go">Создать и войти</button><div id="m" hidden></div>
   </form></div>`;
  const f=document.getElementById("f"),m=document.getElementById("m"),go=document.getElementById("go");
  f.onsubmit=async e=>{e.preventDefault();msg(m,"");
    if(f.p.value!==f.p2.value){msg(m,"Пароли не совпадают");return}
    setBusy(go,true,"Создаём…");
    try{const j=await api("setup",{code:f.c.value,name:f.n.value,login:f.l.value,password:f.p.value});ME=j.user;route()}
    catch(err){msg(m,err.message);setBusy(go,false)}};
}

/* ключ шага (i — позиция с 0) и позиция шага по ключу */
const K=(l,i)=>l.keys?l.keys[i]:String(i+1);
const P=(l,k)=>l.keys?l.keys.indexOf(String(k))+1:+k;
/* ---------- прогресс: подсчёт ---------- */
function stats(course,data){
  const st=(data&&data.st)||{};let done=0,total=0;
  const lessons=course.lessons.map(l=>{let d=0,t=0;const cells=[];
    l.steps.forEach((s,i)=>{if(s!=="task")return;t++;const x=st[l.num+"/"+K(l,i)]||{};if(x.ok)d++;cells.push({n:i+1,x})});
    done+=d;total+=t;return{num:l.num,title:l.title,done:d,total:t,cells}});
  return{done,total,lessons,touched:Object.keys(st).length>0};
}
const pct=(a,b)=>b?Math.round(100*a/b):0;
function ago(ts){
  if(!ts)return"ещё не входил";
  const d=new Date(ts*1000),now=new Date(),t=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  const days=Math.floor((new Date(now.toDateString())-new Date(d.toDateString()))/864e5);
  if(days===0)return"сегодня, "+t;if(days===1)return"вчера, "+t;
  return d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})+(d.getFullYear()!==now.getFullYear()?" "+d.getFullYear():"");
}

/* ---------- ученик ---------- */
async function viewStudent(){
  const [cat,p]=await Promise.all([catalog(),api("my_progress")]);
  const by=p.coins_by||{};
  let info={schedule:[],homework:""};try{info=await api("info_get")}catch(e){}
  HWCTX={cat,prog:p.progress};
  app.innerHTML=infoCards(info)+`<div class="wallet">${COIN}<div><b>${p.coins||0}</b><span>${coinWord(p.coins||0)} в копилке. 3 за каждую решённую задачу, −1 за каждую ошибку; если посмотреть ответ — 0.</span></div></div><div id="lbslot" style="margin-bottom:16px"></div><div class="courses">${groupCat(cat).map(c=>{if(c.parts)return egeCard(c,p,by);const s=stats(c,(p.progress[c.key]||{}).data);
    return `<article class="course"><h3>${esc(c.title)}</h3>
      <div><div class="meter"><i style="width:${pct(s.done,s.total)}%"></i></div></div>
      <div class="cnum">${s.done} из ${s.total} задач решено${by[c.key]?` · ${COIN} ${by[c.key]}`:""}</div>
      ${s.lessons.filter(l=>l.total).map(l=>`<div class="lrow"><span>${c.kind==="variant"?`<a href="${esc(c.url)}#${esc(l.num)}-1">${esc(l.title)}</a>`:esc(l.num+" "+l.title)}</span><div class="meter"><i style="width:${pct(l.done,l.total)}%"></i></div><b>${l.done}/${l.total}</b></div>`).join("")}
      <a class="btn" href="${esc(c.url)}">${s.touched?"Продолжить":"Начать"}</a></article>`}).join("")}</div>
    ${pwCard()}`;
  bindPw();
  bindHw();
  lbCard(false).then(h=>{const s=document.getElementById("lbslot");if(s)s.innerHTML=h});
}
let HWCTX={cat:[],prog:{}};
/* разделы одного курса (ЕГЭ: № 4, № 12, …) — одной карточкой */
function groupCat(cat){
  const out=[],g={};
  cat.forEach(c=>{if(!c.group){out.push(c);return}
    if(!g[c.group]){g[c.group]={title:c.group,url:c.url,parts:[]};out.push(g[c.group])}g[c.group].parts.push(c)});
  return out;
}
function egeCard(G,p,by){
  let done=0,total=0,coins=0,touched=false;
  const rows=G.parts.map(c=>{const s=stats(c,(p.progress[c.key]||{}).data);done+=s.done;total+=s.total;coins+=by[c.key]||0;touched=touched||s.touched;
    return `<div class="lrow"><span>${esc(c.title)}</span><div class="meter"><i style="width:${pct(s.done,s.total)}%"></i></div><b>${s.done}/${s.total}</b></div>`}).join("");
  return `<article class="course"><h3>${esc(G.title)}</h3>
    <div><div class="meter"><i style="width:${pct(done,total)}%"></i></div></div>
    <div class="cnum">${done} из ${total} задач решено${coins?` · ${COIN} ${coins}`:""}</div>${rows}
    <a class="btn" href="${esc(G.url)}">${touched?"Продолжить":"Начать"}</a></article>`;
}
function hwTasksHTML(tasks){
  /* домашка блоками: один блок на урок («42.1 Теория — 12 задач»); нажатие открывает курс на первой нерешённой задаче */
  if(!tasks||!tasks.length)return"";
  const groups=[];let solved=0,n=0;
  tasks.forEach(tk=>{const [key,sid]=tk.split("|");const c=HWCTX.cat.find(x=>x.key===key);if(!c)return;
    const [ln,sk]=sid.split("/");const L=c.lessons.find(l=>l.num===ln);if(!L)return;const sn=P(L,sk);if(!sn)return;
    const st=((HWCTX.prog[key]||{}).data||{}).st||{};const ok=!!(st[sid]&&st[sid].ok);n++;if(ok)solved++;
    let g=groups.find(x=>x.key===key);if(!g){g={key,c,blocks:[]};groups.push(g)}
    let b=g.blocks.find(x=>x.ln===ln);if(!b){b={ln,L,all:0,ok:0,first:null,min:sn};g.blocks.push(b)}
    b.all++;if(ok)b.ok++;else if(b.first==null||sn<b.first)b.first=sn;if(sn<b.min)b.min=sn});
  const block=(g,b)=>{const vr=g.c.kind==="variant",done=b.ok>=b.all,to=done?b.min:b.first;
    const cnt=done?`✓ ${b.all} из ${b.all}`:b.ok?`${b.ok} из ${b.all}`:`${b.all} ${taskWord(b.all)}`;
    return `<a class="hwb${done?" ok":""}" href="${esc(g.c.url)}#${esc(b.ln)}-${to}"><span class="hwbt">${vr?"":`<small>${esc(b.ln)}</small>`}${esc(b.L.title)}</span><span class="hwbc">${cnt}</span><span class="hwba" aria-hidden="true">›</span></a>`};
  return `<div class="hwbar">${solved>=n?"<b>✓ Все задачи решены</b>":`Решено <b>${solved} из ${n}</b>`}<div class="meter"><i style="width:${pct(solved,n)}%"></i></div></div>
    <div class="hwl">${groups.map(g=>`<h4>${esc(g.c.title)}</h4>${g.blocks.map(b=>block(g,b)).join("")}`).join("")}</div>`;
}
function taskWord(n){const m=n%10,h=n%100;return m===1&&h!==11?"задача":m>=2&&m<=4&&(h<12||h>14)?"задачи":"задач"}
function hwSolved(tasks){
  let s=0;(tasks||[]).forEach(tk=>{const [key,sid]=tk.split("|");const st=((HWCTX.prog[key]||{}).data||{}).st||{};if(st[sid]&&st[sid].ok)s++});
  return s;
}
function deadlineHTML(i){
  const tasks=i.hw_tasks||[];if(!i.hw_due||(!i.homework&&!tasks.length))return"";
  const done=tasks.length?hwSolved(tasks)>=tasks.length&&(!i.homework||i.hw_done):!!i.hw_done;
  const due=new Date(i.hw_due+"T00:00:00"),today=new Date(new Date().toDateString());
  const days=Math.round((due-today)/864e5);
  let cls,left;
  if(done){cls="ok";left="✓ Домашка сделана"}
  else if(days<0){cls="late";left="Просрочено на "+(-days)+" "+dayWord(-days)}
  else if(days===0){cls="hot";left="Сегодня — последний день"}
  else if(days===1){cls="hot";left="Остался 1 день — до завтра"}
  else{cls="wait";left="Осталось "+days+" "+dayWord(days)}
  return `<div class="dl ${cls}"><span class="dll">Сдать домашку до</span><b class="dld">${due.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"})}</b><span class="dlc">${left}</span></div>`;
}
function dayWord(n){const m=n%10,h=n%100;return m===1&&h!==11?"день":m>=2&&m<=4&&(h<12||h>14)?"дня":"дней"}
function infoCards(i){
  const nb=nextLesson(i.schedule);
  const sch=i.schedule&&i.schedule.length?`<div class="days">${i.schedule.map(x=>`<div class="day"><b>${DAYS[x.day]}</b><span>${x.time}</span><small class="muted">${x.dur||60} мин</small></div>`).join("")}</div>${nb?`<div class="next">Следующее занятие<b>${fmtNext(nb)}</b></div>`:""}`
    :`<p class="muted" style="margin:0">Расписание пока не назначено.</p>`;
  const tasks=i.hw_tasks||[];
  const hw=(i.homework||tasks.length)?`${i.homework?`<div class="hw hwnote">${linkify(i.homework)}</div>`:""}${hwTasksHTML(tasks)}<div class="hwmeta">${i.hw_due?`<span>Сделать до <span class="due${isLate(i.hw_due)&&!i.hw_done?" late":""}">${fmtDue(i.hw_due)}</span></span>`:""}
      ${i.homework?(i.hw_done?`<span class="done">✓ Отмечено как сделанное</span><button class="btn ghost small" id="hwundo" type="button">Отменить</button>`:`<button class="btn small" id="hwdone" type="button">Я сделал(а)</button>`):""}</div>`
    :`<p class="muted" style="margin:0">Сейчас домашнего задания нет.</p>`;
  return `<div class="duo"><section class="card" id="schcard"><div class="ic"><span class="em">📅</span><h2>Расписание занятий</h2></div>${sch}${deadlineHTML(i)}</section>
    <section class="card" id="hwcard"><div class="ic"><span class="em">📝</span><h2>Домашнее задание</h2></div>${hw}</section></div>`;
}
function bindHw(){
  const d=document.getElementById("hwdone"),u=document.getElementById("hwundo");
  const go=async done=>{try{const i=await api("hw_done",{done});const c=document.createElement("div");c.innerHTML=infoCards(i);document.getElementById("hwcard").replaceWith(c.querySelector("#hwcard"));const sc=document.getElementById("schcard");if(sc)sc.replaceWith(c.querySelector("#schcard"));bindHw()}catch(e){}};
  if(d)d.onclick=()=>go(true);if(u)u.onclick=()=>go(false);
}
async function lbCard(teacher){
  let d;try{d=await api("leaderboard")}catch(e){return ""}
  const medal=["🥇","🥈","🥉"];
  const row=r=>`<div class="lbrow${r.me?" me":""}"><span class="pl${r.place<=3?" m":""}">${r.place&&r.place<=3?medal[r.place-1]:(r.place||"—")}</span><span class="nm">${esc(r.name)}${r.me?"<small>это ты</small>":""}</span><span class="cs">${COIN}${r.coins}</span></div>`;
  let h=`<section class="card lb"><h2>🏆 Топ‑5 по монеткам</h2><p class="sub">${teacher?"Ученики видят имя и первую букву фамилии.":"Решай задачи без ошибок — так монеток больше всего."}</p>`;
  if(!d.top.length) h+=`<div class="empty">Пока ни у кого нет монеток. ${teacher?"":"Стань первым!"}</div>`;
  h+=d.top.map(row).join("");
  if(d.me&&!d.top.some(r=>r.me)) h+=`<div class="lbrow gap">…</div>`+row(d.me);
  return h+`</section>`;
}
function coinWord(n){const a=n%10,b=n%100;return (a===1&&b!==11?"монетка":a>=2&&a<=4&&(b<12||b>14)?"монетки":"монеток")}
function pwCard(){return `<div class="card" style="margin-top:16px"><details class="pw"><summary>Сменить пароль</summary>
  <form id="pwf"><div class="row"><div class="field"><label for="po">Старый пароль</label><input id="po" type="password" autocomplete="current-password" required></div>
  <div class="field"><label for="pn">Новый пароль</label><input id="pn" type="password" autocomplete="new-password" minlength="4" required></div>
  <button class="btn" id="pwb">Сохранить</button></div><div id="pwm" hidden></div></form></details></div>`}
function bindPw(){
  const f=document.getElementById("pwf"),m=document.getElementById("pwm"),b=document.getElementById("pwb");
  f.onsubmit=async e=>{e.preventDefault();setBusy(b,true);
    try{await api("password",{old:f.po.value,new:f.pn.value});f.reset();msg(m,"Пароль изменён",true)}catch(err){msg(m,err.message)}setBusy(b,false)};
}

/* ---------- учитель ---------- */
let TAB="students",STUDENTS=[],COURSE_I=0,OPEN=null;
/* фильтр учеников: категория (Школа / Репетиторство) и группа (класс). "" — все, "-" — не указано */
const CATS=["Школа","Репетиторство"];
let FCAT="",FGRP="";
try{FCAT=localStorage.getItem("kab-fcat")||"";FGRP=localStorage.getItem("kab-fgrp")||""}catch(e){}
try{TAB=sessionStorage.getItem("kab-tab")||TAB;COURSE_I=+(sessionStorage.getItem("kab-course")||0)}catch(e){}
async function viewTeacher(){
  app.innerHTML=`<nav class="tabs" role="tablist">
     <button class="tab" role="tab" data-t="students">Ученики</button>
     <button class="tab" role="tab" data-t="progress">Прогресс</button>
     <button class="tab" role="tab" data-t="variants">Варианты</button>
     <button class="tab" role="tab" data-t="rating">Рейтинг</button></nav><div id="pane"><div class="loading">Загрузка…</div></div>`;
  app.querySelectorAll(".tab").forEach(b=>{b.setAttribute("aria-selected",b.dataset.t===TAB);b.onclick=()=>{TAB=b.dataset.t;try{sessionStorage.setItem("kab-tab",TAB)}catch(e){}viewTeacher()}});
  try{STUDENTS=(await api("students")).students}catch(e){document.getElementById("pane").innerHTML=`<div class="msg">${esc(e.message)}</div>`;return}
  if(TAB==="rating"){document.getElementById("pane").innerHTML=await lbCard(true);return}
  if(TAB==="variants"){paneVariants();return}
  TAB==="students"?paneStudents():paneProgress();
}
function credText(login,pass){return "Сайт: "+SITE+"\nЛогин: "+login+"\nПароль: "+pass}
function credBox(name,login,pass){
  return `<div class="cred"><p>Данные для входа <b>${esc(name)}</b> — пароль показывается один раз, отправьте его ученику сейчас:</p>
   <pre id="ct">${esc(credText(login,pass))}</pre><button class="btn small" id="cp" type="button">Скопировать</button></div>`;
}
function bindCopy(){const b=document.getElementById("cp");if(!b)return;b.onclick=async()=>{const t=document.getElementById("ct").textContent;
  try{await navigator.clipboard.writeText(t);b.textContent="Скопировано"}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("ct"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Выделено — нажмите Копировать"}
  setTimeout(()=>b.textContent="Скопировать",2000)}}
function paneStudents(cred){
  const pane=document.getElementById("pane");
  const V=visible();
  pane.innerHTML=`<datalist id="grplist">${groups().map(([g])=>`<option value="${esc(g)}">`).join("")}</datalist>${filterBar(true)}<div id="editslot"></div>
   <div class="card"><h2>Ученики · ${esc(fLabel())} · ${V.length}</h2>
    ${V.length?`<div class="bulk" id="bulk"><span class="bn" id="bn">Отметьте учеников галочками, чтобы перенести сразу нескольких</span>
     <span class="bacts"><button class="btn small" type="button" data-bcat="Школа" disabled>→ Школа</button><button class="btn small" type="button" data-bcat="Репетиторство" disabled>→ Репетиторство</button>
     <span class="bgrp"><input id="bg" list="grplist" placeholder="10 класс" aria-label="Класс для выбранных"><button class="btn ghost small" type="button" id="bgb" disabled>Поставить класс</button></span></span></div>`:""}
    <div class="tbl-wrap"><table><thead><tr><th class="ck">${V.length?'<input type="checkbox" id="ckall" aria-label="Отметить всех">':""}</th><th>Имя</th><th class="hide-sm">Логин</th><th>Категория и класс</th><th>Монетки</th><th>Занятия и ДЗ</th><th class="hide-sm">Был на сайте</th><th></th></tr></thead><tbody>
    ${V.length?V.map(s=>`<tr><td class="ck"><input type="checkbox" class="ck1" value="${s.id}" aria-label="Отметить: ${esc(s.name)}"></td><td>${esc(s.name)}</td><td class="mono hide-sm">${esc(s.login)}</td><td><span class="mv">${CATS.map(c=>`<button type="button" data-mv="${s.id}" data-cat="${c}" aria-pressed="${catOf(s)===c}">${c}</button>`).join("")}</span>${grpOf(s)?`<div class="muted mvg">${esc(grpOf(s))}</div>`:""}</td><td><span class="ccell">${COIN}${s.coins||0}</span></td><td class="sum">${s.info&&s.info.schedule.length?s.info.schedule.map(x=>DS[x.day]+" "+x.time).join(", "):'<span class="muted">без расписания</span>'}<br>ДЗ: ${hwChip(s.info)}</td><td class="hide-sm muted">${ago(s.last_seen)}</td>
       <td class="acts"><button class="btn small" data-info="${s.id}">Занятия и ДЗ</button><button class="btn ghost small" data-reset="${s.id}">Новый пароль</button><button class="btn danger small" data-del="${s.id}">Удалить</button></td></tr>`).join("")
     :`<tr><td colspan="8" class="empty">${STUDENTS.length?"В этой группе пока никого.":"Пока никого. Добавьте первого ученика выше."}</td></tr>`}
    </tbody></table></div></div>
   <div class="card"><h2>Добавить ученика</h2><p class="sub">Логин придумается сам из имени, пароль — случайный.</p>
    <form id="af"><div class="row">
      <div class="field" style="flex-basis:240px"><label for="an">Имя и фамилия</label><input id="an" required placeholder="Иван Петров"></div>
      <div class="field"><label for="al">Логин <span class="muted">(необязательно)</span></label><input id="al" autocapitalize="none" spellcheck="false" placeholder="ivan.petrov"></div>
      <div class="field" style="flex:0 1 190px"><label for="aca">Категория</label>${catSel("aca",CATS.includes(FCAT)?FCAT:"")}</div>
      <div class="field" style="flex:0 1 160px"><label for="ao">Класс / группа</label><input id="ao" list="grplist" placeholder="10 класс" value="${FGRP&&FGRP!=="-"?esc(FGRP):""}"></div>
      <button class="btn" id="ab">Добавить</button></div><div id="am" hidden></div></form>
    <div id="credslot">${cred||""}</div></div>
   ${V.length?`<div class="card"><h2>Начислить монетки</h2><p class="sub">Бонус за работу на уроке, олимпиаду или просто так. Отрицательное число — списать.</p>
    <form id="cf"><div class="row">
      <div class="field" style="flex-basis:240px"><label for="cs">Ученик</label><select id="cs" class="sel">${V.map(s=>`<option value="${s.id}">${esc(s.name)} · ${s.coins||0}</option>`).join("")}</select></div>
      <div class="field" style="flex:0 1 140px"><label for="ca">Монеток</label><input id="ca" type="number" value="5" step="1" min="-1000" max="1000" required></div>
      <button class="btn" id="cb">Начислить</button></div><div id="cm" hidden></div></form></div>`:""}`;
  bindCopy();bindFilter(()=>paneStudents());bindMove();
  const f=document.getElementById("af"),m=document.getElementById("am"),b=document.getElementById("ab");
  f.onsubmit=async e=>{e.preventDefault();msg(m,"");setBusy(b,true,"Добавляем…");
    try{const j=await api("student_create",{name:f.an.value,login:f.al.value,note:f.ao.value,cat:f.aca.value});
      STUDENTS=(await api("students")).students;paneStudents(credBox(j.student.name,j.student.login,j.password));document.getElementById("an").focus()}
    catch(err){msg(m,err.message);setBusy(b,false)}};
  pane.querySelectorAll("[data-info]").forEach(btn=>btn.onclick=()=>editInfo(STUDENTS.find(x=>x.id===+btn.dataset.info)));
  const gb=document.getElementById("ghw");if(gb)gb.onclick=()=>editGroupHw();
  const cf=document.getElementById("cf");
  if(cf)cf.onsubmit=async e=>{e.preventDefault();const m=document.getElementById("cm"),b=document.getElementById("cb"),id=+cf.cs.value,n=parseInt(cf.ca.value,10);
    setBusy(b,true);try{const j=await api("coins_add",{id,amount:n});STUDENTS=(await api("students")).students;const s=STUDENTS.find(x=>x.id===id);paneStudents();
      const m2=document.getElementById("cm");document.getElementById("cs").value=id;msg(m2,(n>0?"Начислено ":"Списано ")+Math.abs(n)+" "+coinWord(Math.abs(n))+": "+s.name+" — теперь "+j.coins,true)}
    catch(err){msg(m,err.message);setBusy(b,false)}};
  pane.querySelectorAll("[data-reset]").forEach(btn=>btn.onclick=async()=>{
    const s=STUDENTS.find(x=>x.id===+btn.dataset.reset);
    if(!btn.classList.contains("sure")){btn.classList.add("sure");btn.textContent="Точно сбросить?";setTimeout(()=>{btn.classList.remove("sure");btn.textContent="Новый пароль"},4000);return}
    try{const j=await api("student_reset",{id:s.id});paneStudents(credBox(s.name,j.login,j.password));document.getElementById("credslot").scrollIntoView({behavior:"smooth",block:"center"})}catch(err){alertBox(err.message)}});
  pane.querySelectorAll("[data-del]").forEach(btn=>btn.onclick=async()=>{
    const s=STUDENTS.find(x=>x.id===+btn.dataset.del);
    if(!btn.classList.contains("sure")){btn.classList.add("sure");btn.textContent="Удалить вместе с прогрессом?";setTimeout(()=>{btn.classList.remove("sure");btn.textContent="Удалить"},4000);return}
    try{await api("student_delete",{id:s.id});STUDENTS=STUDENTS.filter(x=>x.id!==s.id);paneStudents()}catch(err){alertBox(err.message)}});
}
const catOf=s=>(s.cat||"").trim(),grpOf=s=>(s.note||"").trim();
const inCat=s=>FCAT===""||(FCAT==="-"?!catOf(s):catOf(s)===FCAT);
const inGrp=s=>FGRP===""||(FGRP==="-"?!grpOf(s):grpOf(s)===FGRP);
const visible=()=>STUDENTS.filter(s=>inCat(s)&&inGrp(s));
function groups(list){
  const m=new Map();(list||STUDENTS).forEach(s=>{const g=grpOf(s);if(g)m.set(g,(m.get(g)||0)+1)});
  return[...m].sort((a,b)=>a[0].localeCompare(b[0],"ru",{numeric:true}));
}
function fLabel(){
  const a=[];if(FCAT)a.push(FCAT==="-"?"без категории":FCAT);if(FGRP)a.push(FGRP==="-"?"без группы":FGRP);
  return a.length?a.join(" · "):"все ученики";
}
function filterBar(withHw){
  const inC=STUDENTS.filter(inCat);const G=groups(inC);
  if(FGRP&&FGRP!=="-"&&!G.some(([g])=>g===FGRP))FGRP="";
  const noCat=STUDENTS.filter(s=>!catOf(s)).length,noGrp=inC.filter(s=>!grpOf(s)).length;
  const t=(v,label,n)=>`<button class="tab" type="button" data-fc="${esc(v)}" aria-selected="${FCAT===v}">${esc(label)} <span class="cnt">${n}</span></button>`;
  const c=(v,label,n)=>`<button class="tab sm" type="button" data-fg="${esc(v)}" aria-selected="${FGRP===v}">${esc(label)} <span class="cnt">${n}</span></button>`;
  const vis=visible().length;
  return `<div class="card fbar"><div class="seg" role="tablist" aria-label="Категория">${t("","Все",STUDENTS.length)}${CATS.map(x=>t(x,x,STUDENTS.filter(s=>catOf(s)===x).length)).join("")}${noCat?t("-","Без категории",noCat):""}</div>
   <div class="seg sub2" aria-label="Группа">${c("","Все классы",inC.length)}${G.map(([g,n])=>c(g,g,n)).join("")}${noGrp&&G.length?c("-","Без группы",noGrp):""}</div>
   ${withHw?`<div class="row fhw"><button class="btn" type="button" id="ghw" ${vis?"":"disabled"}>📝 Задать домашку: ${esc(fLabel())} (${vis})</button>
   ${noCat===STUDENTS.length&&STUDENTS.length?`<p class="note">Разделите учеников: в таблице ниже нажмите «Школа» или «Репетиторство» у ученика или отметьте нескольких галочками.</p>`:""}</div>`:""}</div>`;
}
function bindFilter(rerender){
  document.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>{FCAT=b.dataset.fc;FGRP="";saveF();rerender()});
  document.querySelectorAll("[data-fg]").forEach(b=>b.onclick=()=>{FGRP=b.dataset.fg;saveF();rerender()});
}
/* перенос учеников между категориями и классами */
async function moveStudents(ids,patch,what){
  try{const j=await api("students_move",Object.assign({ids},patch));STUDENTS=(await api("students")).students;paneStudents();
    document.getElementById("editslot").innerHTML=`<div class="card"><div class="msg good" role="status">${esc(what)}: ${j.count} ${plural(j.count,"ученик","ученика","учеников")}.</div></div>`}
  catch(err){alertBox(err.message)}
}
function bindMove(){
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{if(b.getAttribute("aria-pressed")==="true")return;
    const s=STUDENTS.find(x=>x.id===+b.dataset.mv);moveStudents([s.id],{cat:b.dataset.cat},s.name+" → «"+b.dataset.cat+"»")});
  const all=document.getElementById("ckall");if(!all)return;
  const boxes=[...document.querySelectorAll(".ck1")];
  const sel=()=>boxes.filter(c=>c.checked).map(c=>+c.value);
  const upd=()=>{const n=sel().length;document.getElementById("bn").innerHTML=n?`Выбрано <b>${n}</b>:`:"Отметьте учеников галочками, чтобы перенести сразу нескольких";
    document.querySelectorAll("#bulk button").forEach(b=>b.disabled=!n);document.getElementById("bulk").classList.toggle("on",n>0);
    all.checked=n===boxes.length;all.indeterminate=n>0&&n<boxes.length};
  boxes.forEach(c=>c.onchange=upd);all.onchange=()=>{boxes.forEach(c=>c.checked=all.checked);upd()};
  document.querySelectorAll("[data-bcat]").forEach(b=>b.onclick=()=>moveStudents(sel(),{cat:b.dataset.bcat},"Перенесено в «"+b.dataset.bcat+"»"));
  document.getElementById("bgb").onclick=()=>{const g=document.getElementById("bg").value.trim();if(!g){document.getElementById("bg").focus();return}
    moveStudents(sel(),{note:g},"Класс «"+g+"» поставлен")};
}
function saveF(){try{localStorage.setItem("kab-fcat",FCAT);localStorage.setItem("kab-fgrp",FGRP)}catch(e){}}
const catSel=(id,v)=>`<select id="${id}" class="sel"><option value="">— не указана —</option>${CATS.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("")}${v&&!CATS.includes(v)?`<option selected>${esc(v)}</option>`:""}</select>`;
function editGroupHw(){
  const slot=document.getElementById("editslot");
  const list=visible(),label=fLabel();
  slot.innerHTML=`<div class="card edit"><h2>Домашка: ${esc(label)}</h2><p class="sub">Домашка появится в кабинете у каждого отмеченного ученика. Расписание, решённые задачи и монетки не меняются. Другую группу выберите кнопками выше.</p>
   <form id="gf">
    <div class="field"><label>Кому <span class="muted" id="gcnt"></span></label><div class="glist">${list.length?list.map(s=>`<label class="gs"><input type="checkbox" class="gu" value="${s.id}" checked><span>${esc(s.name)}</span><span class="gcur">сейчас: ${hwChip(s.info)}</span></label>`).join(""):'<p class="muted">В этой группе пока никого.</p>'}</div></div>
    <div class="field"><label>Если у ученика уже есть домашка</label><div class="gmode"><label><input type="radio" name="gm" value="replace" checked> Заменить новой</label><label><input type="radio" name="gm" value="add"> Добавить к текущей</label></div></div>
    <div class="field" style="margin-top:6px"><label>Задачи из курсов <span class="muted" id="pkall"></span></label><div id="picker"><div class="loading" style="padding:14px">Загрузка курсов…</div></div></div>
    <div class="field"><label for="hwt">Задание словами <span class="muted">(необязательно)</span></label><textarea id="hwt" style="min-height:80px" placeholder="Например: повторить перевод в двоичную систему. Ссылки можно вставлять прямо в текст."></textarea></div>
    <div class="row"><div class="field" style="flex:0 1 200px"><label for="hwd">Сделать до</label><input type="date" id="hwd"></div></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="gs">Выдать домашку</button><button class="btn ghost" type="button" id="gc">Закрыть</button></div><div id="gmsg" hidden></div></form></div>`;
  buildPicker(new Set());
  const cnt=()=>{const n=slot.querySelectorAll(".gu:checked").length;document.getElementById("gcnt").textContent="— выбрано "+n+" из "+list.length;document.getElementById("gs").textContent=n?"Выдать домашку ("+n+")":"Выдать домашку"};
  slot.querySelectorAll(".gu").forEach(c=>c.onchange=cnt);cnt();
  document.getElementById("gc").onclick=()=>{slot.innerHTML=""};
  slot.scrollIntoView({behavior:"smooth",block:"start"});
  document.getElementById("gf").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("gs"),m=document.getElementById("gmsg");
    const ids=[...slot.querySelectorAll(".gu:checked")].map(c=>+c.value);
    const hw_tasks=[...document.querySelectorAll("#picker .tk:checked")].map(c=>c.value);
    const homework=document.getElementById("hwt").value,mode=slot.querySelector("[name=gm]:checked").value;
    if(!ids.length){msg(m,"Отметьте хотя бы одного ученика");return}
    if(!hw_tasks.length&&!homework.trim()){msg(m,"Выберите задачи или напишите задание словами");return}
    setBusy(b,true,"Выдаём…");
    try{const j=await api("hw_assign",{ids,homework,hw_tasks,hw_due:document.getElementById("hwd").value,mode});
      STUDENTS=(await api("students")).students;paneStudents();
      document.getElementById("editslot").innerHTML=`<div class="card"><div class="msg good" role="status">Домашка выдана: ${j.count} ${plural(j.count,"ученику","ученикам","ученикам")}${FCAT||FGRP?" ("+esc(label)+")":""}. Ученики уже видят её в кабинете.</div></div>`}
    catch(err){msg(m,err.message);setBusy(b,false)}};
}
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c}
function editInfo(s){
  const i=s.info||{schedule:[],homework:"",hw_due:""};
  const slot=document.getElementById("editslot");
  const row=x=>`<div class="srow"><select class="sd">${DAYS.slice(1).map((d,k)=>`<option value="${k+1}" ${x.day===k+1?"selected":""}>${d}</option>`).join("")}</select><input type="time" class="st" value="${x.time||"17:00"}" required><input type="number" class="dur" min="15" max="240" step="15" value="${x.dur||60}" title="Длительность, мин"><span class="muted">мин</span><button class="btn danger small rm" type="button">Убрать</button></div>`;
  slot.innerHTML=`<div class="card edit"><h2>${esc(s.name)}: занятия и домашка</h2><p class="sub">Ученик увидит это у себя в кабинете сразу после сохранения.</p>
   <form id="ef"><div class="row"><div class="field" style="flex:0 1 220px"><label for="eca">Категория</label>${catSel("eca",catOf(s))}</div>
    <div class="field" style="flex:0 1 200px"><label for="egr">Класс / группа</label><input id="egr" list="grplist" value="${esc(s.note||"")}" placeholder="10 класс"></div></div>
    <label>Расписание</label><div id="rows">${(i.schedule.length?i.schedule:[]).map(row).join("")}</div>
    <button class="btn ghost small" type="button" id="addrow">+ Добавить день</button>
    <div class="field" style="margin-top:18px"><label>Домашнее задание: задачи из курсов <span class="muted" id="pkall"></span></label><div id="picker"><div class="loading" style="padding:14px">Загрузка курсов…</div></div></div>
    <div class="field"><label for="hwt">Задание словами <span class="muted">(необязательно)</span></label><textarea id="hwt" style="min-height:80px" placeholder="Например: повторить перевод в двоичную систему. Ссылки можно вставлять прямо в текст.">${esc(i.homework||"")}</textarea></div>
    <div class="row"><div class="field" style="flex:0 1 200px"><label for="hwd">Сделать до</label><input type="date" id="hwd" value="${esc(i.hw_due||"")}"></div>
     <div class="field" style="flex:1 1 200px"><label>&nbsp;</label>${(i.hw_tasks||[]).length?"Сейчас: "+hwChip(i)+" ":""}${i.homework?(i.hw_done?'<span class="chip2 ok">✓ ученик отметил «сделано» '+new Date(i.hw_done*1000).toLocaleDateString("ru-RU")+'</span>':'<span class="chip2 wait">текст ещё не отмечен как сделанный</span>'):""}</div></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="es">Сохранить</button><button class="btn ghost" type="button" id="ec">Закрыть</button><button class="btn ghost" type="button" id="eclr">Очистить домашку</button></div><div id="em" hidden></div></form></div>`;
  const rows=document.getElementById("rows");
  buildPicker(new Set(i.hw_tasks||[]));
  const bindRm=()=>rows.querySelectorAll(".rm").forEach(b=>b.onclick=()=>b.parentElement.remove());bindRm();
  document.getElementById("addrow").onclick=()=>{rows.insertAdjacentHTML("beforeend",row({day:1,time:"17:00",dur:60}));bindRm()};
  document.getElementById("ec").onclick=()=>{slot.innerHTML=""};
  document.getElementById("eclr").onclick=()=>{document.getElementById("hwt").value="";document.getElementById("hwd").value="";document.querySelectorAll("#picker .tk").forEach(c=>c.checked=false);syncPicker()};
  slot.scrollIntoView({behavior:"smooth",block:"start"});
  document.getElementById("ef").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("es"),m=document.getElementById("em");
    const schedule=[...rows.querySelectorAll(".srow")].map(r=>({day:+r.querySelector(".sd").value,time:r.querySelector(".st").value,dur:+r.querySelector(".dur").value||60}));
    setBusy(b,true,"Сохраняем…");
    const hw_tasks=[...document.querySelectorAll("#picker .tk:checked")].map(c=>c.value);
    try{const ng=document.getElementById("egr").value.trim(),nc=document.getElementById("eca").value;
      if(ng!==grpOf(s)||nc!==catOf(s))await api("student_update",{id:s.id,name:s.name,note:ng,cat:nc});
      await api("info_set",{id:s.id,schedule,homework:document.getElementById("hwt").value,hw_tasks,hw_due:document.getElementById("hwd").value});
      STUDENTS=(await api("students")).students;paneStudents();const ns=STUDENTS.find(x=>x.id===s.id);editInfo(ns);msg(document.getElementById("em"),"Сохранено — ученик уже видит это в кабинете",true)}
    catch(err){msg(m,err.message);setBusy(b,false)}};
}
async function buildPicker(sel){
  const cat=await catalog();const box=document.getElementById("picker");if(!box)return;
  box.innerHTML=cat.map(c=>{
    const any=c.lessons.some(l=>l.steps.some((s,k)=>s==="task"&&sel.has(c.key+"|"+l.num+"/"+K(l,k))));
    return `<details class="pick" ${any?"open":""}><summary>${esc(c.title)}<span class="pc" data-pc></span></summary><div class="lessons">${c.lessons.map(l=>{
      const tk=l.steps.map((s,k)=>s==="task"?k+1:0).filter(Boolean);if(!tk.length)return"";
      const lany=tk.some(n=>sel.has(c.key+"|"+l.num+"/"+K(l,n-1)));
      return `<details class="pl" ${lany?"open":""}><summary><input type="checkbox" class="lall" aria-label="Все задачи урока ${esc(l.num)}"><span>${esc(l.num+" "+l.title)}</span><small data-lc></small></summary><div class="tasks">${tk.map(n=>{const v=c.key+"|"+l.num+"/"+K(l,n-1);
        return `<label class="pt"><input type="checkbox" class="tk" value="${esc(v)}" ${sel.has(v)?"checked":""}><b>Шаг ${n}</b><span>${esc((l.labels||[])[n-1]||"")}</span><a href="${esc(c.url)}#${esc(l.num)}-${n}" target="_blank" rel="noopener">открыть</a></label>`}).join("")}</div></details>`}).join("")}</div></details>`}).join("");
  box.querySelectorAll(".lall").forEach(cb=>{cb.onclick=e=>e.stopPropagation();cb.onchange=()=>{cb.closest(".pl").querySelectorAll(".tk").forEach(t=>t.checked=cb.checked);syncPicker()}});
  box.querySelectorAll(".tk").forEach(cb=>cb.onchange=syncPicker);
  syncPicker();
}
function syncPicker(){
  let all=0;
  document.querySelectorAll("#picker .pick").forEach(p=>{let n=0;
    p.querySelectorAll(".pl").forEach(l=>{const t=[...l.querySelectorAll(".tk")],k=t.filter(x=>x.checked).length;n+=k;
      const a=l.querySelector(".lall");a.checked=k===t.length;a.indeterminate=k>0&&k<t.length;l.querySelector("[data-lc]").textContent=k?k+" из "+t.length:t.length+" задач"});
    const pc=p.querySelector("[data-pc]");pc.textContent=n?"выбрано: "+n:"";pc.classList.toggle("on",n>0);all+=n});
  const el=document.getElementById("pkall");if(el)el.textContent=all?"— выбрано "+all:"";
}
/* ---------- варианты (закрытые материалы) ---------- */
async function paneVariants(note){
  const pane=document.getElementById("pane");
  let list=[];try{list=(await api("materials")).materials||[]}catch(e){pane.innerHTML=`<div class="msg">${esc(e.message)}</div>`;return}
  pane.innerHTML=`${note||""}<div class="card"><h2>Варианты · ${list.length}</h2><p class="sub">Видны только вошедшим ученикам. Задать вариант домашкой: «Ученики» → «Задать домашку» или «Занятия и ДЗ» → отметьте вариант целиком.</p>
   ${list.length?`<div class="vlist">${list.map(c=>{const t=c.lessons.reduce((a,l)=>a+l.steps.filter(x=>x==="task").length,0);
     return `<div class="vrow"><div><b>${esc(c.title)}</b><span class="muted">${c.lessons.map(l=>esc(l.title)).join(", ")} · ${t} задач с проверкой</span></div>
      <div class="acts"><a class="btn small" href="${esc(c.url)}" target="_blank" rel="noopener">Открыть</a><button class="btn danger small" type="button" data-vdel="${esc(c.mid)}">Удалить</button></div></div>`}).join("")}</div>`:'<p class="empty">Пока нет ни одного варианта.</p>'}</div>
   <div class="card"><h2>Загрузить вариант</h2><p class="sub">Выберите папку варианта, которую подготовил Claude (в ней лежит файл manifest.json и папки img и files). Если такой вариант уже есть, он обновится — ответы учеников сохранятся.</p>
    <div class="row"><input type="file" id="vdir" webkitdirectory directory multiple hidden><button class="btn" type="button" id="vpick">Выбрать папку…</button><span class="muted" id="vname"></span></div>
    <div id="vprog" hidden><div class="meter" style="margin-top:12px"><i id="vbar" style="width:0%"></i></div><p class="note" id="vstat"></p></div><div id="vmsg" hidden></div></div>`;
  pane.querySelectorAll("[data-vdel]").forEach(b=>b.onclick=async()=>{
    if(!b.classList.contains("sure")){b.classList.add("sure");b.textContent="Точно удалить вариант?";setTimeout(()=>{b.classList.remove("sure");b.textContent="Удалить"},4000);return}
    try{await api("material_delete",{mid:b.dataset.vdel});CAT=null;paneVariants()}catch(e){alert(e.message)}});
  const inp=document.getElementById("vdir");
  document.getElementById("vpick").onclick=()=>inp.click();
  inp.onchange=()=>uploadVariant([...inp.files]);
}
async function uploadVariant(files){
  const m=document.getElementById("vmsg"),prog=document.getElementById("vprog"),bar=document.getElementById("vbar"),stat=document.getElementById("vstat");
  const rel=f=>(f.webkitRelativePath||f.name).split("/").slice(1).join("/")||f.name;
  const man=files.find(f=>rel(f)==="manifest.json");
  if(!man){msg(m,"В папке нет файла manifest.json — выберите папку варианта целиком.");return}
  let mf;try{mf=JSON.parse(await man.text())}catch(e){msg(m,"Не получилось прочитать manifest.json");return}
  const rest=files.filter(f=>/^(img|files)\//.test(rel(f))&&!/\/\./.test(rel(f)));
  const CH=512*1024;const total=rest.reduce((a,f)=>a+Math.max(1,Math.ceil(f.size/CH)),0)+1;let done=0;
  msg(m,"");prog.hidden=false;document.getElementById("vpick").disabled=true;
  const step=t=>{done++;bar.style.width=Math.round(done/total*100)+"%";stat.textContent=t};
  try{
    await api("material_put",{mid:mf.mid,title:mf.title,course:mf.course,catalog:mf.catalog});step("Задания загружены");
    for(const f of rest){const parts=Math.max(1,Math.ceil(f.size/CH));
      for(let i=0;i<parts;i++){
        const body=f.slice(i*CH,(i+1)*CH);
        const r=await fetch(API+"?action=mfile_put&m="+encodeURIComponent(mf.mid)+"&f="+encodeURIComponent(rel(f))+"&part="+i,{method:"POST",headers:{"X-Inf":"1","Content-Type":"application/octet-stream"},body,credentials:"same-origin"});
        let j=null;try{j=await r.json()}catch(e){}
        if(!r.ok||!j||!j.ok)throw new Error((j&&j.error)||("Ошибка загрузки "+rel(f)+" ("+r.status+")"));
        step("Файл "+rel(f)+(parts>1?" — часть "+(i+1)+" из "+parts:""))}}
    CAT=null;paneVariants(`<div class="card"><div class="msg good" role="status">Вариант «${esc(mf.title)}» загружен. Его уже можно задавать домашкой.</div></div>`);
  }catch(e){msg(m,e.message+". Попробуйте ещё раз — уже загруженное просто перезапишется.");document.getElementById("vpick").disabled=false}
}
function alertBox(t){const m=document.getElementById("am");if(m)msg(m,t)}
async function paneProgress(){
  const pane=document.getElementById("pane"),cat=await catalog();
  if(COURSE_I>=cat.length)COURSE_I=0;
  const c=cat[COURSE_I];
  pane.innerHTML=filterBar(false)+`<div class="seg">${cat.map((x,i)=>`<button class="tab" data-c="${i}" aria-selected="${i===COURSE_I}">${esc(x.title)}</button>`).join("")}</div><div class="card"><div class="loading">Загрузка…</div></div>`;
  bindFilter(()=>{OPEN=null;paneProgress()});
  pane.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{COURSE_I=+b.dataset.c;OPEN=null;try{sessionStorage.setItem("kab-course",COURSE_I)}catch(e){}paneProgress()});
  let P;try{P=(await api("class_progress",null,{key:c.key})).progress}catch(e){pane.querySelector(".card:not(.fbar)").innerHTML=`<div class="msg">${esc(e.message)}</div>`;return}
  const L=c.lessons.filter(l=>l.steps.includes("task"));
  const V=visible();const rows=V.map(s=>{const p=P[s.id]||{};return{s,p,k:stats(c,p.data)}});
  const cellH=(d,t)=>`<span class="cell ${d===t&&t?"full":d?"":"zero"}"><b>${d}/${t}</b><span class="meter"><i style="width:${pct(d,t)}%"></i></span></span>`;
  pane.querySelector(".card:not(.fbar)").innerHTML=!STUDENTS.length?`<div class="empty">Сначала добавьте учеников на вкладке «Ученики».</div>`:!V.length?`<div class="empty">В этой группе пока никого.</div>`:
   `<div class="tbl-wrap"><table class="pt"><thead><tr><th>Ученик</th>${L.map(l=>`<th title="${esc(l.title)}">${esc(l.num)}</th>`).join("")}<th>Всего</th><th class="hide-sm">Последнее</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="srow" data-u="${r.s.id}" aria-expanded="${OPEN===r.s.id}"><td>${esc(r.s.name)}</td>${r.k.lessons.filter(l=>l.total).map(l=>`<td>${cellH(l.done,l.total)}</td>`).join("")}<td>${cellH(r.k.done,r.k.total)}</td><td class="hide-sm muted">${r.p.updated?ago(r.p.updated):"—"}</td></tr>
      ${OPEN===r.s.id?`<tr class="detail"><td colspan="${L.length+3}">${detail(r)}</td></tr>`:""}`).join("")}
   </tbody></table></div>
   <div class="legend"><span><i class="sq ok"></i>решено</span><span><i class="sq bad"></i>пытался, не решил</span><span><i class="sq"></i>не начинал</span><span><i class="sq rev"></i>смотрел ответ</span><span>Нажмите на ученика, чтобы увидеть каждую задачу</span></div>`;
  pane.querySelectorAll(".srow").forEach(tr=>tr.onclick=()=>{const u=+tr.dataset.u;OPEN=OPEN===u?null:u;paneProgress()});
}
function ansText(v){if(v==null)return"";if(Array.isArray(v))return v.map(r=>Array.isArray(r)?r.filter(Boolean).join(" "):r).filter(Boolean).join(" | ");return String(v)}
function detail(r){
  const res=r.p.resets?`<p class="note">Нажимал «Начать заново»: ${r.p.resets} раз(а)</p>`:"";
  return `<div class="dl">${r.k.lessons.filter(l=>l.total).map(l=>`<div><h4>${esc(l.num+" "+l.title)} · ${l.done}/${l.total}</h4><div class="sqs">
    ${l.cells.map(c=>{const x=c.x,cls=x.ok?"ok":(x.att?"bad":""),a=ansText(x.v);
      const tip="Шаг "+c.n+(x.ok?" — решено":x.att?" — не решено":" — не начинал")+(x.att?", попыток: "+x.att:"")+(x.rev?", смотрел ответ":"")+(a?"\nОтвет: "+a:"");
      return `<span class="sq ${cls}${x.rev?" rev":""}" title="${esc(tip)}">${c.n}</span>`}).join("")}</div></div>`).join("")}${res}</div>`;
}
